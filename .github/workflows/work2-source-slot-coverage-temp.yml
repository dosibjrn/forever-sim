name: Work2 bounded source slot coverage (temporary)
on:
  push:
    branches:
      - work/2nd-source-slot-stratified-coverage-20261102
jobs:
  source-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused source test dependencies
        run: python -m pip install -q pytest beautifulsoup4
      - name: Real Mage and Druid L30 source slot proposal regressions
        run: python -m pytest -q tests/test_source_wand_paid_slot_proposals.py
