name: Work2 bounded source slot coverage (temporary)
on:
  push:
    branches:
      - work/2nd-source-slot-stratified-coverage-20261102
jobs:
  source-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused source test dependencies
        run: python -m pip install -q pytest beautifulsoup4
      - name: Compile changed production modules
        run: python -m compileall -q src/v2/source_persistent_slot_search.py src/v2/source_bounded_joint_frontier.py tools/wf437_direct_budgeted_run.py
      - name: Source-backed Mage Druid gear legality and joint-budget regressions
        run: python -m pytest -q tests/test_source_wand_paid_slot_proposals.py tests/test_wf326_druid20_source_slot_search.py tests/test_wf391_generic_joint_frontier.py::test_bonus_points_supported_and_invalid_search_budget
