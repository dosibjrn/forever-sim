name: Clean source-stage direct CLI verification (temporary)
on:
  push:
    branches: [work/clean-source-stage-cli-20261101]
permissions:
  contents: read
concurrency:
  group: clean-source-stage-cli-20261101
  cancel-in-progress: true
jobs:
  real-source-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install real source HTML parser
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Direct-file source-stage entrypoints (no PYTHONPATH)
        run: |
          set -euo pipefail
          unset PYTHONPATH
          python tools/wf292_ingest_verified_detail_headers_sqlite.py --help >/dev/null
          python tools/wf293_ingest_source_effect_atoms_sqlite.py --help >/dev/null
          python tools/wf315_source_index_typed_runtime_batch.py --help >/dev/null
          python tools/wf317_stage_canonical_verified_effects.py --help >/dev/null
      - name: Real nine-class sourced ingest on isolated SQLite copy
        run: |
          set -euo pipefail
          cp data/forever/catalogue/forever_abilities.sqlite "$RUNNER_TEMP/source-stage.sqlite"
          sha256sum data/forever/catalogue/forever_abilities.sqlite > "$RUNNER_TEMP/source-before.sha"
          python tools/wf292_ingest_verified_detail_headers_sqlite.py --db "$RUNNER_TEMP/source-stage.sqlite" > "$RUNNER_TEMP/headers.json"
          python tools/wf293_ingest_source_effect_atoms_sqlite.py --db "$RUNNER_TEMP/source-stage.sqlite" > "$RUNNER_TEMP/atoms.json"
          python - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          temp=Path(os.environ['RUNNER_TEMP'])
          h=json.loads((temp/'headers.json').read_text())
          a=json.loads((temp/'atoms.json').read_text())
          with sqlite3.connect(temp/'source-stage.sqlite') as db:
              assert db.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
              classes=db.execute('SELECT COUNT(DISTINCT class_key) FROM spell_index WHERE kind="abilities"').fetchone()[0]
              assert classes==9,classes
          assert h['executable_promotions']==0,h
          assert a.get('executable_promotions',0)==0,a
          print('REAL_SOURCE_STAGE_GREEN',classes,h,a)
          PY
          sha256sum -c "$RUNNER_TEMP/source-before.sha"
