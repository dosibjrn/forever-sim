name: L30 native eight-mob free joint optimizer with Shoot

on:
  push:
    branches: [work/warlock-l30-surrogate-expand-ranking-20261108]
    paths:
      - tools/wf_warlock_chain_surrogate.py
      - tools/wf_warlock_surrogate_rank_validation.py
      - tools/wf_warlock_eight_mob_joint_search.py
      - tools/wf_native_apl_source.py
      - tools/wf_native_wand_l30_smoke.py
      - data/warlock-l30-rust-source-fixture.request.json
      - tools/wf_warlock_l30_surrogate_probe.py
      - tools/test_wf_warlock_chain_surrogate.py
      - tools/test_wf_warlock_eight_mob_probe.py
      - tools/test_wf_warlock_eight_mob_joint_search.py
      - .github/workflows/warlock-l30-native-three-mob-surrogate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l30-eight-world-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout optimization source
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout exact canonical Rust with sequential-mob receipts
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: 538cdb08ac217b6e490b1482b2e907b8b4a101a9
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing native bridge deps
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify native source, 3/8-mob feature parity and ranking validation tests
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "538cdb08ac217b6e490b1482b2e907b8b4a101a9"
          python3 -m py_compile project/tools/wf_warlock_chain_surrogate.py project/tools/wf_warlock_l30_surrogate_probe.py project/tools/wf_warlock_surrogate_rank_validation.py project/tools/wf_warlock_eight_mob_joint_search.py project/tools/wf_native_apl_source.py project/tools/wf_native_wand_l30_smoke.py
          python3 -m unittest discover -s project/tools -p 'test_wf_warlock_chain_surrogate.py' -v
          python3 -m unittest discover -s project/tools -p 'test_wf_warlock_eight_mob_probe.py' -v
          python3 -m unittest discover -s project/tools -p 'test_wf_warlock_eight_mob_joint_search.py' -v
      - name: Build Rust executable
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Verify actual native L30 equipped wand Shoot and no-wand negative control
        working-directory: project
        run: |
          python3 -u tools/wf_native_wand_l30_smoke.py \
            --binary ../engine/target/debug/forever-engine \
            --source data/warlock-l30-rust-source-fixture.request.json \
            --out ../warlock-l30-native-eight-mob-surrogate/wand-native-smoke
      - name: Run eight-mob native adaptive joint search and new 100-mob labels with equipped wand Shoot
        working-directory: project
        run: |
          python3 -u tools/wf_warlock_l30_surrogate_probe.py \
            --binary ../engine/target/debug/forever-engine \
            --source data/warlock-l30-rust-source-fixture.request.json \
            --engine-tools ../engine/tools \
            --engine-sha 538cdb08ac217b6e490b1482b2e907b8b4a101a9 \
            --full-count 10 \
            --extra-candidates 24 \
            --search-iterations 96 \
            --seed 20261108 \
            --out ../warlock-l30-native-eight-mob-surrogate
      - name: Preserve native 8-mob optimization, Shoot action proof, 100-mob truth and ranking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-native-eight-mob-surrogate
          path: warlock-l30-native-eight-mob-surrogate/
          if-no-files-found: warn
          retention-days: 14
