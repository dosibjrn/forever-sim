name: Warlock L20 pinned Rust first contact (no M1 write)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tools/warlock_l20_native_first_contact.py'
      - 'tests/test_warlock_l20_native_first_contact.py'
      - '.github/workflows/warlock-l20-native-first-contact.yml'

permissions:
  contents: read

jobs:
  native-l20-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR head with exact Rust gitlink
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Python contract tests
        run: python -m unittest discover -s tests -p 'test_warlock_l20_native_first_contact.py' -v
      - name: Hydrate exactly pinned Rust engine
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init integrations/mythicsim-rust/engine
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected"
          test "$actual" = "$expected"
          echo "Rust gitlink: $actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Build selected Rust (debug is sufficient for source-option discovery)
        run: cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml
      - name: Read real Warlock L20 native source state, never record M1
        shell: bash
        run: |
          set -euo pipefail
          python tools/warlock_l20_native_first_contact.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            | tee "$RUNNER_TEMP/warlock-l20-native.json"
          {
            echo '## Warlock L20 Rust first contact (diagnostic, NOT P3 PASS)'
            echo '~~~json'
            cat "$RUNNER_TEMP/warlock-l20-native.json"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
