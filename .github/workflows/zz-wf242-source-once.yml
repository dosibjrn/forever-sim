name: One-shot WF242 source periodic regression
on:
  push:
    branches:
      - work/2nd-wf242-source-periodic-invariants-20261101
    paths:
      - .github/workflows/zz-wf242-source-once.yml
permissions:
  contents: read
jobs:
  sourced-periodics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute sourced runtime tests on exact checkout
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf242_persisted_periodics_and_multi_pull.py tests/test_wf374_final_pack_recovery.py
