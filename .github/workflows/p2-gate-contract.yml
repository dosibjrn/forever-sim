name: P2 gate contract tests

on:
  pull_request:
    paths:
      - ".github/workflows/p2-gate-contract.yml"
      - "docs/gates/P1-P2.md"
      - "tools/wf_gate.py"
      - "tools/wf_gate_p2_live.py"
      - "tools/wf_gate_coverage.py"
      - "tests/test_wf_druid_p2_probe.py"
      - "tests/test_wf475_live_p2_gate_alignment.py"
      - "tests/test_wf_prio_native_p2_source_receipts.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/p2-gate-contract.yml"
      - "docs/gates/P1-P2.md"
      - "tools/wf_gate.py"
      - "tools/wf_gate_p2_live.py"
      - "tools/wf_gate_coverage.py"
      - "tests/test_wf_druid_p2_probe.py"
      - "tests/test_wf475_live_p2_gate_alignment.py"
      - "tests/test_wf_prio_native_p2_source_receipts.py"

permissions:
  contents: read

jobs:
  p2-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install gate test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Check P2 gate syntax
        run: python -m py_compile tools/wf_gate.py tools/wf_gate_p2_live.py tools/wf_gate_coverage.py tests/test_wf_druid_p2_probe.py tests/test_wf475_live_p2_gate_alignment.py tests/test_wf_prio_native_p2_source_receipts.py
      - name: Run P2 acceptance and M1 coverage contract tests
        run: python -m pytest -q tests/test_wf_druid_p2_probe.py tests/test_wf475_live_p2_gate_alignment.py tests/test_wf_prio_native_p2_source_receipts.py
