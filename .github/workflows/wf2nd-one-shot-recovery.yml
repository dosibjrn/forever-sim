name: One-shot source-paid persistent recovery frontier

on:
  push:
    branches:
      - work/2nd-persistent-recovery-frontier-20261101
    paths:
      - .github/workflows/wf2nd-one-shot-recovery.yml

permissions:
  contents: read

jobs:
  real-persistent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install source test dependencies
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Execute source-backed 2 and 100 mob persistent search regressions
        run: python -m pytest -q tests/test_wf302_persistent_joint_search.py tests/test_wf303_paid_candidate_persistent_search.py
      - name: Execute real source Druid L30 1-2-100 persistent combat and recovery
        run: |
          python tools/wf61_live_persistent_replay.py \
            --class druid --level 30 \
            --stage evidence/wf353/WF353_L30_P3_BEST_JOINT_ITEM_STAGE.json \
            --ability-db data/forever/staged_druid_l30_talents_70338.sqlite \
            --observations evidence/WF322_DRUID_L20_WEB_TEXT_OBSERVATIONS_70338.json \
            --control-observations evidence/wf321/druid_l20_control_observations.json \
            --build-as-of 2026-10-13 --max-wall-s 180 \
            --out /tmp/wf2nd-actual-gsim-1-2-100.json
