name: One-shot pinned Go native pet damage regression (NOT P7)
on:
  push:
    branches: [work/first-native-pet-source-damage-20261101]
    paths: [.github/workflows/wf-native-pet-source-once.yml]
permissions:
  contents: read
jobs:
  source-pet:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Install pinned Go source prerequisites
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
      - name: Pinned native pet journal GREEN and negative control
        run: |
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          cd upstream
          go test ./sim/core -run 'Test(NativeWorldDamageJournal|WorldHealthACK)' -count=1 -v
      - name: Test real gsim source-backed world damage and pet provenance
        run: |
          python3 -m pip install --disable-pip-version-check pytest beautifulsoup4
          cd project
          python3 -m pytest -q tests/test_wf_go_native_world_damage_ack.py tests/test_wf_native_health_feedback_perturbation.py
      - name: Check source Go ACK tamper and build pinned native binary
        run: |
          cd project/integrations/mythicsim-go/world_boundary/ingress
          GO111MODULE=off go test -count=1 -v feed.go feed_test.go world_damage_ack.go world_damage_ack_test.go
          cd ../../../../
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Actual Warlock source request - pet spell result changes real gsim world HP
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          result=run(Path("../gsim-go-world-ingress"),
              Path("../upstream/sim/warlock/testdata/imp-brand/kerani.request.json"),
              ticks=100,target_spawn_yards=3.,enemy_move_speed_yards_s=0.,
              target_health=10000000.)
          pet=[(row,e) for row in result["observations"]
               for e in row["native_damage_events"]
               if e.get("native_caster_type")=="pet"]
          assert pet, "REAL_WARLOCK_PET_SOURCE_DAMAGE_NOT_OBSERVED"
          assert all(row["native_world_ack_confirmation"]["native_spell_action_ack"]
                     for row,e in pet)
          assert all(row["gsim_applied_world_ack"]["world_target_health_after"] <
                     row["gsim_applied_world_ack"]["world_target_health_before"]
                     for row,e in pet)
          assert all(e["native_caster_label"] for row,e in pet)
          assert result["native_process_reused"] and result["gsim_runtime_real"]
          assert not result["checkpoint_certified"]
          print("REAL_WARLOCK_PET_SOURCE_TO_GSIM_HP_ACK_PASS",len(pet))
          PY
