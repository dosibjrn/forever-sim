name: L30 Affliction 100 native serial-mob APL challengers

on:
  push:
    branches: [work/warlock-l30-100mob-apl-challengers-20261107]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-challengers:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: ca2f38cd97a1eac28ed87d6b4d56b7850cc4ed1a
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - run: |
          python3 -m py_compile project/tools/wf_warlock_l30_100mob_challengers.py
          test "$(git -C engine rev-parse HEAD)" = "ca2f38cd97a1eac28ed87d6b4d56b7850cc4ed1a"
      - working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Paid native 100 mob APL pet and gear comparison
        working-directory: project
        run: |
          python3 -u tools/wf_warlock_l30_100mob_challengers.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --engine-tools ../engine/tools \
            --out ../warlock-l30-apl-challengers
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-apl-100mob-challengers
          path: warlock-l30-apl-challengers/
          if-no-files-found: warn
          retention-days: 14
