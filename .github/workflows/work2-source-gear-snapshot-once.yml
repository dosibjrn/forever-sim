name: Work2 one-shot source gear snapshot regression
on:
  push:
    branches:
      - work/2nd-pin-source-gear-snapshot-20261102
    paths:
      - tests/test_wf_p6_gear_source_snapshot.py
permissions:
  contents: read
jobs:
  source-gear-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - run: python -m pytest -q tests/test_wf_p6_gear_source_snapshot.py
