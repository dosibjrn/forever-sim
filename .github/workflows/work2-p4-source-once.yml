name: Work2 one-shot actual P4 30-second source search (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/work2-p4-source-once.yml'

permissions:
  contents: read

jobs:
  run-source-once:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - name: Exact-PR-head source + LFS checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: One actual P4 30s source-paid production entry run
        env:
          FOREVER_P4_P5_FULL_SOURCE: '1'
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p4_live import run_live
          from tools.wf_gate import ROOT
          import json, sys
          r=run_live(ROOT,'druid',30,spec='unrestricted')
          print('REAL_P4_SOURCE_GATE',json.dumps(r,sort_keys=True,default=str),flush=True)
          # FAIL is expected until selected native<->2D and source coverage.
          # A *real* source cold search and independent paid replay must run.
          if r.get('status')!='FAIL':
              print('UNEXPECTED_GATE_STATUS', r.get('status'))
              sys.exit(1)
          if r.get('requested_wall_budget_s') != 30:
              print('NO_TRUE_30_SECOND_SOURCE_ENTRY',r.get('reasons'))
              sys.exit(1)
          print('SOURCE_SEARCH_EXECUTED',r.get('real_search_wall_s'),
                'UNIQUE_PAID',r.get('real_paid_unique_full_builds'),
                '100MOB_COMPLETE',r.get('real_100mob_complete'),
                'SOURCE_HASH',r.get('source_db_sha256'),flush=True)
          PY
