name: Work2 P5 paired cold comparison focused verification
on:
  push:
    branches:
      - work/work2-p5-paired-source-comparison-20261102
    paths:
      - .github/workflows/work2-p5-pair-once.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/test_work2_full_source_p4_p5_gate_entry.py
