name: Work1 Priest L20 P6 focused no-record regression
on:
  push:
    branches:
      - work/work1-priest-l20-p6-native-receipt-20261104
    paths:
      - 'tools/wf_native_priest_l20_cold.py'
      - 'tools/wf_gate_p6_live.py'
      - 'tests/test_wf_native_priest_l20_cold.py'
      - 'tests/gates/test_wf_gate_p6_live.py'
      - '.github/workflows/work1-priest-l20-p6-focused.yml'

permissions:
  contents: read
  actions: read

jobs:
  p6-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused Forever test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Test native P6 receipt forwarding and rejection
        run: python -m pytest -q tests/test_wf_native_priest_l20_cold.py tests/gates/test_wf_gate_p6_live.py
      - name: Reclassify genuine prior native 300s/100-mob receipt for P6 (NO RECORD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/priest-l20-p6-source-receipt
          gh run download 41907409064 --repo dosibjrn/forever-sim --name priest-l20-native-cold-no-record --dir /tmp/priest-l20-p6-source-receipt
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.wf_native_priest_l20_cold import native_cold_p6_verdict, native_cold_gate_verdicts
          path = Path("/tmp/priest-l20-p6-source-receipt/priest-l20-cold-receipts.json")
          cold = json.loads(path.read_text(encoding="utf-8"))
          assert native_cold_gate_verdicts(cold)["P4"]["status"] == "PASS"
          assert native_cold_gate_verdicts(cold)["P5"]["status"] == "PASS"
          verdict = native_cold_p6_verdict(cold)
          print("PRIEST_L20_P6_SOURCE_BACKED_NO_RECORD", json.dumps({
              "source_run": 41907409064,
              "source_head": "8b00fe6ff4adb4ca1fce09b5f5d698cfa015e975",
              "p6": verdict,
          }, sort_keys=True), flush=True)
          assert verdict["status"] == "PASS", verdict["reasons"]
          PY
