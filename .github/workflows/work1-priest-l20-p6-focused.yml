name: Work1 Priest L20 P6 focused no-record regression
on:
  push:
    branches:
      - work/work1-priest-l20-p6-native-receipt-20261104
    paths:
      - 'tools/wf_native_priest_l20_cold.py'
      - 'tools/wf_gate_p6_live.py'
      - 'tests/test_wf_native_priest_l20_cold.py'
      - 'tests/gates/test_wf_gate_p6_live.py'
      - '.github/workflows/work1-priest-l20-p6-focused.yml'

permissions:
  contents: read

jobs:
  p6-receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused Forever test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Test native P6 receipt forwarding and rejection
        run: python -m pytest -q tests/test_wf_native_priest_l20_cold.py tests/gates/test_wf_gate_p6_live.py
