name: Work2 one-shot paid event accounting
on:
  push:
    branches:
      - work/work2-paid-exit-travel-event-accounting-20261102
permissions:
  contents: read
jobs:
  targeted-source-paid:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/test_work2_paid_travel_event_accounting.py tests/test_work2_persistent_pack_budget.py tests/test_wf374_final_pack_recovery.py
