name: Clean one-shot live gate regression relocation

on:
  push:
    branches:
      - clean/group-live-gate-regressions-20261102-2046
    paths:
      - .github/workflows/clean-gates-verification-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded unit-test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Run relocated live gate contracts
        run: |
          python -m pytest -q \
            tests/gates/test_wf_gate_p6_live.py \
            tests/gates/test_wf_gate_p7_2_live.py \
            tests/gates/test_wf_gate_p7_3_live.py \
            tests/gates/test_wf_gate_p7_4_live.py \
            tests/gates/test_wf_gate_p7_5_live.py \
            tests/gates/test_wf_first_checkpoint_vertical.py
