name: Work2 Warlock L20 native P7.3 talent-only (no M1)

on:
  push:
    branches:
      - work2/warlock-l20-p73-native-talent-20261109-2145
    paths:
      - .github/workflows/work2-warlock-l20-p73-native.yml
      - tools/wf_gate_p7_2_live.py
      - tools/wf_gate_p7_3_live.py
      - tests/test_work2_warlock_l20_p73.py
  workflow_dispatch:

permissions:
  contents: read

# One genuine native paid changed talent candidate on the existing frozen
# stochastic reference. No P7.1 replay, 300s cold search, or official ledger.
concurrency:
  group: work2-warlock-l20-p73-${{ github.ref }}
  cancel-in-progress: false

jobs:
  talent-axis:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      FOREVER_MYTHICSIM_RUST_BIN: integrations/mythicsim-rust/engine/target/release/forever-engine
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout exact Forever HEAD and selected source
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1

      - name: Check native engine gitlink and frozen Warlock request
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$recorded" && test "$recorded" = "$actual"
          test -s docs/evidence/native-references/warlock-l20-unrestricted/request.json
          test -s docs/evidence/native-references/warlock-l20-unrestricted/reference.json
          echo "Forever HEAD: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected Rust SHA: $actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install focused Python dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'

      - name: Verify Work2 native transport and frozen-reference regression
        run: >-
          python -m pytest -q
          tests/test_work2_warlock_l20_p73.py
          tests/test_work2_warlock_l20_p72.py

      - name: Build exact selected Rust engine
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --release --bin forever-engine

      - name: Pay one changed talent allocation in selected native scorer (no record)
        shell: bash
        run: |
          set -euo pipefail
          python tools/wf_gate.py \
            --class warlock --level 20 --spec unrestricted --gate P7.3 \
            --out warlock-l20-p73-gate.json | tee warlock-l20-p73-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("warlock-l20-p73-gate.json").read_text())
          print("NATIVE_P73_REPORT", json.dumps(rows, sort_keys=True)[:2500])
          PY

      - name: Preserve exact native result and bounded refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l20-p73-no-record
          path: |
            warlock-l20-p73-gate.json
            warlock-l20-p73-stdout.json
          if-no-files-found: warn
          retention-days: 3
