name: Work1 P7.4 confirmed-finalist freeze regression (temporary)
on:
  push:
    branches:
      - work/work1-p74-confirmed-finalist-freeze-20261103
    paths:
      - tools/wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_p7_4_live.py
      - .github/workflows/work1-p74-finalist-freeze-temporary.yml
permissions:
  contents: read
concurrency:
  group: work1-p74-confirmed-freeze
  cancel-in-progress: false
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Execute exact-HEAD full focused P7.4 source-paid regressions
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
