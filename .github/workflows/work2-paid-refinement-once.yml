name: Work2 one-shot paid refinement budget
on:
  push:
    branches:
      - work/work2-preflight-budget-real-paid-20261102
    paths:
      - .github/workflows/work2-paid-refinement-once.yml
      - tests/test_source_paid_gear_witness_priority.py
      - src/v2/source_bounded_joint_frontier.py
permissions:
  contents: read
jobs:
  source-paid-refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real source paid refinement budget regression
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py tests/test_source_wand_paid_slot_proposals.py
