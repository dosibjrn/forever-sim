name: Work2 selected Rust multiple real gsim world targets (not M1)
on:
  push:
    branches: [work/work2-native-multi-world-main-20261103]
  pull_request:
    paths:
      - integrations/mythicsim-rust/port_native_two_world_cli.py
      - integrations/mythicsim-rust/live_two_world_pulls.py
      - integrations/mythicsim-rust/port_native_world_lethal_terminal.py
      - .github/workflows/work2-native-multi-world.yml

permissions:
  contents: read

jobs:
  multi-world-kills:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Port the actual selected Rust engine, idempotently
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          echo "SELECTED_RUST_SHA=$(git -C "$engine" rev-parse HEAD)"
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py "$engine"
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py "$engine"
          git -C "$engine" diff --check
          first="$(git -C "$engine" diff | sha256sum)"
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py "$engine"
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py "$engine"
          second="$(git -C "$engine" diff | sha256sum)"
          test "$first" = "$second"
          python3 -m py_compile integrations/mythicsim-rust/port_native_two_world_cli.py integrations/mythicsim-rust/live_two_world_pulls.py
      - name: Upgrade real already-published two-target fork port without duplication
        shell: bash
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/published-rust"
          git clone --quiet --filter=blob:none --no-checkout https://github.com/dosibjrn/mythicsim-forever-engine.git "$old"
          git -C "$old" fetch --quiet --depth 1 origin 9d56aba0de30d11fddf6af3cdffb3e0c0085ea83
          git -C "$old" checkout --quiet --detach FETCH_HEAD
          grep -Fq 'pub(crate) fn native_two_world_targets(&mut self)' "$old/src/core/fight.rs"
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py "$old"
          git -C "$old" diff --check
          first="$(git -C "$old" diff | sha256sum)"
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py "$old"
          second="$(git -C "$old" diff | sha256sum)"
          test "$first" = "$second"
          test "$(grep -Fc 'pub(crate) fn native_two_world_targets(&mut self, target_count: usize)' "$old/src/core/fight.rs")" = 1
          ! grep -Fq 'pub(crate) fn native_two_world_targets(&mut self)' "$old/src/core/fight.rs"
          cargo check --locked --manifest-path "$old/Cargo.toml"
      - name: Build selected source and check native actor regressions
        working-directory: integrations/mythicsim-rust/engine
        run: |
          cargo check --locked
          cargo test --locked --lib persistent_next_target
          cargo test --locked --lib world_lethal_terminal
          cargo build --locked --bin forever-engine
      - name: Two and three distinct real 2D kills and forged ACK rejection
        run: |
          python3 integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
            --mob-health 1200 --targets 2
          python3 integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
            --mob-health 1200 --targets 3
