name: One-shot WF61 sourced 1-2-100 paid replay
on:
  push:
    branches:
      - work/2nd-wf61-first-live-source-20261101
    paths:
      - .github/workflows/zz-wf61-first-live-once.yml
permissions:
  contents: read
jobs:
  source-paid-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run real source-backed paid 1, 2 and 100 mob sessions
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python tools/wf61_live_persistent_replay.py \
            --class druid --level 30 \
            --stage evidence/wf353/WF353_L30_P3_BEST_JOINT_ITEM_STAGE.json \
            --ability-db data/forever/staged_druid_l30_talents_70338.sqlite \
            --observations evidence/WF322_DRUID_L20_WEB_TEXT_OBSERVATIONS_70338.json \
            --control-observations evidence/wf321/druid_l20_control_observations.json \
            --build-as-of 2026-10-13 --max-wall-s 180 \
            --out /tmp/wf61-actual.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/wf61-actual.json'))
          print('WF61_REAL_REPLAY',json.dumps({k:r.get(k) for k in ('status','checkpoint_certified','source_identity','runs')},default=str)[:12000])
          PY
