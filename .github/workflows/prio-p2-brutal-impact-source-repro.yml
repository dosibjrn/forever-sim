name: Prio P2 Brutal Impact source-runtime diagnosis (one shot)
on:
  push:
    branches: [prio/p2-brutal-impact-source-repro-20261102]
jobs:
  canonical-brutal-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Inspect actual canonical source and rank compilation without modifying the ledger
        run: |
          python - <<'PY'
          import json
          from src.game.data.forever.registry import build_game_ir_slice
          from src.game.data.forever.sqlite_talents import DEFAULT_DB
          from src.game.talent_execution_coverage import compile_talent_runtime
          db=DEFAULT_DB
          print('PRIO_SOURCE_DB=',db,'bytes=',db.stat().st_size,flush=True)
          raw=build_game_ir_slice(class_key='druid',level=60,ability_db_path=db)
          compiled,inventory=compile_talent_runtime(raw)
          for ir,stage in ((raw,'raw'),(compiled,'compiled')):
              talent=next((t for t in ir.talents if t.id=='brutal_impact'),None)
              print('PRIO_BRUTAL_STAGE=',stage,'metadata=',repr(getattr(talent,'metadata',None)),flush=True)
              if talent:
                  for rank in talent.ranks:
                      print('PRIO_BRUTAL_RANK=',stage,rank.rank,'capture=',json.dumps(rank.provenance.get('checkpoint_source_l0'),sort_keys=True,default=str),'mods=',repr(rank.modifiers),flush=True)
              bash=[a for a in ir.actions if a.family_key=='bash']
              print('PRIO_BASH_ACTIONS=',stage,[(a.id,a.cooldown_s,[(e.effect_type,getattr(e,'control_id',None),getattr(e,'duration_s',None)) for e in a.effects],a.metadata.get('source_build_bridge_verified')) for a in bash],flush=True)
          print('PRIO_COMPILE_LEDGER=',str(inventory)[-4000:],flush=True)
          PY
      - name: Run real canonical P2 no-record for observed rank failure
        run: |
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P2 --out /tmp/prio-p2-no-record.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/prio-p2-no-record.json'))
          print('PRIO_LIVE_P2=',json.dumps({'status':d.get('status'),'results':[{'status':x.get('status'),'verified':x.get('verified'),'applicable':x.get('applicable'),'source_rank_pass':x.get('source_rank_pass'),'source_rank_total':x.get('source_rank_total'),'brutal_reasons':[a for a in x.get('reasons',[]) if 'brutal_impact' in str(a)]} for x in d.get('results',[])]},default=str))
          PY
