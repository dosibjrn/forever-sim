name: Work1 P7.4 deadline guard focused (one-shot)
on:
  push:
    branches: [work/work1-p74-deadline-aware-paid-steps-20261103]
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test real P7.4 search routing and deadline guard
        run: |
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/test_work1_p7_full_gear_pool.py
          python -m compileall -q tools/wf_gate_p7_4_live.py
