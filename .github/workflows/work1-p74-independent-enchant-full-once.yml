name: Work1 independent-enchant P7.4 real 300s/1000 no-record

# One changed-source full P7.4 after actual independent-enchant gear-pool admission fix; no M1 writes.
on:
  push:
    branches: [work/work1-p74-independent-enchant-pool-20261103]
    paths: [.github/workflows/work1-p74-independent-enchant-full-once.yml]

permissions:
  contents: read

jobs:
  real-production:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        gate: [P7.4]
    steps:
      - name: Checkout exact Work1 producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - name: Test source-independent-enchant pool and P7.4/P7.5 live routing
        run: |
          python -m compileall -q tools/wf_gate.py tools/wf_gate_p7_4_live.py
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_5_live.py tests/test_work1_p7_full_gear_pool.py
      - name: Hydrate exactly selected public MythicSim fork gitlink
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || { echo "SUBMODULE_SHA_MISMATCH $recorded $actual" >&2; exit 1; }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || exit 1
          ln -s "$engine" upstream
          test -f upstream/src/core/fight/world_bridge.rs
          echo "Exact selected Rust fork gitlink $actual"
      - name: Hydrate source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install source parser
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Build pinned native production Rust
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Run changed real cold search 300s plus frozen stochastic 1000 (no M1 write)
        shell: bash
        env:
          GATE: ${{ matrix.gate }}
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_FULL_SOURCE_SEARCH: "1"
        run: |
          set -euo pipefail
          mkdir -p run-output
          printf 'producer_head=%s\npinned_rust=%s\nsource_request=docs/evidence/druid-l60-balance/p7.3/saved_728_request.json\nbackend=pinned_mythicsim_rust_gsim_2d\n' "$(git rev-parse HEAD)" "$(git -C upstream rev-parse HEAD)" > run-output/provenance.txt
          echo "Running changed source-admitted P7.4 full cold search: $GATE"
          set +e
          timeout 1500s python -u tools/wf_gate.py --class druid --level 60 --spec balance --gate "$GATE" --out "run-output/$GATE.json" > "run-output/$GATE.log" 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >> run-output/provenance.txt
          tail -n 10 "run-output/$GATE.log"
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then exit "$rc"; fi
          test -s "run-output/$GATE.json"
          python - "$GATE" <<'PY'
          import json,sys,os
          from pathlib import Path
          g=sys.argv[1]
          d=json.loads((Path("run-output")/(g+".json")).read_text())
          assert d["status"] in ("PASS","FAIL","BLOCKED")
          r=d["results"][0]
          summary={k:r.get(k) for k in (
              "gate","status","reasons","joint_cold_world_dps","winner_live_dps",
              "frozen_stochastic_native_dps","frozen_stochastic_world_dps",
              "source_legal_joint_candidates_paid","source_legal_cold_candidates_paid",
              "search_wall_s","cold_candidate_failures", "winner_selection", "winner_screen_dps", "paid_stochastic_finalists", "paid_stochastic_confirmed_finalists", "paid_stochastic_finalist_failures")}
          print(json.dumps(summary))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as out:
              out.write(f"### {g}: {d['status']} (no M1 write)\n\n")
              out.write("~~~json\n"+json.dumps(summary,indent=2)+"\n~~~\n")
          PY
      - name: Upload actual full-gate diagnostic JSON and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work1-post-fork-full-source-${{ matrix.gate }}-${{ github.sha }}
          path: run-output/
          if-no-files-found: warn
          retention-days: 14
