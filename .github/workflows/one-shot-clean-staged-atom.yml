name: One-shot Clean staged atom source RED GREEN
on:
  push:
    branches:
      - work/clean-staged-atom-provenance-20261101
permissions:
  contents: read
concurrency:
  group: clean-staged-atom-source
  cancel-in-progress: false
jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real canonical source regression, base RED and changed GREEN
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          HEAD_SHA="$(git rev-parse HEAD)"
          git fetch --depth=1 origin b5e4a937a1ff58ce69590421b31f7ad1978db250
          git checkout --detach b5e4a937a1ff58ce69590421b31f7ad1978db250
          set +e
          python -m pytest -q tests/test_wf273_staged_source_search.py::test_data_only_source_change_flips_real_optimizer_winner > /tmp/atom-red.log 2>&1
          red_code=$?
          set -e
          cat /tmp/atom-red.log
          test "$red_code" -ne 0
          grep -q 'STALE_ATOM_INDEX_REINGEST_REQUIRED' /tmp/atom-red.log
          git checkout --detach "$HEAD_SHA"
          echo "GREEN_HEAD=$HEAD_SHA"
          python -m pytest -q \
            tests/test_wf273_staged_source_search.py::test_data_only_source_change_flips_real_optimizer_winner \
            tests/test_wf273_staged_source_search.py::test_bad_source_or_missing_effect_blocks_without_promotion \
            tests/test_wf294_source_atom_batch_cache.py::VerifiedAtomClassCacheTest::test_same_size_source_mutation_with_restored_mtime_invalidates
