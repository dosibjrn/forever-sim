name: One-shot native HP feedback causal source run (NOT P7)
on:
  push:
    branches: [work/native-world-hp-feedback-causal-20261101]
    paths:
      - .github/workflows/wf-native-hp-causal-one-shot.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-go-gsim-hp-feedback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Fast genuine gsim HP and ACK tests
        working-directory: project
        run: |
          python -m pip install --disable-pip-version-check pytest beautifulsoup4
          python -m pytest -q tests/test_wf_native_health_feedback_perturbation.py tests/test_wf_go_native_world_damage_ack.py
      - name: Build exact pinned source native engine
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
          cd ..
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Real gsim HP perturbation must change subsequent native source action
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          src=Path('upstream/sim/paladin/retribution/testdata/lights_vigil_request.json')
          request=json.loads(src.read_text())
          players=[p for party in request['raid']['parties'] for p in party['players']]
          assert len(players)==1
          actions=players[0]['rotation']['priorityList']
          original=[a for a in actions if a.get('action',{}).get('castSpell',{}).get('spellId',{}).get('spellId')==20271]
          assert len(original)==1, 'SOURCE_SPELL_20271_NOT_IN_PINNED_APL'
          actions.remove(original[0])
          actions.insert(0,{'action':{'castSpell':{'spellId':{'spellId':20271}},
                        'condition':{'isExecutePhase':{'threshold':'E20'}}}})
          Path('source-execute-request.json').write_text(json.dumps(request))
          PY
          cd project
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path('../gsim-go-world-ingress')
          request=Path('../source-execute-request.json')
          high=run(binary,request,ticks=80,target_spawn_yards=3.,
                   enemy_move_speed_yards_s=0.,target_initial_health_fraction=1.)
          low=run(binary,request,ticks=80,target_spawn_yards=3.,
                  enemy_move_speed_yards_s=0.,target_initial_health_fraction=.1)
          assert len(high['observations'])==len(low['observations'])==80
          assert high['native_binary_sha256']==low['native_binary_sha256']
          assert high['native_request_sha256']==low['native_request_sha256']
          assert all(x['native_world_ack_confirmation']['native_world_health_applied']
                     for x in high['observations']+low['observations'])
          h=high['observations'][1]
          l=low['observations'][1]
          print('Native execute phases after real ACK:',h['native_execute_phase_at_boundary'],l['native_execute_phase_at_boundary'])
          assert h['native_execute_phase_at_boundary']>20
          assert l['native_execute_phase_at_boundary']==20
          def spells(r):
              return [(x['action_id'],x['casts'],x['hits'],x['ticks'])
                      for x in r['observations'][-1]['native_spell_counters']]
          print('HIGH',spells(high))
          print('LOW',spells(low))
          assert spells(high)!=spells(low), 'WORLD_HP_NOT_CAUSAL_TO_NATIVE_SOURCE_ACTION'
          print('REAL_GSIM_HP_TO_NATIVE_APL_SOURCE_ACTION_DIFFERENCE_NOT_P7')
          PY
