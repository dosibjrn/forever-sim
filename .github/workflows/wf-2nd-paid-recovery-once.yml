name: One-shot source-paid persistent optimizer (2nd work)
on:
  push:
    branches:
      - work/2nd-paid-recovery-frontier-production-20261101
    paths:
      - .github/workflows/wf-2nd-paid-recovery-once.yml
permissions:
  contents: read
concurrency:
  group: 2nd-paid-recovery-frontier-once
  cancel-in-progress: false
jobs:
  source-paid:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install source-backed runtime prerequisites
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' beautifulsoup4
      - name: Real sourced recovery frontier in CombatRuntime
        run: python -m pytest -q tests/test_wf302_persistent_joint_search.py -k source_paid_recovery_frontier
      - name: Real class-neutral joint optimizer with recovery choices and 100-mob finalists
        run: |
          timeout 900s python -m tools.wf302_persistent_joint_optimizer --class-key druid --level 20 --screen-candidates 4 --finalists 1 --output /tmp/source-paid-2nd.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/source-paid-2nd.json'))
          s=r['screening']
          assert s['screen_evaluated']>=2, s
          policies=[row['recovery_policy'] for row in s['screening']]
          assert any(p is None for p in policies),policies
          assert any(p is not None for p in policies),policies
          assert s['screen_completed']>=1,s
          assert r['persistent_winner'] is not None,s
          assert r['persistent_winner']['persistent']['count']==100
          print('REAL_100_MOB_PAID_RECOVERY_JOINT_SEARCH',s['screen_evaluated'],policies,
                r['persistent_winner']['persistent']['mean_s_per_mob'])
          PY
