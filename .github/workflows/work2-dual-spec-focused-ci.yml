name: Work2 dual-spec baseline focused regression

on:
  push:
    branches:
      - work2/dual-spec-single-baseline-20261110-1209
    paths:
      - src/v2/dual_spec.py
      - tests/test_dual_spec_i17.py
      - .github/workflows/work2-dual-spec-focused-ci.yml

permissions:
  contents: read

jobs:
  focused-dual-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify dual-spec baseline and fallback without simulating Warcraft
        run: python -m pytest -q tests/test_dual_spec_i17.py
