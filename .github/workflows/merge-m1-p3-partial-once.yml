name: Merge-only M1 P3 real production partial (one shot)
on:
  push:
    branches: [work/merge-m1-p3-partial-20261102]
    paths: [.github/workflows/merge-m1-p3-partial-once.yml]
permissions:
  contents: write
jobs:
  measure-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Ensure canonical LFS SQLite is materialized
        run: |
          git lfs pull
          python - <<'PY'
          from pathlib import Path
          for path in Path('data').rglob('*.sqlite'):
              assert not path.read_bytes()[:50].startswith(b'version https://git-lfs.github.com/spec/v1'), path
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Real P3 production regression
        run: python -m pytest -q tests/test_wf_prio_p1_p3_partials.py -k p3
      - name: Execute Merge-owned P3 live FAIL and record verified partial
        shell: bash
        run: |
          set +e
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P3 --record-progress > /tmp/merge-p3-live.json
          rc=$?
          set -e
          cat /tmp/merge-p3-live.json
          test "$rc" -eq 1
          python - <<'PY'
          import csv, json
          from pathlib import Path
          report = json.loads(Path('/tmp/merge-p3-live.json').read_text())
          assert report['status'] == 'FAIL' and report['results'][0]['status'] == 'FAIL', report
          rows = list(csv.DictReader(Path('docs/planning/M1_PASSES.tsv').open(), delimiter='\t'))
          matches = [r for r in rows if (r['class'],r['level'],r['spec'],r['gate']) == ('druid','60','balance','P3')]
          assert len(matches) == 1 and matches[0]['status'] == 'PARTIAL', matches
          row = matches[0]
          assert 0 < int(row['verified']) < int(row['applicable']), row
          assert row['scope_provisional'] == '1', row
          assert row['run_url'].endswith('/actions/runs/' + __import__('os').environ['GITHUB_RUN_ID']), row
          print('Verified real production P3 partial:',row['verified'],'/',row['applicable'])
          PY
      - name: Print M1 register-only scoreboard
        run: python tools/m1_progress.py
      - name: Commit only the official M1 TSV change on this isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Forever Sim Merge"
          git config user.email "forever-sim-merge@users.noreply.github.com"
          git add docs/planning/M1_PASSES.tsv
          git diff --cached --quiet && { echo 'No verified ledger change'; exit 1; }
          git commit -m "chore(m1): record live Druid L60 Balance P3 measured partial"
          git push origin HEAD:work/merge-m1-p3-partial-20261102
