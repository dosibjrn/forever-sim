name: Temporary Clean native-world test relocation verification
on:
  pull_request:
    paths:
      - 'tests/integration/backend/test_wf_*.py'
      - '.github/workflows/manual-exact-pr-head.yml'
      - '.github/workflows/wf-gsim-go-native-range-loop.yml'
      - '.github/workflows/wf-gsim-go-world-range-feed.yml'
      - '.github/workflows/clean-native-world-once.yml'
permissions:
  contents: read
jobs:
  check-native-world:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify six relocated native-world regressions and manual verifier contract
        run: |
          python -m pytest -q \
            tests/integration/backend/test_wf_druid_l60_native_step_protocol.py \
            tests/integration/backend/test_wf_go_native_world_damage_ack.py \
            tests/integration/backend/test_wf_go_paired_native_spell_probe.py \
            tests/integration/backend/test_wf_native_health_feedback_perturbation.py \
            tests/integration/backend/test_wf_native_spell_observations.py \
            tests/integration/backend/test_wf_native_target_spell_observations.py \
            tests/maintenance/test_manual_exact_pr_head_workflow.py
