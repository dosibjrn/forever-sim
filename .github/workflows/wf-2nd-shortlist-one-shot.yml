name: Bounded 2nd work source shortlist RED GREEN
on:
  push:
    branches:
      - work/2nd-distinct-paid-recovery-shortlist-20261101
    paths:
      - tests/test_wf437_fast_search_validation_tdd.py
      - src/v2/source_bounded_joint_frontier.py
      - .github/workflows/wf-2nd-shortlist-one-shot.yml
permissions:
  contents: read
jobs:
  real-source-shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-backed paid shortlist regression
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          git rev-parse HEAD
          python -m pytest -q tests/test_wf437_fast_search_validation_tdd.py -k real_source_paid_shortlist_never_replays_same_full_build_twice
