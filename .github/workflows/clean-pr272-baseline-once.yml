name: Clean PR272 baseline G50 cold HTTP (one-shot)
on:
  push:
    branches:
      - clean/group-g50c-i-service-integration-20261102-1947
    paths:
      - .github/workflows/clean-pr272-baseline-once.yml
permissions:
  contents: read
jobs:
  baseline:
    name: Main-baseline ${{ matrix.test_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test_name: G50c, file: tests/test_g50c_cold_service_http_isolation.py}
          - {test_name: G50d, file: tests/test_g50d_cold_listener_worker_isolation.py}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: efd208d2f49d1a6ca19ec6b04974154a9dc27951
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install exact same dependencies as relocated test
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Cold HTTP baseline against original main file layout
        env:
          TEST_FILE: ${{ matrix.file }}
        run: python -m pytest -vv -ra "$TEST_FILE" -k 'not browser'
