name: Work2 — Warlock L20 unseeded native 30/300 cold search

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - .github/workflows/work2-warlock-l20-paid-cold.yml
      - tests/test_work2_warlock_native_cold_cli.py
  workflow_dispatch:

permissions:
  contents: read

# Preserve a started paid run. This workflow only auto-launches on the
# initial PR or a corrective change to this paid workflow/CLI fixture.
# Unrelated production edits run focused PR CI without restarting paid search.
concurrency:
  group: work2-warlock-l20-paid-cold
  cancel-in-progress: false

jobs:
  unseeded-native-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact Forever PR or manually dispatched HEAD
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Checkout tested MythicSim Rust engine
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: febc1d703e022265ed61ede3fec9b05416282536
          path: engine
      - name: Verify exact engine and unseeded actor template
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "febc1d703e022265ed61ede3fec9b05416282536"
          git -C project rev-parse HEAD
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("engine/fixtures/warlock-l20-troll-native.request.json")
          actor = json.loads(path.read_text())["raid"]["parties"][0]["players"][0]
          assert actor["class"] == "ClassWarlock" and actor["race"] == "RaceTroll"
          assert actor["equipment"]["items"] == [] and actor["talentsString"] == "0-0-0"
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded transport test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Focused Forever cold proposal and gate transport regressions
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_native_cold.py tests/test_work2_warlock_native_cold_cli.py tests/test_work2_warlock_gate_bridge.py
      - name: Build the exact selected real native Rust
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: One real unseeded 30-to-300s paid search and native hostile 100-mob finalists
        working-directory: project
        run: |
          set -euo pipefail
          python -u tools/wf_warlock_l20_native_cold.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-native.request.json \
            --out ../warlock-l20-cold-evidence \
            --unseeded --budget 300 --snapshot 30 --seed 20261109
      - name: Preserve real native requests, 30/300 snapshot and finalist refusals
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l20-unseeded-cold-${{ github.run_id }}
          path: warlock-l20-cold-evidence/
          if-no-files-found: warn
          retention-days: 7
