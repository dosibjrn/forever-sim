name: Prio P5 contract one-shot
on:
  pull_request:
    paths:
      - tools/wf_gate.py
      - tools/wf_gate_p5_live.py
      - tools/wf_gate_p4_p5_partial.py
      - tests/test_prio_p5_contract_alignment.py
      - .github/workflows/prio-p5-contract-one-shot.yml
permissions:
  contents: read
jobs:
  p5-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_prio_p5_contract_alignment.py
      - run: python -m compileall -q tools/wf_gate.py tools/wf_gate_p5_live.py
