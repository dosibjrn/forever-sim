name: Work1 P7.5 accepted-M1 receipt regression one-shot
on:
  push:
    branches:
      - work/work1-p75-trusted-prior-receipts-20261103-0403
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run actual P7.5 prior and M1 retrieval regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest -q tests/gates/test_wf_gate_p7_5_receipts.py tests/gates/test_wf_gate_p7_5_prior.py
          python -m compileall -q tools/wf_gate_p7_5_receipts.py tools/wf_gate_p7_5_prior.py
