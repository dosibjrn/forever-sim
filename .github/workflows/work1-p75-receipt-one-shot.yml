name: Work1 P7.5 accepted-M1 receipt regression one-shot
on:
  push:
    branches:
      - work/work1-p75-trusted-prior-receipts-20261103-0403
permissions:
  contents: read
  actions: read
jobs:
  receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Run actual P7.5 prior and M1 retrieval regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2'
          python -m pytest -q tests/gates/test_wf_gate_p7_5_receipts.py tests/gates/test_wf_gate_p7_5_prior.py
          python -m compileall -q tools/wf_gate_p7_5_receipts.py tools/wf_gate_p7_5_prior.py
      - name: Probe actual registered accepted M1 runs (no gate re-execution)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/wf_gate_p7_5_receipts.py \
            --repository "$GITHUB_REPOSITORY" --class druid --level 60 \
            --spec balance --out "$RUNNER_TEMP/p75-priors.json"
          FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS="$RUNNER_TEMP/p75-priors.json" python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p7_5_prior import strongest_accepted_prior
          p = strongest_accepted_prior(
              Path.cwd(), "druid", 60, "balance",
              engine_revision="54cf5237d4bccc4532cdb75b05f4d16aaa75a394",
              source_sha256="e99b06e5aa891a941ac077643a4209ab8582c810b678df4ec2d47ac48c6c646a",
              reference_dps=728.1936126415858)
          assert p is not None, "P7.5 accepted prior remained unavailable"
          assert p["dps"] >= 749.53 and "P7.3" in p["compatible_gates"], p
          print("Actual compatible accepted M1 P7.3 prior:", p)
          PY
