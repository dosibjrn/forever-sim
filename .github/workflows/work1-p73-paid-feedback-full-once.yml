name: Work1 P7.3 paid-feedback real full no-record once
on:
  push:
    branches: [work/work1-p73-paid-feedback-20261103-0323]
    paths: [.github/workflows/work1-p73-paid-feedback-full-once.yml]
permissions:
  contents: read
jobs:
  full-selected-rust-gsim:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Work1 producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - name: Hydrate selected Rust submodule and prove gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || exit 1
          ln -s "$engine" upstream
          test -f upstream/src/core/fight/world_bridge.rs
          echo "Selected Rust SHA=$actual"
      - name: Hydrate source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install source parser and run focused regression
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py
      - name: Build exact pinned MythicSim Rust
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Real 300-second source-paid P7.3 and frozen 1000 stochastic native-gsim fights (no M1 write)
        shell: bash
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_FULL_SOURCE_SEARCH: '1'
        run: |
          set -euo pipefail
          mkdir -p run-output
          printf 'producer_head=%s\npinned_rust=%s\nsource_request=docs/evidence/druid-l60-balance/p7.3/saved_728_request.json\nbackend=pinned_mythicsim_rust_gsim_2d\n' "$(git rev-parse HEAD)" "$(git -C upstream rev-parse HEAD)" > run-output/provenance.txt
          set +e
          timeout 1500s python -u tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.3 --out run-output/P7.3.json > run-output/P7.3.log 2>&1
          rc=$?
          set -e
          echo "gate_exit_code=$rc" >> run-output/provenance.txt
          tail -n 12 run-output/P7.3.log
          [[ "$rc" == 0 || "$rc" == 1 ]] || exit "$rc"
          test -s run-output/P7.3.json
          python - <<'PY'
          import json
          r=json.load(open("run-output/P7.3.json"))
          d=r["results"][0]
          fields=["status","reasons","search_wall_s","source_legal_cold_candidates_paid","early_stochastic_finalists_paid","stochastic_parent_proposals","paid_stochastic_finalists","winner_selection","winner_live_dps","frozen_stochastic_iterations","frozen_stochastic_native_dps","frozen_stochastic_world_dps","required_reference_dps","native_source_revision","source_request_raw_sha256"]
          print(json.dumps({k:d.get(k) for k in fields}))
          print("REAL_GATE_VERDICT",r["status"],"NO_M1_RECORD")
          PY
      - name: Upload full gate receipt (no M1 write)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work1-p73-early-feedback-${{ github.sha }}
          path: run-output/
          retention-days: 14
          if-no-files-found: warn
