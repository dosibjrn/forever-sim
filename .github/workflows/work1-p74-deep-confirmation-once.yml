name: Work1 P7.4 deep paid finalist RED GREEN one-shot
on:
  push:
    branches: [work/work1-p74-deep-paid-confirmation-20261103]
    paths:
      - .github/workflows/work1-p74-deep-confirmation-once.yml
      - tools/wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_p7_4_live.py
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - name: Focused RED GREEN P7.4 paid selection + all existing P7.4 regressions
        run: |
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_4_live.py
