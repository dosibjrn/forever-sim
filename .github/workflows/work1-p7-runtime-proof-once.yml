name: Work1 one-shot P7 runtime-proof exact-branch verification
on:
  push:
    branches:
      - work/work1-p7-live-runtime-proof-20261102-1941
    paths:
      - .github/workflows/work1-p7-runtime-proof-once.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused dispatcher-to-provider regressions (mocked producer, NOT P7 acceptance)
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          echo "Production/test commit: $(git rev-parse HEAD)"
          python -m pytest -q \
            tests/test_work1_p7_1_live_entry.py \
            tests/test_wf_gate_p7_2_live.py \
            tests/test_wf_gate_p7_3_live.py \
            tests/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_1_live.py tools/wf_gate_p7_2_live.py tools/wf_gate_p7_3_live.py tools/wf_gate_p7_4_live.py
