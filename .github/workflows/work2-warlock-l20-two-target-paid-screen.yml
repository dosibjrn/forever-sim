name: Work2 — single real paid Warlock L20 two-target diagnostic

# One bounded source-paid timing probe on the implementation PR. Subsequent
# code edits do not repeat this expensive native build automatically.
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/work2-warlock-l20-two-target-paid-screen.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work2-warlock-l20-paid-screen-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  actual-native-two-target-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact Forever implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project

      - name: Checkout prior 100/100 paid Decisions-capable Warlock Rust source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: febc1d703e022265ed61ede3fec9b05416282536
          path: engine

      - name: Record precise provenance and limit claim to old source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "febc1d703e022265ed61ede3fec9b05416282536"
          test -s engine/fixtures/warlock-l20-troll-best-paid.request.json
          echo "FOREVER_HEAD=$(git -C project rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "RUST_SOURCE_SHA=$(git -C engine rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "This Rust SHA completed the earlier 100/100 paid Decisions chain; this is a 2-target stationary-source timing diagnostic, NOT Work1's pending hostile-compatible pin or a P4/P5/P6 verdict." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install existing Forever world dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Build exact tested Rust source
        working-directory: engine
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --bin forever-engine

      - name: One genuinely native-paid two-target Decisions chain and measured wall
        shell: bash
        working-directory: project
        run: |
          set -euo pipefail
          python -u -m tools.wf_warlock_l20_native_cold \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --out ../warlock-l20-two-target-paid \
            --two-target-screen --screen-timeout 120

      - name: Summarize actual completion and 30-second eligibility
        if: always()
        shell: bash
        run: |
          if test -s warlock-l20-two-target-paid/two_target_screen_summary.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path("warlock-l20-two-target-paid/two_target_screen_summary.json").read_text())
          for key in ("status", "elapsed_wall_s", "completed_by_30s", "screen_targets", "reason"):
              print(f"{key}: {r.get(key)}")
              with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as out:
                  out.write(f"{key}: {r.get(key)}\\n")
          PY
          else
            echo "No structured receipt: inspect native build or runner logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Preserve bounded native request, actor, ACK and wall receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l20-one-paid-two-target-screen
          path: warlock-l20-two-target-paid/
          if-no-files-found: warn
          retention-days: 1
