name: Work2 Warlock L23 one changed native paid route trial

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]
    paths:
      - tools/wf_warlock_next_level_source.py
      - tests/test_work2_warlock_next_level_source.py
      - .github/workflows/work2-warlock-l23-native-trial.yml
      - src/v2/native_paid_route.py
      - src/v2/path_dp.py
      - tools/wf_warlock_route_guide.py
      - tests/test_work2_native_paid_banked_path_dp.py
      - tests/test_work2_native_paid_route_publisher.py

permissions:
  contents: read

jobs:
  paid-native-l23:
    # This is one independent new L23 chain, not an L22 or cold-search rerun.
    if: github.head_ref == 'work2/warlock-native-paid-banked-path-20261110-0831'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work2 producer
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout tested native actor source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify source pin
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
          git -C project rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever world adapter and tests
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify native-boundary producer and guide
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_warlock_route_guide.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py
      - name: Build exact pinned native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve exact L22 executed-world source and route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13740652424/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l22-native-route/native_l22/best_apl/source_request.json
          test -s previous/warlock-l22-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          route=json.loads(Path("previous/warlock-l22-native-route/route.json").read_text())
          source=Path("previous/warlock-l22-native-route/native_l22/best_apl/source_request.json").read_bytes()
          assert route["measured_levels"] == [20,21,22],route["measured_levels"]
          l22=[r for r in route["observations"] if r["level"]==22]
          assert l22 and any(r["source_request_sha256"]==hashlib.sha256(source).hexdigest()
                             for r in l22), "L22 actual paid-world source fingerprint mismatch"
          assert route["full_10_60_native_replay_executed"] is False
          print("VERIFIED_PAID_L22_BASELINE",hashlib.sha256(source).hexdigest(),flush=True)
          PY
      - name: Propose actual L23 candidate using Rust options and prepare
        id: propose
        continue-on-error: true
        working-directory: project
        run: |
          python -u tools/wf_warlock_next_level_source.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l22-native-route/native_l22/best_apl/source_request.json \
            --from-level 22 --to-level 23 \
            --out ../warlock-l23-source
      - name: Publish exact source-native L23 refusal without invented route
        if: steps.propose.outcome == 'failure'
        working-directory: project
        run: |
          test -s ../warlock-l23-source/proposal.json
          python -u tools/wf_warlock_route_guide.py \
            --native-proposal ../warlock-l23-source/proposal.json \
            --baseline-observations ../previous/warlock-l22-native-route/route.json \
            --out ../warlock-l23-native-route
      - name: Execute actual hostile L23 100-target paid native Decisions chain
        if: steps.propose.outcome == 'success'
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 23 \
            --binary ../engine/target/debug/forever-engine \
            --source ../warlock-l23-source/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --baseline-observations ../previous/warlock-l22-native-route/route.json \
            --trial paid-source-native-l23 \
            --out ../warlock-l23-native-route
      - name: Preserve full actual L22 source, L23 requests, refusals and measured guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l23-paid-${{ github.run_id }}
          path: |
            previous/warlock-l22-native-route/native_l22/best_apl/source_request.json
            previous/warlock-l22-native-route/route.json
            warlock-l23-source/
            warlock-l23-native-route/
          if-no-files-found: warn
          retention-days: 3
