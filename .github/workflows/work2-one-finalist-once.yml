name: Work2 one-shot real paid finalist regression

on:
  push:
    branches:
      - work/work2-preserve-fastest-paid-finalist-20261102
    paths:
      - .github/workflows/work2-one-finalist-once.yml
      - src/v2/source_bounded_joint_frontier.py

permissions:
  contents: read

jobs:
  real-paid-finalist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout hydrated source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real source and production finalist selection
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf395_two_stage_joint_frontier_tdd.py
