name: One-shot P1 mixed-domain source RED GREEN
on:
  push:
    branches:
      - work/prio-p1-observed-domain-failclosed-20261101
    paths:
      - .github/workflows/prio-p1-mixed-domain-one-shot.yml
permissions:
  contents: read
jobs:
  source-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: RED on pre-fix exact source with real SQLite and sourced observation
        env:
          WOW_FOREVER_BUILD_AS_OF: '2026-10-17'
        run: |
          git checkout --detach 23a251588404002784db8328d48baf3ebd6489f0
          set +e
          python -m pytest -q tests/test_wf470_p1_scope.py::test_mixed_healing_and_unclassified_positive_source_effect_stays_unresolved
          status=$?
          set -e
          echo "pre-fix reproduction exit=$status"
          if [ "$status" -eq 0 ]; then echo "RED was not reproduced"; exit 1; fi
      - name: GREEN same real source reproduction and scoped P1 regression
        env:
          WOW_FOREVER_BUILD_AS_OF: '2026-10-17'
        run: |
          git checkout --detach 645a05ba2945346ccd277d97365c1cfcd0631d68
          python -m pytest -q tests/test_wf470_p1_scope.py
          python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p1_live import run_live
          root = Path.cwd()
          for level in (20, 30):
              report = run_live(root, 'druid', level)
              print('real sourced Druid P1 level', level, 'status', report['status'],
                    'problem_count', report['problem_count'])
              assert report['status'] in ('PASS', 'FAIL')
          PY
