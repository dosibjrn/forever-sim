name: Work1 selected-pin P7.5 bounded native-world diagnosis
on:
  push:
    branches: [work/work1-selected-pin-p75-probe-20261103-0446]
    paths: [.github/workflows/work1-selected-pin-p75-probe.yml]
permissions:
  contents: read
jobs:
  verify-production-pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          submodules: true
          lfs: true
      - name: Verify exact selected Rust and source
        shell: bash
        run: |
          set -euo pipefail
          echo "PROBE_PRODUCER_SHA=$(git -C project rev-parse HEAD)"
          expected="$(git -C project ls-tree HEAD -- integrations/mythicsim-rust/engine | awk '$1=="160000" {print $3}')"
          actual="$(git -C project/integrations/mythicsim-rust/engine rev-parse HEAD)"
          echo "PRODUCER_SHA=$(git -C project rev-parse HEAD)"
          echo "SELECTED_RUST_SHA=$actual"
          test "$actual" = "$expected"
          test "$actual" = "4aaefef11c21eaaa52a1531a27ac4e6b294cd770"
          ln -s project/integrations/mythicsim-rust/engine upstream
          cd project
          git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 2D source dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Compile exact selected engine
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Real fixed-request native and 2D stochastic parity on selected pin
        working-directory: project
        run: |
          python - <<'PY'
          import importlib.util, json
          from pathlib import Path
          path=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("work1_native_world",path)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("docs/evidence/druid-l60-balance/p7.3/saved_728_request.json")
          native=probe.native_source_control(binary,request,1000,rng_mode="stochastic")
          world=probe.run(binary,request,distance=15.,iterations=1000,rng_mode="stochastic")
          result={"native_dps":native["native_dps"],"world_dps":world["world_mean_dps"],
                  "iterations":world["iterations_done"],"native_damage_events":world["native_damage_events"],
                  "world_boundaries":world["native_world_ticks"]}
          print("WORK1_SELECTED_PIN_REFERENCE",json.dumps(result),flush=True)
          assert result["iterations"]==1000
          assert result["native_damage_events"]>0 and result["world_boundaries"]>0
          assert abs(result["native_dps"]-result["world_dps"])<1e-5, result
          PY
      - name: P7.5 tiny real source-paid probe (no M1 write; not a full gate)
        working-directory: project
        run: |
          set -uo pipefail
          mkdir -p run-output
          FOREVER_P7_FULL_SOURCE_SEARCH=0 python -u tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.5 --out run-output/p75-light.json > run-output/p75-light.log 2>&1
          code=$?
          echo "P7.5_LITE_EXIT=$code"
          tail -n 10 run-output/p75-light.log
          test -s run-output/p75-light.json || exit 1
          python - <<'PY'
          import json
          with open("run-output/p75-light.json") as f: o=json.load(f)
          r=o.get("results",[o])[0]
          print("WORK1_P75_LIGHT_ACTUAL",json.dumps({k:r.get(k) for k in (
              "gate","status","reasons","native_source_revision",
              "source_legal_joint_candidates_paid","joint_cold_world_dps",
              "paid_joint_stochastic_finalists","cold_candidate_failures")}),flush=True)
          assert r.get("native_source_revision")=="4aaefef11c21eaaa52a1531a27ac4e6b294cd770"
          assert r.get("source_legal_joint_candidates_paid",0)>0
          assert r.get("status")!="PASS", "3-candidate probe cannot certify P7.5"
          PY
      - name: Upload bounded diagnostics for next Work1 cycle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-current-rust-p75-light-probe
          path: project/run-output/
          retention-days: 7
