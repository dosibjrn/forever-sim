name: Clean G06 original-path baseline comparison (one shot)

on:
  push:
    branches:
      - clean/group-gameir-publication-20261102

permissions:
  contents: read

jobs:
  original-vs-relocated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          lfs: true
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused regression dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Run original G06 pre-tuning case on main
        shell: bash
        run: |
          set +e
          echo "MAIN_SHA=$(git rev-parse HEAD)"
          echo "MAIN_G06_BLOB=$(git hash-object tests/test_game_ir_tuning_overlays_g06.py)"
          timeout 45s python -u -m pytest -vv -s --tb=short -x tests/test_game_ir_tuning_overlays_g06.py::test_pre_tuning_build_keeps_raw_executable_damage
          rc=$?
          echo "ORIGINAL_MAIN_EXIT=$rc"
          exit 0
      - name: Checkout same PR head being tested
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          lfs: true
          clean: true
      - name: Run relocated G06 pre-tuning case on PR
        shell: bash
        run: |
          set +e
          echo "CLEAN_HEAD_SHA=$(git rev-parse HEAD)"
          echo "CLEAN_G06_BLOB=$(git hash-object tests/generic/publication/test_game_ir_tuning_overlays_g06.py)"
          timeout 45s python -u -m pytest -vv -s --tb=short -x tests/generic/publication/test_game_ir_tuning_overlays_g06.py::test_pre_tuning_build_keeps_raw_executable_damage
          rc=$?
          echo "RELOCATED_HEAD_EXIT=$rc"
          exit 0
