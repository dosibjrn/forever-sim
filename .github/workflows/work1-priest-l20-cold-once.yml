name: Work1 Priest L20 native cold P4-P5 no-record
on:
  push:
    branches:
      - work/work1-priest-l20-native-pin-20261104
    paths:
      - '.github/workflows/work1-priest-l20-cold-once.yml'

permissions:
  contents: read

jobs:
  priest-cold:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact selected Rust pin
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing Forever bridge and focused test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Focus-test real 2-mob paid route ranking and frozen 100-mob finalists before cold run
        run: >-
          python -m pytest -q
          tests/test_wf_native_priest_l20_cold.py
          tests/test_wf_native_priest_l20_paid.py
          tests/test_work1_p4_p5_single_cold_snapshot.py
      - name: Build selected native engine
        run: |
          set -euo pipefail
          selected="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          actual="$(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
          test "$selected" = "$actual"
          echo "PRIEST_COLD_HEAD=$GITHUB_SHA RUST_ENGINE_PIN=$actual"
          cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml --bin forever-engine
      - name: Pay source-authored Priest talent and APL proposals on exact selected native Rust
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          from tools.wf_native_priest_l20_paid import score_source_priest_l20
          binary = Path("integrations/mythicsim-rust/engine/target/debug/forever-engine").resolve()
          folder = Path("integrations/mythicsim-rust/fixtures/priest-l20-source-frontier")
          rows = []
          for path in sorted(folder.glob("*.json")):
              try:
                  paid = score_source_priest_l20(binary, path, budget_s=7.0)
                  row = {
                      "candidate": path.name, "status": "NATIVE_PAID",
                      "action_casts": paid["native_source_action_casts"],
                      "native_action_ids_cast": paid["native_source_action_cast_counts"],
                      "mind_flay_15407_casts": sum(
                          count for identity, count in
                          paid["native_source_action_cast_counts"].items()
                          if json.loads(identity).get("spellId") == 15407
                      ),
                  }
              except (OSError, ValueError, RuntimeError, AssertionError,
                      TimeoutError, subprocess.SubprocessError) as exc:
                  row = {"candidate": path.name, "status": "NATIVE_REFUSED",
                         "native_reason": str(exc)[-400:]}
              rows.append(row)
              print("PRIEST_L20_REAL_SOURCE_POLICY_PAID", json.dumps(row, sort_keys=True), flush=True)
          assert len(rows) >= 4, rows
          assert rows[0]["status"] == "NATIVE_PAID" and rows[0]["action_casts"] > 0, rows
          # P4 requires a reachable talent-unlocked action to be compared
          # through actual native casts, not merely present in a source APL.
          # This is a cheap preflight: a native refusal/zero cast stops the
          # 300s run and exposes the actual reason without inventing credit.
          assert any(
              row["candidate"] == "04-source-mind-flay.json"
              and row["status"] == "NATIVE_PAID"
              and row.get("mind_flay_15407_casts", 0) > 0
              for row in rows
          ), "PRIEST_L20_MIND_FLAY_UNLOCK_NOT_NATIVE_CAST"
          # A new 300s cold run is justified only if at least one changed
          # source talent/APL candidate actually executes in the pinned Rust.
          # A proposed unlock with zero native casts is NOT unlock evidence.
          assert any(row["status"] == "NATIVE_PAID" and row["action_casts"] > 0
                     for row in rows[1:]), "NO_PAID_NATIVE_POLICY_OR_TALENT_VARIANT"
          print("PRIEST_L20_REAL_NATIVE_VARIANT_REACHABLE_NO_GATE_CREDIT", flush=True)
          PY
      - name: One fresh 300s native paid cold P4/P5 producer, NO RECORD
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: integrations/mythicsim-rust/engine/target/debug/forever-engine
          FOREVER_P4_P5_PRIEST_L20_SOURCE_REQUEST_DIR: integrations/mythicsim-rust/fixtures/priest-l20-source-frontier
          FOREVER_P4_P5_PRIEST_L20_LIVE_WORLD: '1'
          FOREVER_P4_P5_PRIEST_L20_PERSISTENT_TARGETS: '100'
          FOREVER_P4_P5_PRIEST_L20_COLD_SEARCH: '1'
          FOREVER_P4_P5_PRIEST_L20_COLD_RECEIPT_OUT: priest-l20-cold-receipts.json
        run: |
          set +e
          python tools/wf_gate.py --class priest --level 20 --spec unrestricted --gate P4 --out priest-l20-cold-gate.json
          gate_exit=$?
          set -e
          echo "NONCERTIFYING_GATE_EXIT=$gate_exit"
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path("priest-l20-cold-gate.json").read_text())
          receipt_file = Path("priest-l20-cold-receipts.json")
          if not receipt_file.exists():
              raise SystemExit("NATIVE_COLD_PRODUCER_ABORTED: " + repr(gate["results"]))
          receipts = json.loads(receipt_file.read_text())
          print("PRIEST_NATIVE_COLD_REAL_RESULT", json.dumps({
              "head": gate["class"], "gate_status": gate["status"],
              "native_paid_before_30": receipts["native_cold_native_paid_before_30"],
              "native_paid_after_30": receipts["native_cold_native_paid_after_30"],
              "completed_routes_before_30": receipts["native_cold_completed_routes_before_30"],
              "completed_routes_after_30": receipts["native_cold_completed_routes_after_30"],
              "real_100mob_finalists": receipts["native_cold_completed_100mob_finalists"],
              "elapsed_wall_s": receipts["native_cold_search_wall_s"],
              "reached_300": receipts["native_cold_300s_reached"],
              "overrun": receipts["native_cold_300s_overrun"],
              "snapshot_30_available": receipts["native_cold_snapshot_30"] is not None,
              "final_300_available": receipts["native_cold_final_300"] is not None,
          }, sort_keys=True), flush=True)
          from collections import Counter
          executed_ids = Counter()
          for row in receipts.get("native_cold_rows", []):
              executed_ids.update(row.get("native_source_action_cast_counts") or {})
          print("PRIEST_NATIVE_COLD_EXECUTED_NATIVE_APL_ACTION_IDS",
                json.dumps(dict(executed_ids), sort_keys=True), flush=True)
          status_counts = Counter(row.get("status", "UNKNOWN")
                                  for row in receipts.get("native_cold_rows", []))
          refusal_reasons = Counter(
              str(row.get("reason", "")) for row in receipts.get("native_cold_rows", [])
              if row.get("status") == "NATIVE_REFUSED")
          print("PRIEST_NATIVE_COLD_REFUSAL_SUMMARY", json.dumps({
              "status_counts": dict(status_counts),
              "top_native_refusals": refusal_reasons.most_common(3),
          }, sort_keys=True), flush=True)
          early = receipts.get("native_cold_30s_paid_selection") or {}
          deferred = receipts.get("native_cold_30s_post_search_route") or {}
          print("PRIEST_NATIVE_COLD_30S_SELECTION", json.dumps({
              "real_paid_selection_before_cutoff": bool(early),
              "paid_completed_elapsed_s": early.get("paid_completed_elapsed_s"),
              "paid_2mob_route_s_per_mob": early.get("route_probe_s_per_mob"),
              "selection_objective": early.get("snapshot_selection_objective"),
              "source_request_sha256": early.get("source_request_sha256"),
              "post_search_native_100mob_status": deferred.get("status"),
              "post_search_real_route_s_per_mob": deferred.get("route_s_per_mob"),
              "post_search_native_failure": deferred.get("reason"),
              "final_300_100mob_status": (receipts.get("native_cold_300s_post_search_route") or {}).get("status"),
              "final_300_paid_route_s_per_mob": (receipts.get("native_cold_300s_paid_selection") or {}).get("route_probe_s_per_mob"),
          }, sort_keys=True), flush=True)
          # Expose only genuine executed finalist receipts in the job log.
          # A missing snapshot or winner is an observed result, not a stub
          # PASS; the artifact keeps the full source-native receipt if present.
          for window in ("native_cold_snapshot_30", "native_cold_final_300"):
              winner = receipts.get(window)
              if not isinstance(winner, dict):
                  print("PRIEST_NATIVE_COLD_WINDOW", window, "NO_EXECUTED_WINNER", flush=True)
                  continue
              world = winner.get("real_100mob_receipt") or {}
              print("PRIEST_NATIVE_COLD_WINDOW", json.dumps({
                  "window": window,
                  "source_request_sha256": winner.get("source_request_sha256"),
                  "paid_completed_elapsed_s": winner.get("paid_completed_elapsed_s"),
                  "real_route_s_per_mob": winner.get("route_s_per_mob"),
                  "native_world_kills": world.get("native_2d_persistent_world_targets_killed"),
                  "native_source_action_events": world.get("native_2d_persistent_source_action_events"),
                  "native_paid_recovery": world.get("native_2d_persistent_paid_recovery"),
              }, sort_keys=True), flush=True)
          assert gate["status"] != "PASS", "No-record producer must not silently certify"
          assert receipts["native_cold_attempted_distinct_builds"] > 0, "No genuine candidate attempted"
          PY
      - name: Preserve exact real-run native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priest-l20-native-cold-no-record
          path: |
            priest-l20-cold-gate.json
            priest-l20-cold-receipts.json
          if-no-files-found: warn
          retention-days: 14
