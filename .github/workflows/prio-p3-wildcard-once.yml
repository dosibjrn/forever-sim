name: Prio P3 wildcard weapon source (temporary)
on:
  push:
    branches: [prio/p3-wildcard-weapon-dps-20261102]
  pull_request:
    branches: [main]
jobs:
  source-weapon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Materialize canonical SQLite from Git LFS
        run: |
          git lfs pull
          file data/forever/catalogue/forever_abilities.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-test dependencies
        run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Inspect genuine source weapon facts and selected runtime
        run: |
          python - <<'PY'
          from src.game.data.forever.registry import build_game_ir_slice
          from src.game.gear import _weapon_facts_for_ir,executable_gear_stats
          from src.game.model.ir import WeaponDamageEffect
          for name,level in [('rogue',20),('druid',60)]:
              ir=build_game_ir_slice(class_key=name,level=level)
              print('SOURCE_CLASS',name,'level',level,'ir',bool(ir),flush=True)
              if ir is None: continue
              facts=_weapon_facts_for_ir(ir)
              print('FACTS',[(f.mode_label,m,f.source_stat,f.damage_source_kind) for f,m in facts],flush=True)
              print('AXES',executable_gear_stats(ir),flush=True)
              print('ACTIONS',[(a.id,[(e.damage_source.kind,e.damage_source.dps_stat_id) for e in a.effects if isinstance(e,WeaponDamageEffect)],a.requirements) for a in ir.actions if any(isinstance(e,WeaponDamageEffect) for e in a.effects)],flush=True)
          PY
      - name: Real production wildcard regression
        run: |
          python -m pytest -q tests/test_prio_p3_wildcard_weapon.py
