name: Prio P3 wildcard weapon source (temporary)
on:
  push:
    branches: [prio/p3-wildcard-weapon-dps-20261102]
  pull_request:
    branches: [main]
jobs:
  source-weapon:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Materialize canonical SQLite from Git LFS
        run: |
          git lfs pull
          file data/forever/catalogue/forever_abilities.sqlite
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-test dependencies
        run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Real source-backed P3 gear and runtime regressions
        run: |
          python -m pytest -q tests/test_wf_prio_p3_spec_build.py

      - name: Source-backed Druid Balance L60 P3 actual production gate (read-only)
        run: |
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P3 > /tmp/prio_p3_live.json || true
          python - <<'PY'
          import json
          report=json.load(open('/tmp/prio_p3_live.json'))
          gate=report['results'][0]
          print('LIVE_P3_STATUS',gate.get('status'),flush=True)
          print('LIVE_P3_REASON',gate.get('reasons'),flush=True)
          print('LIVE_P3_AXES',gate.get('real_measured_stat_weight_axes'),flush=True)
          print('LIVE_P3_ITEMS',gate.get('real_catalogue_top5_items_scored'),flush=True)
          print('LIVE_P3_EVALUATED',gate.get('real_source_search_evaluated'),flush=True)
          assert gate.get('status') in ('PASS','FAIL'), gate
          assert 'MISSING_APPLICABLE_DPS_WEIGHT' not in gate.get('reasons',()), gate
          assert gate.get('real_source_search_evaluated',0) > 0, gate
          PY
