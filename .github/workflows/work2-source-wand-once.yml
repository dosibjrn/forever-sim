name: Work2 one-shot real sourced wand proposal regression

on:
  push:
    branches:
      - work/2nd-source-wand-paid-gear-frontier-20261102
    paths:
      - src/v2/source_persistent_slot_search.py
      - tests/test_source_wand_paid_slot_proposals.py
      - .github/workflows/work2-source-wand-once.yml

permissions:
  contents: read

jobs:
  source-wand-paid-frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal real-source test dependencies
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Real catalogue Mage wand proposal and source-swap regressions
        run: |
          python -m pytest -q tests/test_source_wand_paid_slot_proposals.py tests/test_wf326_druid20_source_slot_search.py
