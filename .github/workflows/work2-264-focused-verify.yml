name: Work2 #264 exact-head bounded source-paid regressions
on:
  push:
    branches:
      - work/work2-p4-p5-source-profile-20261102-1923
    paths:
      - .github/workflows/work2-264-focused-verify.yml
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install targeted source test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify source and exact head bounded regressions
        run: |
          echo "tested HEAD $(git rev-parse HEAD)"
          python -m pytest -q tests/test_wf_prio_p4_p5_paid_partials.py tests/test_work2_full_source_p4_p5_gate_entry.py
