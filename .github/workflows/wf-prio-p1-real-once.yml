name: One-shot real P1 source run (PRIO)
on:
  push:
    branches: [work/prio-p1-rebased-full-main-20261101]
permissions:
  contents: read
jobs:
  p1-real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run actual Druid L60 Balance P1 with LFS source SQLite
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 pytest
          python tools/wf_gate.py --class druid --level 30 --spec balance --gate P1
      - name: Focused acquisition regressions
        if: always()
        run: python -m pytest -q tests/test_wf34_acquisition_snapshot_binding.py tests/test_wf34_p1_client_acquisition_proof.py
