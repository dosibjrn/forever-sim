name: Work1 once P7.1 original-source Rust and live 2D stochastic final
on:
  push:
    branches:
      - work/work1-p71-stochastic-final-20261102-2045
    paths:
      - .github/workflows/work1-once-p71-stochastic-final-20261102.yml
permissions:
  contents: read
jobs:
  original-source-p71-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work1 source
        uses: actions/checkout@v4
        with:
          path: project
          lfs: true
          persist-credentials: false
      - name: Checkout selected pinned MythicSim Rust
        uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact source parser and production world ingress
        working-directory: project
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          python integrations/mythicsim-rust/patch_world_ingress.py ../upstream
          python -m compileall -q tools/wf_gate_p7_1_live.py
      - name: Build real pinned Rust production engine
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Run exactly 1000 native and coupled live stochastic P7.1 fights (no M1 write)
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCER_COMMIT=$(git rev-parse HEAD)"
          echo "PINNED_ENGINE_COMMIT=$(git -C ../upstream rev-parse HEAD)"
          export FOREVER_MYTHICSIM_RUST_BIN="$(realpath ../upstream/target/release/forever-engine)"
          unset FOREVER_P7_LIVE_PROBE_ITERATIONS || true
          unset FOREVER_P7_FULL_SOURCE_SEARCH || true
          mkdir -p p71-receipt
          set +e
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.1 --out p71-receipt/report.json
          rc=$?
          set -e
          echo "GATE_CLI_EXIT=$rc"
          if [[ "$rc" -ne 0 && "$rc" -ne 1 ]]; then exit "$rc"; fi
          python - <<'PY'
          from pathlib import Path
          import json
          result=json.loads(Path("p71-receipt/report.json").read_text())
          print("WORK1_P71_NO_RECORD_REPORT",json.dumps(result,sort_keys=True,ensure_ascii=False),flush=True)
          assert result["status"] in ("PASS","FAIL","BLOCKED")
          PY
      - name: Upload actual P7.1 source-native/world gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-p71-source-native-live-1000-stochastic
          path: project/p71-receipt/report.json
          if-no-files-found: warn
          retention-days: 7
