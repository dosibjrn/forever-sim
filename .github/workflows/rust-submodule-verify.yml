          rc = int(sys.argv[2])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "mage", 60, "frost", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          row = gate["results"][0]
          receipt = row.get("native_equipped_paid_receipt") or {}
          if row.get("item_options_source") == "MYTHICSIM_NATIVE_GET_OPTIONS":
              assert row.get("real_source_search_evaluated") == 0, gate
              assert 0 <= row.get("native_equipped_paid_attempts", 0) <= 44, gate
              assert receipt.get("paid_attempts") == row["native_equipped_paid_attempts"], gate
          print("MAGE_L60_FROST_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "actor": receipt.get("native_prepared_actor"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          PY

      - name: Run Paladin Retribution L60 selected-native P3 (no record)
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/paladin-retribution-p3"
          mkdir -p "$output"
          source="integrations/mythicsim-rust/engine/validation/2026-10-06-multi-target-paladin-druid-references/retribution-paladin-2-targets.request.json"
          sha256sum "$source" | tee "$output/source-sha256.txt"
          git -C integrations/mythicsim-rust/engine rev-parse HEAD | tee "$output/native-engine-sha.txt"
          report="$output/paladin-retribution-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class paladin --level 60 \
            --spec retribution --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          rc = int(sys.argv[2])
          if not report.exists():
              print("PALADIN_L60_RETRIBUTION_P3_NO_RECORD", "NO_REPORT", "exit", rc,
                    flush=True)
              raise SystemExit(1)
          gate = json.loads(report.read_text())
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "paladin", 60, "retribution", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          row = gate["results"][0]
          receipt = row.get("native_equipped_paid_receipt") or {}
          if row.get("item_options_source") == "MYTHICSIM_NATIVE_GET_OPTIONS":
              assert row.get("real_source_search_evaluated") == 0, gate
              assert 0 <= row.get("native_equipped_paid_attempts", 0) <= 44, gate
              assert receipt.get("paid_attempts") == row["native_equipped_paid_attempts"], gate
          print("PALADIN_L60_RETRIBUTION_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "native_options_status": row.get("native_item_options_status"),
              "actor": receipt.get("native_prepared_actor"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
              "baseline": (receipt.get("evaluations") or [None])[0],
          }, default=str), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paladin-retribution-l60-native-p3-no-record
          path: ${{ runner.temp }}/paladin-retribution-p3/
          if-no-files-found: ignore

      - name: Run no-record Rogue L20 P3 native capability and gate receipt
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
          FOREVER_P3_NATIVE_ROGUE_REQUEST: integrations/mythicsim-rust/fixtures/rogue-l20-p3-native.request.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-p3-no-record"
          native="$RUNNER_TEMP/native-p3-no-record/rogue-l20-item-options.json"
          report="$RUNNER_TEMP/native-p3-no-record/rogue-l20-p3.json"
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" item-options \
            --class rogue --level 20 --spec unrestricted --slot all > "$native"
          rc=0
          timeout 600s python tools/wf_gate.py --class rogue --level 20 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$native" "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          native = json.loads(Path(sys.argv[1]).read_text())
          gate = json.loads(Path(sys.argv[2]).read_text())
          rc = int(sys.argv[3])
          assert native["class"] == "rogue" and native["level"] == 20, native
          assert native["spec"] == "unrestricted" and native["slot"] == "all", native
          assert gate["class"] == "rogue" and gate["level"] == 20, gate
          assert gate["gate"] == "P3" and gate["spec"] == "unrestricted", gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (gate, rc)
          row = gate["results"][0]
          status = native["status"]
          if status == "refused":
              refusal = native["refusal"]["code"]
              assert refusal == "NATIVE_ITEM_OPTIONS_UNSUPPORTED_CLASS", native
              assert gate["status"] == "BLOCKED", gate
              assert "P3_NATIVE_ITEM_OPTIONS_REFUSED:" + refusal in row["reasons"], gate
              assert row["real_source_search_evaluated"] == 0, gate
          elif status in ("ok", "partial_level_unknown", "empty"):
              if not native["items"]:
                  assert gate["status"] == "BLOCKED", gate
                  assert row["real_source_search_evaluated"] == 0, gate
              else:
                  assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS", gate
                  assert "P3_NO_LEGAL_ITEMS_IN_CURRENT_DB" not in row.get("reasons", []), gate
                  assert row["native_item_options_status"] == status, gate
                  assert row["real_source_search_evaluated"] == 0, gate
                  assert row["reachability_count"] >= row["pass_count"] >= 0, gate
                  assert row.get("p3_native_pair_reserved_attempts") == 44, gate
                  assert row.get("p3_shared_budget_attempts", 45) <= 44, gate
                  assert row.get("native_equipped_paid_attempts", 0) >= 2, gate
                  assert isinstance(row.get("native_equipped_paid_receipt"), dict), gate
                  if gate["status"] == "PASS":
                      assert row["pass_count"] == row["reachability_count"], gate
                      assert row["runtime_proof"]["executed"] is True, gate
          else:
              raise AssertionError(("unknown native status", native))
          print("ROGUE_L20_P3_NO_RECORD", "native_status", status,
                "gate_status", gate["status"], "reasons", row.get("reasons"),
                "verified", row.get("pass_count"),
                "applicable", row.get("reachability_count"),
                "paid", row.get("real_source_search_evaluated"),
                "native_paid", row.get("native_equipped_paid_attempts"),
                "native_result", (row.get("native_equipped_paid_receipt") or {}).get("status"),
                flush=True)
          PY

      - name: Run no-record Priest and Mage L20 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-p3-no-record"
          for class in priest mage; do
            report="$RUNNER_TEMP/native-p3-no-record/$class-l20-p3.json"
            rc=0
            timeout 600s python tools/wf_gate.py --class "$class" --level 20 \
              --spec unrestricted --gate P3 --out "$report" || rc=$?
            python - "$report" "$class" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          class_key, rc = sys.argv[2], int(sys.argv[3])
          assert report["class"] == class_key and report["level"] == 20
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          assert report["status"] in ("PASS", "FAIL"), report
          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
          # Priest deliberately retains partial unknown client-level status.
          # Mage's selected ItemSparse universe now excludes non-client rows.
          # Assert semantic native counts, not obsolete hardcoded row totals.
          if class_key == "priest":
              assert row["native_item_options_status"] == "partial_level_unknown"
              assert row["native_unverified_candidate_count"] > 0
              assert any(reason.startswith("NATIVE_ITEM_OPTIONS_PARTIAL_LEVEL_UNKNOWN:")
                         for reason in row["reasons"])
          else:
              assert row["native_item_options_status"] == "ok"
              assert row["native_unverified_candidate_count"] == 0
              assert row["native_excluded_non_client_item_count"] > 0
              assert not any(reason.startswith("NATIVE_ITEM_OPTIONS_PARTIAL_LEVEL_UNKNOWN:")
                             for reason in row["reasons"])
          assert row["native_item_options_source"].startswith("mythicsim:")
          assert row["real_catalogue_legal_items"] > 0
          assert row["real_catalogue_slots_scored"] > 0
          assert row["real_native_representative_items_scored"] > 0
          assert row["real_source_search_evaluated"] > 0
          assert row["reachability_count"] > 0
          assert "P3_NO_LEGAL_ITEMS_IN_CURRENT_DB" not in row["reasons"]
          print("NO_RECORD_NATIVE_P3_MEASURED", class_key,
                "known_items", row["real_catalogue_legal_items"],
                "representative_scored", row["real_native_representative_items_scored"],
                "reachability", row["reachability_count"],
                "unverified", row["native_unverified_candidate_count"], flush=True)
          PY
          done
      - name: Run no-record Shaman L20 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/native-p3-no-record/shaman-l20-p3.json"
          rc=0
          timeout 600s python tools/wf_gate.py --class shaman --level 20 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["class"] == "shaman" and report["level"] == 20
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          assert report["status"] in ("FAIL", "PASS"), report
          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
          assert row["native_item_options_status"] == "ok"
          assert row["native_unverified_candidate_count"] == 0
          assert row["native_excluded_non_client_item_count"] > 0
          source = row["native_item_options_source"]
          assert isinstance(source, str) and source.startswith("mythicsim:")
          assert row["real_catalogue_legal_items"] > 0
          assert row["real_catalogue_slots_scored"] > 0
          assert row["real_native_representative_items_scored"] > 0
          assert row["real_source_search_evaluated"] > 0
          assert row["reachability_count"] > 0
          print("NO_RECORD_NATIVE_P3_MEASURED shaman:20",
                "known_items", row["real_catalogue_legal_items"],
                "representative_scored", row["real_native_representative_items_scored"],
                "reachability", row["reachability_count"],
                "paid_evaluations", row["real_source_search_evaluated"],
                "native_status", row["native_item_options_status"],
                "excluded_non_client", row["native_excluded_non_client_item_count"], flush=True)
          PY

      - name: Run no-record Paladin L20 P3 with native player context and item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
          FOREVER_P3_NATIVE_PLAYER_CONTEXT_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/native-p3-no-record/paladin-l20-p3.json"
          rc=0
          timeout 600s python tools/wf_gate.py --class paladin --level 20 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["class"] == "paladin" and report["level"] == 20
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          assert report["status"] in ("FAIL", "PASS"), report
          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
          assert row["native_item_options_status"] == "ok"
          assert row["native_unverified_candidate_count"] == 0
          assert row["native_excluded_non_client_item_count"] > 0
          assert isinstance(row["native_player_context_id"], str) and row["native_player_context_id"]
          assert row["native_player_context_kind"] == "source_backed_baseline_context_not_full_native_sim_actor"
          assert isinstance(row["native_player_context_base_stats"], dict)
          assert isinstance(row["native_player_context_resources"], dict)
          assert isinstance(row["native_player_context_weapon"], dict)
          assert "item_id" in row["native_player_context_weapon"]
          source = row["native_item_options_source"]
          assert isinstance(source, str) and "SkillLine+SkillRaceClassInfo" in source
          assert row["real_catalogue_legal_items"] > 0
          assert row["real_catalogue_slots_scored"] > 0
          assert row["real_native_representative_items_scored"] > 0
          assert row["real_source_search_evaluated"] > 0
          assert row["reachability_count"] > 0
          print("NO_RECORD_NATIVE_P3_MEASURED paladin:20",
                "known_items", row["real_catalogue_legal_items"],
                "representative_scored", row["real_native_representative_items_scored"],
                "reachability", row["reachability_count"],
                "paid_evaluations", row["real_source_search_evaluated"],
                "excluded_non_client", row["native_excluded_non_client_item_count"], flush=True)
          PY

      - name: Run no-record Mage L30 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/native-p3-no-record/mage-l30-p3.json"
          rc=0
          timeout 600s python tools/wf_gate.py --class mage --level 30 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["class"] == "mage" and report["level"] == 30
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          if report["status"] == "BLOCKED":
              reasons = report.get("reasons", [])
              assert reasons and any(
                  reason.startswith("P3_NATIVE_ITEM_OPTIONS_") for reason in reasons
              ), (report, rc)
              assert "P3_NATIVE_ITEM_OPTIONS_BINARY_REQUIRED" not in reasons
              assert rc == 1, (report, rc)
              print("NO_RECORD_NATIVE_P3_BLOCKED mage:30", reasons, flush=True)
          else:
              assert report["status"] in ("FAIL", "PASS"), report
              assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
              assert len(report["results"]) == 1
              row = report["results"][0]
              assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
              native_status = row["native_item_options_status"]
              assert native_status == "ok", row
              unknown = row["native_unverified_candidate_count"]
              assert unknown == 0, row
              excluded = row["native_excluded_non_client_item_count"]
              assert type(excluded) is int and excluded > 0, row
              assert not any(reason.startswith("NATIVE_ITEM_OPTIONS_PARTIAL_LEVEL_UNKNOWN:")
                             for reason in row["reasons"])
              source = row["native_item_options_source"]
              assert isinstance(source, str) and source.startswith("mythicsim:")
              known = row["real_catalogue_legal_items"]
              assert type(known) is int and known >= 0
              assert type(row["real_catalogue_slots_scored"]) is int
              assert type(row["real_native_representative_items_scored"]) is int
              assert type(row["real_source_search_evaluated"]) is int
              print("NO_RECORD_NATIVE_P3_MEASURED mage:30",
                    "known_items", known,
                    "native_status", native_status,
                    "unverified_levels", unknown,
                    "excluded_non_client", excluded,
                    "verified", row["pass_count"],
                    "applicable", row["reachability_count"],
                    "representative_scored", row["real_native_representative_items_scored"],
                    "reachability", row["reachability_count"], flush=True)
          PY

      - name: Upload no-record native P3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-p3-no-record-${{ github.sha }}
          path: ${{ runner.temp }}/native-p3-no-record/*.json
          if-no-files-found: warn
          retention-days: 30
