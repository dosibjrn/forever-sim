name: Selected Rust native P2 adapter boundary (not M1 gate)

on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - src/engine_client/native_p2_rank_probe.py
      - integrations/mythicsim-rust/tests/test_native_p2_rank_probe.py

permissions:
  contents: read

jobs:
  native-p2-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the exact selected engine pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the pinned engine for the P2 adapter integration
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --bin forever-engine
      - name: Exercise only the changed native P2 request/response adapter
        env:
          FOREVER_ENGINE_BINARY: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        run: python3 integrations/mythicsim-rust/tests/test_native_p2_rank_probe.py
