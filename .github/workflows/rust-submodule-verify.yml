name: Selected MythicSim Rust submodule verification

on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - .github/workflows/m1-on-demand-record.yml
      - .github/workflows/rust-submodule-verify.yml
      - integrations/mythicsim-rust/native_executor.py
      - integrations/mythicsim-rust/native_p3_equipped.py
      - integrations/mythicsim-rust/tests/test_native_p3_equipped.py
      - src/game/checkpoint_p3_smoke.py
      - src/game/native_p3_item_options.py
      - src/game/native_p3_player_context.py
      - tests/gates/test_wf_gate_class_cli.py
      - tests/test_native_p3_item_options.py
      - tests/test_work2_mage_native_p3.py
      - tests/test_work2_paladin_retribution_native_p3.py
      - tests/test_work2_paladin_protection_native_p3.py
      - tests/test_work1_rogue_native_p3_preflight.py
      - tests/test_work2_paladin_native_context.py
      - tests/test_prio_p3_source_policy_sp.py
      - tools/wf_gate.py
      - tools/wf_gate_p3_live.py

permissions:
  contents: read

jobs:
  verify-selected-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - name: Require exact selected engine pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python for the live P3 provider
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the existing P3 source-search dependency
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"
      - name: Run focused Forever-owned native P3 adapter regressions
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.3.5"
          python -m pytest -q \
            integrations/mythicsim-rust/tests/test_native_p3_equipped.py \
            tests/test_work1_rogue_native_p3_preflight.py \
            tests/test_work2_mage_native_p3.py \
            tests/test_work2_paladin_retribution_native_p3.py \
            tests/test_work2_paladin_protection_native_p3.py
      # Native source/gateway integration is expensive; keep focused Forever
      # adapter regressions on Python-only PRs, but do not rebuild and pay
      # unrelated P3 no-record probes when the selected Rust pin is unchanged.
      - name: Detect selected Rust pin change
        id: selected_rust_change
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags --depth=1 origin "$base"
          if git diff --name-only "$base" HEAD -- .gitmodules integrations/mythicsim-rust/engine | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "Selected Rust pin unchanged; focused adapter regressions ran, no native cold/probe replay." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build the exact selected engine
        if: steps.selected_rust_change.outputs.changed == 'true'
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --bin forever-engine
      - name: Probe unified get_options JSON on two class/level pairs
        if: steps.selected_rust_change.outputs.changed == 'true'
        working-directory: integrations/mythicsim-rust/engine
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mage 20" "warrior 60"; do
            read -r class level <<< "$pair"
            output="$RUNNER_TEMP/${class}-${level}-unified-options.json"
            target/debug/forever-engine options --class "$class" --level "$level" > "$output"
            python3 - "$class" "$level" "$output" <<'PY'
          import json, sys
          from pathlib import Path

          class_name, level, filename = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          payload = json.loads(Path(filename).read_text(encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert (payload["class"], payload["level"]) == (class_name, level)
          assert payload["source_revision"]
          assert isinstance(payload["spells"], list)
          assert isinstance(payload["items"], list)
          # Check Forever's versioned JSON transport, not MythicSim's
          # Warcraft legality or source coverage. Native status is data.
          assert isinstance(payload.get("talents"), dict)
          coverage = payload.get("coverage")
          print("UNIFIED_OPTIONS_JSON", class_name, level,
                "spells", len(payload["spells"]), "items", len(payload["items"]),
                "coverage", coverage, flush=True)
          PY
          done

      - name: Probe Feral L60 P3 on selected native engine (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feral-p3"
          options="$RUNNER_TEMP/feral-p3/options.json"
          prepared="$RUNNER_TEMP/feral-p3/prepared.json"
          report="$RUNNER_TEMP/feral-p3/p3.json"
          # Auxiliary item-options is a diagnostic, never a precondition for
          # executing the actual selected-native P3 gate.
          options_rc=0
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" item-options \
            --class druid --level 60 --spec unrestricted --slot all \
            > "$options" 2> "$RUNNER_TEMP/feral-p3/item-options.stderr" || options_rc=$?
          prepare_rc=0
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" prepare \
            --request docs/evidence/druid-l60-feral/p7.1/saved_811_request.json \
            --outfile "$prepared" --go-rules \
            > "$RUNNER_TEMP/feral-p3/prepare.stdout" \
            2> "$RUNNER_TEMP/feral-p3/prepare.stderr" || prepare_rc=$?
          gate_rc=0
          timeout 300s python tools/wf_gate.py --class druid --level 60 \
            --spec feral --gate P3 --out "$report" || gate_rc=$?
          python - "$options" "$prepared" "$report" "$prepare_rc" "$gate_rc" "$options_rc" <<'PY'
          import json, sys
          from pathlib import Path
          # Item-options may refuse or fail to emit JSON on this pin. Its
          # failure must not hide the real gate's PASS/FAIL/BLOCKED outcome.
          try:
              options = json.loads(Path(sys.argv[1]).read_text())
              if not isinstance(options, dict):
                  raise ValueError("options diagnostic is not a JSON object")
          except (OSError, ValueError) as exc:
              options = {"status": "DIAGNOSTIC_UNAVAILABLE",
                         "refusal": {"error": type(exc).__name__}}
          prepared_path = Path(sys.argv[2])
          gate = json.loads(Path(sys.argv[3]).read_text())
          prepare_rc, gate_rc, options_rc = map(int, sys.argv[4:7])
          prepared = json.loads(prepared_path.read_text()) if prepared_path.exists() else {}
          assert gate["class"] == "druid" and gate["level"] == 60, gate
          assert gate["spec"] == "feral" and gate["gate"] == "P3", gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert gate_rc == (0 if gate["status"] == "PASS" else 1), (gate_rc, gate)
          # The separate options probe is diagnostic, not a precondition for
          # the actual P3 gate outcome. Refusals may have no candidate rows.
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          if prepare_rc == 0:
              actor = prepared.get("player") or {}
              print("FERAL_PREPARED_ACTOR", actor.get("class"), actor.get("level"))
          print("FERAL_L60_P3_NO_RECORD", "item_options_rc", options_rc,
                "item_options", options.get("status", "unknown"),
                "native_refusal", options.get("refusal"),
                "prepare_rc", prepare_rc,
                "gate", gate["status"], "reasons", row.get("reasons", gate.get("reasons", [])),
                "paid", row.get("native_equipped_paid_attempts", 0),
                flush=True)
          PY

      - name: Run Mage Arcane L60 unified-options native P3 (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mage-arcane-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class mage --level 60 \
            --spec arcane --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          gate = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "mage", 60, "arcane", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          receipt = row.get("native_equipped_paid_receipt") or {}
          # Native search breadth, paid counts and receipt metadata are observations,
          # not additional P3 acceptance predicates in this no-record CI.
          print("MAGE_L60_ARCANE_P3_NO_RECORD", json.dumps({
              "gate_status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "native_options_status": row.get("native_item_options_status"),
              "native_unverified": row.get("native_unverified_candidate_count"),
              "native_paid": row.get("native_equipped_paid_attempts"),
              "receipt_status": receipt.get("status"),
              "prepared_actor": receipt.get("native_prepared_actor"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          PY

      - name: Run Mage Fire L60 selected-native P3 (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mage-fire-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class mage --level 60 \
            --spec fire --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          gate = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "mage", 60, "fire", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          receipt = row.get("native_equipped_paid_receipt") or {}
          # Native search breadth, paid counts and receipt metadata are observations,
          # not additional P3 acceptance predicates in this no-record CI.
          print("MAGE_L60_FIRE_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "actor": receipt.get("native_prepared_actor"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          PY

      - name: Run Mage Frost L60 selected-native P3 (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mage-frost-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class mage --level 60 \
            --spec frost --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          gate = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "mage", 60, "frost", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          receipt = row.get("native_equipped_paid_receipt") or {}
          # Native search breadth, paid counts and receipt metadata are observations,
          # not additional P3 acceptance predicates in this no-record CI.
          print("MAGE_L60_FROST_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "actor": receipt.get("native_prepared_actor"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          PY

      - name: Run Paladin Retribution L60 selected-native P3 (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/paladin-retribution-p3"
          mkdir -p "$output"
          source="integrations/mythicsim-rust/engine/validation/2026-10-06-multi-target-paladin-druid-references/retribution-paladin-2-targets.request.json"
          sha256sum "$source" | tee "$output/source-sha256.txt"
          git -C integrations/mythicsim-rust/engine rev-parse HEAD | tee "$output/native-engine-sha.txt"
          report="$output/paladin-retribution-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class paladin --level 60 \
            --spec retribution --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          rc = int(sys.argv[2])
          if not report.exists():
              print("PALADIN_L60_RETRIBUTION_P3_NO_RECORD", "NO_REPORT", "exit", rc,
                    flush=True)
              raise SystemExit(1)
          gate = json.loads(report.read_text())
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "paladin", 60, "retribution", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          receipt = row.get("native_equipped_paid_receipt") or {}
          # Native search breadth, paid counts and receipt metadata are observations,
          # not additional P3 acceptance predicates in this no-record CI.
          print("PALADIN_L60_RETRIBUTION_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "native_options_status": row.get("native_item_options_status"),
              "actor": receipt.get("native_prepared_actor"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
              "baseline": (receipt.get("evaluations") or [None])[0],
          }, default=str), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.selected_rust_change.outputs.changed == 'true'
        with:
          name: paladin-retribution-l60-native-p3-no-record
          path: ${{ runner.temp }}/paladin-retribution-p3/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Paladin Protection L60 selected-native TPS P3 (no record)
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/paladin-protection-p3"
          mkdir -p "$output"
          source="integrations/mythicsim-rust/engine/validation/2026-10-06-multi-target-paladin-druid-references/protection-paladin-2-targets.request.json"
          sha256sum "$source" | tee "$output/source-sha256.txt"
          git -C integrations/mythicsim-rust/engine rev-parse HEAD | tee "$output/native-engine-sha.txt"
          report="$output/paladin-protection-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class paladin --level 60 \
            --spec protection --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = Path(sys.argv[1])
          rc = int(sys.argv[2])
          if not report.exists():
              print("PALADIN_L60_PROTECTION_P3_NO_RECORD", "NO_REPORT", "exit", rc,
                    flush=True)
              raise SystemExit(1)
          gate = json.loads(report.read_text())
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "paladin", 60, "protection", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          receipt = row.get("native_equipped_paid_receipt") or {}
          # Native search breadth, paid counts and receipt metadata are observations,
          # not additional P3 acceptance predicates in this no-record CI.
          print("PALADIN_L60_PROTECTION_P3_NO_RECORD", json.dumps({
              "status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "native_options_status": row.get("native_item_options_status"),
              "actor": receipt.get("native_prepared_actor"),
              "objective": receipt.get("objective"),
              "paid": row.get("native_equipped_paid_attempts"),
              "occupied": row.get("source_occupied_slots"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
              "baseline": (receipt.get("evaluations") or [None])[0],
          }, default=str), flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always() && steps.selected_rust_change.outputs.changed == 'true'
        with:
          name: paladin-protection-l60-native-p3-no-record
          path: ${{ runner.temp }}/paladin-protection-p3/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run no-record Rogue L20 P3 native capability and gate receipt
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
          FOREVER_P3_NATIVE_ROGUE_REQUEST: integrations/mythicsim-rust/fixtures/rogue-l20-p3-native.request.json
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-p3-no-record"
          native="$RUNNER_TEMP/native-p3-no-record/rogue-l20-item-options.json"
          report="$RUNNER_TEMP/native-p3-no-record/rogue-l20-p3.json"
          # This auxiliary native catalogue query is diagnostic only. The real
          # P3 gate owns native proposals, execution and verdict.
          native_rc=0
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" item-options \
            --class rogue --level 20 --spec unrestricted --slot all > "$native" \
            2> "$RUNNER_TEMP/native-p3-no-record/rogue-l20-item-options.stderr" || native_rc=$?
          rc=0
          timeout 600s python tools/wf_gate.py --class rogue --level 20 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$native" "$report" "$rc" "$native_rc" <<'PY'
          import json, sys
          from pathlib import Path
          # Missing, refused or malformed auxiliary output must not mask
          # the already-executed P3 PASS/FAIL/BLOCKED receipt.
          try:
              native = json.loads(Path(sys.argv[1]).read_text())
              if not isinstance(native, dict):
                  native = {"status": "non_object_diagnostic"}
          except (OSError, ValueError):
              native = {"status": "unavailable"}
          if not isinstance(native.get("refusal"), dict):
              native["refusal"] = {}
          gate = json.loads(Path(sys.argv[2]).read_text())
          rc = int(sys.argv[3])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "rogue", 20, "unrestricted", "P3"), gate
          # No-record CI verifies Forever request/response transport. Native refusals,
          # zero items, source eligibility and paid evaluation counts are observations,
          # not extra P3 acceptance criteria.
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (gate, rc)
          rows = gate.get("results") or []
          assert isinstance(rows, list), gate
          row = rows[0] if rows else {}
          print("NO_RECORD_NATIVE_P3_OBSERVED rogue:20",
                "native_status", native.get("status"),
                "native_probe_exit", int(sys.argv[4]),
                "native_refusal", (native.get("refusal") or {}).get("code"),
                "gate_status", gate["status"],
                "reasons", row.get("reasons", gate.get("reasons", [])),
                "verified", row.get("pass_count"),
                "applicable", row.get("reachability_count"),
                "native_paid", row.get("native_equipped_paid_attempts"),
                "native_result", (row.get("native_equipped_paid_receipt") or {}).get("status"),
                flush=True)
          PY

      - name: Run no-record Priest and Mage L20 P3 with native item options
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-p3-no-record"
          for class in priest mage; do
            report="$RUNNER_TEMP/native-p3-no-record/$class-l20-p3.json"
            rc=0
            timeout 600s python tools/wf_gate.py --class "$class" --level 20 \
              --spec unrestricted --gate P3 --out "$report" || rc=$?
            python - "$report" "$class" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          class_key, rc = sys.argv[2], int(sys.argv[3])
          assert (report["class"], report["level"], report["spec"], report["gate"]) == (
              class_key, 20, "unrestricted", "P3"), report
          # No-record CI checks the Forever transport and propagates the real
          # native result. A native refusal, absent options or zero scored
          # proposals is evidence to report, not a new class/source audit gate.
          assert report["status"] in ("PASS", "FAIL", "BLOCKED"), report
          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          rows = report.get("results") or []
          assert isinstance(rows, list), report
          row = rows[0] if rows else {}
          print("NO_RECORD_NATIVE_P3_OBSERVED", class_key,
                "status", report["status"],
                "native_status", row.get("native_item_options_status"),
                "source", row.get("native_item_options_source"),
                "paid", row.get("native_equipped_paid_attempts"),
                "reasons", row.get("reasons", report.get("reasons", [])),
                flush=True)
          PY
          done
      - name: Run no-record Shaman L20 P3 with native item options
        if: steps.selected_rust_change.outputs.changed == 'true'
        env:
