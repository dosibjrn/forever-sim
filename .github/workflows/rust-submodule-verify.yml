name: Build selected Rust engine for Forever boundary tests (not M1 gate)
on:
  # The selected Rust pin is a trusted dependency for Forever-only changes.
  # Rebuild it only when the submodule selection itself changes; Forever
  # request/response changes use the focused Python contract workflows.
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine

permissions:
  contents: read

jobs:
  native-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal live 2D world bridge dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Require the exact selected engine pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Build selected engine binary for Forever boundary invocation
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --bin forever-engine
      - name: Exercise selected-Rust P2 prepare response adapter
        env:
          FOREVER_ENGINE_BINARY: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        run: python3 integrations/mythicsim-rust/tests/test_native_p2_rank_probe.py
      - name: Exercise selected-Rust P1 direct action and live 2D world bridge
        env:
          FOREVER_ENGINE_BINARY: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        run: python3 integrations/mythicsim-rust/tests/test_native_p1_effect_probe.py
