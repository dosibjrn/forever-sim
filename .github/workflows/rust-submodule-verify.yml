name: Compile exact pinned patched Rust fork source (not M1 gate)
on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - .github/workflows/rust-submodule-verify.yml
      - .github/workflows/wf-gsim-rust-native-world.yml
      - integrations/mythicsim-rust/port_native_typed_rng.py
      - integrations/mythicsim-rust/tests/test_port_native_typed_rng.py
      - .github/workflows/m1-on-demand-record.yml

permissions:
  contents: read

jobs:
  source-compiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Require exact Git submodule commit and our actual Rust source patch
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          test -f "$engine/src/core/fight/world_bridge.rs"
          # #528: selected gitlink itself must contain the typed runtime;
          # a temporary CI source port is never proof of published production code.
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          python3 integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          # Retain the idempotence check below, but additionally require that
          # porting the already-published pin changes ZERO tracked Rust files.
          if ! git -C "$engine" diff --quiet; then
            echo "PINNED_RUST_REQUIRES_UNPUBLISHED_TYPED_RNG_PATCH" >&2; exit 1
          fi
          # Fork-sync retries and an already-typed published pin must not
          # duplicate the Rust enum or rewrite migrated test callsites.
          first_port="$(git -C "$engine" diff --binary | sha256sum)"
          python3 integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          second_port="$(git -C "$engine" diff --binary | sha256sum)"
          if [[ "$first_port" != "$second_port" ]]; then
            echo "RUST_TYPED_RNG_PORT_NOT_IDEMPOTENT" >&2; exit 1
          fi
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          if grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"; then
            echo "ENVIRONMENT_SELECTED_RNG_REMAINS_IN_SELECTED_RUST" >&2; exit 1
          fi
          grep -Fq 'RandomRequest::Bernoulli' "$engine/src/core/rng.rs"
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile typed RNG API and all Rust integration-test targets
        working-directory: integrations/mythicsim-rust/engine
        run: |
          cargo test --locked --lib typed_rng_api_tests
          cargo check --locked
          cargo test --locked --no-run
