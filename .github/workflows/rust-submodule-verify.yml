name: Selected MythicSim Rust submodule verification

on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - .github/workflows/m1-on-demand-record.yml
      - .github/workflows/rust-submodule-verify.yml
      - src/game/checkpoint_p3_smoke.py
      - src/game/native_p3_item_options.py
      - tests/gates/test_wf_gate_class_cli.py
      - tests/test_native_p3_item_options.py
      - tests/test_prio_p3_source_policy_sp.py
      - tools/wf_gate.py
      - tools/wf_gate_p3_live.py

permissions:
  contents: read

jobs:
  verify-selected-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - name: Require exact selected engine pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python for the live P3 provider
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the existing P3 source-search dependency
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"
      - name: Build the exact selected engine
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --bin forever-engine
      - name: Run no-record Priest and Mage L20 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-p3-no-record"
          for class in priest mage; do
            report="$RUNNER_TEMP/native-p3-no-record/$class-l20-p3.json"
            rc=0
            timeout 600s python tools/wf_gate.py --class "$class" --level 20 \
              --spec unrestricted --gate P3 --out "$report" || rc=$?
            python - "$report" "$class" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          class_key, rc = sys.argv[2], int(sys.argv[3])
          assert report["class"] == class_key and report["level"] == 20
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          assert report["status"] == "FAIL" and rc == 1, (report, rc)
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
          assert row["native_item_options_status"] == "partial_level_unknown"
          expected_unknown = {"priest": 2267, "mage": 2239}[class_key]
          assert row["native_unverified_candidate_count"] == expected_unknown
          assert row["native_item_options_source"].startswith("mythicsim:")
          assert row["real_catalogue_legal_items"] > 0
          assert row["real_catalogue_slots_scored"] > 0
          assert row["real_catalogue_top5_items_scored"] > 0
          assert row["real_source_search_evaluated"] > 0
          assert row["reachability_count"] > 0
          assert any(reason.startswith("NATIVE_ITEM_OPTIONS_PARTIAL_LEVEL_UNKNOWN:")
                     for reason in row["reasons"])
          assert "P3_NO_LEGAL_ITEMS_IN_CURRENT_DB" not in row["reasons"]
          print("NO_RECORD_NATIVE_P3_MEASURED", class_key,
                "known_items", row["real_catalogue_legal_items"],
                "top5_scored", row["real_catalogue_top5_items_scored"],
                "reachability", row["reachability_count"],
                "unverified", row["native_unverified_candidate_count"], flush=True)
          PY
          done
      - name: Run no-record Shaman L20 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/native-p3-no-record/shaman-l20-p3.json"
          rc=0
          timeout 600s python tools/wf_gate.py --class shaman --level 20 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["class"] == "shaman" and report["level"] == 20
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          assert report["status"] in ("FAIL", "PASS"), report
          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          assert len(report["results"]) == 1
          row = report["results"][0]
          assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
          assert row["native_item_options_status"] == "ok"
          assert row["native_unverified_candidate_count"] == 0
          source = row["native_item_options_source"]
          assert isinstance(source, str) and source.startswith("mythicsim:")
          assert row["real_catalogue_legal_items"] > 0
          assert row["real_catalogue_slots_scored"] > 0
          assert row["real_catalogue_top5_items_scored"] > 0
          assert 0 < row["real_source_search_evaluated"] <= 44
          assert row["reachability_count"] > 0
          print("NO_RECORD_NATIVE_P3_MEASURED shaman:20",
                "known_items", row["real_catalogue_legal_items"],
                "top5_scored", row["real_catalogue_top5_items_scored"],
                "reachability", row["reachability_count"],
                "paid_evaluations", row["real_source_search_evaluated"],
                "native_status", row["native_item_options_status"], flush=True)
          PY

      - name: Run no-record Mage L30 P3 with native item options
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/native-p3-no-record/mage-l30-p3.json"
          rc=0
          timeout 600s python tools/wf_gate.py --class mage --level 30 \
            --spec unrestricted --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["class"] == "mage" and report["level"] == 30
          assert report["spec"] == "unrestricted" and report["gate"] == "P3"
          if report["status"] == "BLOCKED":
              reasons = report.get("reasons", [])
              assert reasons and any(
                  reason.startswith("P3_NATIVE_ITEM_OPTIONS_") for reason in reasons
              ), (report, rc)
              assert "P3_NATIVE_ITEM_OPTIONS_BINARY_REQUIRED" not in reasons
              assert rc == 1, (report, rc)
              print("NO_RECORD_NATIVE_P3_BLOCKED mage:30", reasons, flush=True)
          else:
              assert report["status"] in ("FAIL", "PASS"), report
              assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
              assert len(report["results"]) == 1
              row = report["results"][0]
              assert row["item_options_source"] == "MYTHICSIM_NATIVE_ITEM_OPTIONS"
              native_status = row["native_item_options_status"]
              assert native_status in ("ok", "empty", "partial_level_unknown")
              unknown = row["native_unverified_candidate_count"]
              assert type(unknown) is int and unknown >= 0
              assert native_status == "partial_level_unknown" or unknown == 0
              if native_status == "partial_level_unknown":
                  assert unknown > 0
                  assert any(
                      reason == f"NATIVE_ITEM_OPTIONS_PARTIAL_LEVEL_UNKNOWN:{unknown}"
                      for reason in row["reasons"]
                  )
              source = row["native_item_options_source"]
              assert isinstance(source, str) and source.startswith("mythicsim:")
              known = row["real_catalogue_legal_items"]
              assert type(known) is int and known >= 0
              assert type(row["real_catalogue_slots_scored"]) is int
              assert type(row["real_catalogue_top5_items_scored"]) is int
              assert type(row["real_source_search_evaluated"]) is int
              print("NO_RECORD_NATIVE_P3_MEASURED mage:30",
                    "known_items", known,
                    "native_status", native_status,
                    "unknown_level_excluded", unknown,
                    "top5_scored", row["real_catalogue_top5_items_scored"],
                    "reachability", row["reachability_count"], flush=True)
          PY

      - name: Upload no-record native P3 reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-p3-no-record-${{ github.sha }}
          path: ${{ runner.temp }}/native-p3-no-record/*.json
          if-no-files-found: warn
          retention-days: 30
