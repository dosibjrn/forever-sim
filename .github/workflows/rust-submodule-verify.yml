          assert rc == (0 if report["status"] == "PASS" else 1), (report, rc)
          rows = report.get("results") or []
          assert isinstance(rows, list), report
          row = rows[0] if rows else {}
          print("NO_RECORD_NATIVE_P3_OBSERVED shaman:20",
                "status", report["status"],
                "native_status", row.get("native_item_options_status"),
                "source", row.get("native_item_options_source"),
                "paid", row.get("native_equipped_paid_attempts"),
                "reasons", row.get("reasons", report.get("reasons", [])),
