name: Selected MythicSim Rust submodule verification

on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - .github/workflows/m1-on-demand-record.yml
      - .github/workflows/rust-submodule-verify.yml
      - integrations/mythicsim-rust/native_executor.py
      - integrations/mythicsim-rust/native_p3_equipped.py
      - integrations/mythicsim-rust/tests/test_native_p3_equipped.py
      - src/game/checkpoint_p3_smoke.py
      - src/game/native_p3_item_options.py
      - src/game/native_p3_player_context.py
      - tests/gates/test_wf_gate_class_cli.py
      - tests/test_native_p3_item_options.py
      - tests/test_work2_mage_native_p3.py
      - tests/test_work2_paladin_retribution_native_p3.py
      - tests/test_work1_rogue_native_p3_preflight.py
      - tests/test_work2_paladin_native_context.py
      - tests/test_prio_p3_source_policy_sp.py
      - tools/wf_gate.py
      - tools/wf_gate_p3_live.py

permissions:
  contents: read

jobs:
  verify-selected-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - name: Require exact selected engine pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Set up Python for the live P3 provider
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the existing P3 source-search dependency
        run: python -m pip install --disable-pip-version-check "beautifulsoup4==4.13.4"
      - name: Run focused Forever-owned native P3 adapter regressions
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.3.5"
          python -m pytest -q \
            integrations/mythicsim-rust/tests/test_native_p3_equipped.py \
            tests/test_work1_rogue_native_p3_preflight.py \
            tests/test_work2_mage_native_p3.py \
            tests/test_work2_paladin_retribution_native_p3.py
      - name: Build the exact selected engine
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --bin forever-engine
      - name: Probe unified get_options JSON on two class/level pairs
        working-directory: integrations/mythicsim-rust/engine
        shell: bash
        run: |
          set -euo pipefail
          for pair in "mage 20" "warrior 60"; do
            read -r class level <<< "$pair"
            output="$RUNNER_TEMP/${class}-${level}-unified-options.json"
            target/debug/forever-engine options --class "$class" --level "$level" > "$output"
            python3 - "$class" "$level" "$output" <<'PY'
          import json, sys
          from pathlib import Path

          class_name, level, filename = sys.argv[1], int(sys.argv[2]), sys.argv[3]
          payload = json.loads(Path(filename).read_text(encoding="utf-8"))
          assert payload["schema_version"] == 1
          assert (payload["class"], payload["level"]) == (class_name, level)
          assert payload["source_revision"]
          assert isinstance(payload["spells"], list)
          assert isinstance(payload["items"], list)
          assert payload["talents"]["status"] == "ok"
          coverage = payload["coverage"]
          assert coverage["spell_learnability_complete"] is False
          assert coverage["talent_prerequisites_complete"] is True
          assert isinstance(coverage["notes"], list)
          if class_name == "warrior":
              assert coverage["item_eligibility_complete"] is False
              assert coverage["native_item_status"] == "proficiency_unverified"
              assert all(row["eligibility"] == "proficiency_unverified" for row in payload["items"])
          else:
              assert all(row["eligibility"] == "native_eligible" for row in payload["items"])
          print("UNIFIED_OPTIONS_JSON", class_name, level,
                "spells", len(payload["spells"]), "items", len(payload["items"]),
                "coverage", coverage, flush=True)
          PY
          done

      - name: Probe Feral L60 P3 on selected native engine (no record)
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/feral-p3"
          options="$RUNNER_TEMP/feral-p3/options.json"
          prepared="$RUNNER_TEMP/feral-p3/prepared.json"
          report="$RUNNER_TEMP/feral-p3/p3.json"
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" item-options \
            --class druid --level 60 --spec unrestricted --slot all > "$options"
          prepare_rc=0
          "$FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN" prepare \
            --request docs/evidence/druid-l60-feral/p7.1/saved_811_request.json \
            --outfile "$prepared" --go-rules \
            > "$RUNNER_TEMP/feral-p3/prepare.stdout" \
            2> "$RUNNER_TEMP/feral-p3/prepare.stderr" || prepare_rc=$?
          gate_rc=0
          timeout 300s python tools/wf_gate.py --class druid --level 60 \
            --spec feral --gate P3 --out "$report" || gate_rc=$?
          python - "$options" "$prepared" "$report" "$prepare_rc" "$gate_rc" <<'PY'
          import json, sys
          from pathlib import Path
          options = json.loads(Path(sys.argv[1]).read_text())
          prepared_path = Path(sys.argv[2])
          gate = json.loads(Path(sys.argv[3]).read_text())
          prepare_rc, gate_rc = map(int, sys.argv[4:6])
          prepared = json.loads(prepared_path.read_text()) if prepared_path.exists() else {}
          assert options["class"] == "druid" and options["level"] == 60, options
          assert gate["class"] == "druid" and gate["level"] == 60, gate
          assert gate["spec"] == "feral" and gate["gate"] == "P3", gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert gate_rc == (0 if gate["status"] == "PASS" else 1), (gate_rc, gate)
          if options["status"] == "refused":
              code = options.get("refusal", {}).get("code")
              assert gate["status"] == "BLOCKED", gate
              assert "P3_NATIVE_ITEM_OPTIONS_REFUSED:" + str(code) in gate["results"][0]["reasons"], gate
          if prepare_rc == 0:
              actor = prepared.get("player") or {}
              print("FERAL_PREPARED_ACTOR", actor.get("class"), actor.get("level"))
          print("FERAL_L60_P3_NO_RECORD", "item_options", options["status"],
                "native_refusal", options.get("refusal"),
                "prepare_rc", prepare_rc,
                "gate", gate["status"], "reasons", gate["results"][0].get("reasons"),
                "paid", gate["results"][0].get("native_equipped_paid_attempts", 0),
                flush=True)
          PY

      - name: Run Mage Arcane L60 unified-options native P3 (no record)
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/mage-arcane-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class mage --level 60 \
            --spec arcane --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          gate = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "mage", 60, "arcane", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          row = gate["results"][0]
          receipt = row.get("native_equipped_paid_receipt") or {}
          if row.get("item_options_source") == "MYTHICSIM_NATIVE_GET_OPTIONS":
              assert row["real_source_search_evaluated"] == 0, gate
              assert 0 <= row.get("native_equipped_paid_attempts", 0) <= 44, gate
              assert receipt.get("paid_attempts") == row["native_equipped_paid_attempts"], gate
          print("MAGE_L60_ARCANE_P3_NO_RECORD", json.dumps({
              "gate_status": gate["status"], "reasons": row.get("reasons"),
              "source": row.get("item_options_source"),
              "native_options_status": row.get("native_item_options_status"),
              "native_unverified": row.get("native_unverified_candidate_count"),
              "native_paid": row.get("native_equipped_paid_attempts"),
              "receipt_status": receipt.get("status"),
              "prepared_actor": receipt.get("native_prepared_actor"),
              "slot_evaluations": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          PY

      - name: Run Mage Fire L60 selected-native P3 (no record)
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
