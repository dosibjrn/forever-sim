name: Verify exact public Rust fork submodule before production promotion

on:
  pull_request:
    paths:
      - .gitmodules
      - integrations/mythicsim-rust/engine
      - .github/workflows/rust-submodule-verify.yml
      - .github/workflows/wf-gsim-rust-native-world.yml
      - .github/workflows/m1-on-demand-record.yml
      - integrations/mythicsim-rust/verify_upstream_candidate.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-submodule-native-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - name: Verify source is the reviewed exact public fork gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] ||
            { echo "SOURCE_RUST_GITLINK_MISMATCH"; exit 1; }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] ||
            { echo "INCORRECT_PUBLIC_RUST_SOURCE"; exit 1; }
          test -f "$engine/src/core/fight/world_bridge.rs"
          test -f "$engine/src/core/rng.rs"
          echo "Verified source pin: $actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hydrate existing original Forever source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - name: Keep original Python gate and RNG regression tests
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q \
            tests/test_wf_gate_p7_3_live.py \
            tests/test_wf_gate_p7_2_live.py \
            tests/test_work1_p7_balanced_native_world_rng.py \
            integrations/mythicsim-rust/tests/test_rng_extreme_probability_fix.py
      - name: Verify native Rust typed RNG coverage and audited exceptions
        run: python integrations/mythicsim-rust/wf659_rng_boolean_audit.py integrations/mythicsim-rust/engine/src
      - name: Test native Rust library (including original balanced/probability regressions)
        working-directory: integrations/mythicsim-rust/engine
        run: |
          cargo test --locked --lib wf652_balanced_tests
          cargo test --locked --lib wf_l60_rng_extreme_tests
          cargo test --locked --lib
      - name: Build EXACT candidate source-native Rust engine
        working-directory: integrations/mythicsim-rust/engine
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: New upstream native stochastic/2D parity, including Mage and Hunter pet
        run: |
          python integrations/mythicsim-rust/verify_upstream_candidate.py \
            --engine integrations/mythicsim-rust/engine/target/release/forever-engine \
            --out rust-submodule-candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-submodule-candidate-${{ github.run_id }}
          path: rust-submodule-candidate.json
          if-no-files-found: ignore
