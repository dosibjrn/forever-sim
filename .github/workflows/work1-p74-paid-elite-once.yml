name: Work1 P7.4 source-paid elite focused (one-shot)
on:
  push:
    branches:
      - work/work1-p74-paid-elite-diversity-20261102
    paths:
      - .github/workflows/work1-p74-paid-elite-once.yml
      - tools/wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_p7_4_live.py
permissions:
  contents: read
jobs:
  source-paid-elite-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Compile and focused source/native contract regression
        run: |
          echo "producer_head=$(git rev-parse HEAD)"
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/test_work1_p7_full_gear_pool.py integrations/mythicsim-rust/tests/test_p74_gear_search_ci.py
