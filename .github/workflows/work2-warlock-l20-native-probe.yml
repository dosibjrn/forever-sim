name: Work2 — One native Warlock L20 cold two-target probe

on:
  push:
    branches:
      - work2/warlock-l20-unseeded-paid-cold-20261109
      - work2/warlock-l20-native-apl-composition-20261109
    paths:
      - tools/wf_warlock_l20_native_cold.py
      - tests/test_work2_warlock_native_cold.py
      - .github/workflows/work2-warlock-l20-native-probe.yml
  workflow_dispatch:

permissions:
  contents: read

# One source-paid two-target diagnosis before another expensive 300s window.
# This workflow does not run a gate, recorder or 100-mob acceptance.
concurrency:
  group: work2-warlock-l20-native-probe
  cancel-in-progress: false

jobs:
  one-cold-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Forever HEAD
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout selected native engine
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: febc1d703e022265ed61ede3fec9b05416282536
          path: engine
      - name: Verify source and engine commit
        run: |
          set -euo pipefail
          git -C project rev-parse HEAD
          test "$(git -C engine rev-parse HEAD)" = "febc1d703e022265ed61ede3fec9b05416282536"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify cold proposal forwarding and refusal classification
        working-directory: project
        run: python -m pytest -q tests/test_work2_warlock_native_cold.py tests/test_work2_warlock_native_cold_cli.py tests/test_work2_warlock_gate_bridge.py
      - name: Build pinned selected native engine
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Pay exactly one unseeded native-source cold proposal against two hostile world targets
        working-directory: project
        run: |
          python -u tools/wf_warlock_l20_native_cold.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-native.request.json \
            --out ../warlock-l20-cold-probe-evidence \
            --two-target-cold-proposal --screen-timeout 180 --seed 20261109
      - name: Preserve exact cold candidate, native/world ACK and refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l20-one-native-cold-probe-${{ github.run_id }}
          path: warlock-l20-cold-probe-evidence/
          if-no-files-found: warn
          retention-days: 7
