name: Clean - bounded Actions artifact storage guard

on:
  push:
    paths:
      - .github/workflows/actions-storage-preventive-gc.yml
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete only safe superseded main-branch stage5 artifacts (default dry run)'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: write
  issues: read
  pull-requests: read

concurrency:
  group: clean-actions-artifact-gc
  cancel-in-progress: false

jobs:
  monitor-and-prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read-only retained Actions footprint across both owned production repos
        # Diagnostic only. The repository-local evidence-pinned GC below is the
        # ONLY deletion path. Failed fork reads must not suppress that safe GC.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m tools.actions_storage_footprint
      - name: Inventory and bounded evidence-safe GC
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          APPLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.apply) }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          apply = os.environ.get("APPLY", "false").lower() == "true"
          ceiling = 384 * 1024 * 1024
          cutoff = dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=72)
          prefix = re.compile(r"^native-joint-28-stage5-[0-9a-f]{40}$")
          base = f"https://api.github.com/repos/{repo}/actions/"

          def request(path, method="GET"):
              url = base + path
              req = urllib.request.Request(
                  url, method=method,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return response.status, json.loads(response.read() or b"null")
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode("utf-8", errors="replace")

          # The deletion path must use the same strict page-count/ID checks
          # as the read-only monitor. API churn is an abort, not deletion input.
          from tools.actions_storage_footprint import verified_artifacts

          def list_artifacts():
              def fetch_page(_repository, page):
                  code, payload = request(f"artifacts?per_page=100&page={page}")
                  if code != 200:
                      raise RuntimeError(f"artifact inventory HTTP {code}: {str(payload)[:160]}")
                  return payload

              return verified_artifacts(repo, fetch_page)

          def created(a):
              return dt.datetime.fromisoformat(a["created_at"].replace("Z", "+00:00"))

          all_artifacts = list_artifacts()
          total = sum(int(a["size_in_bytes"]) for a in all_artifacts)
          stage5 = sorted((a for a in all_artifacts if prefix.fullmatch(a["name"])),
                          key=created, reverse=True)
          stage5_bytes = sum(int(a["size_in_bytes"]) for a in stage5)
          print(f"MODE={'APPLY' if apply else 'DRY_RUN'} repo={repo}")
          print(f"BEFORE count={len(all_artifacts)} bytes={total} MiB={total/1048576:.2f}")
          print(f"STAGE5 count={len(stage5)} bytes={stage5_bytes} MiB={stage5_bytes/1048576:.2f}")

          # Protect accepted M1 URLs as well as prose references.
          # Missing local evidence must fail closed before any deletion.
          from tools.actions_artifact_pins import (artifact_run_id, collect_local_references,
                                                   completed_run_candidates, record_references)
          pinned_runs, pinned_artifacts = collect_local_references(pathlib.Path("."))

          def gh_collection(endpoint):
              entries = []
              for page in range(1, 100):
                  separator = "&" if "?" in endpoint else "?"
                  url = f"repos/{repo}/{endpoint}{separator}per_page=100&page={page}"
                  result = subprocess.run(["gh", "api", url], capture_output=True, text=True, check=True)
                  batch = json.loads(result.stdout)
                  if not isinstance(batch, list):
                      raise RuntimeError(f"Expected list from {endpoint}")
                  entries.extend(batch)
                  if len(batch) < 100:
                      return entries
              raise RuntimeError(f"Too many pages of {endpoint}")

          # Protect links in issue/PR bodies, conversation comments and
          # inline PR reviews; exhaust API pagination before deleting.
          for issue in gh_collection("issues?state=all"):
              record_references(issue.get("body"), pinned_runs, pinned_artifacts)
          for endpoint in ("issues/comments?sort=created&direction=desc",
                           "pulls/comments?sort=created&direction=desc"):
              for comment in gh_collection(endpoint):
                  record_references(comment.get("body"), pinned_runs, pinned_artifacts)
          # Submitted review *bodies* are not inline review comments. Collect
          # every PR's review references before deletion. Batch GraphQL to avoid
          # 1,000+ individual REST requests against GITHUB_TOKEN's hourly limit.
          # Ten reviews/PR keep GraphQL points low; overflow falls back to
          # full REST pagination. GraphQL errors or missing pages fail closed.
          # Never silently truncate review evidence.
          all_prs = gh_collection("pulls?state=all")
          owner, name = repo.split("/", 1)
          review_count = 0
          for offset in range(0, len(all_prs), 20):
              batch = all_prs[offset:offset + 20]
              fields = " ".join(
                  f"p{i}: pullRequest(number: {int(pr['number'])}) "
                  "{ reviews(first: 10) { nodes { body } "
                  "pageInfo { hasNextPage } } }"
                  for i, pr in enumerate(batch))
              query = (f'query {{ repository(owner: "{owner}", name: "{name}") '
                       f'{{ {fields} }} }}')
              response = subprocess.run(
                  ["gh", "api", "graphql", "-f", f"query={query}"],
                  capture_output=True, text=True, check=True)
              payload = json.loads(response.stdout)
              if payload.get("errors"):
                  raise RuntimeError(f"Review pin GraphQL errors: {str(payload['errors'])[:250]}")
              results = (payload.get("data") or {}).get("repository")
              if not isinstance(results, dict):
                  raise RuntimeError("Missing GraphQL review pin repository result")
              for i, pr in enumerate(batch):
                  connection = (results.get(f"p{i}") or {}).get("reviews")
                  if (not isinstance(connection, dict)
                          or not isinstance(connection.get("nodes"), list)
                          or not isinstance(connection.get("pageInfo"), dict)
                          or type(connection["pageInfo"].get("hasNextPage")) is not bool):
                      raise RuntimeError(f"Incomplete review pin result for PR {pr['number']}")
                  reviews = (gh_collection(f"pulls/{int(pr['number'])}/reviews")
                             if connection["pageInfo"]["hasNextPage"]
                             else connection["nodes"])
                  for review in reviews:
                      record_references(review.get("body"), pinned_runs, pinned_artifacts)
                      review_count += 1
          print(f"PIN_SCAN prs={len(all_prs)} pr_reviews={review_count}")
          open_branches = {p["head"]["ref"] for p in all_prs
                           if p.get("state") == "open"
                           and p.get("head", {}).get("repo", {}).get("full_name") == repo}
          keep_recent = {int(a["id"]) for a in stage5[:5]}
          # Protect newest two outputs on every still-open PR branch.
          active_branch_counts = {}
          for a in stage5:
              run = a.get("workflow_run")
              branch = run.get("head_branch") if isinstance(run, dict) else None
              if branch in open_branches and active_branch_counts.get(branch, 0) < 2:
                  keep_recent.add(int(a["id"]))
                  active_branch_counts[branch] = active_branch_counts.get(branch, 0) + 1
          candidates = []
          protected = {"newest-or-active-head": 0, "project-or-issue-linked": 0,
                       "unknown-run-provenance": 0, "younger-than-72h": 0}
          for a in reversed(stage5):
              aid = int(a["id"])
              run_id = artifact_run_id(a)
              if aid in keep_recent:
                  protected["newest-or-active-head"] += 1
              elif aid in pinned_artifacts or (run_id is not None and run_id in pinned_runs):
                  protected["project-or-issue-linked"] += 1
              elif run_id is None:
                  # Never delete an artifact whose originating run cannot be
                  # checked against evidence pins, even if it looks old.
                  protected["unknown-run-provenance"] += 1
              elif created(a) >= cutoff:
                  protected["younger-than-72h"] += 1
              else:
                  candidates.append(a)
          print(f"PROTECTED {protected}; known linked run IDs={len(pinned_runs)}; linked artifact IDs={len(pinned_artifacts)}; open PR branches={len(open_branches)}")
          # Check origin-run completion before building ANY artifact deletion
          # plan. Errors, missing IDs and malformed replies fail closed.
          def fetch_origin_run(run_id):
              status, payload = request(f"runs/{run_id}")
              if status != 200:
                  raise RuntimeError(f"run {run_id}: completion read HTTP {status}: {str(payload)[:160]}")
              return payload

          # Artifact name alone is insufficient: another workflow can use
          # the same name. Fail closed on an unexpected origin before DELETE.
          candidates, unfinished = completed_run_candidates(
              candidates, fetch_origin_run,
              expected_workflow=".github/workflows/native-joint-28-sweep.yml",
              expected_name_prefix="native-joint-28-stage5-",
              # Manually dispatched full evidence is a deliberate opt-in,
              # unlike replaceable PR/push CI diagnostics. Retention handles it.
              allowed_events=("pull_request", "push"))
          print(f"RUN_COMPLETION eligible_finished={len(candidates)} deferred_unsafe={unfinished}")
          print(f"ELIGIBLE count={len(candidates)} MiB={sum(a['size_in_bytes'] for a in candidates)/1048576:.2f}")
          for a in candidates[:12]:
              print(f"CANDIDATE id={a['id']} bytes={a['size_in_bytes']} run={(a.get('workflow_run') or {}).get('id')} age={a['created_at']}")
          planned = []
          remaining = total
          for a in candidates:
              if remaining <= ceiling:
                  break
              planned.append(a)
              remaining -= int(a["size_in_bytes"])
          print(f"PLAN count={len(planned)} reclaim_MiB={(total-remaining)/1048576:.2f} predicted_remaining_MiB={remaining/1048576:.2f}")
          if not apply:
              print("DRY_RUN: no artifacts deleted")
          else:
              deleted = []
              for a in planned:
                  aid = int(a["id"])
                  status, body = request(f"artifacts/{aid}", "DELETE")
                  if status not in (204, 404):
                      raise RuntimeError(f"DELETE id={aid} expected 204/previously gone 404, got {status}: {str(body)[:160]}")
                  deleted.append(aid)
              # GitHub may return stale GET/list data immediately after a 204.
              # Verify final absence with bounded eventual-consistency retries.
              remaining_ids = set(deleted)
              for attempt in range(12):
                  after_artifacts = list_artifacts()
                  live_ids = {int(a["id"]) for a in after_artifacts}
                  remaining_ids = set(deleted).intersection(live_ids)
                  if not remaining_ids:
                      break
                  print(f"Deletion pending visibility for {len(remaining_ids)} IDs; retry {attempt + 1}/12")
                  time.sleep(5)
              if remaining_ids:
                  raise RuntimeError(f"DELETE verification did not converge: {sorted(remaining_ids)[:12]}")
              after = sum(int(a["size_in_bytes"]) for a in after_artifacts)
              print(f"AFTER count={len(after_artifacts)} bytes={after} MiB={after/1048576:.2f}")
              print(f"VERIFIED_DELETIONS count={len(deleted)} reclaimed_MiB={(total-after)/1048576:.2f}")
              if after > ceiling:
                  print("NOTICE: protected/other artifacts still exceed 384 MiB; no unsafe deletion")
          PY
