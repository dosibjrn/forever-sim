name: Clean PR330 publication relocation focused check (temporary)
on:
  push:
    branches:
      - work/clean-generic-route-publication-tests-20261102

permissions:
  contents: read

jobs:
  publication-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch HEAD with LFS source inputs
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Run actual G39 and G46f modules after relocation
        run: python -m pytest -q tests/generic/publication/test_generic_melee_routes_g39.py tests/generic/publication/test_generic_cold_snapshot_g46f.py
