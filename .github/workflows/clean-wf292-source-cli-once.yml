name: Bounded Clean WF292 direct source CLI RED GREEN
on:
  push:
    branches:
      - work/clean-wf292-direct-cli-20261101
permissions:
  contents: read
concurrency:
  group: clean-wf292-source-cli
  cancel-in-progress: false
jobs:
  real-source-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install bounded source dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Real direct CLI, canonical nine-class source and safety control
        shell: bash
        run: |
          set -euo pipefail
          python tools/wf292_batch_verified_source_recovery.py --help > /dev/null
          db=data/forever/catalogue/forever_abilities.sqlite
          before="$(sha256sum "$db" | cut -d' ' -f1)"
          python tools/wf292_batch_verified_source_recovery.py --db "$db" --staging "$RUNNER_TEMP/wf292-stage.sqlite" --offline --max-chunks 0 --max-level 20 --output "$RUNNER_TEMP/wf292.json" > /dev/null
          python - "$RUNNER_TEMP/wf292.json" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1]))
          assert data['status']=='OFFLINE_SOURCE_INVENTORY_ONLY'
          assert data['before']['indexed']==2255
          assert len(data['before']['by_class_pending'])==9
          assert data['attempted_chunks']==0
          print('NINE_CLASS_SOURCE_INVENTORY_PASS',data['before']['pending'])
          PY
          after="$(sha256sum "$db" | cut -d' ' -f1)"
          [[ "$before" == "$after" ]] || exit 9
          if python tools/wf292_batch_verified_source_recovery.py --db "$db" --staging "$db" --offline > "$RUNNER_TEMP/negative.out" 2>&1; then
            echo "FAILED: canonical overwrite accepted"; exit 10
          fi
          grep -q CANONICAL_MUST_NEVER_BE_CAPTURE_STAGE "$RUNNER_TEMP/negative.out"
          python -m pytest -q tests/test_wf292_source_batch_pipeline.py -k nine_class_bulk_queue_and_source_immunity
