name: One-shot retained source-native two-pull RED GREEN (NOT P7)
on:
  push:
    branches: [work/first-native-retained-two-pulls-20261101]
    paths: [.github/workflows/wf-native-two-pulls-one-shot.yml]
permissions:
  contents: read
jobs:
  real-retained-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Source gsim and negative controls
        working-directory: project
        run: |
          python -m pip install --disable-pip-version-check pytest beautifulsoup4
          python -m pytest -q tests/test_wf_go_native_world_damage_ack.py tests/test_wf_native_health_feedback_perturbation.py
      - name: Build exact pinned Go source with retained world overlay
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
          cd ..
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go test -count=1 ./sim/core -run 'Test(WorldHealthACK|WorldBoundary|WorldSession)'
          go test -count=1 ./cmd/wf_gsim_go_world_ingress -run 'Test(WorldTargetTransition|WorldRangeFeed|RealWorldEffectACK)'
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Actual source Paladin two gsim kills in same Go process and journal
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          source=Path('../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json')
          binary=Path('../gsim-go-world-ingress')
          one=run(binary,source,ticks=80,target_spawn_yards=3.,
                  enemy_move_speed_yards_s=.1,target_health=100.,pulls=1)
          assert one['killed_target_ids']==['m1'],one['killed_target_ids']
          two=run(binary,source,ticks=100,target_spawn_yards=3.,
                  enemy_move_speed_yards_s=.1,target_health=100.,pulls=2)
          print('REAL_TWO_PULLS',two['killed_target_ids'],len(two['observations']))
          assert two['killed_target_ids']==['m1','m0'],two['killed_target_ids']
          events=[(x['world_tick']['selected_target_id'],e['event_id'])
                  for x in two['observations'] for e in x['native_damage_events']]
          print('REAL_NATIVE_SOURCE_EVENTS',events)
          assert any(t=='m1' for t,_ in events)
          assert any(t=='m0' for t,_ in events)
          assert len(set(e for _,e in events))==len(events)
          assert all(x['native_world_ack_confirmation']['native_process_id']==two['native_process_id']
                     for x in two['observations'])
          assert all(x['native_world_ack_confirmation']['native_world_health_applied']
                     for x in two['observations'])
          print('REAL_RETAINED_NATIVE_TWO_PULLS_NOT_P7')
          druid=Path('docs/evidence/druid-l60-balance/p7.3/saved_728_request.json')
          sourced=run(binary,druid,ticks=100,target_spawn_yards=3.,
                      enemy_move_speed_yards_s=.1,target_health=100.,pulls=2)
          print('REAL_DRUID_L60_TWO_PULLS',sourced['killed_target_ids'],
                len(sourced['observations']))
          assert sourced['killed_target_ids']==['m1','m0'],sourced['killed_target_ids']
          assert sourced['native_process_reused']
          PY
      - name: RED old main exits before source-native second pull
        run: |
          git -C project show 5144bd2310ae13ad99a6b704fffa340883afe01e:integrations/mythicsim-go/world_boundary/ingress/main.go > upstream/cmd/wf_gsim_go_world_ingress/main.go
          cd upstream
          go build -tags=with_db -trimpath -o ../gsim-go-old-ingress ./cmd/wf_gsim_go_world_ingress
          cd ../project
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          try:
              run(Path('../gsim-go-old-ingress'),
                  Path('../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json'),
                  ticks=100,target_spawn_yards=3.,enemy_move_speed_yards_s=.1,
                  target_health=100.,pulls=2)
          except (RuntimeError,BrokenPipeError) as exc:
              print('REAL_MAIN_RED_SECOND_PULL_TERMINATES',type(exc).__name__,str(exc)[:300])
          else:
              raise AssertionError('OLD_MAIN_UNEXPECTEDLY_SUPPORTED_RETAINED_SECOND_PULL')
          PY
