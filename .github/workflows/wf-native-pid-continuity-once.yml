name: One-shot real native-world PID continuity verification
on:
  push:
    branches:
      - work/native-world-pid-continuity-20261101
    paths:
      - .github/workflows/wf-native-pid-continuity-once.yml

permissions:
  contents: read

concurrency:
  group: native-world-pid-continuity-once
  cancel-in-progress: false

jobs:
  real-native-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact baseline with LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 7cf6fc205e38a262f3f28a971a368beaca246cc3
          path: base
          lfs: true
          persist-credentials: false
      - name: Checkout implementation with LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: project
          lfs: true
          persist-credentials: false
      - name: Checkout pinned native Go
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Install bounded source test prerequisites
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: RED old main must accept a restarted native process incorrectly
        shell: bash
        run: |
          set -euo pipefail
          cp project/tests/test_wf_go_native_world_damage_ack.py base/tests/test_wf_go_native_world_damage_ack.py
          cd base
          set +e
          python -m pytest -q tests/test_wf_go_native_world_damage_ack.py -k native_process_restart > ../red.log 2>&1
          code=$?
          set -e
          cat ../red.log
          test "$code" -ne 0
          grep -q 'DID NOT RAISE' ../red.log
          echo 'RED reproduced: old source-world applier accepts native PID change'
      - name: GREEN real gsim source-world ACK and negative controls
        working-directory: project
        run: |
          python -m pytest -q tests/test_wf_go_native_world_damage_ack.py tests/test_wf_gsim_go_world_range_feed.py
      - name: Build pinned real Go world boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = a667dce8492bd9fb94269a9f864289cb74006775
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          (cd upstream && make sim/core/proto/api.pb.go)
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          (cd upstream && go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress)
      - name: Real pinned Go native spell effects to gsim world and ACK
        working-directory: project
        run: |
          python tools/wf_gsim_go_live_range_probe.py --binary ../gsim-go-world-ingress --request ../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json --out ../real-native-world.json
          python - <<'PY'
          import json
          r=json.load(open('../real-native-world.json'))
          obs=r['observations']
          assert len(obs)==20
          assert r['native_process_reused'] and r['gsim_runtime_real']
          assert len({o['native_process_id'] for o in [r]})==1
          assert all(o['native_world_ack_confirmation']['native_world_health_applied'] for o in obs)
          assert all(o['native_world_ack_confirmation']['native_process_id']==r['native_process_id'] for o in obs)
          assert all(o['native_world_ack_confirmation']['ack_id'] for o in obs)
          print('REAL_NATIVE_GSIM_WORLD_ACK_CONTINUITY_PASS',len(obs),r['native_process_id'])
          PY
      - name: Real pinned Go process rejects forged world ACK
        working-directory: project
        run: |
          python tools/wf_gsim_go_live_range_probe.py --binary ../gsim-go-world-ingress --request ../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json --out ../forged-unused.json --expect-invalid-ack-rejected
