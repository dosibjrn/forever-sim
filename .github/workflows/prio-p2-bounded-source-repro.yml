name: prio-p1-source-effect-repro
on:
  push:
    branches:
      - work/prio-p2-source-fullpoint-20261101-2356
    paths:
      - .github/prio-p2-repro-trigger.txt
      - tools/wf_gate_p2_live.py
permissions:
  contents: read
  issues: write
jobs:
  real-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Real sourced P1 behavior and negative control
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 pytest==8.3.5
          python -m pytest -q tests/test_wf470_p1_scope.py
          WOW_FOREVER_BUILD_AS_OF=2026-10-17 python tools/wf_gate.py --class druid --level 20 --gate P1
      - name: Publish bounded run ID to work PR for exact-HEAD verification
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: dosibjrn/forever-sim
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh api repos/dosibjrn/forever-sim/issues/94/comments \
            -f body="P1 bounded source diagnostic run: https://github.com/dosibjrn/forever-sim/actions/runs/$RUN_ID (HEAD $HEAD_SHA). This comment only provides the run ID; inspect job logs for RED/GREEN evidence."
