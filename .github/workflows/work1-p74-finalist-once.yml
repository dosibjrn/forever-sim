name: Work1 P7.4 stochastic finalist focused exact-branch regression (one shot)
on:
  push:
    branches:
      - work/work1-p74-stochastic-paid-finalist-20261102
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused P7.4 source-native/world selection regression
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
