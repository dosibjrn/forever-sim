name: Work1 P7.4 dual stochastic seed focused check (temporary)
on:
  push:
    branches:
      - work/work1-p74-dual-seed-stochastic-finalists-20261102
    paths:
      - '.github/workflows/work1-p74-dual-seed-check.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5'
      - run: python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
      - run: python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
