name: Work2 one-shot source slot coverage

on:
  push:
    branches:
      - 'work/2nd-source-gear-slot-round-robin-20261102'

permissions:
  contents: read

jobs:
  source-slot-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused source test dependencies
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Run actual source Mage/Hunter slot regressions
        run: python -m pytest -q tests/test_source_wand_paid_slot_proposals.py
