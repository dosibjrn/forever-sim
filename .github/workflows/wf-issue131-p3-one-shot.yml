name: Temporary issue131 actual production P3 first-pass
on:
  push:
    branches: [work/issue131-live-p3-production-20261102]
  workflow_dispatch:
jobs:
  actual-p3:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Actually run selected Druid L60 Balance P3 production search and scorer (FAIL diagnostic expected)
        run: |
          python - <<'PY'
          from tools.wf_gate import _run_live_gate, ROOT
          r = _run_live_gate(ROOT, 'druid', 60, 'balance', 'P3', '')
          print("P3_SELECTED_L60_BALANCE:",r)
          assert r["status"] != "PASS"
          assert r.get("real_catalogue_top5_items_scored",0) > 0, "Real scorer was not reached"
          assert r.get("real_source_search_evaluated",0) > 0
          PY
      - name: Second class same real P3 provider Hunter L20 (genericity smoke)
        run: |
          python - <<'PY'
          from tools.wf_gate import _run_live_gate, ROOT
          r = _run_live_gate(ROOT, 'hunter', 20, 'unrestricted', 'P3', '')
          print("P3_SECOND_CLASS_HUNTER_L20:",r)
          assert r["status"] != "PASS"
          assert r["status"] == "BLOCKED", r
          assert r.get("production_component") == "src.v2.source_budgeted_gear.run_source_budgeted_gear", r
          assert any("BLOCKED_NO_NAKED_SUCCESS" in x for x in r["reasons"]), r
          PY
      - name: Fast original source gear production scorer regressions
        run: python -m pytest -q tests/test_wf408_unified_production_item_score_p3_tdd.py tests/test_wf_gate_p3_approved.py
