name: Work1 P7.5 accepted-M1 receipt focused regression
on:
  push:
    branches:
      - work/work1-p75-accepted-m1-projection-20261103-0343
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact Work1 production changes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Run P7.5 accepted-prior regression on exact source
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pytest -q tests/gates/test_wf_gate_p7_5_prior.py
          python -m compileall -q tools/wf_gate_p7_5_prior.py
