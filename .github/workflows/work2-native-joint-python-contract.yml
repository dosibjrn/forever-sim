name: Work2 — Native JOINT Python contract

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/work2-native-joint-python-contract.yml
      - integrations/mythicsim-rust/native_joint_two_class.py
      - integrations/mythicsim-rust/native_options.py
      - integrations/mythicsim-rust/tests/test_native_options.py
      - integrations/mythicsim-rust/native_gear_adapter.py
      - integrations/mythicsim-rust/native_l60_matrix.py
      - integrations/mythicsim-rust/native_joint_28_sweep.py
      - integrations/mythicsim-rust/tests/test_native_joint_28_sweep.py
      - integrations/mythicsim-rust/native_executor.py
      - integrations/mythicsim-rust/tests/test_native_gear_adapter.py
      - integrations/mythicsim-rust/p73_talent_search_v2.py
      - integrations/mythicsim-rust/native_joint_composition.py
      - integrations/mythicsim-rust/native_source_donors.py
      - integrations/mythicsim-rust/tests/test_native_joint_two_class.py
      - integrations/mythicsim-rust/tests/test_native_l20_paid_cast_receipts.py
      - integrations/mythicsim-rust/tests/test_native_joint_composition.py
      - integrations/mythicsim-rust/tests/test_native_source_donors.py
      - integrations/mythicsim-rust/tests/test_native_matrix_contract.py

permissions:
  contents: read

concurrency:
  group: work2-native-joint-python-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-joint-python:
    name: Exact-head native JOINT Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run native JOINT Python contract tests
        run: |
          python integrations/mythicsim-rust/tests/test_native_joint_two_class.py -v
          python integrations/mythicsim-rust/tests/test_native_l20_paid_cast_receipts.py -v
          python integrations/mythicsim-rust/tests/test_native_joint_composition.py -v
          python integrations/mythicsim-rust/tests/test_native_gear_adapter.py -v
          python integrations/mythicsim-rust/tests/test_native_options.py -v
          python integrations/mythicsim-rust/tests/test_native_source_donors.py -v
          python integrations/mythicsim-rust/tests/test_native_joint_28_sweep.py -v
          python integrations/mythicsim-rust/tests/test_native_matrix_contract.py -v
