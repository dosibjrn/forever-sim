name: Work1 P7.4 paid gear neighbor regression (temporary)
on:
  push:
    branches:
      - work/work1-p74-paid-source-gear-neighbors-20261102
    paths:
      - .github/workflows/work1-p74-paid-gear-one-shot.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Verify exact source and focused regression
        run: |
          git rev-parse HEAD
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
