name: Work2 real sourced 100-mob diagnostic once (NOT P4/P5/P6 acceptance)

on:
  push:
    branches:
      - work/work2-paid-100mob-positive-timing-20261102
    paths:
      - .github/workflows/work2-real-100mob-one-shot.yml

permissions:
  contents: read

jobs:
  source-paid-100mob:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore original source LFS assets
        run: git lfs pull
      - name: Install source runtime dependencies
        run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Execute bounded real source-cold search and independent 100-mob replay
        run: |
          python -u - <<'PY'
          import json
          from src.game.data.forever.registry import build_game_ir_slice
          from src.v2.source_bounded_joint_frontier import (
              source_cold_start_stage, search_bounded_joint_frontier,
              replay_joint_shortlist_100mob,
          )
          class_key, level = "druid", 30
          ir = build_game_ir_slice(class_key=class_key, level=level)
          seed = source_cold_start_stage(
              class_key=class_key, level=level,
              source_ir=ir, gear_role="druid_feral")
          search = search_bounded_joint_frontier(
              class_key=class_key, level=level,
              source_ir=ir, seed_stage=seed, bonus_talent_points=5,
              max_talents=8, max_gear_moves=12, max_policies=4,
              max_recovery_policies=2, max_paid_builds=32,
              max_cpu_s=6., per_candidate_wall_s=0.75,
              screen_mobs=2, finalist_mobs=100, pack_size=2,
              search_only=True, screen_evaluator_backend="direct",
              refinement_rounds=0)
          print("SOURCE_PAID_COLD", json.dumps({
              "status": search["status"],
              "paid_candidates": search["paid_candidates"],
              "screen_complete_candidates": search["screen_complete_candidates"],
              "unique_full_builds": search["unique_full_builds"],
              "shortlist": len(search["validation_shortlist"]),
              "elapsed_s": search["wall_s"],
              "paid_axis_coverage": search["joint_axis_paid_coverage"],
              "first_blockers": [
                  r.get("blocker") or r.get("screen_status")
                  for r in search["rows"][:6]],
          }, default=str), flush=True)
          if not search["validation_shortlist"]:
              raise SystemExit("NO_SOURCE_PAID_FINALIST_TO_REPLAY")
          first = {**search,
                   "validation_shortlist": search["validation_shortlist"][:1]}
          result = replay_joint_shortlist_100mob(
              first, source_ir=ir, seed_stage=seed, class_key=class_key,
              level=level, bonus_talent_points=5, pack_size=2,
              max_per_candidate_wall_s=90.)
          print("REAL_PAID_100MOB", json.dumps(result, default=str), flush=True)
          row = (result.get("rows") or [None])[0]
          if not row or row.get("status") != "COMPLETE" or row.get("count") != 100:
              raise SystemExit("SOURCE_PAID_100MOB_INCOMPLETE")
          PY
