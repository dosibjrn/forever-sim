name: Work2 P6 true production predicate and cold replay (one-shot)
on:
  push:
    branches:
      - work/work2-p6-real-predicate-20261102
jobs:
  p6-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Focused P6 gate predicate with positive and negative controls
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_work2_p6_full_source_checkpoint.py tests/test_work2_p6_full_source_checkpoint.py
      - name: First real independent paid P6 30s/300s and two 100-mob replay (NO M1)
        shell: bash
        env:
          FOREVER_P6_FULL_SOURCE_COMPARE: '1'
        run: |
          set +e
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P6 --out /tmp/work2-p6.json
          rc=$?
          set -e
          echo "WORK2_P6_GATE_EXIT=$rc"
          if [ -f /tmp/work2-p6.json ]; then
            python - <<'PY'
          import json
          report=json.load(open('/tmp/work2-p6.json'))
          for row in report.get('results',[]):
              keys=('gate','status','reasons','production_engine','source_replay_T30_T300',
                    'source_replay_T30_s_per_mob','source_replay_T300_s_per_mob',
                    'source_replay_numeric_saturation','N30_unique_paid','N300_unique_paid',
                    'source_replay_results','search_wall_s','runtime_proof')
              print('WORK2_P6_LIVE_RECEIPT='+json.dumps(
                  {k:row.get(k) for k in keys},sort_keys=True),flush=True)
          PY
          fi
          # Test purpose: collect genuine PASS/FAIL verdict; FAIL is a gate result,
          # not a GitHub runner/test infrastructure failure.
          exit 0
