name: Work2 P6 exact source regression (temporary)
on:
  push:
    branches:
      - work/work2-p6-canonical-source-20261102-1953
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/test_work2_p6_full_source_checkpoint.py tests/test_work2_full_source_p4_p5_gate_entry.py tests/test_wf_gate_p6_live.py
