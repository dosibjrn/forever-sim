name: Work1 P7.4 independent legal reference rediscovery focused RED GREEN
on:
  push:
    branches: [work/work1-p74-independent-reference-rediscovery-20261103]
    paths:
      - tools/wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_p7_4_live.py
      - .github/workflows/work1-p74-reference-rediscovery-once.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run P7.4 source-cold rediscovery and all focused regressions
        run: |
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_4_live.py
