name: M1 - Merge-owned partial receipt invalidation

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: m1-invalidate-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  invalidate:
    if: >-
      github.actor == 'dosibjrn' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/m1-invalidate ')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Merge command and already-merged main PR
        id: request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "$COMMENT_BODY" != *$'\n'* ]] || { echo "M1_INVALIDATION_COMMAND_MUST_BE_SINGLE_LINE"; exit 1; }
          payload="${COMMENT_BODY#/m1-invalidate }"
          [[ "$payload" == *" --expected-run "* && "$payload" == *" --reason "* ]] || {
            echo 'Usage: /m1-invalidate mage:30:unrestricted:P3 --expected-run 41764632715 --reason <reason>'; exit 1;
          }
          target="${payload%% --expected-run *}"
          rest="${payload#* --expected-run }"
          expected_run="${rest%% --reason *}"
          reason="${rest#* --reason }"
          [[ "$target" == "mage:30:unrestricted:P3" ]] || { echo "M1_INVALIDATION_TARGET_NOT_APPROVED"; exit 1; }
          [[ "$expected_run" == "41764632715" ]] || { echo "M1_INVALIDATION_EXPECTED_RUN_NOT_APPROVED"; exit 1; }
          [[ -n "$reason" && ${#reason} -le 240 && "$reason" == *"#359"* && "$reason" == *"#790"* ]] || {
            echo "M1_INVALIDATION_REASON_MUST_CITE_OWNER_DECISION_359_AND_ISSUE_790"; exit 1;
          }
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          jq -e --arg repo "$GITHUB_REPOSITORY" \
            '.merged == true and .base.ref == "main" and .base.repo.full_name == $repo' \
            <<< "$pr" >/dev/null || { echo "M1_INVALIDATION_REQUIRES_MERGED_PR_TO_MAIN"; exit 1; }
          {
            echo "target=$target"
            echo "expected_run=$expected_run"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout current main with full ledger history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Invalidate only the named PARTIAL receipt and publish ledger plus chart atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.request.outputs.target }}
          EXPECTED_RUN: ${{ steps.request.outputs.expected_run }}
          REASON: ${{ steps.request.outputs.reason }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          read -r class level spec gate <<< "${TARGET//:/ }"
          token_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B main origin/main
            candidate_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq '[.workflow_runs[] | select(.name=="M1 - Merge-owned batch live gate recorder" and (.status=="queued" or .status=="in_progress")) | .id] | .[]')"
            active=0
            while IFS= read -r run_id; do
              [[ -n "$run_id" ]] || continue
              job_payload="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100")"
              job_count="$(jq '.jobs | length' <<< "$job_payload")"
              if [[ "$job_count" == 0 ]]; then
                active=1
                continue
              fi
              running_jobs="$(jq '[.jobs[] | select(.name=="record" and (.status=="queued" or .status=="in_progress"))] | length' <<< "$job_payload")"
              if [[ "$running_jobs" -gt 0 ]]; then active=1; fi
            done <<< "$candidate_runs"
            if [[ "$active" != 0 ]]; then
              echo "M1_RECORDER_IN_PROGRESS attempt=$attempt"
              if [[ "$attempt" == 5 ]]; then exit 2; fi
              sleep 5
              continue
            fi

            python - "$TARGET" "$EXPECTED_RUN" <<'PY'
          import csv
          import sys
          from pathlib import Path

          target = tuple(sys.argv[1].split(":"))
          expected_run = sys.argv[2]
          with Path("docs/planning/M1_PASSES.tsv").open(encoding="utf-8", newline="") as handle:
              matches = [
                  row for row in csv.DictReader(handle, delimiter="\t")
                  if tuple(row.get(key, "") for key in ("class", "level", "spec", "gate")) == target
              ]
          if len(matches) != 1:
              raise SystemExit(f"M1_INVALIDATION_EXPECTED_ONE_RECEIPT got={len(matches)}")
          row = matches[0]
          if row.get("status") != "PARTIAL":
              raise SystemExit(f"M1_INVALIDATION_REFUSES_STATUS {row.get('status')}")
          if expected_run not in row.get("run_url", ""):
              raise SystemExit("M1_INVALIDATION_PROVENANCE_MISMATCH")
          print("M1_INVALIDATION_VERIFIED", target, row.get("verified"), row.get("applicable"), row.get("run_url"))
          PY

            python tools/m1_progress.py --ledger docs/planning/M1_PASSES.tsv \
              --invalidate "$class" "$level" "$spec" "$gate"
            python tools/m1_progress.py --ledger docs/planning/M1_PASSES.tsv \
              --plot-svg docs/planning/M1_HISTORY.svg
            python tools/m1_progress.py --ledger docs/planning/M1_PASSES.tsv

            git add docs/planning/M1_PASSES.tsv docs/planning/M1_HISTORY.svg
            if git diff --cached --quiet; then
              echo "M1_INVALIDATION_NO_CHANGE"
              exit 0
            fi
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "M1: invalidate legacy SQLite-derived Mage L30 P3 partial" \
              -m "Expected source receipt: Actions $EXPECTED_RUN. Reason: $REASON. Owner-authorized via merged PR #$PR_NUMBER."
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $token_header" \
              push origin HEAD:refs/heads/main; then
              {
                echo "## M1 receipt invalidation published"
                echo "- Target: \`$TARGET\`"
                echo "- Expected receipt: Actions $EXPECTED_RUN"
                echo "- Reason: $REASON"
                git show -1 --format='- Commit: %H (%s)'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "M1_INVALIDATION_CAS_RETRY $attempt"
          done
          echo "M1_INVALIDATION_CAS_EXHAUSTED"
          exit 1
