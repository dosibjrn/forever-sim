name: Clean GameIR publication scoped tests
on:
  push:
    branches:
      - clean/group-gameir-publication-20261102
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m compileall -q tests/generic/publication
      - run: python -m pytest -q tests/generic/publication/test_game_ir_g04.py tests/generic/publication/test_game_ir_tuning_overlays_g06.py tests/generic/publication/test_player_starting_state_ir_g05.py
