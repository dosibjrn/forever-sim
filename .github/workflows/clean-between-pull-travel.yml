name: Clean scoped source travel regression
on:
  push:
    branches:
      - work/clean-between-pull-travel-clock-20261101
    paths:
      - .github/workflows/clean-between-pull-travel.yml
permissions:
  contents: read
concurrency:
  group: clean-between-pull-travel-one-shot
  cancel-in-progress: true
jobs:
  source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real sourced GameIR repeated-pull travel and carried periodics
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q tests/test_wf374_final_pack_recovery.py tests/test_wf242_persisted_periodics_and_multi_pull.py
