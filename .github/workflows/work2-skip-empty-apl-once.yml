name: Work2 one-shot skip absent sourced policy
on:
  push:
    branches:
      - work/work2-skip-absent-apl-20261102
    paths:
      - .github/workflows/work2-skip-empty-apl-once.yml
      - src/v2/source_bounded_joint_frontier.py
      - tests/test_source_paid_gear_witness_priority.py
permissions:
  contents: read
jobs:
  source-apl:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run real source and engine regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf409_talent_unlock_paid_witness_tdd.py tests/test_source_paid_gear_witness_priority.py
