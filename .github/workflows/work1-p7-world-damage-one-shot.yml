name: Work1 P7 world damage receipt focused exact-HEAD validation (one-shot)
# Revalidate receipt diagnostics after the first source-backed RED run.
on:
  push:
    branches: [work/work1-p7-world-damage-conservation-20261102]
    paths: [.github/workflows/work1-p7-world-damage-one-shot.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Work1 P7.1–P7.5 exact-source receipt regressions
        run: |
          echo "Exact-HEAD $(git rev-parse HEAD)"
          python -m pytest -q tests/test_work1_p7_1_live_entry.py tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py tests/test_wf_gate_p7_5_live.py
