name: Prio P1 P3 measured partial production proof (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  real-partials:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_prio_p1_p3_partials.py
      - name: Real source gate partial evidence (not PASS recording)
        run: |
          python - <<'PY'
          from tools.wf_gate import _run_live_gate, ROOT
          for gate in ("P1", "P3"):
              report = _run_live_gate(ROOT, "druid", 60, "balance", gate,
                                      "current_solo_leveling_100mob_v1")
              print("EXECUTED", gate, "status", report.get("status"),
                    "verified", report.get("pass_count"),
                    "applicable", report.get("reachability_count"),
                    "behavior_probes", report.get("behavior_probes_executed"),
                    "scope", report.get("partial_scope"),
                    "first_blockers", report.get("reasons", [])[:2])
          PY
