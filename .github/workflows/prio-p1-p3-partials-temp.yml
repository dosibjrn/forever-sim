name: Prio P1 P3 measured partial production proof (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  real-partials:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_prio_p1_p3_partials.py
      - run: python tools/wf_gate.py --class druid --level 60 --spec balance --gate P1 || test "$?" = "1"
      - run: python tools/wf_gate.py --class druid --level 60 --spec balance --gate P3 || test "$?" = "1"
