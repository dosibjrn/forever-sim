name: Work1 P7.4 mutable-slot exact-HEAD focused check (temporary)
on:
  push:
    branches: [work/work1-p74-single-slot-mutable-neighbor-20261102]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify actual P7.4 gear neighbor code and regressions
        run: |
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
