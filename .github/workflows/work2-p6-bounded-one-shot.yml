name: Work2 one-shot P6 Balance source-profile routing
on:
  push:
    branches:
      - work/work2-p6-bounded-source-profile-20261102
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-p6-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run source-hydrated P6 route and paid comparator regressions
        run: |
          set -euo pipefail
          echo "Tested HEAD: $(git rev-parse HEAD)"
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf_gate_p6_live.py tests/test_work2_p6_full_source_checkpoint.py tests/test_wf_p6_gear_source_snapshot.py
          python -m compileall -q tools/wf_gate_p6_live.py tests/test_wf_gate_p6_live.py
