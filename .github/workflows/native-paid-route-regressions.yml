name: Native-paid route continuity regressions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - src/v2/path_dp.py
      - src/v2/native_paid_route.py
      - tools/wf_warlock_next_level_source.py
      - tests/test_work2_warlock_next_level_source.py
      - tools/wf_warlock_paid_range.py
      - tools/wf_warlock_shortlist_world.py
      - tests/test_work1_warlock_shortlist_world.py
      - tests/test_work2_warlock_paid_range.py
      - tests/test_work2_native_paid_banked_path_dp.py
      - tests/test_work2_native_paid_route_publisher.py
      - tools/wf_warlock_paid_artifact.py
      - tests/test_warlock_paid_artifact.py
      - .github/workflows/work2-warlock-l41-l50-native-batch.yml
      - .github/workflows/native-paid-route-regressions.yml

permissions:
  contents: read

jobs:
  native-paid-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Test native paid receipt continuity and no-respec safety
        run: python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py tests/test_warlock_paid_artifact.py tests/test_work2_warlock_paid_range.py tests/test_work1_warlock_shortlist_world.py
