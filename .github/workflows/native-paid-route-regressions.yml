name: Native-paid route continuity regressions

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - src/v2/path_dp.py
      - src/v2/native_range_optimizer.py
      - src/v2/native_class_adapters.py
      - tests/test_native_class_adapters.py
      - tools/wf_warlock_native_range_optimize.py
      - tools/wf_warlock_native_persistent_optimizer.py
      - tests/test_work2_native_persistent_optimizer.py
      - tools/wf_warlock_native_range_scored_adapter.py
      - tools/wf_warlock_native_source_frontier.py
      - tests/test_work2_live_native_source_frontier.py
      - tests/test_prio_native_frontier_binary_identity.py
      - tests/test_prio_native_range_receipt_status.py
      - tools/wf_warlock_native_candidate_scoring.py
      - tests/test_work1_native_candidate_scoring.py
      - tests/test_work2_native_range_optimizer.py
      - tests/test_work2_adaptive_native_finalists.py
      - tests/test_work2_world_rest_comparison.py
      - tools/wf_native_paid_html.py
      - tools/wf_native_paid_reference_layout.py
      - tools/wf_native_paid_sim_report.py
      - tests/test_native_paid_sim_report.py
      - tests/test_native_paid_html.py
      - tests/test_work2_independent_native_anchors.py
      - src/v2/native_paid_route.py
      - tools/wf_warlock_next_level_source.py
      - tools/wf_warlock_full_family_shortlist.py
      - tests/test_work2_warlock_next_level_source.py
      - tests/test_work1_full_family_shortlist.py
      - tools/wf_warlock_paid_range.py
      - tools/wf_warlock_l10_root.py
      - tools/wf_warlock_native_start_source.py
      - tests/test_work2_warlock_native_start_source.py
      - tests/test_work2_warlock_l10_root.py
      - tools/wf_warlock_shortlist_world.py
      - tests/test_work1_warlock_shortlist_world.py
      - tests/test_work1_paid_family_guide.py
      - tools/wf_warlock_paid_family_guide.py
      - data/warlock/native_l47_paid_family_guide.json
      - data/warlock/native_l47_paid_family_guide.md
      - tests/test_work2_warlock_paid_range.py
      - tests/test_work2_native_paid_banked_path_dp.py
      - tests/test_work2_native_paid_route_publisher.py
      - tools/wf_warlock_paid_artifact.py
      - tests/test_warlock_paid_artifact.py
      - .github/workflows/work2-warlock-l41-l50-native-batch.yml
      - .github/workflows/native-paid-route-regressions.yml
  workflow_dispatch:
    inputs:
      predecessor_artifact_id:
        description: "Explicit authentic predecessor for a genuinely unmeasured successor (no repeat L47 baseline)"
        required: false
        type: string
      from_level:
        description: "Source-paid predecessor level (successor is from_level + 1)"
        required: false
        type: number
      selected_rust_sha:
        description: "Exact selected Rust source revision"
        required: false
        type: string
      predecessor_binary_sha256:
        description: "Exact binary SHA256 of predecessor's genuine 100-mob receipt"
        required: false
        type: string
      max_proposals:
        description: "Maximum native prepare probes per complete talent family"
        required: false
        type: number
        default: 240
      max_finalists:
        description: "Maximum distinct paid 100-mob finalists"
        required: false
        type: number
        default: 3
      run_m06_original:
        description: "Pay one bounded M0.6 original native comparison at the dispatched ref"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read  # Authenticate the actual paid predecessor artifact; no replay.

jobs:
  native-paid-route:
    if: github.event_name == 'pull_request'
    # Only obsolete fast PR checks are superseded; manual Rust-paid evidence
    # jobs below must NEVER be cancelled by a new PR commit or dispatch.
    concurrency:
      group: native-paid-route-fast-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Test native paid receipt continuity and no-respec safety
        run: python -m pytest -q tests/test_prio_native_frontier_binary_identity.py tests/test_prio_native_range_receipt_status.py tests/test_work1_native_candidate_scoring.py tests/test_work2_warlock_next_level_source.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_range_optimizer.py tests/test_work2_adaptive_native_finalists.py tests/test_work2_world_rest_comparison.py tests/test_native_paid_html.py tests/test_native_paid_sim_report.py tests/test_native_class_adapters.py tests/test_clean_native_paid_axis_breadth.py tests/test_work2_native_persistent_optimizer.py tests/test_work2_independent_native_anchors.py tests/test_work2_live_native_source_frontier.py tests/test_work2_native_paid_route_publisher.py tests/test_warlock_paid_artifact.py tests/test_work2_warlock_paid_range.py tests/test_work2_warlock_l10_root.py tests/test_work2_warlock_native_start_source.py tests/test_work1_warlock_shortlist_world.py tests/test_work1_full_family_shortlist.py tests/test_work1_paid_family_guide.py tests/maintenance/test_m06_paid_dispatch_boundary.py

  # Explicitly requested M0.6 original native-paid sample comparison.
  # Work2 already proved the bounded run in #43072652469; repeated PR pushes
  # must not rebuild Rust and repay the same scenario. Dispatch at the intended ref.
  work2-m06-original-native:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_m06_original == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install current native world transport dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Compile exact selected MythicSim engine for paid M0.6
        run: |
          set -euo pipefail
          selected="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          actual="$(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
          test "$selected" = "$actual"
          echo "M06_EXACT_SELECTED_RUST_SHA=$actual"
          cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml --bin forever-engine
      - name: Original two-level adaptive native-paid optimize and ranked guide
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs
          python -m src.v2.runner optimize \
            --class warlock --tree unconstrained \
            --start-level 20 --end-level 40 --level-stride 20 \
            --n-mobs 2 --budget 12 --recover-at-end true \
            --rng balanced --backend rust \
            --native-binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --out runs/m06-adaptive-original.json \
            --guide-out runs/m06-adaptive-original.md \
            --shortlist-out runs/m06-adaptive-shortlist.md \
            2>&1 | tee runs/m06-adaptive-original.log
      - name: Keep original source-native receipts or precise refusal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-m06-adaptive-original-${{ github.sha }}
          path: |
            runs/m06-adaptive-original.json
            runs/m06-adaptive-original.md
            runs/m06-adaptive-shortlist.md
            runs/m06-adaptive-original.log
            runs/native-api-paid-cache/
          if-no-files-found: warn
          retention-days: 3

  # The real native 100/100 comparison is deliberately opt-in, never an
  # automatic response to every source push or a rerun of paid L20–L60 routes.
  # The old PR label launcher replayed the already-measured L46→L47
  # experiment. Require deliberate manual dispatch and explicit source,
  # predecessor and binary identities for any NEW paid comparison.
  # Every native rejection remains in the artifact.
  cross-tree-native-world:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.predecessor_artifact_id != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      FROM_LEVEL: ${{ inputs.from_level }}
      PREDECESSOR_ARTIFACT_ID: ${{ inputs.predecessor_artifact_id }}
      PREDECESSOR_BINARY_SHA256: ${{ inputs.predecessor_binary_sha256 }}
      SELECTED_RUST_SHA: ${{ inputs.selected_rust_sha }}
      MAX_PROPOSALS: ${{ inputs.max_proposals }}
      MAX_FINALISTS: ${{ inputs.max_finalists }}
    steps:
      # Validate manual paid-work requests before either repository checkout.
      # Malformed identities/budgets must never start a source fetch or Cargo build.
      - name: Preflight bounded paid comparison inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SELECTED_RUST_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PREDECESSOR_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$PREDECESSOR_BINARY_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$FROM_LEVEL" =~ ^[0-9]+$ ]]
          [[ "$MAX_PROPOSALS" =~ ^[0-9]+$ ]]
          [[ "$MAX_FINALISTS" =~ ^[0-9]+$ ]]
          test "$FROM_LEVEL" -ge 10
          test "$FROM_LEVEL" -lt 60
          test "$MAX_PROPOSALS" -ge 1
          test "$MAX_PROPOSALS" -le 1000
          test "$MAX_FINALISTS" -ge 1
          test "$MAX_FINALISTS" -le 6
      - name: Checkout exact comparison source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
      - name: Checkout exact native authority
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: ${{ env.SELECTED_RUST_SHA }}
          path: engine
      - name: Verify exact checked-out native revision
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "$SELECTED_RUST_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused Forever integration requirements
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Test only changed Forever candidate/receipt forwarding
        working-directory: project
        run: python -m pytest -q tests/test_work1_warlock_shortlist_world.py tests/test_work2_warlock_next_level_source.py tests/test_warlock_paid_artifact.py tests/test_work1_full_family_shortlist.py
      - name: Build exact Rust executor (no source-rules audit)
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Download existing paid predecessor receipt, never repay it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p predecessor-archive
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/$PREDECESSOR_ARTIFACT_ID/zip" \
            -o predecessor.zip
          unzip -q predecessor.zip -d predecessor-archive
      - name: Stage only actual paid source and native route for predecessor
        working-directory: project
        run: |
          set -euo pipefail
          python tools/wf_warlock_paid_artifact.py \
            --archive-dir ../predecessor-archive --from-level "$FROM_LEVEL" \
            --out ../predecessor-staged
      - name: Confirm original 100/100 ACK and executable binary lineage
        working-directory: project
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.wf_warlock_next_level_source import verified_paid_predecessor
          receipt = verified_paid_predecessor(
              route=Path("../predecessor-staged/route.json"),
              source=Path("../predecessor-staged/source_request.json"),
              binary=Path("../engine/target/debug/forever-engine"),
              from_level=int(os.environ["FROM_LEVEL"]),
              predecessor_binary_sha256=os.environ["PREDECESSOR_BINARY_SHA256"])
          print("VERIFIED_PAID_NATIVE_PREDECESSOR", receipt, flush=True)
          PY
      - name: Construct genuine distinct full native-prepared talent families and 30s screens
        working-directory: project
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u tools/wf_warlock_full_family_shortlist.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../predecessor-staged/source_request.json \
            --predecessor-route ../predecessor-staged/route.json \
            --predecessor-binary-sha256 "$PREDECESSOR_BINARY_SHA256" \
            --from-level "$FROM_LEVEL" --to-level "$((FROM_LEVEL + 1))" \
            --max-native-probes-per-family "$MAX_PROPOSALS" \
            --out ../cross-tree/shortlist
      - name: Pay actual bounded distinct native/gsim hostile 100/100 worlds
        working-directory: project
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u tools/wf_warlock_shortlist_world.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../predecessor-staged/source_request.json \
            --predecessor-route ../predecessor-staged/route.json \
            --shortlist ../cross-tree/shortlist/native_paid_shortlist.json \
            --out ../cross-tree/world \
            --max-new-trials "$MAX_FINALISTS" --max-candidates "$MAX_FINALISTS"
      - name: Publish genuine winner or exact provisional/refusal state
        working-directory: project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("../cross-tree/world/comparison.json")
          result = json.loads(p.read_text())
          assert result["kind"] == "warlock_native_world_finalist_comparison_v1"
          assert result["m1_recording_performed"] is False
          assert result["stat_weights_measured"] is False
          assert result["new_native_100_trials"] <= 6
          print("NATIVE_PAID_CROSS_TREE_RESULT", json.dumps({
              "status": result["status"], "level": result["level"],
              "winner": result["world_winner"],
              "candidates": result["candidates"],
              "pending": result["pending_candidate_indexes"],
          }, indent=2), flush=True)
          PY
      - name: Preserve original predecessor, source-screened alternatives and all paid worlds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-warlock-cross-tree-${{ github.run_id }}
          path: |
            predecessor-staged/
            cross-tree/
          if-no-files-found: warn
          retention-days: 14
