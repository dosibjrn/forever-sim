name: One-shot Clean acquisition audit source DB RED GREEN
on:
  push:
    branches:
      - work/clean-acquisition-audit-source-db-20261101
    paths:
      - tools/audit_source_acquisition_gate.py
      - .github/workflows/clean-acquisition-audit-once.yml
permissions:
  contents: read
concurrency:
  group: clean-acquisition-audit-once
  cancel-in-progress: false
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4 pytest==8.3.5
      - name: Real canonical and staged source acquisition regressions
        run: python -m pytest -q tests/test_audit_source_acquisition_cli.py
