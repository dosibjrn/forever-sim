name: Work2 one-shot P6 paid replay receipt regression

on:
  push:
    branches:
      - work/work2-p6-replay-failure-receipts-20261102
    paths:
      - .github/workflows/work2-p6-replay-receipts-one-shot.yml

permissions:
  contents: read

jobs:
  receipt-regression:
    if: ${{ !contains(github.event.head_commit.message, 'remove disposable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exact-source production-report regressions
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_work2_p6_replay_receipts.py tests/test_wf_gate_p6_live.py tests/test_work2_p6_full_source_checkpoint.py
          python -m compileall -q tools/wf_gate.py tests/test_work2_p6_replay_receipts.py
