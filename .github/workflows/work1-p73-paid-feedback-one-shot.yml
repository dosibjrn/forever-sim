name: Work1 P7.3 paid stochastic feedback focused regression (one-shot)
on:
  push:
    branches: [work/work1-p73-paid-feedback-20261103-0323]
    paths:
      - 'tools/wf_gate_p7_3_live.py'
      - 'tests/gates/test_wf_gate_p7_3_live.py'
      - '.github/workflows/work1-p73-paid-feedback-one-shot.yml'
permissions:
  contents: read
jobs:
  exact-head-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Production P7.3 focused tests on exact HEAD (not full 300s gate)
        run: |
          echo "HEAD=$(git rev-parse HEAD)"
          python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py
          python -m compileall -q tools/wf_gate_p7_3_live.py
