name: Work1 P7.3 paid-elite regression (temporary)
on:
  push:
    branches:
      - work/work1-p73-paid-elite-native-world-20261102
  workflow_dispatch:
jobs:
  p73-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest
      - name: Compile changed source and test
        run: python -m compileall -q tools/wf_gate_p7_3_live.py tests/gates/test_wf_gate_p7_3_live.py
      - name: Test source-legal paid-elite search and cold independence
        run: python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py tests/gates/test_p7_independent_cold_rediscovery.py
