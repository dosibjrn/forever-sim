name: Merge once — combined main M1 and source regressions
on:
  push:
    branches: [merge/verify-combined-167-20261102]
    paths: [.github/workflows/merge-combined-167-one-shot.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Verify exact combined main code and no repository changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "039b2a5925a01a84b036b92ae297693ef320d12a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-combined-167-one-shot.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Read-only official M1 progress
        run: |
          set -euo pipefail
          python tools/m1_progress.py
          git diff --exit-code -- docs/planning/M1_PASSES.tsv
      - name: Combined production source and gate-probe regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf395_two_stage_joint_frontier_tdd.py tests/test_wf_gate_probe.py
