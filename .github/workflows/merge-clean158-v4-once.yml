name: Merge once — exact PR158 V4 verification
on:
  push:
    branches: [merge/verify-clean158-v4-20261102]
    paths: [.github/workflows/merge-clean158-v4-once.yml]
permissions:
  contents: read
jobs:
  verify-v4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Exact source code identity, no production delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f73e086691e4cae819b0f2917573fd8b44ada6ef"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-clean158-v4-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real V4, launcher contract, and V1-V4 shell syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_v4_concurrency_writer_isolation_v0114823.py tests/maintenance/test_root_launcher_relocation.py
          for n in 1 2 3 4; do bash -n "scripts/commands/run-validation-v${n}.sh"; done
          test ! -e tools/validate_v1_browser.py
          test ! -e tools/validate_v2_restart.py
          test ! -e tools/validate_v3_checkpoint_failure.py
          test ! -e tools/validate_v4_concurrency.py
          if command -v pwsh >/dev/null; then
            pwsh -NoProfile -Command '$errors = @(); 1..3 | ForEach-Object { $p = "scripts/commands/run-validation-v$_.ps1"; $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $p), [ref]$errors); if ($errors.Count -gt 0) { throw "PowerShell parse error in $p" } }'
          fi
