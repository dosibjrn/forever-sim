name: 2nd source resource guard RED GREEN one-shot
on:
  push:
    branches:
      - work/2nd-policy-resource-guard-regeneration
    paths:
      - tests/test_source_policy_resource_guard_regen.py
      - src/game/policy.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourced-regeneration:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/test_source_policy_resource_guard_regen.py tests/test_wf373_pack_policy.py tests/test_canonical_policy_ir_g15.py -k 'sourced_rogue_guard or apl_finishes_entire_three_target_pack or g15_generic_conditions'
