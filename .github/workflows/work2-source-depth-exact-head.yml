name: Work2 one-shot source gear depth regression

on:
  push:
    branches:
      - work/work2-source-depth-paid-frontier
    paths:
      - .github/workflows/work2-source-depth-exact-head.yml

permissions:
  contents: read

jobs:
  source-gear-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact pushed HEAD with source data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Source-legal gear depth, witness and cross-class regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py tests/test_source_wand_paid_slot_proposals.py
