name: One-shot exact-HEAD saved source replay exit contract
on:
  pull_request:
    branches: [main]
    paths: [tools/wf437_direct_budgeted_run.py]
permissions:
  contents: read
  actions: read
concurrency:
  group: one-shot-2nd-replay-exit-20261101
  cancel-in-progress: false
jobs:
  replay-exit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Real source 30s search, successful replay, and impossible pack negative control
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
          python -m tools.wf437_direct_budgeted_run --budget 30 --output /tmp/cold30.json
          python -m tools.wf437_direct_budgeted_run --replay-from /tmp/cold30.json --replay-row 0 --output /tmp/replay-good.json
          python - <<'PY'
          import json,subprocess,sys
          good=json.load(open('/tmp/replay-good.json'))
          assert good['validation']['complete_100mob_replays']==1
          saved=json.load(open('/tmp/cold30.json'))
          saved['pack_size']=100
          json.dump(saved,open('/tmp/cold30-100pack.json','w'))
          p=subprocess.run([sys.executable,'-m','tools.wf437_direct_budgeted_run',
              '--replay-from','/tmp/cold30-100pack.json','--replay-row','0',
              '--output','/tmp/replay-negative.json'],capture_output=True,text=True)
          print('NEGATIVE_REAL_100_PACK_EXIT',p.returncode, 'STDOUT',p.stdout[-2500:],
                'STDERR',p.stderr[-2500:],flush=True)
          assert p.returncode!=0, 'INCOMPLETE_REAL_REPLAY_REPORTED_SUCCESS'
          negative=json.load(open('/tmp/replay-negative.json'))
          assert negative['validation']['complete_100mob_replays']==0
          assert negative['validation']['rows'][0]['status']!='COMPLETE'
          print('SOURCE_REPLAY_EXIT_CONTRACT_PASS',negative['validation']['rows'][0],flush=True)
          PY
      - name: Locate independent 300s cold-search run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=8584924f04dd17e227761902484767d3eff34586&per_page=10" --jq '.workflow_runs[] | [.id,.status,.conclusion,.html_url] | @tsv' || true
