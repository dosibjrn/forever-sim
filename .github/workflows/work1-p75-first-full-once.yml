name: Work1 P7.5 first real full source-native 2D no-record receipt
on:
  push:
    branches: [work/work1-p75-first-full-20261103-0413]
    paths: [.github/workflows/work1-p75-first-full-once.yml]
# One bounded #7 Work1 diagnostic on tested #428 source. Never writes the official M1 ledger.
permissions:
  contents: read
  actions: read
jobs:
  full-p75-real:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Work1 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - name: Hydrate and validate selected Rust fork gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || exit 1
          ln -s "$engine" upstream
          test -f upstream/src/core/fight/world_bridge.rs
          echo "Selected Rust SHA=$actual"
      - name: Hydrate real source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Focused receipt and prior tests on exact producer
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/gates/test_wf_gate_p7_5_receipts.py tests/gates/test_wf_gate_p7_5_prior.py
      - name: Build checked-in native Rust fork
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Retrieve original accepted prior receipts from trusted M1 Actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          receipts="$RUNNER_TEMP/p75-accepted-priors.json"
          python tools/wf_gate_p7_5_receipts.py --repository "$GITHUB_REPOSITORY" \
            --class druid --level 60 --spec balance --out "$receipts"
          echo "FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS=$receipts" >> "$GITHUB_ENV"
          python - "$receipts" <<'PY'
          import json,sys
          receipts=json.load(open(sys.argv[1]))["receipts"]
          print("ORIGINAL_ACCEPTED_PRIORS", [r["gate"] for r in receipts])
          PY
      - name: Real independent 300s cold joint search and frozen 1000 stochastic live fights
        shell: bash
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_FULL_SOURCE_SEARCH: '1'
        run: |
          set -euo pipefail
          mkdir -p run-output
          printf 'producer_head=%s\npinned_rust=%s\nsource_request=docs/evidence/druid-l60-balance/p7.3/saved_728_request.json\nbackend=pinned_mythicsim_rust_gsim_2d\nM1_record=false\n' \
            "$(git rev-parse HEAD)" "$(git -C upstream rev-parse HEAD)" > run-output/provenance.txt
          set +e
          timeout 1500s python -u tools/wf_gate.py --class druid --level 60 \
            --spec balance --gate P7.5 --out run-output/P7.5.json > run-output/P7.5.log 2>&1
          rc=$?
          set -e
          echo "gate_exit_code=$rc" >> run-output/provenance.txt
          tail -n 12 run-output/P7.5.log
          [[ "$rc" == 0 || "$rc" == 1 ]] || exit "$rc"
          test -s run-output/P7.5.json
          python - <<'PY'
          import json
          r=json.load(open("run-output/P7.5.json"))
          d=r["results"][0]
          keys=("status","reasons","search_wall_s","source_legal_cold_candidates_paid",
                "frozen_stochastic_iterations","frozen_stochastic_native_dps",
                "frozen_stochastic_world_dps","dps_objective_required",
                "native_source_revision","source_request_raw_sha256")
          print(json.dumps({k:d.get(k) for k in keys}))
          print("REAL_P75_GATE",r["status"],"NO_M1_RECORD")
          PY
      - name: Upload exact full real gate receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work1-first-full-P75-${{ github.sha }}
          path: run-output/
          retention-days: 14
          if-no-files-found: warn
