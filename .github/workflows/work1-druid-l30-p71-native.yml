name: Work1 Druid L30 native P7.1 reference and gate (no M1)

on:
  push:
    branches:
      - work/work1-druid-l30-p71-native-fixture-20261105-1415
    paths:
      - .github/workflows/work1-druid-l30-p71-native.yml
      - integrations/mythicsim-rust/engine
      - integrations/mythicsim-rust/live_world_probe.py
      - tools/wf_p7_native_reference.py
      - tests/test_work1_p71_native_generated.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work1-druid-l30-reference-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-l30-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      FOREVER_MYTHICSIM_RUST_BIN: integrations/mythicsim-rust/engine/target/release/forever-engine
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout exact Work1 commit and pinned native engine
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1

      - name: Verify selected gitlink and Druid L30 source
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] || {
            echo "NATIVE_ENGINE_GITLINK_DIVERGED recorded=$recorded actual=$actual" >&2
            exit 1
          }
          test -s "$engine/fixtures/references/druid-l30-p71.request.json"
          echo "Forever HEAD: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected Rust SHA: $actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install focused Forever dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'

      - name: Verify selected L30 reference transport and refusal handling
        run: >-
          python -m pytest -q tests/test_work1_p71_native_generated.py
          tests/test_work1_p7_1_live_entry.py

      - name: Build the exact selected Rust executable
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --release --bin forever-engine

      - name: Query actual native Druid L30 options and prepare actor
        shell: bash
        run: |
          set -euo pipefail
          fixture=integrations/mythicsim-rust/engine/fixtures/references/druid-l30-p71.request.json
          "$FOREVER_MYTHICSIM_RUST_BIN" options --class druid --level 30 > druid-l30-options.json
          "$FOREVER_MYTHICSIM_RUST_BIN" prepare --request "$fixture" --actor-level 30 > druid-l30-prepared.json
          python - <<'PY'
          import json
          from pathlib import Path
          options = json.loads(Path("druid-l30-options.json").read_text())
          response = json.loads(Path("druid-l30-prepared.json").read_text())
          actor = response.get("player", {})
          assert actor.get("class") == "ClassDruid", response
          assert actor.get("level") == 30, response
          print("NATIVE_DRUID_L30_OPTIONS", json.dumps(options, sort_keys=True)[:1200])
          print("NATIVE_PREPARED_ACTOR", actor.get("class"), actor.get("level"))
          PY

      - name: Produce one real stochastic 1000-fight L30 reference and verify
        shell: bash
        run: |
          set -euo pipefail
          frozen=docs/evidence/native-references/druid-l30-unrestricted
          if [[ -e "$frozen/request.json" || -e "$frozen/reference.json" ]]; then
            test -s "$frozen/request.json" && test -s "$frozen/reference.json" || {
              echo "INCOMPLETE_FROZEN_L30_REFERENCE" >&2
              exit 1
            }
            echo "Reuse existing frozen L30 receipt; do not repay stochastic sample"
          else
            python tools/wf_p7_native_reference.py \
              --class druid --level 30 --spec unrestricted --verify \
              | tee druid-l30-reference-producer.json
          fi

      - name: Run actual Druid L30 P7.1 provider without M1 write
        shell: bash
        run: |
          set -euo pipefail
          python tools/wf_gate.py \
            --class druid --level 30 --spec unrestricted --gate P7.1 \
            --out druid-l30-p71-gate.json \
            | tee druid-l30-p71-gate-stdout.json
          cat druid-l30-p71-gate.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain native actor, stochastic reference and real gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-druid-l30-p71-no-record
          path: |
            druid-l30-options.json
            druid-l30-prepared.json
            docs/evidence/native-references/druid-l30-unrestricted/request.json
            docs/evidence/native-references/druid-l30-unrestricted/reference.json
            druid-l30-reference-producer.json
            druid-l30-p71-gate.json
            druid-l30-p71-gate-stdout.json
          if-no-files-found: warn
          retention-days: 30
