name: Work2 source-labeled 2D world target smoke (temporary)
on:
  pull_request:
    paths:
      - 'integrations/mythicsim-rust/live_two_world_pulls.py'
      - 'tests/test_work2_gsim_world_walk.py'
      - '.github/workflows/work2-world-target-hp-smoke.yml'
permissions:
  contents: read
jobs:
  source-hp-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact PR implementation and focused gsim 2D source-HP contract
        run: |
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_work2_gsim_world_walk.py
