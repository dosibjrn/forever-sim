name: Merge PR137 one-shot source P2 verification
on:
  push:
    branches: [merge/verify-p2-crit-137-20261102]
    paths: [.github/workflows/merge-verify-pr137-once.yml]
permissions:
  contents: read
jobs:
  p2-crit-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 3
          persist-credentials: false
      - name: Verify only workflow added over PR137 exact HEAD
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "9ec8e923e941f3cbc63b051dec7e483b8f167285"
          git diff --name-only HEAD~2 HEAD | grep -Fx .github/workflows/merge-verify-pr137-once.yml
          test "$(git diff --name-only HEAD~2 HEAD | wc -l)" -eq 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute real-source P2 regression and honest result
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf_prio_p2_legal_pair.py tests/test_wf_prio_p2_exact_rank_fullpoint.py
          python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p2_live import run_live
          r=run_live(Path.cwd(),'druid',60,spec='balance')
          print('SOURCE_P2',r['status'],r['pass_count'],r['fail_count'],r['unresolved_count'],r['unreachable_count'],r['source_rank_total'])
          assert sum(r[k] for k in ('pass_count','fail_count','unresolved_count','unreachable_count'))==r['source_rank_total']
          PY
