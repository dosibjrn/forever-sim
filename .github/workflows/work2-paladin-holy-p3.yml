name: Work2 — Paladin Holy L60 selected-native HPS P3 (no record)

on:
  pull_request:
    paths:
      - .github/workflows/work2-paladin-holy-p3.yml
      - integrations/mythicsim-rust/native_p3_equipped.py
      - tools/wf_gate_p3_live.py
      - tests/test_work2_paladin_holy_native_p3.py

permissions:
  contents: read

concurrency:
  group: work2-paladin-holy-p3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  holy-native-p3:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR HEAD and selected Rust gitlink
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          lfs: true
          persist-credentials: false

      - name: Verify source and selected-engine identity
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          selected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$selected" && "$actual" == "$selected" ]]
          [[ "$(git -C "$engine" remote get-url origin)" == *dosibjrn/mythicsim-forever-engine* ]]
          echo "FOREVER_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "SELECTED_RUST_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Focused Forever HPS, identity, routing, refusal regressions
        run: |
          python -m pip install --disable-pip-version-check "pytest==8.3.5" "beautifulsoup4==4.13.4"
          python -m pytest -q             tests/test_work2_paladin_holy_native_p3.py             tests/test_work2_paladin_protection_native_p3.py             tests/test_work2_paladin_retribution_native_p3.py             integrations/mythicsim-rust/tests/test_native_p3_equipped.py

      - name: Build exact selected Rust CLI
        working-directory: integrations/mythicsim-rust/engine
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --locked --bin forever-engine

      - name: One genuine Holy HPS paid P3, no M1 write
        shell: bash
        env:
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/paladin-holy-p3"
          mkdir -p "$dir"
          source="integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/holy-paladin-healing.request.json"
          sha256sum "$source" | tee "$dir/source-sha256.txt"
          git -C integrations/mythicsim-rust/engine rev-parse HEAD | tee "$dir/native-engine-sha.txt"
          git rev-parse HEAD | tee "$dir/forever-head.txt"
          report="$dir/paladin-holy-l60-p3.json"
          rc=0
          timeout 300s python tools/wf_gate.py --class paladin --level 60             --spec holy --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path

          report, rc = Path(sys.argv[1]), int(sys.argv[2])
          if not report.exists():
              print("HOLY_L60_NATIVE_P3_NO_RECORD NO_REPORT exit", rc, flush=True)
              raise SystemExit(1)
          gate = json.loads(report.read_text(encoding="utf-8"))
          assert (gate["class"], gate["level"], gate["spec"], gate["gate"]) == (
              "paladin", 60, "holy", "P3"), gate
          assert gate["status"] in ("PASS", "FAIL", "BLOCKED"), gate
          assert rc == (0 if gate["status"] == "PASS" else 1), (rc, gate)
          row = gate["results"][0]
          receipt = row.get("native_equipped_paid_receipt") or {}
          print("HOLY_L60_NATIVE_P3_NO_RECORD", json.dumps({
              "gate": gate["status"], "reasons": row.get("reasons"),
              "item_options_source": row.get("item_options_source"),
              "source_revision": row.get("source_context_sha256"),
              "native_actor": receipt.get("native_prepared_actor"),
              "objective": (receipt.get("comparison") or {}).get("objective"),
              "occupied": row.get("source_occupied_slots"),
              "native_paid_attempts": row.get("native_equipped_paid_attempts"),
              "baseline": (receipt.get("evaluations") or [None])[0],
              "alternatives": receipt.get("native_slot_evaluations"),
          }, default=str), flush=True)
          assert gate["status"] == "PASS", gate
          assert (receipt.get("comparison") or {}).get("objective") == "HPS", receipt
          assert receipt.get("native_prepared_actor", {}).get("actor_class") == "ClassPaladin"
          assert receipt.get("native_prepared_actor", {}).get("actor_level") == 60
          assert row.get("real_source_search_evaluated") == 0
          PY

      - name: Preserve exact Holy native gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paladin-holy-l60-native-hps-p3-no-record
          path: ${{ runner.temp }}/paladin-holy-p3/
          if-no-files-found: ignore

          retention-days: 30