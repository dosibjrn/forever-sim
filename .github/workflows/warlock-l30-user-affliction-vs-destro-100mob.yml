name: L30 exact user Affliction vs Destro native 100-mob head-to-head

on:
  push:
    branches: [work/warlock-l30-user-affliction-vs-destro-100mob-20261106]
    paths:
      - tools/wf_warlock_l30_direct_affliction_comparison.py
      - .github/workflows/warlock-l30-user-affliction-vs-destro-100mob.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l30-user-affliction-native-100mob:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout direct 100-mob comparator
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout level-correct Rust pet engine
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: ae9be46d89d4c2cfc5d3c5c5d5b102725216a81a
          path: engine
      - name: Verify exact source identity and Python comparator
        run: |
          test "$(git -C engine rev-parse HEAD)" = "ae9be46d89d4c2cfc5d3c5c5d5b102725216a81a"
          python3 -m py_compile project/tools/wf_warlock_native_optimizer.py project/tools/wf_warlock_l30_direct_affliction_comparison.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install world bridge dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Build exact Rust without new gameplay model
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Direct actual 100-mob comparisons, no 30s DPS finalist cutoff
        working-directory: project
        run: |
          python3 -u tools/wf_warlock_l30_direct_affliction_comparison.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --engine-tools ../engine/tools \
            --out ../warlock-l30-user-affliction-100mob
      - name: Preserve source requests, actual kill counts and measured elapsed seconds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-user-affliction-vs-destro-native-100mob
          path: warlock-l30-user-affliction-100mob/
          if-no-files-found: warn
          retention-days: 14
