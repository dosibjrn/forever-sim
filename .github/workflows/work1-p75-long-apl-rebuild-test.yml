name: Work1 P7.5 long APL rebuild contract

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'integrations/mythicsim-rust/apl_mutation.py'
      - 'integrations/mythicsim-rust/p75_joint_search.py'
      - 'integrations/mythicsim-rust/tests/test_p75_rotation_rebuild_length_bias.py'
      - '.github/workflows/work1-p75-long-apl-rebuild-test.yml'

permissions:
  contents: read

concurrency:
  group: work1-p75-long-apl-contract-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  contract:
    if: github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.4.1'

      - name: Verify long rotation rebuild contract and preserve generic cold APL reachability
        run: |
          python -m pytest -q \
            integrations/mythicsim-rust/tests/test_p75_rotation_rebuild_length_bias.py \
            integrations/mythicsim-rust/tests/test_apl_mutation_length_reachability.py
