name: Work1 one-shot independent P7 APL cold search regression

on:
  push:
    branches: [work/work1-p7-independent-rediscovery-20261102-2001]
    paths: [.github/workflows/work1-p7-cold-independent-once.yml]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact producer HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run actual P7 source cold generation and gate regression suite
        shell: bash
        run: |
          set -euo pipefail
          echo "Exact HEAD: $(git rev-parse HEAD)"
          python -m pip install --disable-pip-version-check pytest
          python -m compileall -q integrations/mythicsim-rust/apl_mutation.py tools/wf_gate_p7_2_live.py tools/wf_gate_p7_3_live.py tools/wf_gate_p7_5_live.py
          python -m pytest -q tests/gates/test_p7_independent_cold_rediscovery.py tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py tests/test_wf_gate_p7_5_live.py tests/gates/test_p7_reference_floors.py
