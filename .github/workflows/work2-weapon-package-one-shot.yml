name: Work2 one-shot source weapon package RED GREEN
on:
  push:
    branches:
      - work/work2-weapon-package-paid-prefix-20261102
permissions:
  contents: read
jobs:
  source-paid-weapon:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install focused test requirements
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Prove source-backed RED on original production implementation
        shell: bash
        run: |
          set -euo pipefail
          cp src/v2/source_bounded_joint_frontier.py /tmp/work2_green.py
          git fetch --depth=1 origin main
          git show FETCH_HEAD:src/v2/source_bounded_joint_frontier.py > src/v2/source_bounded_joint_frontier.py
          set +e
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py -k source_legal_atomic_weapon_package_is_paid_before_second_slot_item > /tmp/work2_red.log 2>&1
          status=$?
          set -e
          cat /tmp/work2_red.log
          if [[ "$status" -eq 0 ]]; then
            echo 'RED control unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'AssertionError' /tmp/work2_red.log || {
            echo 'RED control failed for unrelated reason' >&2
            exit 1
          }
          cp /tmp/work2_green.py src/v2/source_bounded_joint_frontier.py
      - name: GREEN source-backed atomic package and source-slot regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py -k 'atomic_weapon_package or source_legal_slots_get_early_paid_witnesses or deeper_source_frontier_cannot_resume_old_paid_search_journal or compound_apl_gets_a_paid_coordinate_before_second_item_in_same_slot'
