name: Warlock L30 Mobalytics vs Icy Veins Decisions food-water 100mob

on:
  push:
    branches: [work/warlock-l30-mobalytics-vs-icy-100mob-20261108]
    paths:
      - tools/wf_warlock_l30_guide_compare.py
      - .github/workflows/warlock-l30-guide-compare.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  head-to-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        guide: [icy, mobalytics]
    steps:
      - name: Checkout guide comparison
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout exact native Rust with L30 warlock and real Shoot
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: work/decisions-food-water-latest-warlock-20261108
          path: engine
      - name: Verify source and scripts
        run: |
          set -euo pipefail
          test "$(git -C engine branch --show-current)" = "work/decisions-food-water-latest-warlock-20261108"
          python3 -m py_compile project/tools/wf_warlock_l30_guide_compare.py
          python3 -m py_compile project/tools/wf_warlock_native_optimizer.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native gsim bridge dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Build canonical Rust engine
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Native exact guide comparison on 100 distinct world mobs, two APLs
        working-directory: project
        run: |
          python3 -u tools/wf_warlock_l30_guide_compare.py \
            --binary ../engine/target/debug/forever-engine \
            --source tests/fixtures/warlock-l20-troll-best-paid.request.json \
            --engine-tools ../project/tools \
            --out ../guide-comparison-${{ matrix.guide }} \
            --guide ${{ matrix.guide }}
      - name: Save native results, source requests, full receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-100mob-guide-${{ matrix.guide }}
          path: guide-comparison-${{ matrix.guide }}/
          if-no-files-found: warn
          retention-days: 14
