name: Work1 P7.4 winner receipt focused check (temporary)
on:
  push:
    branches:
      - work/work1-p74-winner-receipt-20261102
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.4.2
      - run: python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_class_cli.py::test_p74_cli_preserves_frozen_paid_gear_and_search_metadata_on_fail
      - run: python -m compileall -q tools/wf_gate_p7_4_live.py tools/wf_gate.py tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_class_cli.py
