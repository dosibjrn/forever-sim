name: Live gsim 2D to pinned native Go world-effect ACK (NOT P7)
# Migration safety: original pull_request triggers intentionally withheld until public baseline and runner are verified.
on:
  workflow_dispatch:
  # One controlled native build on this implementation branch; this workflow
  # file is the sole path trigger. Other source/doc pushes cannot start it.
  push:
    branches:
      - work/wf28-native-world-health-feedback-20261101
      - work/first-native-source-long-horizon-20261102
      - work/first-native-druid-full-duration-20261102
      - work/first-native-source-target-health-20261102
      - work/first-native-source-single-target-20261102
      - work/first-native-terminal-boundary-20261102
      - work/first-native-world-dps-parity-20261102
      - work/first-native-source-facing-20261102
      - work/first-native-feral-shred-facing-20261102
      - work/first-native-source-p71-stochastic-20261102
    paths:
      - .github/workflows/wf-gsim-go-native-range-loop.yml
      - tools/wf_gsim_go_live_range_probe.py
      - src/game/runtime/simulator.py
      - tests/integration/backend/test_wf_gsim_go_world_range_feed.py
      - integrations/mythicsim-go/world_boundary/core/world_boundary.go
      - integrations/mythicsim-go/world_boundary/ingress/main.go

permissions:
  contents: read
jobs:
  native-go-range-loop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python source-backed test prerequisites
        run: python -m pip install --disable-pip-version-check pytest beautifulsoup4
      - name: Exact-HEAD native world-ACK Python source regressions
        run: |
          cd project
          python -m compileall -q \
            tests/integration/backend/test_wf_go_native_world_damage_ack.py \
            tests/integration/backend/test_wf_go_paired_native_spell_probe.py \
            src/game/runtime/go_native_world_damage_ack.py \
            tools/wf_gsim_go_live_range_probe.py
          python -m pytest -q \
            tests/integration/backend/test_wf_gsim_go_world_range_feed.py \
            tests/integration/backend/test_wf_native_spell_observations.py \
            tests/integration/backend/test_wf_native_target_spell_observations.py \
            tests/integration/backend/test_wf_go_native_world_damage_ack.py \
            tests/integration/backend/test_wf_go_paired_native_spell_probe.py \
            tests/integration/backend/test_wf28_pinned_native_damage_hook.py \
            tests/integration/backend/test_wf_druid_l60_native_step_protocol.py
      - name: Install Go proto and verify exact upstream pin
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
      - name: Standalone ingress validator (before native build)
        working-directory: project/integrations/mythicsim-go/world_boundary/ingress
        run: |
          GO111MODULE=off go test -count=1 -v feed.go feed_test.go world_damage_ack.go world_damage_ack_test.go
          GO111MODULE=off go vet feed.go feed_test.go world_damage_ack.go world_damage_ack_test.go
      - name: Build real pinned native Go world-ingress binary
        run: |
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go test ./sim/core -run 'Test(WorldTick|WorldDistance|WorldBoundary|NextWorld|NativeSpellCounters|NativeTargetSpells|NativeWorldDamageJournal)' -count=1 -v
          # Upstream database_load.go is guarded by //go:build with_db.
          # Without this tag, the native request panics on source item 12640.
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Couple moving real gsim 2D with native source-event world ACK (NOT P7)
        run: |
          mkdir -p evidence
          cd project
          python tools/wf_gsim_go_live_range_probe.py \
            --binary ../gsim-go-world-ingress \
            --request ../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json \
            --out ../evidence/gsim-go-live-range-only.json
          cd ..
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/gsim-go-live-range-only.json'))
          assert r['status']=='NATIVE_GO_WORLD_DAMAGE_ACK_NOT_P7'
          assert r['native_process_reused'] and r['gsim_runtime_real']
          assert len(r['observations'])==20
          assert r['world_target_count']==2  # Legacy two-enemy moving diagnostic
          assert r['observations'][0]['world_tick']['distance_yards']==20
          assert 14 < r['observations'][10]['world_tick']['distance_yards'] < 16
          assert all(x['world_tick']['distance_yards']==x['native_range_receipt']['applied_yards'] for x in r['observations'])
          assert len({x['world_tick']['world_sha256'] for x in r['observations']}) > 1
          assert all(isinstance(x['native_spell_counters'],list) for x in r['observations'])
          assert r['native_spell_counters_observed']
          assert r['native_target_spell_counters_observed']
          assert all(isinstance(x['native_target_spell_counters'],list) for x in r['observations'])
          assert all('gsim_applied_world_ack' in x and 'native_world_ack_confirmation' in x for x in r['observations'])
          assert r['native_spell_action_ack'] == any(bool(x['gsim_applied_world_ack']['applied_event_ids']) for x in r['observations'])
          assert not r['checkpoint_certified']
          PY
      - name: Paired near/far genuine native spell delta and gsim world ACK (NOT Druid P7)
        run: |
          cd project
          python tools/wf_gsim_go_paired_native_spell_probe.py \
            --binary ../gsim-go-world-ingress \
            --request ../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json \
            --ticks 60 --require-native-spell-delta \
            --out ../evidence/gsim-go-paired-spell-metrics-not-ack.json
      - name: Run saved Druid L60 Balance source request through real native/gsim ACK (NOT P7)
        run: |
          cd project
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('docs/evidence/druid-l60-balance/p7.3/frozen_winner_request.json')
          r=json.loads(p.read_text())
          players=[pl for party in r['raid']['parties'] for pl in party['players']]
          assert len(players)==1, 'DRUID_REFERENCE_MULTI_PLAYER'
          assert players[0]['class']=='ClassDruid' and 'balanceDruid' in players[0], 'NOT_BALANCE_DRUID_REFERENCE'
          assert len(r['encounter']['targets'])==1 and r['encounter']['targets'][0]['level']==63, 'NOT_SAVED_L63_ENCOUNTER'
          assert int(r['simOptions']['randomSeed'])>0, 'ZERO_SOURCE_RANDOM_SEED'
          print('SAVED_DRUID_L60_BALANCE_REFERENCE_ACCEPTED',p)
          PY
          python tools/wf_gsim_go_paired_native_spell_probe.py \
            --binary ../gsim-go-world-ingress \
            --request docs/evidence/druid-l60-balance/p7.3/frozen_winner_request.json \
            --ticks 60 --require-native-spell-delta \
            --out ../evidence/gsim-go-druid-l60-balance-saved-p73-paired.json
          cd ..
          python3 - <<'PY'
          import json
          r=json.load(open('evidence/gsim-go-druid-l60-balance-saved-p73-paired.json'))
          assert r['status']=='NATIVE_SPELL_DELTA_AND_WORLD_ACK_NOT_DRUID_P7'
          assert r['native_spell_counter_delta_observed'] and r['native_spell_action_ack']
          assert not r['checkpoint_certified'] and not r['druid_l60_balance_proven']
          for mode in ('near','far'):
              scenario=r['scenarios'][mode]
              assert len(scenario['observations'])==60
              assert scenario['native_process_reused'] and scenario['gsim_runtime_real']
              assert all(row['native_world_ack_confirmation']['ack_id'] for row in scenario['observations'])
          print('REAL_SAVED_DRUID_SOURCE_PAIRED_CAUSAL_ACK_PASS_NOT_P7')
          PY


      - name: Reproduce exact saved 728 reference with unchanged source Go and live gsim world (NOT P7)
        run: |
          cd project
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import PINNED_GO_REVISION, run
          from src.game.runtime.go_world_range_feed import GoWorldRangeError
          binary=Path("../gsim-go-world-ingress").resolve()
          request=Path("docs/evidence/druid-l60-balance/p7.3/saved_728_request.json").resolve()
          source=json.loads(request.read_text())
          witness=json.loads(Path("docs/evidence/wf633/WF633_VALIDATION.json").read_text())
          assert witness["iterations"]==source["simOptions"]["iterations"]==10000
          assert int(source["simOptions"]["randomSeed"])==1179706472
          assert len(source["encounter"]["targets"])==1 and source["encounter"]["targets"][0]["level"]==63
          players=[p for party in source["raid"]["parties"] for p in party["players"]]
          assert len(players)==1 and players[0]["class"]=="ClassDruid" and "balanceDruid" in players[0]
          assert players[0]["talentsString"]=="5532220115501351--505"
          assert source["raid"]["debuffs"]["curseOfElements"] and source["raid"]["buffs"]["arcaneBrilliance"]
          assert len(players[0]["equipment"]["items"])==16 and len(players[0]["rotation"]["priorityList"])==10
          assert source["encounter"]["duration"]==120 and source["encounter"]["durationVariation"]==15
          # Same file and hash must be passed unchanged to both genuine pinned-Go
          # modes; native source mode keeps all 10,000 requested iterations.
          def native(*args):
              return json.loads(subprocess.check_output([
                  str(binary),"--request",str(request),
                  "--source-revision",PINNED_GO_REVISION,*args],text=True,timeout=240))
          one=native("--native-only-single-fight")
          stochastic=native("--native-source-replay")
          hybrid=run(binary,request,ticks=1500,
                     target_spawn_yards=players[0]["distanceFromTarget"],
                     enemy_move_speed_yards_s=0.,source_target_health=True,
                     timeout_s=30.)
          sourcehash=hashlib.sha256(request.read_bytes()).hexdigest()
          assert all(x["native_request_sha256"]==sourcehash for x in (one,stochastic,hybrid))
          assert all(x["native_source_revision"]==PINNED_GO_REVISION for x in (one,stochastic,hybrid))
          assert one["iterations"]==1 and stochastic["iterations"]==10000
          assert one["source_random_seed"]==stochastic["source_random_seed"]==int(source["simOptions"]["randomSeed"])
          assert stochastic["native_dps"]>0 and one["native_dps"]>0
          assert hybrid["native_encounter_end_reached"] and hybrid["world_target_count"]==1
          assert hybrid["native_spell_action_ack"] and not hybrid["checkpoint_certified"]
          assert hybrid["source_sampled_duration_s"]==one["native_duration_s"]
          assert abs(one["native_dps"]-hybrid["raw_native_dps"])<1e-6
          assert abs(one["native_dps"]-hybrid["effective_gsim_world_dps"])<1e-6
          assert all(row["world_tick"]["facing_applied"] and
                     row["world_tick"]["in_front_of_target"] is players[0].get("inFrontOfTarget",False)
                     for row in hybrid["observations"])
          # Backend mismatch is diagnostic, not a coerced gate PASS. Native Go
          # can be below the saved Rust reference; keep that result visible.
          delta=stochastic["native_dps"]-witness["reference_dps"]
          print("SOURCE_P71_GO_10000_NATIVE_DPS",stochastic["native_dps"],
                "RUST_SAVED_REFERENCE_DPS",witness["reference_dps"],"DELTA",delta,
                "P71_2_GO_THRESHOLD", "MEETS" if delta>=0 else "BELOW",flush=True)
          print("SOURCE_P71_GO_SAME_SEED_NATIVE_VS_WORLD_DPS",
                one["native_dps"],hybrid["raw_native_dps"],hybrid["effective_gsim_world_dps"],
                one["native_duration_s"],flush=True)
          print("SOURCE_P71_3_STOCHASTIC_GSIM_UNTESTED_NOT_P7",flush=True)
          PY
      - name: Same saved Feral source Shred front/back native divergence (NOT P7)
        run: |
          cd project
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          request = Path("docs/evidence/druid-l60-feral/p7.1/saved_811_request.json")
          source = json.loads(request.read_text())
          players = [p for party in source["raid"]["parties"] for p in party["players"]]
          assert len(players)==1 and players[0]["class"]=="ClassDruid"
          assert "feralCatDruid" in players[0] and not players[0]["feralCatDruid"]["options"].get("cannotShredTarget",False)
          assert len(source["encounter"]["targets"])==1 and source["encounter"]["targets"][0]["level"]==63
          apl = players[0]["rotation"]["priorityList"]
          assert any(a.get("action",{}).get("castSpell",{}).get("spellId",{}).get("spellId")==9830 for a in apl)
          binary = Path("../gsim-go-world-ingress")
          # Identical unmodified 811-DPS source request, seed, target, gear,
          # talents and APL. Only actual 2D gsim target heading is perturbed.
          back = run(binary,request,ticks=200,target_spawn_yards=3.,
                     enemy_move_speed_yards_s=0.,source_target_health=True,
                     world_facing_override=False,timeout_s=30.)
          front = run(binary,request,ticks=200,target_spawn_yards=3.,
                      enemy_move_speed_yards_s=0.,source_target_health=True,
                      world_facing_override=True,timeout_s=30.)
          def casts(result, spell_id):
              return sum(delta["casts"] for row in result["observations"]
                  for delta in row["native_spell_counter_deltas"]
                  if delta["action_id"] == f"{{SpellID: {spell_id}}}")
          for result, expected in ((back,False),(front,True)):
              assert result["native_process_reused"] and result["gsim_runtime_real"]
              assert result["native_spell_action_ack"] and not result["checkpoint_certified"]
              assert all(row["world_tick"]["facing_applied"] and
                         row["world_tick"]["in_front_of_target"] is expected and
                         row["native_range_receipt"]["facing_applied"] and
                         row["native_range_receipt"]["in_front_of_target"] is expected
                         for row in result["observations"])
              assert all(row["native_world_ack_confirmation"]["native_world_health_applied"]
                         for row in result["observations"])
          assert front["native_request_sha256"] == back["native_request_sha256"]
          assert front["native_binary_sha256"] == back["native_binary_sha256"]
          assert front["native_encounter_end_ns"] == back["native_encounter_end_ns"]
          back_shred,front_shred=casts(back,9830),casts(front,9830)
          front_claw=casts(front,9850)
          assert back_shred>0 and front_shred==0 and front_claw>0, (back_shred,front_shred,front_claw)
          print("REAL_SOURCE_FERAL_SHRED_POSITIONAL_NATIVE_DIVERGENCE_NOT_P7",
                "back_shred",back_shred,"front_shred",front_shred,
                "front_claw",front_claw)
          PY
      - name: Prove gsim HP changes the next pinned Go execute decision (near/far)
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path("../gsim-go-world-ingress")
          request=Path("../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json")
          near=run(binary,request,ticks=10,target_spawn_yards=3.,target_health=5000.)
          far=run(binary,request,ticks=10,target_spawn_yards=80.,target_health=5000.)
          a,b=near["observations"],far["observations"]
          near_effects=sum(len(row["native_damage_events"]) for row in a)
          far_effects=sum(len(row["native_damage_events"]) for row in b)
          assert near_effects>0 and far_effects==0,(near_effects,far_effects)
          i=next(i for i,row in enumerate(a) if row["native_damage_events"])
          assert i+1<len(a),"NO_NEXT_NATIVE_DECISION_BOUNDARY"
          near_ack=a[i]["native_world_ack_confirmation"]
          assert near_ack["native_world_health_applied"]
          assert near_ack["native_remaining_health_fraction"]<1
          assert a[i+1]["native_world_health_feedback_active_at_boundary"]
          assert a[i+1]["native_execute_phase_at_boundary"]<b[i+1]["native_execute_phase_at_boundary"]
          assert a[i+1]["native_health_fraction_at_boundary"]<b[i+1]["native_health_fraction_at_boundary"]
          print("REAL_WORLD_HP_CHANGED_NEXT_NATIVE_EXECUTE_PHASE",near_effects,far_effects,
                a[i+1]["native_execute_phase_at_boundary"],b[i+1]["native_execute_phase_at_boundary"])
          PY
      - name: Real saved Druid source 120-second continuous native-world encounter (NOT P7)
        run: |
          cd project
          python3 - <<'PY'
          import json
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path("../gsim-go-world-ingress")
          request=Path("docs/evidence/druid-l60-balance/p7.3/frozen_winner_request.json")
          source=json.loads(request.read_text())
          player=source["raid"]["parties"][0]["players"][0]
          assert player["class"]=="ClassDruid" and "balanceDruid" in player
          assert source["encounter"]["duration"]==120
          assert source["encounter"]["targets"][0]["level"]==63
          distance=player["distanceFromTarget"]
          source_health=source["encounter"]["targets"][0]["stats"][32]
          assert source_health==127393,source_health
          # Real gsim 2D target remains stationary at the source caster range.
          # This does not yet prove source target stats, facing/CC or P7.
          result=run(binary,request,ticks=1350,target_spawn_yards=distance,
                     enemy_move_speed_yards_s=0.,timeout_s=30.,source_target_health=True)
          observations=result["observations"]
          end_ns=result["native_encounter_end_ns"]
          assert 105_000_000_000 <= end_ns <= 135_000_000_000,end_ns
          assert result["native_encounter_end_reached"]
          assert result["world_target_count"]==len(source["encounter"]["targets"])==1
          assert 1050 <= len(observations) <= 1350,len(observations)
          last_ns=observations[-1]["world_tick"]["native_clock_ns"]
          assert 0 < end_ns-last_ns < 1_000_000,(end_ns,last_ns)  # Real terminal native/world tick
          assert all(row["world_tick"]["distance_yards"]==distance for row in observations)
          assert all(row["world_tick"]["facing_applied"] for row in observations)
          assert all(row["world_tick"]["in_front_of_target"] is player.get("inFrontOfTarget",False)
                     for row in observations)
          assert all(row["native_range_receipt"]["facing_applied"] for row in observations)
          assert all(row["native_range_receipt"]["in_front_of_target"] is player.get("inFrontOfTarget",False)
                     for row in observations)
          assert all(row["world_tick"]["world_target_max_health"]==source_health for row in observations)
          assert observations[0]["world_tick"]["world_target_health_before"]==source_health
          assert all(row["native_actor_state"]["native_clock_ns"]==row["world_tick"]["native_clock_ns"]
                     for row in observations)
          assert result["native_spell_action_ack"]
          # RED on old production: no ACK-derived full-duration DPS existed.
          # This is real source-native damage actually applied by gsim, not
          # a native-only replay, mock spell counter or invented DPS number.
          assert result["source_sampled_duration_s"]==end_ns/1e9
          assert result["raw_native_dps"]>0
          assert result["effective_gsim_world_dps"]>0
          assert result["effective_gsim_world_damage"]<=result["raw_native_damage"]+1e-6
          ack_damage=sum(row["gsim_applied_world_ack"]["applied_native_damage"] for row in observations)
          assert abs(result["raw_native_damage"]-ack_damage)<1e-6
          from subprocess import check_output
          from tools.wf_gsim_go_live_range_probe import PINNED_GO_REVISION
          baseline=json.loads(check_output([
              str(binary.resolve()),"--native-only-single-fight",
              "--request",str(request.resolve()),
              "--source-revision",PINNED_GO_REVISION],text=True))
          assert baseline["type"]=="native_go_single_fight_baseline_not_p7"
          assert baseline["native_request_sha256"]==result["native_request_sha256"]
          assert baseline["native_source_revision"]==result["native_source_revision"]
          assert baseline["iterations"]==1 and not baseline["checkpoint_certified"]
          assert baseline["native_dps"]>0 and baseline["native_duration_s"]>0
          assert baseline["source_random_seed"]==int(source["simOptions"]["randomSeed"])
          # Actual same-seed source Druid: native-only vs real 2D+native
          # must agree numerically in this stationary/no-CC scenario.
          # This is a bounded deterministic regression, NOT stochastic P7.
          assert abs(baseline["native_duration_s"]-result["source_sampled_duration_s"])<1e-9
          assert abs(baseline["native_dps"]-result["raw_native_dps"])<1e-6
          assert abs(baseline["native_dps"]-result["effective_gsim_world_dps"])<1e-6
          print("REAL_PINNED_GO_SINGLE_FIGHT_NATIVE_VS_GSIM_DPS_NOT_P7",
                baseline["native_dps"],result["raw_native_dps"],
                result["effective_gsim_world_dps"],baseline["native_duration_s"],
                result["source_sampled_duration_s"])
          assert result["native_process_reused"] and result["gsim_runtime_real"]
          assert all(row["native_world_ack_confirmation"]["native_world_health_applied"]
                     for row in observations)
          assert all(row["native_world_ack_confirmation"]["native_process_id"]==result["native_process_id"]
                     for row in observations)
          print("REAL_SAVED_DRUID_SOURCE_HEALTH_AND_SAMPLED_END_ACK_PASS_NOT_P7",
                len(observations),end_ns,last_ns,source_health)
          try:
              run(binary,request,ticks=1501)
          except ValueError as exc:
              assert "INVALID_PROBE_LIMITS" in str(exc)
          else:
              raise AssertionError("UNBOUNDED_NATIVE_WORLD_PROBE")
          PY
      - name: Real pinned Go native overkill kills the actual gsim target and closes session
        run: |
          cd project
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          result=run(Path("../gsim-go-world-ingress"),
              Path("../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json"),
              ticks=60,target_spawn_yards=3.,target_health=100.)
          observations=result["observations"]
          assert 0<len(observations)<60,len(observations)
          last=observations[-1]
          raw=sum(e["damage"] for e in last["native_damage_events"])
          ack=last["gsim_applied_world_ack"]
          assert raw>100,raw
          assert ack["world_target_health_before"]==100
          assert ack["world_target_health_after"]==0
          assert ack["applied_native_damage"]==raw
          assert last["native_world_ack_confirmation"]["native_world_health_applied"]
          print("REAL_NATIVE_OVERKILL_GSIM_TARGET_KILLED_AND_ACKED",raw,len(observations))
          PY
      - name: Reject forged gsim world ACK in the real native Go process
        run: |
          cd project
          python tools/wf_gsim_go_live_range_probe.py \
            --binary ../gsim-go-world-ingress \
            --request ../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json \
            --out ../evidence/invalid-ack-unused.json \
