name: Work2 — Native Rust joint 28-profile stage-5 sweep

on:
  workflow_dispatch:
    inputs:
      retain_full_evidence:
        description: 'Opt in to uploading the entire ~20-60 MB native request/response directory'
        type: boolean
        default: false
        required: false
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/native-joint-28-sweep.yml
      - integrations/mythicsim-rust/native_joint_28_sweep.py
      - integrations/mythicsim-rust/native_joint_two_class.py
      - integrations/mythicsim-rust/native_source_donors.py
      - integrations/mythicsim-rust/native_matrix.py
      - integrations/mythicsim-rust/native_joint_composition.py
      - integrations/mythicsim-rust/native_gear_adapter.py
      - integrations/mythicsim-rust/native_l60_matrix.py
      - integrations/mythicsim-rust/native_executor.py
      - integrations/mythicsim-rust/p73_talent_search_v2.py
      - integrations/mythicsim-rust/apl_mutation.py
      - integrations/mythicsim-rust/port_native_typed_rng.py
      - integrations/mythicsim-rust/tests/**
      - config/validation/checkpoint_148.json
      - integrations/mythicsim-rust/engine
      - .gitmodules
  push:
    branches:
      - work/work2-native-joint-28-sweep-20261103
    paths:
      - .github/workflows/native-joint-28-sweep.yml
      - integrations/mythicsim-rust/native_joint_28_sweep.py
      - integrations/mythicsim-rust/native_joint_two_class.py
      - integrations/mythicsim-rust/native_source_donors.py
      - integrations/mythicsim-rust/native_matrix.py
      - integrations/mythicsim-rust/native_joint_composition.py
      - integrations/mythicsim-rust/native_gear_adapter.py
      - integrations/mythicsim-rust/native_l60_matrix.py
      - integrations/mythicsim-rust/p73_talent_search_v2.py
      - integrations/mythicsim-rust/apl_mutation.py
      - integrations/mythicsim-rust/port_native_typed_rng.py
      - integrations/mythicsim-rust/tests/**
      - config/validation/checkpoint_148.json
      - integrations/mythicsim-rust/engine
      - .gitmodules

permissions:
  contents: read

concurrency:
  group: native-joint-28-stage5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-joint-stage5:
    name: Balanced native JOINT 5s × 28 (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout repository and exact Rust submodule pin
        uses: actions/checkout@v4
        with:
          path: project
          submodules: true

      - name: Verify exact public Rust fork gitlink
        run: |
          set -euo pipefail
          engine=project/integrations/mythicsim-rust/engine
          recorded="$(git -C project ls-tree HEAD -- integrations/mythicsim-rust/engine | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual" >&2
            exit 1
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || {
            echo "WRONG_RUST_FORK_REMOTE" >&2
            exit 1
          }
          echo "Pinned engine SHA: $actual"
          echo "Repository SHA: $(git -C project rev-parse HEAD)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply typed RNG port to the exact pinned engine
        run: |
          set -euo pipefail
          # The selected Rust engine already owns typed RNG. Old patching by
          # source-text substitution is only for historical pins without it.
          if ! grep -Fq 'pub enum RngMode' "project/integrations/mythicsim-rust/engine/src/core/rng.rs"; then
          python project/integrations/mythicsim-rust/port_native_typed_rng.py project/integrations/mythicsim-rust/engine
          fi
          python project/integrations/mythicsim-rust/wf659_rng_boolean_audit.py project/integrations/mythicsim-rust/engine/src
          grep -Fq 'pub enum RngMode' project/integrations/mythicsim-rust/engine/src/core/rng.rs
          if grep -Fq 'WOWSIM_RNG_MODE' project/integrations/mythicsim-rust/engine/src/core/rng.rs; then
            echo "ENVIRONMENT_SELECTED_RNG_REMAINS_IN_SELECTED_RUST" >&2
            exit 1
          fi

      - name: Verify typed RNG and deterministic balanced backend
        working-directory: project/integrations/mythicsim-rust/engine
        run: |
          cargo test --locked --lib typed_rng_api_tests
          cargo test --locked --lib wf652_balanced_tests
          cargo test --locked --lib wf_l60_rng_extreme_tests

      - name: Build exact pinned native Rust evaluator
        working-directory: project/integrations/mythicsim-rust/engine
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked --bin forever-engine

      - name: Run native joint contract tests
        working-directory: project
        run: |
          python integrations/mythicsim-rust/tests/test_native_joint_two_class.py
          python integrations/mythicsim-rust/tests/test_native_joint_composition.py
          python integrations/mythicsim-rust/tests/test_native_joint_28_sweep.py
          python integrations/mythicsim-rust/tests/test_native_gear_adapter.py
          python integrations/mythicsim-rust/tests/test_native_source_donors.py
          python integrations/mythicsim-rust/tests/test_apl_mutation_length_reachability.py

      - name: Run balanced native 5s × 28 profile sweep
        working-directory: project
        run: |
          python integrations/mythicsim-rust/native_joint_28_sweep.py \
            --engine-src integrations/mythicsim-rust/engine \
            --binary integrations/mythicsim-rust/engine/target/release/forever-engine \
            --out artifacts/native-joint-28-stage5 \
            --stage 5 --iterations 40 --seed 731

      - name: Publish matrix summary
        if: always()
        working-directory: project
        run: |
          if [[ -f artifacts/native-joint-28-stage5/matrix.md ]]; then
            cat artifacts/native-joint-28-stage5/matrix.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f artifacts/native-joint-28-stage5/provenance.json ]]; then
            echo '## Exact run provenance' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/native-joint-28-stage5/provenance.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact native matrix and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-joint-28-summary-${{ github.sha }}
          path: |
            project/artifacts/native-joint-28-stage5/matrix.md
            project/artifacts/native-joint-28-stage5/provenance.json
          if-no-files-found: warn
          retention-days: 3

      - name: Upload full native paid request-response evidence when explicitly requested
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.retain_full_evidence }}
        uses: actions/upload-artifact@v4
        with:
          name: native-joint-28-stage5-${{ github.sha }}
          path: project/artifacts/native-joint-28-stage5/
          if-no-files-found: warn
          retention-days: 7
