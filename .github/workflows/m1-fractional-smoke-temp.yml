name: M1 fractional bookkeeping smoke (temporary)
on:
  push:
    branches: [work/m1-within-gate-fractional-progress-20261102]
  pull_request:
jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_m1_progress.py
      - run: python tools/m1_progress.py
