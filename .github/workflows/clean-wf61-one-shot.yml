name: Clean one-shot WF61 sourced companion integration
on:
  push:
    branches:
      - work/clean-wf61-full-main-integration-20261101
permissions:
  contents: read
concurrency:
  group: clean-wf61-one-shot
  cancel-in-progress: false
jobs:
  real-source-pet:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact source and compile
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git lfs pull
          python -m py_compile src/v2/source_persistent_joint_finalists.py tests/test_wf61_companion_persistence.py
      - name: Run sourced companion and existing paid runtime regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest beautifulsoup4
          python -m pytest -x -q tests/test_wf61_companion_persistence.py tests/test_wf252_companion_joint.py tests/test_wf302_persistent_joint_search.py tests/test_wf61_persistent_pull_trace_audit.py
