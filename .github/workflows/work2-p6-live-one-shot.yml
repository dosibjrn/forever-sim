name: Work2 one-shot live bounded P6 Balance probe
on:
  push:
    branches:
      - work/work2-p6-bounded-source-profile-20261102
permissions:
  contents: read
jobs:
  real-p6-bounded:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute original P6 bounded production path without recording M1
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          echo "Executed exact head $(git rev-parse HEAD)"
          set +e
          timeout 210s python tools/wf_gate.py --class druid --level 60 --spec balance --gate P6 --out /tmp/p6-work2.json
          rc=$?
          set -e
          echo "NO_RECORD_P6_EXIT=$rc"
          test -s /tmp/p6-work2.json || { echo "No P6 report generated"; exit 1; }
          python - <<'PY'
          import json
          r=json.load(open('/tmp/p6-work2.json'))
          print(json.dumps(r, indent=2)[:14000])
          assert r['status'] in ('FAIL','BLOCKED'), r['status']
          reasons=str(r)
          assert 'P6_SOURCE_SPEC_TREE_SEARCH_CONSTRAINT_NOT_YET_CONNECTED' not in reasons
          print('VERIFIED: no false named-spec BLOCKED; gate remains non-PASS')
          PY
