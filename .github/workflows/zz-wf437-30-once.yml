name: One-shot WF437 cold source joint 30s and paid validation
on:
  push:
    branches:
      - work/2nd-wf61-first-live-source-20261101
    paths:
      - .github/workflows/zz-wf437-30-once.yml
permissions:
  contents: read
jobs:
  source-paid-joint:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute real cold 30s gear talents APL recovery search and independent 100mob shortlist
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf437_fast_search_validation_tdd.py -k shortlist_serializes_source_gear_policy_and_independent_real_replay
          python -m tools.wf437_direct_budgeted_run --budget 30 --output /tmp/wf437-30.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/wf437-30.json'))
          print('WF437_30_REAL',json.dumps({k:r.get(k) for k in ('status','wall_s','paid_candidates','joint_axis_paid_coverage','validation','p4_acceptance_status')},default=str)[:8000])
          PY
