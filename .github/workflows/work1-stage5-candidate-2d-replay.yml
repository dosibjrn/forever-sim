name: Work1 Stage-5 Druid Balance native-2D candidate replay

on:
  push:
    branches:
      - "work/work1-stage5-candidate-2d-replay-20261103"
  pull_request:
    paths:
      - ".github/workflows/work1-stage5-candidate-2d-replay.yml"
      - "tools/diagnostics/replay_stage5_candidate_2d.py"
      - "integrations/mythicsim-rust/live_world_probe.py"
      - "integrations/mythicsim-rust/port_native_typed_rng.py"
      - "integrations/mythicsim-rust/engine/**"
  workflow_dispatch:
    inputs:
      stage5_run_id:
        description: "Successful native-joint-28 Stage-5 workflow run containing the Druid Balance artifact."
        required: true
        default: "41662174877"

permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing world runtime dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Apply tracked typed RNG port and compile the exact selected Rust fork
        run: |
          set -euo pipefail
          selected="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          actual="$(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
          test "$selected" = "$actual"
          echo "SELECTED_RUST_SHA=$actual"
          python integrations/mythicsim-rust/port_native_typed_rng.py integrations/mythicsim-rust/engine
          cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml --bin forever-engine
      - name: Prove a mid-fight gsim range change reaches the next native decision
        run: |
          python integrations/mythicsim-rust/live_world_probe.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --request integrations/mythicsim-rust/engine/tests/classes/druid/prepare/balance.request.json \
            --range-perturbation-only
      - name: Download the exact Stage-5 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE5_RUN_ID: ${{ github.event.inputs.stage5_run_id || '41662174877' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stage5"
          gh run download "$STAGE5_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/stage5"
          test -n "$(find "$RUNNER_TEMP/stage5" -name matrix.json -print -quit)"
      - name: Replay Druid Balance baseline, best and generated donors in native and live 2D
        run: |
          python tools/diagnostics/replay_stage5_candidate_2d.py \
            --artifact-dir "$RUNNER_TEMP/stage5" \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --iterations 5
