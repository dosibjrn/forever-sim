name: Work1 P7.4 final-window rerank focused check (temporary)
on:
  push:
    branches:
      - work/work1-p74-late-finalist-rerank-20261102
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'pytest==8.3.5'
      - name: P7.4 producer and late-window stochastic rerank tests
        run: python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
      - name: Compile changed production and regression
        run: python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
