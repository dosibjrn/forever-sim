name: Work2 Warlock L32 source-native paid successor from exact L31 receipt

on:
  push:
    branches:
      - work2/warlock-l32-native-paid-20261110-1132
    paths:
      - .github/workflows/work2-warlock-l32-native-successor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-native-l32:
    # Reuse actual L20-L31 receipts; pay only for the new L32 hostile chain.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work2 implementation
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.sha }}
      - name: Checkout identical native source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify selected Rust source revision
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
          git -C project rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever adapter and test dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Regression-test native predecessor, successor and publisher
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_warlock_route_guide.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py
      - name: Build selected native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve exact successful L31 executed source and connected route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13750967513/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l31-native-route/native_l31/best_apl/source_request.json
          test -s previous/warlock-l31-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          root = Path("previous/warlock-l31-native-route")
          source = root / "native_l31/best_apl/source_request.json"
          report = json.loads((root / "route.json").read_text())
          fingerprint = hashlib.sha256(source.read_bytes()).hexdigest()
          assert fingerprint == "a444f4e6e7ce9c41c9a49bd414a89a1291a353a752f5081f86a61129105ca2af", "Unexpected L31 paid source SHA"
          assert report["measured_levels"] == list(range(20, 32)), "L20-L31 measured source receipts not retained"
          native = report["native_paid_talent_continuity"]
          assert native["levels"] == list(range(20, 32)), "L31 talent lineage is not connected to L20"
          l31 = [row for row in report["observations"] if row.get("level") == 31]
          assert any(
              row.get("source_request_sha256") == fingerprint
              and row.get("status") == "measured_native_chain"
              and row.get("targets_requested") == row.get("targets_killed") == 100
              and row.get("native_world_ack") is True
              and row.get("paid_native_recovery") is True
              for row in l31
          ), "Exact L31 source lacks a completed paid 100-target native predecessor"
          assert report["full_10_60_native_replay_executed"] is False
          assert report["elapsed_10_60_seconds"] is None
          assert len(report["unmeasured_levels"]) == 39
          print("VERIFIED_PAID_L31_PREDECESSOR", fingerprint,
                "CONNECTED_LEVELS", len(native["levels"]), flush=True)
          PY
      - name: Propose L31 to L32 via native options and native prepare
        id: propose
        continue-on-error: true
        working-directory: project
        run: |
          python -u tools/wf_warlock_next_level_source.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l31-native-route/native_l31/best_apl/source_request.json \
            --predecessor-route ../previous/warlock-l31-native-route/route.json \
            --from-level 31 --to-level 32 \
            --out ../warlock-l32-source
      - name: Publish native L32 refusal without fabricated measurement
        if: steps.propose.outcome == 'failure'
        working-directory: project
        run: |
          test -s ../warlock-l32-source/proposal.json
          set +e
          python -u tools/wf_warlock_route_guide.py \
            --native-proposal ../warlock-l32-source/proposal.json \
            --baseline-observations ../previous/warlock-l31-native-route/route.json \
            --out ../warlock-l32-native-route
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          test -s ../warlock-l32-native-route/route.json
      - name: Execute new L32 hostile paid native/gsim 100-mob Decisions chain
        if: steps.propose.outcome == 'success'
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 32 \
            --binary ../engine/target/debug/forever-engine \
            --source ../warlock-l32-source/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --baseline-observations ../previous/warlock-l31-native-route/route.json \
            --trial paid-source-native-l32 \
            --out ../warlock-l32-native-route
      - name: Archive exact L31 source, new candidate, refusals and L32 paid guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l32-paid-${{ github.run_id }}
          path: |
            previous/warlock-l31-native-route/native_l31/best_apl/source_request.json
            previous/warlock-l31-native-route/route.json
            warlock-l32-source/
            warlock-l32-native-route/
          if-no-files-found: warn
          retention-days: 3
