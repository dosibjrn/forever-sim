name: Merge one-shot Clean98 source-239 main baseline
on:
  push:
    branches: [merge/verify-clean98-baseline-20261102]
    paths: [.github/workflows/merge-clean98-baseline-one-shot.yml]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Confirm identical main source except this temporary workflow
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7fc20c45ba7f5e86cb57aca5bc7de37ed32bbe82"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-clean98-baseline-one-shot.yml"
      - name: Run original source-239 tests and capture known baseline failures
        run: |
          set -uo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4' 'PyYAML==6.0.2'
          python -m pytest -q tests/test_wf_coverage239_source_ability_batch.py > /tmp/baseline.log 2>&1
          code=$?
          cat /tmp/baseline.log
          echo "BASELINE_EXIT_CODE=$code"
          test "$code" -eq 1 || exit 1
          grep -F '6 failed' /tmp/baseline.log
          grep -F '13 passed' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_source_semantics_and_rank_inventory' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_rank_selection_uses_source_level_and_never_future_rank' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_real_starfire_cast_cost_damage_and_search_candidate' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_real_rake_direct_dot_combo_and_mode_rejection' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_fail_closed_on_malformed_source_tooltip' /tmp/baseline.log
          grep -F 'FAILED tests/test_wf_coverage239_source_ability_batch.py::test_default_mode_search_includes_new_source_rake_policy' /tmp/baseline.log
          echo 'CLEAN98_BASELINE_IDENTICAL_SIX_EXISTING_FAILURES'
