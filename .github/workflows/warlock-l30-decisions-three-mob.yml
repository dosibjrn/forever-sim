name: Warlock L30 Decisions 3-mob combat-only native validation

on:
  push:
    branches: [work/warlock-l30-3mob-decisions-combat-20261109]
    paths:
      - tools/wf_warlock_l30_guide_compare.py
      - .github/workflows/warlock-l30-decisions-three-mob.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  three-native-mob-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        guide: [icy, mobalytics]
    steps:
      - name: Checkout exact L30 guide and features
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout exact engine after PR 44 combat/rest split
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: 207827ae2357cf6860c670cf59beb9fca5e8530a
          path: engine
      - name: Verify engine identity and Python features
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "207827ae2357cf6860c670cf59beb9fca5e8530a"
          python3 -m py_compile project/tools/wf_warlock_l30_guide_compare.py project/tools/wf_warlock_chain_surrogate.py
          python3 -m unittest discover -s project/tools -p 'test_wf_warlock_chain_surrogate.py' -v
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install source gsim bridge dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Build source-native Rust and verify post-recovery receipt split
        working-directory: engine
        run: |
          cargo test --locked regen_receipts_exclude_between_pull_regen_from_combat
          cargo build --locked --bin forever-engine
      - name: Run genuinely paid 3-mob Decisions native warlock and extract combat-only features
        working-directory: project
        run: |
          python3 -u tools/wf_warlock_l30_guide_compare.py \
            --binary ../engine/target/debug/forever-engine \
            --source tests/fixtures/warlock-l20-troll-best-paid.request.json \
            --engine-tools ../project/tools \
            --out ../warlock-three-mob-${{ matrix.guide }} \
            --guide ${{ matrix.guide }} --targets 3
      - name: Assert all three native kills and feature provenance
        working-directory: project
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("../warlock-three-mob-${{ matrix.guide }}")
          report=json.loads((root/"comparison.json").read_text())
          assert report["target_count"]==3,report
          for outcome in report["results"]:
              assert outcome["status"]=="COMPLETED",outcome
              assert outcome["confirmed_kills"]==3,outcome
              assert outcome["feature_source"]=="post_recovery_combat_only",outcome
              features=json.loads((root/outcome["filler"]/"three_features.json").read_text())
              assert features["raw"]["native_mana_gained_source"]=="native_combat_mana_gained"
          print("WARLOCK_L30_REAL_THREE_MOB_COMBAT_ONLY_PASS")
          PY
      - name: Preserve full 2D ACK, exact Rust receipts and 3-mob features
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-decisions-three-mob-${{ matrix.guide }}
          path: warlock-three-mob-${{ matrix.guide }}/
          if-no-files-found: warn
          retention-days: 14
