name: Prio real live FAIL percentages (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  real-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_gate_live_success_percent.py tests/test_wf_gate_probe.py
      - run: python tools/m1_progress.py
      - run: |
          python tools/wf_gate_probe.py --class druid --level 60 --spec balance --gate-seconds 35 --total-seconds 95
