name: Work2 paid improving lineage one-shot
# Re-run after synchronous nested candidate alarm fix and control-preserving parent selection.
on:
  push:
    branches: [work/work2-paid-improving-descendant-20261102]
    paths: [.github/workflows/work2-paid-improving-lineage-one-shot.yml]
permissions:
  contents: read
jobs:
  real-source-paid-30s:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-backed independent cold 30s and 100-mob finalists
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          git rev-parse HEAD
          mkdir -p work2-real
          python -m tools.wf437_direct_budgeted_run --budget 30 --checkpoint-class druid --checkpoint-level 60 --checkpoint-spec balance --output work2-real/t30.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('work2-real/t30.json').read_text())
          v=x.get('validation') or {}
          rows=[r for r in v.get('rows',[]) if r.get('status')=='COMPLETE' and r.get('count')==100]
          winner=min(rows,key=lambda r:r['full_s_per_mob']) if rows else None
          shortlist=x.get('validation_shortlist') or []
          receipt={'source_sha':x.get('source_db_sha256'),
              'backend':x.get('screen_evaluator_backend'),
              'wall_s':x.get('wall_s'),'budget_s':x.get('requested_wall_budget_s'),
              'unique_paid':x.get('unique_full_builds'),
              'talent_probes':(x.get('refinement') or {}).get('talent_probes'),
              'complete_100mob_replays':len(rows),'shortlist_size':len(shortlist),
              'T30':winner.get('full_s_per_mob') if winner else None,
              'winner_allocation':shortlist[int(winner['id'])]['allocation'] if winner else None}
          print('WORK2_PAID_IMPROVING_LINEAGE_REAL='+json.dumps(receipt,sort_keys=True),flush=True)
          assert receipt['source_sha']=='047204bab4b477420437c2680480312fbe2a1cd9f48085ef3ce70d00c955f2f9'
          assert receipt['budget_s']==30 and 0<receipt['wall_s']<=30
          assert winner and len(rows)==len(shortlist) and len(rows)>0
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work2-paid-improving-lineage-30s
          path: work2-real/t30.json
          retention-days: 3
