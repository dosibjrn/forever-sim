name: One-shot Clean staged CLI source import RED GREEN
on:
  push:
    branches:
      - work/clean-staged-cli-source-import
permissions:
  contents: read
jobs:
  source-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install minimal source test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: RED original main CLI fails direct import without PYTHONPATH
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/run_staged_joint_search.py)" = "d572fb8c58ca2354c76e3c01b976c90868dd7d70"
          git fetch --no-tags --depth=1 origin 5144bd2310ae13ad99a6b704fffa340883afe01e
          git show 5144bd2310ae13ad99a6b704fffa340883afe01e:scripts/run_staged_joint_search.py > scripts/run_staged_joint_search.py
          test "$(git hash-object scripts/run_staged_joint_search.py)" = "a9b3257b0d7a83a095f8cd47435ee29379dc4697"
          if env -u PYTHONPATH python scripts/run_staged_joint_search.py --help > /tmp/staged-red.log 2>&1; then
            echo 'Unexpected RED success' >&2; exit 1
          fi
          cat /tmp/staged-red.log
          grep -F "ModuleNotFoundError: No module named 'src'" /tmp/staged-red.log
          git restore scripts/run_staged_joint_search.py
      - name: GREEN direct CLI and real sourced 28-policy combat recovery regression
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object scripts/run_staged_joint_search.py)" = "d572fb8c58ca2354c76e3c01b976c90868dd7d70"
          env -u PYTHONPATH python scripts/run_staged_joint_search.py --help > /tmp/staged-green.log
          grep -F -- '--screening-gears' /tmp/staged-green.log
          env -u PYTHONPATH python -m pytest -q tests/test_wf273_staged_source_search.py::test_data_only_source_change_flips_real_optimizer_winner
