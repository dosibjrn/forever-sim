name: One-shot 2nd work 30 vs 300s real source paid search
on:
  push:
    branches:
      - work/2nd-300s-cold-paid-replay-20261101
    paths:
      - .github/workflows/zz-2nd-300s-once.yml
permissions:
  contents: read
jobs:
  cold-paid-compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real source runtime and negative control
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf437_fast_search_validation_tdd.py -k 'shortlist_serializes_source_gear_policy_and_independent_real_replay or direct_backend_refuses_full_horizon_or_legacy_full_search'
      - name: Independent cold 30s and 300s searches with separate 100-mob paid replay
        run: |
          set -euo pipefail
          python -m tools.wf437_direct_budgeted_run --budget 30 --output /tmp/wf437-30.json
          python -m tools.wf437_direct_budgeted_run --budget 300 --output /tmp/wf437-300.json
          python - <<'PY'
          import json,math
          a=json.load(open('/tmp/wf437-30.json'))
          b=json.load(open('/tmp/wf437-300.json'))
          assert a['source_db_sha256']==b['source_db_sha256'],'SOURCE_MISMATCH'
          assert a['validation']['validation_outside_search_budget']
          assert b['validation']['validation_outside_search_budget']
          assert 0<a['wall_s']<=30.5 and 0<b['wall_s']<=300.5,'SEARCH_BUDGET'
          def winning_paid(report):
              rows=report['validation']['rows']
              assert rows and report['validation']['complete_100mob_replays']==len(rows),'INCOMPLETE_REPLAY'
              assert all(r['status']=='COMPLETE' and r['count']==100 and r['events']>0 for r in rows),'BAD_100MOB'
              return min(rows,key=lambda r:r['full_s_per_mob'])
          p30=winning_paid(a)
          p300=winning_paid(b)
          ratio=p30['full_s_per_mob']/p300['full_s_per_mob']
          print('SOURCE_SHA256',a['source_db_sha256'])
          for budget,r,w in ((30,a,p30),(300,b,p300)):
              print('COLD_BUDGET',budget,'search_wall_s',r['wall_s'],'paid_candidates',r['paid_candidates'],
                    'coverage',r['joint_axis_paid_coverage'],'replayed',r['validation']['100mob_replays'],
                    'completed',r['validation']['complete_100mob_replays'],
                    'ranking_reversal',r['validation']['ranking_reversal'],
                    'best_paid_id',w['id'],'best_paid_s_per_mob',w['full_s_per_mob'],
                    'events',w['events'],'p4',r['p4_acceptance_status'])
          print('P6_NUMERIC_DIAGNOSTIC',json.dumps({'T30':p30['full_s_per_mob'],
                 'T300':p300['full_s_per_mob'],'ratio':ratio,
                 'numeric_noninferiority':ratio<=1.01,
                 'gate':'NOT_ACCEPTED_SOURCE_COVERAGE_GATES_NOT_PROVEN'}))
          assert math.isfinite(ratio) and ratio>0
          PY
