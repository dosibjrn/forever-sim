name: Work1 P7.4 one-shot focused regression (not acceptance)
on:
  push:
    branches: [work/work1-p74-native-world-cold-final-20261102]
    paths: [.github/workflows/work1-p74-focused-once.yml]
permissions:
  contents: read
jobs:
  p74-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m compileall -q tools/wf_gate_p7_4_live.py tests/test_wf_gate_p7_4_live.py
      - run: python -m pytest -q tests/test_wf_gate_p7_4_live.py
