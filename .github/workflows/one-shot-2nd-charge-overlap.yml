name: One-shot sourced charge overlap regression

on:
  push:
    branches:
      - work/2nd-charge-zero-distance-runtime

permissions:
  contents: read

concurrency:
  group: one-shot-2nd-charge-overlap
  cancel-in-progress: false

jobs:
  sourced-charge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Exact HEAD source GameIR and real CombatRuntime tests
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf441_source_spatial_charge_p2_tdd.py
