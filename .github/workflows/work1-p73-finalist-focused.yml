name: Work1 P7.3 paired finalist focused
on:
  push:
    branches:
      - work/work1-p73-talent-identity-probe-20261102
    paths:
      - .github/workflows/work1-p73-finalist-focused.yml
jobs:
  test-real-producer-routing:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run exact branch focused tests
        run: |
          python -m pip install 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p7_3_live.py tools/wf_gate.py
          python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py
