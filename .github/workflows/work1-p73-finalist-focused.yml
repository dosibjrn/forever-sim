name: Work1 P7.3 live finalist full-source one-shot
on:
  push:
    branches:
      - work/work1-p73-talent-identity-probe-20261102
    paths:
      - .github/workflows/work1-p73-finalist-focused.yml
jobs:
  p73-source-paid-native-2d:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    permissions:
      contents: read
    steps:
      - name: Checkout exact Work1 tournament code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
      - name: Checkout original pinned MythicSim Rust
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
      - name: Hydrate pinned source item catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Exact code focused regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p7_3_live.py tools/wf_gate.py
          python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py
      - name: Patch selected real world ingress and RNG
        run: python integrations/mythicsim-rust/patch_world_ingress.py upstream
      - name: Build pinned selected Rust combat binary
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: off
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked
      - name: Run real cold 300s P7.3 and frozen 1000 stochastic without M1 recording
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_FULL_SOURCE_SEARCH: '1'
        run: |
          mkdir -p run-output
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.3 --out run-output/real-p73.json || true
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("run-output/real-p73.json").read_text())
          print("WORK1_P73_REAL_VERDICT:", json.dumps(d)[:8000],flush=True)
          PY
      - name: Preserve exact-source real production receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: work1-p73-real-${{ github.sha }}
          path: run-output/
          retention-days: 14
