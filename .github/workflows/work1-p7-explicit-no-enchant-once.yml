name: Work1 P7 explicit no-enchant source/native RED GREEN (one-shot)

on:
  push:
    branches: [work/work1-p7-explicit-no-enchant-20261103]
    paths:
      - .github/workflows/work1-p7-explicit-no-enchant-once.yml
      - integrations/mythicsim-rust/p74_gear_validation.py
      - integrations/mythicsim-rust/p74_gear_search.py
      - tests/test_work1_p7_full_gear_pool.py

permissions:
  contents: read

jobs:
  focused-source-native-legality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout exact Work1 producer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Run exact source-validator and live gear gate routing regressions
        run: |
          python -m compileall -q integrations/mythicsim-rust/p74_gear_validation.py integrations/mythicsim-rust/p74_gear_search.py
          python -m pytest -q tests/test_work1_p7_full_gear_pool.py tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_5_live.py
