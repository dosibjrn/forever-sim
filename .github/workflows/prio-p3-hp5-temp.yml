name: Prio P3 HP5 source-runtime regression (temporary)
on:
  push:
    branches: [work/prio-p3-measure-source-hp5-20261102-1304]
jobs:
  hp5:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_prio_p3_spec_build.py
