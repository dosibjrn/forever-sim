name: One-shot real native world health preflight
on:
  push:
    branches: [work/first-native-world-health-preflight-20261102]
    paths: [.github/workflows/one-shot-native-health-preflight.yml]
permissions:
  contents: read
jobs:
  real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source Go preflight contracts
        working-directory: project/integrations/mythicsim-go/world_boundary/ingress
        run: |
          GO111MODULE=off go test -count=1 -v feed.go feed_test.go world_damage_ack.go world_damage_ack_test.go
      - name: Build real pinned Go native engine
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
          cd ..
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Real gsim near/far world ACK and health continuity
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path('../gsim-go-world-ingress')
          request=Path('../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json')
          near=run(binary,request,ticks=12,target_spawn_yards=3.,target_health=5000.)
          far=run(binary,request,ticks=12,target_spawn_yards=80.,target_health=5000.)
          assert len(near['observations'])==12 and len(far['observations'])==12
          assert all(row['native_world_ack_confirmation']['native_world_health_applied'] for row in near['observations'])
          assert all(row['native_world_ack_confirmation']['native_world_health_applied'] for row in far['observations'])
          assert sum(len(row['native_damage_events']) for row in near['observations'])>0
          assert sum(len(row['native_damage_events']) for row in far['observations'])==0
          print('REAL_GSIM_NATIVE_HEALTH_CONTINUITY_NEAR_FAR_PASS')
          PY
