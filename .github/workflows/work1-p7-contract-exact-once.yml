name: Work1 P7 contract focused regression (one-shot)
on:
  push:
    branches:
      - work/work1-p71-source-reference-1000-final-20261102
    paths:
      - .github/workflows/work1-p7-contract-exact-once.yml
permissions:
  contents: read
jobs:
  work1-p7-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Test actual PR HEAD
        shell: bash
        run: |
          set -euo pipefail
          echo "Work1 exact HEAD $(git rev-parse HEAD)"
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m compileall -q tools/wf_gate_p7_1_live.py tools/wf_gate_p7_2_live.py tools/wf_gate_p7_3_live.py tools/wf_gate_p7_4_live.py tools/wf_gate_p7_5_live.py integrations/mythicsim-rust/live_world_probe.py
          python -m pytest -q tests/test_work1_p7_1_live_entry.py tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py tests/test_wf_gate_p7_5_live.py
