name: Work2 Warlock native route guide

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/work2-warlock-route-guide.yml
      - tools/wf_warlock_route_guide.py
      - tools/wf_warlock_next_level_source.py
      - data/warlock/native_route_observations.json
      - tests/test_work2_warlock_route_guide.py
      - tests/test_work2_warlock_next_level_source.py

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Verify route publication and refusal handling
        run: python -m pytest -q tests/test_work2_warlock_route_guide.py tests/test_work2_warlock_next_level_source.py
      - name: Publish reproducible partial guide
        run: |
          python tools/wf_warlock_route_guide.py --out /tmp/warlock-route
          python -m json.tool /tmp/warlock-route/route.json > /dev/null
          test -s /tmp/warlock-route/GUIDE.md

  # A paid native L20 replay is optional and must be explicitly dispatched.
  # Guide/selector-only PRs change publication, not the previously measured
  # native gameplay; never automatically replay the same frozen paid chain.
  paid-native-l20-route:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Work2 PR
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout selected source-native Rust executor
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: febc1d703e022265ed61ede3fec9b05416282536
          path: engine
      - name: Verify selected native engine and preserved source actor
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "febc1d703e022265ed61ede3fec9b05416282536"
          git -C project rev-parse HEAD
          test -s engine/fixtures/warlock-l20-troll-best-paid.request.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native world bridge dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify Forever-owned guide forwarding and refusals
        working-directory: project
        run: python -m pytest -q tests/test_work2_warlock_route_guide.py tests/test_work2_warlock_next_level_source.py
      - name: Compile exact selected Rust executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Execute one real L20 hostile paid gsim→Rust route and publish guide
        working-directory: project
        env:
          # This workflow is not an official M1 gate recorder.
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python -u tools/wf_warlock_route_guide.py \
            --execute-native \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --trial exact-pinned-hostile-l20-route \
            --out ../warlock-l20-native-route
          python -m json.tool ../warlock-l20-native-route/route.json > /dev/null
          test -s ../warlock-l20-native-route/GUIDE.md
      - name: Preserve complete native request, paid receipts, refusals and guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-paid-route-${{ github.run_id }}
          path: |
            warlock-l20-native-route/
          if-no-files-found: warn
          retention-days: 7
