name: Work2 Warlock native route guide

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/work2-warlock-route-guide.yml
      - tools/wf_warlock_route_guide.py
      - tools/wf_warlock_next_level_source.py
      - data/warlock/native_route_observations.json
      - tests/test_work2_warlock_route_guide.py
      - tests/test_work2_warlock_next_level_source.py

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Verify route publication and refusal handling
        run: python -m pytest -q tests/test_work2_warlock_route_guide.py tests/test_work2_warlock_next_level_source.py
      - name: Publish reproducible partial guide
        run: |
          python tools/wf_warlock_route_guide.py --out /tmp/warlock-route
          python -m json.tool /tmp/warlock-route/route.json > /dev/null
          test -s /tmp/warlock-route/GUIDE.md
