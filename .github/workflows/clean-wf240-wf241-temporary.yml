name: Clean WF240/WF241 focused compatibility (temporary)
on:
  pull_request:
    paths:
      - 'tools/wf240_source_joint_replay.py'
      - 'tools/wf241_source_joint_replay.py'
      - 'tests/maintenance/test_historical_joint_replay_compat.py'
      - '.github/workflows/clean-wf240-wf241-temporary.yml'
permissions:
  contents: read
jobs:
  historical-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/maintenance/test_historical_joint_replay_compat.py
