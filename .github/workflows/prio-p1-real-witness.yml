name: Prio P1 real heal effect focused (one-shot)
on:
  push:
    branches: [prio/p1-real-heal-and-applied-damage-witness-20261103]
jobs:
  p1-heal-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/test_wf466_p1_live.py -k 'zero_delta_events or real_production_heal or missing_or_nonfinite_effect_payload'
