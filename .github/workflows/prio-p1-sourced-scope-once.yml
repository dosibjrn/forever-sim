name: P1 sourced numeric scope one-shot
on:
  push:
    branches:
      - work/prio-p1-sourced-spellbook-roles-20261101
permissions:
  contents: read
concurrency:
  group: p1-source-scope-one-shot
  cancel-in-progress: false
jobs:
  sourced-p1:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-bound P1 and negative controls
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'beautifulsoup4==4.13.4'
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          python -m pytest -q tests/test_wf470_p1_scope.py tests/test_wf34_p1_acquisition_ledger_fail_closed.py
          python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p1_live import run_live
          result=run_live(Path.cwd(),'druid',30)
          reasons=result['reasons']
          print('P1_L30_STATUS',result['status'])
          print('P1_L30_REASON_COUNT',len(reasons))
          for reason in reasons:
              print('P1_REASON',reason)
          assert not any('P1_EFFECT_SCOPE_UNRESOLVED:' in r for r in reasons), reasons
          assert any(r.startswith('MISSING_GAME_IR_ACTION:780:') for r in reasons)
          PY
