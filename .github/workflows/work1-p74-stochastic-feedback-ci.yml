name: Work1 P7.4 paid-stochastic feedback RED GREEN (temporary)
on:
  push:
    branches: [work/work1-p74-early-stochastic-feedback-20261103]
    paths:
      - 'tools/wf_gate_p7_4_live.py'
      - 'tests/gates/test_wf_gate_p7_4_live.py'
      - '.github/workflows/work1-p74-stochastic-feedback-ci.yml'
permissions:
  contents: read
jobs:
  paid-search:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.4.2' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
      - run: python -m compileall -q tools/wf_gate_p7_4_live.py
