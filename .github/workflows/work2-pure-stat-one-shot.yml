name: Work2 pure source-stat paid regression (one shot)
on:
  push:
    branches:
      - work/work2-pay-pure-source-stat-packages-20261102
permissions:
  contents: read
jobs:
  source-paid:
    if: ${{ github.event.head_commit.message == 'ci(work2): one-shot source-paid pure-stat verification' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute real source paid regression
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py -k 'pure_source_stat_package_reaches_real_paid_frontier_before_repeated_slot or source_legal_atomic_weapon_package_is_paid_before_second_slot_item or deeper_source_frontier_cannot_resume_old_paid_search_journal'
