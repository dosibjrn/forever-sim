name: Clean PR272 isolated G50 relocation verification (one-shot)
on:
  push:
    branches:
      - clean/group-g50c-i-service-integration-20261102-1947
    paths:
      - .github/workflows/clean-pr272-shards-once.yml
permissions:
  contents: read
jobs:
  scoped-pytest:
    name: G50 ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: c-cold-service, test: tests/integration/service/test_g50c_cold_service_http_isolation.py}
          - {name: d-cold-listener, test: tests/integration/service/test_g50d_cold_listener_worker_isolation.py}
          - {name: e-worker-boundary, test: tests/integration/service/test_g50e_worker_child_legacy_boundary.py}
          - {name: f-native-queue, test: tests/integration/service/test_g50f_native_generic_queue.py}
          - {name: g-queued-read, test: tests/integration/service/test_g50g_explicit_queued_decision_read.py}
          - {name: h-queue-capabilities, test: tests/integration/service/test_g50h_provider_queue_capabilities.py}
          - {name: i-listener-queue, test: tests/integration/service/test_g50i_listener_native_queue_submission.py}
          - {name: workflow-contract, test: tests/maintenance/test_manual_exact_pr_head_workflow.py}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify one relocated suite without browser-only tests
        env:
          TEST_FILE: ${{ matrix.test }}
        run: python -m pytest -vv -ra "$TEST_FILE" -k 'not browser'
