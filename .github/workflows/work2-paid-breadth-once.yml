name: Work2 paid breadth RED GREEN source
on:
  push:
    branches:
      - work/work2-paid-breadth-real-evaluations-20261102
    paths:
      - .github/workflows/work2-paid-breadth-once.yml
      - src/v2/source_bounded_joint_frontier.py
permissions:
  contents: read
jobs:
  source-paid-breadth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Source-real paid breadth regression
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py tests/test_wf437_fast_search_validation_tdd.py tests/test_wf414_cold_source_p4_tdd.py
