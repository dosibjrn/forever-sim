name: Work2 one-shot source unlock paid ordering

on:
  push:
    branches:
      - work/work2-all-source-unlocks-paid-20261102
    paths:
      - .github/workflows/work2-source-unlock-cap-once.yml
      - src/v2/source_bounded_joint_frontier.py

permissions:
  contents: read

jobs:
  source-unlock-scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source with LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Focused source runtime and scheduler tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf409_talent_unlock_paid_witness_tdd.py tests/test_source_paid_gear_witness_priority.py
