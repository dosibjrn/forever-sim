name: Work1 P7.5 cold-elite one-shot verification
on:
  push:
    branches:
      - work/work1-p75-cold-local-search-20261102
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install focused test dependency
        run: python -m pip install -q pytest beautifulsoup4
      - name: Verify P7.2-P7.5 provider regressions
        run: python -m pytest -q tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py tests/test_wf_gate_p7_5_live.py
