name: Work1 P7.2 paid-elite local-search regression (one-shot)
on:
  push:
    branches: [work/work1-p72-paid-elite-local-search-20261102]
    paths:
      - .github/workflows/work1-p72-paid-elite-once.yml
      - tools/wf_gate_p7_2_live.py
      - tests/gates/test_p7_paid_elite_apl.py
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Focused actual P7.2 source-generator regressions (not gate PASS)
        run: |
          echo "exact_head=$(git rev-parse HEAD)"
          python -m pytest -q tests/gates/test_p7_paid_elite_apl.py tests/gates/test_p7_independent_cold_rediscovery.py tests/test_wf_gate_p7_2_live.py
          python -m compileall -q tools/wf_gate_p7_2_live.py integrations/mythicsim-rust/apl_mutation.py
