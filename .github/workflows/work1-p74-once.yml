name: Work1 bounded P7.4 source enchant regression (one-shot)
on:
  push:
    branches:
      - work/work1-p74-native-source-enchants-20261102-1921
    paths:
      - .github/workflows/work1-p74-once.yml
permissions:
  contents: read
concurrency:
  group: work1-p74-once-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run only the relevant bounded source and provider regressions
        run: |
          set -euo pipefail
          echo "Work1 test source HEAD $(git rev-parse HEAD)"
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p7_4_live.py integrations/mythicsim-rust/p74_gear_search.py integrations/mythicsim-rust/p74_preflight.py integrations/mythicsim-rust/p75_joint_search.py
          python -m pytest -q tests/test_wf_gate_p7_4_live.py tests/test_wf_gate_p7_5_live.py integrations/mythicsim-rust/tests/test_p74_preflight.py
