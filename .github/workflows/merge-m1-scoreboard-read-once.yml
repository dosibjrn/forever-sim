name: M1 scoreboard read-only verification
on:
  push:
    branches: [merge/m1-scoreboard-read-20261102-1136]
    paths: [.github/workflows/merge-m1-scoreboard-read-once.yml]
permissions:
  contents: read
jobs:
  m1:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Read canonical M1 scoreboard without gate runs or writes
        run: python tools/m1_progress.py
