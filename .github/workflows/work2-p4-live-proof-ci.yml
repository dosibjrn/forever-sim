name: Work2 real P4 source-paid provenance proof (temporary)
on:
  push:
    branches:
      - work/work2-p4-p5-actual-predicate-no-hidden-veto-20261102
jobs:
  live-p4:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Positive and negative live gate receipt regressions
        run: python -m pytest -q tests/test_work2_full_source_p4_p5_gate_entry.py
      - name: Actual source-paid P4 cold 30s+100mob selected gsim no M1
        shell: bash
        run: |
          set +e
          FOREVER_P4_P5_FULL_SOURCE=1 python tools/wf_gate.py --class druid --level 60 --spec balance --gate P4 --out /tmp/p4-no-record.json
          result=$?
          set -e
          echo "P4_SOURCE_PAID_RUNTIME_CODE=$result"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/p4-no-record.json'))
          for row in x['results']:
              print('P4_SOURCE_PAID_RESULT=' + json.dumps(row, sort_keys=True))
          PY
