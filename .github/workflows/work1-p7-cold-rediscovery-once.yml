name: Work1 one-shot P7 cold rediscovery regression
on:
  push:
    branches:
      - 'work/work1-p7-independent-rediscovery-20261102-2001'
    paths:
      - '.github/workflows/work1-p7-cold-rediscovery-once.yml'
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: P7 real module regressions
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/gates/test_p7_independent_cold_rediscovery.py tests/gates/test_p7_reference_floors.py
          python -m compileall -q tools/wf_gate_p7_2_live.py tools/wf_gate_p7_3_live.py integrations/mythicsim-rust/apl_mutation.py
