name: Work2 one-shot recovery event accounting verification
on:
  push:
    branches: [work/work2-paid-recovery-event-budget-20261102]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Focused source-paid production regressions
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' pytest
          echo "Exact HEAD: $(git rev-parse HEAD)"
          python -m pytest -q tests/test_work2_paid_recovery_event_budget.py tests/test_work2_paid_travel_event_accounting.py tests/test_work2_persistent_pack_budget.py tests/test_wf374_final_pack_recovery.py
