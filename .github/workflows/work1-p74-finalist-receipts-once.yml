name: Work1 P7.4 bounded receipts exact-HEAD check
on:
  push:
    branches:
      - work/work1-p74-selected-finalist-receipts-20261102
    paths:
      - .github/workflows/work1-p74-finalist-receipts-once.yml
      - tools/wf_gate.py
      - tools/wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_p7_4_live.py
      - tests/gates/test_wf_gate_class_cli.py
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify true paid winner identity and bounded CLI failures
        run: |
          git rev-parse HEAD
          python -m compileall -q tools/wf_gate.py tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_class_cli.py
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_class_cli.py -k 'p74 or full_p74'
          python -m pytest -q tests/test_work1_p7_full_gear_pool.py
