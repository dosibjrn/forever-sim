name: Work1 focused source-native P7 gear-pool regression (temporary)
on:
  push:
    branches: [work/work1-p74-independent-enchant-pool-20261103]
    paths:
      - .github/workflows/work1-p74-independent-enchant-pool-once.yml
      - integrations/mythicsim-rust/p74_gear_search.py
      - tools/wf_gate_p7_4_live.py
      - tools/wf_gate_p7_5_live.py
      - tests/test_work1_p7_full_gear_pool.py
permissions:
  contents: read
jobs:
  source-pool:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Run actual source candidate-pool and P7.4/P7.5 focused contracts
        run: |
          python -m pytest -q tests/test_work1_p7_full_gear_pool.py tests/gates/test_wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_5_live.py
          python -m compileall -q integrations/mythicsim-rust/p74_gear_search.py tools/wf_gate_p7_4_live.py tools/wf_gate_p7_5_live.py
