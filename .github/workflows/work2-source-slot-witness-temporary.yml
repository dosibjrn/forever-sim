name: Work2 source-paid slot witness (temporary exact-head)
on:
  push:
    branches:
      - work/work2-paid-source-slot-witness-20261102
permissions:
  contents: read
jobs:
  source-slot-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-legal production scheduling regressions
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py tests/test_source_wand_paid_slot_proposals.py
