name: One-shot sourced finalist replay config
on:
  push:
    branches:
      - work/2nd-replay-exact-shortlist-20261101-2120
    paths:
      - .github/workflows/one-shot-2nd-replay-config-20261101.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Actual cold source search and saved independent 100-mob replay
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m tools.wf437_direct_budgeted_run --budget 30 --output /tmp/cold30.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/cold30.json'))
          rows=p['validation_shortlist']
          assert rows and len(rows)==p['validation']['100mob_replays'], 'SHORTLIST_CONFIG_MISSING'
          assert all({'allocation','equipped_gear','opening_action_ids','policy_ir','policy_signature','recovery'} <= set(row) for row in rows), 'INCOMPLETE_SAVED_BUILD'
          print('FULL_SOURCE_SHORTLIST_ROWS',len(rows),'COLD_COMPLETE',p['validation']['complete_100mob_replays'],flush=True)
          PY
          python -m tools.wf437_direct_budgeted_run --replay-from /tmp/cold30.json --replay-row 0 --output /tmp/replay0.json
          python - <<'PY'
          import json,subprocess,sys
          original=json.load(open('/tmp/cold30.json'))
          replay=json.load(open('/tmp/replay0.json'))
          assert replay['source_db_sha256']==original['source_db_sha256']
          assert replay['replayed_source_build']==original['validation_shortlist'][0]
          assert replay['validation']['complete_100mob_replays']==1, 'SOURCE_REPLAY_NOT_COMPLETE'
          bad={**original,'source_db_sha256':'0'*64}
          json.dump(bad,open('/tmp/tampered.json','w'))
          p=subprocess.run([sys.executable,'-m','tools.wf437_direct_budgeted_run','--replay-from','/tmp/tampered.json','--replay-row','0','--output','/tmp/should-not-exist.json'],capture_output=True,text=True)
          assert p.returncode!=0 and 'REPLAY_SOURCE_SQLITE_SHA256_MISMATCH' in p.stderr, (p.returncode,p.stderr)
          print('SOURCE_REPLAY_NEGATIVE_CONTROL_PASS',flush=True)
          PY
