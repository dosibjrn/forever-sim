name: Work2 paid-100mob positive receipt one-shot (NOT gate acceptance)

on:
  push:
    branches:
      - work/work2-paid-100mob-positive-timing-20261102
    paths:
      - .github/workflows/work2-paid-100mob-one-shot.yml

permissions:
  contents: read

jobs:
  paid-100mob-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Test production shortlist + saved source winner
        run: python -m pytest -q tests/test_work2_paid_100mob_positive_receipt.py
