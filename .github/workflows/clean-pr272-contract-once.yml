name: Clean PR272 corrected workflow contract (one-shot)
on:
  push:
    branches:
      - clean/group-g50c-i-service-integration-20261102-1947
    paths:
      - .github/workflows/clean-pr272-contract-once.yml
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/maintenance -p 'test_manual_exact_pr_head_workflow.py' -v
