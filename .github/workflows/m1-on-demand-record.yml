name: M1 - Merge-owned batch live gate recorder

# One explicit Merge command on a merged PR, or manual Actions dispatch.
# Never run acceptance scans automatically for every push or every hour.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated class:level:spec:gate pairs"
        required: true
        type: string
      allow_heavy:
        description: "Explicit opt-in for full P6/P7 acceptance"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read # P7.5 reads historical registered accepted-run logs only
  issues: read
  pull-requests: read

# GitHub replaces older pending jobs in one concurrency group even when
# cancel-in-progress=false. Unique dispatches must not lose live gate runs;
# the publication step merges actual receipts on top of current main via CAS.
concurrency:
  group: m1-live-${{ github.event.comment.id || github.run_id }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.actor == 'dosibjrn' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/m1-run ')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify Merge command and parse only active gate targets
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_HEAVY: ${{ inputs.allow_heavy }}
        run: |
          set -euo pipefail
          heavy=false
          invalidate=false
          invalidate_target=""
          invalidate_reason=""
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            [[ "$COMMENT_BODY" != *$'\n'* ]] ||
              { echo 'Expected a single-line Merge command' >&2; exit 2; }
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            [[ "$(jq -r '.merged' <<< "$pr")" == true &&
               "$(jq -r '.base.ref' <<< "$pr")" == main &&
               "$(jq -r '.base.repo.full_name' <<< "$pr")" == "$GITHUB_REPOSITORY" ]] ||
              { echo 'M1 command must belong to an already merged PR into main' >&2; exit 2; }
            if [[ "$COMMENT_BODY" == '/m1-invalidate '* ]]; then
              invalidate=true
              command="${COMMENT_BODY#'/m1-invalidate '}"
              invalidate_target="${command%% *}"
              invalidate_reason="${command#"$invalidate_target"}"
              invalidate_reason="${invalidate_reason# }"
              [[ "$invalidate_target" =~ ^(druid|hunter|mage|paladin|priest|rogue|shaman|warlock|warrior):(20|30|40|60):[a-z][a-z0-9_-]*:(P[3-6]|P7\.[1-5])$ ]] ||
                { echo "Invalid active M1 invalidation target: $invalidate_target" >&2; exit 2; }
              [[ -n "$invalidate_reason" ]] ||
                { echo 'M1 invalidation requires a non-empty reason' >&2; exit 2; }
              IFS=: read -r invalidate_class invalidate_level invalidate_spec invalidate_gate <<< "$invalidate_target"
              printf 'invalidate=true\n' >> "$GITHUB_OUTPUT"
              printf 'invalidate_target=%s\n' "$invalidate_target" >> "$GITHUB_OUTPUT"
              printf 'invalidate_reason=%s\n' "$invalidate_reason" >> "$GITHUB_OUTPUT"
              printf 'targets=\n' >> "$GITHUB_OUTPUT"
              printf 'heavy=false\n' >> "$GITHUB_OUTPUT"
              printf 'p7_needed=false\n' >> "$GITHUB_OUTPUT"
              printf 'native_options_needed=false\n' >> "$GITHUB_OUTPUT"
              echo "Accepted explicit M1 receipt invalidation: $invalidate_target"
              exit 0
            fi
            [[ "$COMMENT_BODY" == '/m1-run '* ]] ||
              { echo 'Expected /m1-run or /m1-invalidate command' >&2; exit 2; }
            targets="${COMMENT_BODY#'/m1-run '}"
            if [[ "$targets" == '--heavy '* ]]; then
              heavy=true
              targets="${targets#'--heavy '}"
            fi
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 2
            targets="$DISPATCH_TARGETS"
            [[ "$DISPATCH_HEAVY" != true ]] || heavy=true
          fi
          [[ "$targets" != *$'\n'* ]] || exit 2
          read -r -a entries <<< "$targets"
          (( ${#entries[@]} >= 1 && ${#entries[@]} <= 12 )) ||
            { echo 'Choose 1-12 active checkpoint:gate pairs' >&2; exit 2; }
          declare -A seen=()
          unique=()
          for entry in "${entries[@]}"; do
            [[ "$entry" =~ ^(druid|hunter|mage|paladin|priest|rogue|shaman|warlock|warrior):(20|30|40|60):[a-z][a-z0-9_-]*:(P[3-6]|P7\.[1-5])$ ]] ||
              { echo "Invalid gate target: $entry" >&2; exit 2; }
            gate="${entry##*:}"
            # P7.1 supports a genuine short coupled-native diagnostic.
            # The full 1000-fight acceptance still requires --heavy.
            if [[ "$heavy" != true && ( "$gate" == P7.* && "$gate" != P7.1 && "$gate" != P7.2 && "$gate" != P7.3 && "$gate" != P7.4 && "$gate" != P7.5 ) ]]; then
              echo "Gate $gate needs explicit --heavy / allow_heavy opt-in" >&2; exit 2
            fi
            if [[ -z "${seen[$entry]:-}" ]]; then
              unique+=("$entry")
              seen[$entry]=1
            fi
          done
          printf 'invalidate=false\n' >> "$GITHUB_OUTPUT"
          printf 'targets=%s\n' "$(IFS=' '; echo "${unique[*]}")" >> "$GITHUB_OUTPUT"
          printf 'heavy=%s\n' "$heavy" >> "$GITHUB_OUTPUT"
          p7_needed=false
          native_options_needed=false
          for entry in "${unique[@]}"; do
            if [[ "$entry" == *:P7.* ]]; then p7_needed=true; fi
            IFS=: read -r class level spec gate <<< "$entry"
            if [[ "$gate" == P3 ]]; then
              if [[ "$level" == 20 && ( "$class" == priest || "$class" == mage ) ]] ||
                 [[ "$level" == 20 && "$class" == shaman && "$spec" == unrestricted ]] ||
                 [[ "$level" == 30 && "$class" == mage && "$spec" == unrestricted ]]; then
                native_options_needed=true
              fi
            elif [[ ( "$gate" == P4 || "$gate" == P5 ) && "$class" == priest && "$level" == 20 ]]; then
              # Priest P4/P5 consult the same selected native item-options CLI.
              native_options_needed=true
            fi
          done
          printf 'p7_needed=%s\n' "$p7_needed" >> "$GITHUB_OUTPUT"
          printf 'native_options_needed=%s\n' "$native_options_needed" >> "$GITHUB_OUTPUT"
          echo "Accepted ${#unique[@]} production targets"

      - name: Checkout current main, without saved write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Any P7 gate uses the exact SAME checked-in production gitlink as
      # the native-world workflow plus its deterministic tracked typed-mode port.
      # No floating branch or environment-selected RNG mode.
      - name: Hydrate and verify production Rust fork gitlink for selected P7 gate
        if: steps.targets.outputs.invalidate != 'true' && steps.targets.outputs.p7_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 integrations/mythicsim-rust/engine
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual"; exit 1;
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] ||
            { echo 'WRONG_RUST_FORK_REMOTE'; exit 1; }
          ln -s "$engine" upstream
          python integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          # Production gitlink must itself already contain mandatory typed RNG.
          # No CI-time patch may substitute for a published Rust commit.
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          if ! git -C "$engine" diff --quiet; then
            echo "M1_PINNED_RUST_NEEDS_UNPUBLISHED_TYPED_RNG_PATCH" >&2; exit 1
          fi
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          echo "M1 selected exact checked-in Rust fork revision $actual with typed RNG port"

      - name: Apply tracked typed RNG port and build exact fork-submodule production Rust engine
        if: steps.targets.outputs.invalidate != 'true' && steps.targets.outputs.p7_needed == 'true'
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      - name: Build exact Rust fork for native item-options consumers
        if: steps.targets.outputs.invalidate != 'true' && steps.targets.outputs.native_options_needed == 'true' && steps.targets.outputs.p7_needed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual" >&2; exit 1;
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || {
            echo "WRONG_RUST_FORK_REMOTE" >&2; exit 1;
          }
          ln -s "$engine" upstream
          cargo build --release --locked --manifest-path "$engine/Cargo.toml" --bin forever-engine
          test -x upstream/target/release/forever-engine
          echo "M1_NATIVE_P3_ENGINE_SHA=$actual" >> "$GITHUB_STEP_SUMMARY"

      - name: Run real production gates and update one TSV
        if: steps.targets.outputs.invalidate != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.targets.outputs.targets }}
          ALLOW_HEAVY: ${{ steps.targets.outputs.heavy }}
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
        run: |
          set -euo pipefail
          # Freeze already-completed accepted priors before this batch records
          # any of its own targets. P7.5 must never read its current in-progress
          # M1 run as a prior merely because P7.1-P7.4 appeared earlier in TARGETS.
          accepted_prior_ledger="$RUNNER_TEMP/m1-passes-pre-run.tsv"
          cp docs/planning/M1_PASSES.tsv "$accepted_prior_ledger"
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          echo "Measured production HEAD: $(git rev-parse HEAD)"
          read -r -a entries <<< "$TARGETS"
          echo "## M1 live-gate results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Verdict | Measured component / objective |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for entry in "${entries[@]}"; do
            IFS=: read -r class level spec gate <<< "$entry"
            echo "::group::M1 $entry"
            report="$(mktemp)"
            rc=0
            timeout_s=600
            # Current P5 probe is six seconds; do not require a heavy 300s
            # opt-in merely to obtain its first genuine functional PARTIAL.
            # If P5 later evolves into full acceptance, keep this light cap.
            if [[ "$gate" == P5 && "$ALLOW_HEAVY" != true ]]; then timeout_s=20; fi
            # Explicit heavy mode on P4/P5 runs the existing genuine 30/300 s
            # source-paid cold search and selected 2D 100-mob acceptance,
            # rather than the default bounded PARTIAL-only diagnostic.
            # This opt-in is strictly per target, so ordinary M1 is cheap.
            if [[ ( "$gate" == P4 || "$gate" == P5 ) && "$ALLOW_HEAVY" == true ]]; then
              export FOREVER_P4_P5_FULL_SOURCE=1
              timeout_s=900
            else
              unset FOREVER_P4_P5_FULL_SOURCE || true
            fi
            # The bounded P6 probe is the default. --heavy explicitly runs
            # Work2's real independent 30s/300s cold searches and two fresh
            # paid 100-mob replays; even numerical GREEN is gsim-only FAIL
            # until selected native↔world execution is proven.
            if [[ ( "$gate" == P7.2 || "$gate" == P7.3 || "$gate" == P7.4 || "$gate" == P7.5 ) && "$ALLOW_HEAVY" == true ]]; then
              # Work1 real 300s balanced Rust↔2D cold APL/talent/gear/joint search followed
              # once by 1000 stochastic frozen native/live fights. Only
              # an explicit Merge --heavy run can pay this production cost.
              export FOREVER_P7_FULL_SOURCE_SEARCH=1
              timeout_s=1500
            else
              unset FOREVER_P7_FULL_SOURCE_SEARCH || true
            fi
            if [[ "$gate" == P6 ]]; then
              if [[ "$ALLOW_HEAVY" == true ]]; then
                export FOREVER_P6_FULL_SOURCE_COMPARE=1
                timeout_s=1500
              else
                unset FOREVER_P6_FULL_SOURCE_COMPARE || true
                timeout_s=120
              fi
            else
              unset FOREVER_P6_FULL_SOURCE_COMPARE || true
            fi
            if [[ ( "$gate" == P7.1 || "$gate" == P7.2 || "$gate" == P7.3 || "$gate" == P7.4 || "$gate" == P7.5 ) && "$ALLOW_HEAVY" != true ]]; then
              # Only the approved producer can decide whether its actual
              # coupled DPS supports a provisional objective PARTIAL.
              # No 3/1000 "sample coverage" is recorded.
              export FOREVER_P7_LIVE_PROBE_ITERATIONS=3
              timeout_s=120
            else
              unset FOREVER_P7_LIVE_PROBE_ITERATIONS || true
            fi
            # P7.5 needs numeric genuine accepted prior finals. The TSV
            # intentionally stores only timestamp/run URL, so recover each
            # accepted report from its *registered* trusted M1 Actions log.
            # Never use a guessed prior or re-run an unchanged heavy gate.
            if [[ "$gate" == P7.5 ]]; then
              accepted_receipts="$(mktemp)"
              if python tools/wf_gate_p7_5_receipts.py \
                --repository "$GITHUB_REPOSITORY" --class "$class" \
                --level "$level" --spec "$spec" --out "$accepted_receipts" \
                --ledger "$accepted_prior_ledger"; then
                export FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS="$accepted_receipts"
              else
                rm -f "$accepted_receipts"
                unset FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS || true
                echo "P7.5 accepted prior receipts unavailable; gate remains fail-closed."
              fi
            else
              unset FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS || true
            fi
            timeout "${timeout_s}s" python tools/wf_gate.py --class "$class" --level "$level" \
              --spec "$spec" --gate "$gate" --record-progress --out "$report" || rc=$?
            python -c 'import json,sys; from pathlib import Path; d=json.loads(Path(sys.argv[1]).read_text()); rc=int(sys.argv[2]); assert d["status"] in ("PASS","FAIL","BLOCKED") and rc in (0,1) and ((rc==0)==(d["status"]=="PASS")), "Incomplete or inconsistent live gate"; print(json.dumps(d, ensure_ascii=False))' "$report" "$rc"
            python - "$report" "$entry" <<'PY'
          import json, os, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          item=d["results"][0]
          measure=(
              f'{item["verified"]:g}/{item["applicable"]:g}'
              if isinstance(item.get("verified"), (int, float))
              and isinstance(item.get("applicable"), (int, float))
              else f'{item["dps_objective_actual"]:g}/{item["dps_objective_required"]:g} DPS'
              if "dps_objective_actual" in item
              else f'{item["joint_cold_world_dps"]:g} DPS (P7.5 prior floor unavailable)'
              if "joint_cold_world_dps" in item
              else f'T30/T300 proxy={item["source_replay_Tfirst_Tsecond"]:.5f}'
              if isinstance(item.get("source_replay_Tfirst_Tsecond"), (float, int))
              else "not measurable")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f'| `{sys.argv[2]}` | {d["status"]} | {measure} |\n')
          PY
            rm -f "$report" "${accepted_receipts:-}"
            unset accepted_receipts || true
            echo "::endgroup::"
          done
          rm -f "$accepted_prior_ledger"
          python tools/m1_progress.py | tee "$RUNNER_TEMP/m1-scoreboard.txt"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '### M1 scoreboard (best measured)' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/m1-scoreboard.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          # Plot is a derived view of Git-backed M1 TSV snapshots, not a ledger.
          python tools/m1_progress.py --plot-svg docs/planning/M1_HISTORY.svg > /dev/null
          git diff --stat -- docs/planning/M1_PASSES.tsv docs/planning/M1_HISTORY.svg

      - name: Publish M1 ledger and README chart atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INVALIDATE: ${{ steps.targets.outputs.invalidate }}
          INVALIDATE_TARGET: ${{ steps.targets.outputs.invalidate_target }}
          INVALIDATE_REASON: ${{ steps.targets.outputs.invalidate_reason }}
        run: |
          set -euo pipefail
          if [[ "$INVALIDATE" == true ]]; then
            IFS=: read -r class level spec gate <<< "$INVALIDATE_TARGET"
            for attempt in 1 2 3 4 5; do
              # Explicit invalidations are separate from concurrent new receipts.
              # Re-fetch main, run the canonical invalidator, and CAS-publish.
              git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch origin main
              git reset --hard FETCH_HEAD
              if ! awk -F '\t' -v c="$class" -v l="$level" -v s="$spec" -v g="$gate" \
                'NR>1 && $1==c && $2==l && $3==s && $4==g {found=1} END {exit !found}' \
                docs/planning/M1_PASSES.tsv; then
                echo "M1 receipt already absent: $INVALIDATE_TARGET"
                exit 0
              fi
              python tools/m1_progress.py --invalidate "$class" "$level" "$spec" "$gate" \
                --plot-svg docs/planning/M1_HISTORY.svg | tee "$RUNNER_TEMP/m1-invalidation-scoreboard.txt"
              ledger_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_PASSES.tsv |
                gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
              plot_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_HISTORY.svg |
                gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
              parent="$(git rev-parse HEAD)"
              base_tree="$(git rev-parse "$parent^{tree}")"
              new_tree="$(jq -nc --arg base "$base_tree" --arg ledger "$ledger_blob" --arg svg "$plot_blob" \
                '{base_tree:$base,tree:[
                  {path:"docs/planning/M1_PASSES.tsv",mode:"100644",type:"blob",sha:$ledger},
                  {path:"docs/planning/M1_HISTORY.svg",mode:"100644",type:"blob",sha:$svg}
                ]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
              message="M1: invalidate $INVALIDATE_TARGET ($INVALIDATE_REASON)"
              new_commit="$(jq -nc --arg tree "$new_tree" --arg parent "$parent" --arg message "$message" \
                '{message:$message,tree:$tree,parents:[$parent]}' |
                gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"
              current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
              if [[ "$current" != "$parent" ]]; then
                echo "main advanced during invalidation (attempt $attempt); retrying"
                continue
              fi
              if jq -nc --arg sha "$new_commit" '{sha:$sha,force:false}' |
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" --input - >/dev/null; then
                echo "M1 invalidation published: $new_commit"
                {
                  echo "### Explicit M1 receipt invalidation"
                  echo "- Target: \`$INVALIDATE_TARGET\`"
                  echo "- Reason: $INVALIDATE_REASON"
                  echo "- Commit: $new_commit"
                } >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "main advanced during invalidation publication (attempt $attempt); retrying"
            done
            echo 'M1 invalidation retry limit exhausted; no stale ledger was published.' >&2
            exit 1
          fi
          if git diff --quiet -- docs/planning/M1_PASSES.tsv; then
            echo 'No genuinely improved gate evidence; M1 and chart stay unchanged.'
            exit 0
          fi
          # The live producer has already completed on pinned HEAD. Retain
          # its actual changed receipts; never run the gate again for a CAS.
          git show HEAD:docs/planning/M1_PASSES.tsv > "$RUNNER_TEMP/m1-base.tsv"
          cp docs/planning/M1_PASSES.tsv "$RUNNER_TEMP/m1-measured.tsv"
          for attempt in 1 2 3 4 5; do
            # Each concurrent dispatcher carries only its own new gate rows
            # into current main. Existing PASSes and better partials survive.
            gh api "repos/$GITHUB_REPOSITORY/contents/docs/planning/M1_PASSES.tsv?ref=main" \
              --jq '.content' | base64 -d > "$RUNNER_TEMP/m1-latest.tsv"
            python tools/m1_progress.py --merge-snapshots \
              "$RUNNER_TEMP/m1-base.tsv" "$RUNNER_TEMP/m1-measured.tsv" \
              "$RUNNER_TEMP/m1-latest.tsv" "$RUNNER_TEMP/m1-merged.tsv"
            if cmp -s "$RUNNER_TEMP/m1-latest.tsv" "$RUNNER_TEMP/m1-merged.tsv"; then
              echo 'Concurrent run already recorded equal or stronger evidence.'
              exit 0
            fi
            cp "$RUNNER_TEMP/m1-merged.tsv" docs/planning/M1_PASSES.tsv
            # Recompute the derived homepage view from the just merged ledger,
            # never from the runner's stale source snapshot.
            python tools/m1_progress.py --plot-svg docs/planning/M1_HISTORY.svg > /dev/null
            ledger_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_PASSES.tsv |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
            plot_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_HISTORY.svg |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
            parent="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            # Another job may have advanced main after our TSV read. Its
            # ledger must remain identical to the one we merged, otherwise
            # retry against newer state; never publish a stale TSV.
            latest_sha="$(git hash-object "$RUNNER_TEMP/m1-latest.tsv")"
            parent_ledger="$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/planning/M1_PASSES.tsv?ref=$parent" --jq .sha)"
            if [[ "$latest_sha" != "$parent_ledger" ]]; then
              echo "M1 changed before publication (attempt $attempt)"
              continue
            fi
            base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$parent" --jq .tree.sha)"
            new_tree="$(jq -nc --arg base "$base_tree" \
              --arg ledger "$ledger_blob" --arg svg "$plot_blob" \
              '{base_tree:$base,tree:[
                 {path:"docs/planning/M1_PASSES.tsv",mode:"100644",type:"blob",sha:$ledger},
                 {path:"docs/planning/M1_HISTORY.svg",mode:"100644",type:"blob",sha:$svg}
               ]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
            new_commit="$(jq -nc --arg tree "$new_tree" --arg parent "$parent" \
              --arg message "M1: record concurrent gate receipts (Actions $GITHUB_RUN_ID)" \
              '{message:$message,tree:$tree,parents:[$parent]}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f sha="$new_commit" -F force=false >/dev/null; then
              echo "M1 and chart updated without lost concurrent receipts: $new_commit"
              exit 0
            fi
            echo "main advanced during publication (attempt $attempt); retrying"
          done
          echo 'Concurrent M1 publication retry limit exhausted; source report remains in this Actions log.' >&2
          exit 1
