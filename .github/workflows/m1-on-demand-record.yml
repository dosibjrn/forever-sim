name: M1 - Merge-owned batch live gate recorder

# One explicit Merge command on a merged PR, or manual Actions dispatch.
# Never run acceptance scans automatically for every push or every hour.
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      targets:
        description: "Space-separated class:level:spec:gate pairs"
        required: true
        type: string
      allow_heavy:
        description: "Explicit opt-in for full P6/P7 acceptance"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: read
  pull-requests: read

concurrency:
  group: m1-ledger-writer
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.actor == 'dosibjrn' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/m1-run ')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify Merge command and parse only allowed gate targets
        id: targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
          DISPATCH_HEAVY: ${{ inputs.allow_heavy }}
        run: |
          set -euo pipefail
          heavy=false
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            [[ "$COMMENT_BODY" == '/m1-run '* && "$COMMENT_BODY" != *$'\n'* ]] ||
              { echo 'Expected a single-line /m1-run command' >&2; exit 2; }
            pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
            [[ "$(jq -r '.merged' <<< "$pr")" == true &&
               "$(jq -r '.base.ref' <<< "$pr")" == main &&
               "$(jq -r '.base.repo.full_name' <<< "$pr")" == "$GITHUB_REPOSITORY" ]] ||
              { echo 'M1 command must belong to an already merged PR into main' >&2; exit 2; }
            targets="${COMMENT_BODY#'/m1-run '}"
            if [[ "$targets" == '--heavy '* ]]; then
              heavy=true
              targets="${targets#'--heavy '}"
            fi
          else
            [[ "$GITHUB_REF" == refs/heads/main ]] || exit 2
            targets="$DISPATCH_TARGETS"
            [[ "$DISPATCH_HEAVY" != true ]] || heavy=true
          fi
          [[ "$targets" != *$'\n'* ]] || exit 2
          read -r -a entries <<< "$targets"
          (( ${#entries[@]} >= 1 && ${#entries[@]} <= 12 )) ||
            { echo 'Choose 1-12 checkpoint:gate pairs' >&2; exit 2; }
          declare -A seen=()
          unique=()
          for entry in "${entries[@]}"; do
            [[ "$entry" =~ ^(druid|hunter|mage|paladin|priest|rogue|shaman|warlock|warrior):(20|30|40|60):[a-z][a-z0-9_-]*:(P[1-6]|P7\.[1-5])$ ]] ||
              { echo "Invalid gate target: $entry" >&2; exit 2; }
            gate="${entry##*:}"
            # P7.1 supports a genuine short coupled-native diagnostic.
            # The full 1000-fight acceptance still requires --heavy.
            if [[ "$heavy" != true && ( "$gate" == P6 || ( "$gate" == P7.* && "$gate" != P7.1 ) ) ]]; then
              echo "Gate $gate needs explicit --heavy / allow_heavy opt-in" >&2; exit 2
            fi
            if [[ -z "${seen[$entry]:-}" ]]; then
              unique+=("$entry")
              seen[$entry]=1
            fi
          done
          printf 'targets=%s\n' "$(IFS=' '; echo "${unique[*]}")" >> "$GITHUB_OUTPUT"
          printf 'heavy=%s\n' "$heavy" >> "$GITHUB_OUTPUT"
          p7_needed=false
          for entry in "${unique[@]}"; do
            if [[ "$entry" == *:P7.* ]]; then p7_needed=true; fi
          done
          printf 'p7_needed=%s\n' "$p7_needed" >> "$GITHUB_OUTPUT"
          echo "Accepted ${#unique[@]} production targets"

      - name: Checkout current main, without saved write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      # Any executable P7 gate needs the identical pinned production engine.
      # This is the same upstream + world ingress build as the established
      # Rust/gsim production integration workflow, not a gate-only simulator.
      - name: Checkout pinned production Rust engine for selected P7 gate
        if: steps.targets.outputs.p7_needed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
          persist-credentials: false

      - name: Patch production world ingress for selected P7 gate
        if: steps.targets.outputs.p7_needed == 'true'
        run: python integrations/mythicsim-rust/patch_world_ingress.py upstream

      - name: Build pinned production Rust engine for selected P7 gate
        if: steps.targets.outputs.p7_needed == 'true'
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      - name: Run real production gates and update one TSV
        shell: bash
        env:
          TARGETS: ${{ steps.targets.outputs.targets }}
          ALLOW_HEAVY: ${{ steps.targets.outputs.heavy }}
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          echo "Measured production HEAD: $(git rev-parse HEAD)"
          read -r -a entries <<< "$TARGETS"
          echo "## M1 live-gate results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gate | Verdict | Measured component / objective |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for entry in "${entries[@]}"; do
            IFS=: read -r class level spec gate <<< "$entry"
            echo "::group::M1 $entry"
            report="$(mktemp)"
            rc=0
            timeout_s=600
            # Current P5 probe is six seconds; do not require a heavy 300s
            # opt-in merely to obtain its first genuine functional PARTIAL.
            # If P5 later evolves into full acceptance, keep this light cap.
            if [[ "$gate" == P5 && "$ALLOW_HEAVY" != true ]]; then timeout_s=20; fi
            if [[ "$gate" == P7.1 && "$ALLOW_HEAVY" != true ]]; then
              # Only the approved producer can decide whether its actual
              # coupled DPS supports a provisional objective PARTIAL.
              # No 3/1000 "sample coverage" is recorded.
              export FOREVER_P7_LIVE_PROBE_ITERATIONS=3
              timeout_s=120
            else
              unset FOREVER_P7_LIVE_PROBE_ITERATIONS || true
            fi
            timeout "${timeout_s}s" python tools/wf_gate.py --class "$class" --level "$level" \
              --spec "$spec" --gate "$gate" --record-progress --out "$report" || rc=$?
            python -c 'import json,sys; from pathlib import Path; d=json.loads(Path(sys.argv[1]).read_text()); rc=int(sys.argv[2]); assert d["status"] in ("PASS","FAIL","BLOCKED") and rc in (0,1) and ((rc==0)==(d["status"]=="PASS")), "Incomplete or inconsistent live gate"; print(json.dumps(d, ensure_ascii=False))' "$report" "$rc"
            python - "$report" "$entry" <<'PY'
          import json, os, sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          item=d["results"][0]
          measure=(
              f'{item["verified"]:g}/{item["applicable"]:g}'
              if isinstance(item.get("verified"), (int, float))
              and isinstance(item.get("applicable"), (int, float))
              else f'{item["dps_objective_actual"]:g}/{item["dps_objective_required"]:g} DPS'
              if "dps_objective_actual" in item else "not measurable")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f'| `{sys.argv[2]}` | {d["status"]} | {measure} |\n')
          PY
            rm -f "$report"
            echo "::endgroup::"
          done
          python tools/m1_progress.py | tee "$RUNNER_TEMP/m1-scoreboard.txt"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '### M1 scoreboard (best measured)' >> "$GITHUB_STEP_SUMMARY"
          echo '~~~text' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/m1-scoreboard.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '~~~' >> "$GITHUB_STEP_SUMMARY"
          # Plot is a derived view of Git-backed M1 TSV snapshots, not a ledger.
          python tools/m1_progress.py --plot-svg docs/planning/M1_HISTORY.svg > /dev/null
          git diff --stat -- docs/planning/M1_PASSES.tsv docs/planning/M1_HISTORY.svg

      - name: Publish M1 ledger and README chart atomically
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/planning/M1_PASSES.tsv; then
            echo 'No genuinely improved gate evidence; M1 and chart stay unchanged.'
            exit 0
          fi
          # Upload both blobs once. Each retry builds a single two-path commit
          # from the freshest main; a concurrent ledger edit is fail-closed.
          ledger_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_PASSES.tsv |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
          plot_blob="$(jq -Rs '{content:.,encoding:"utf-8"}' docs/planning/M1_HISTORY.svg |
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input - --jq .sha)"
          expected="$(git rev-parse HEAD:docs/planning/M1_PASSES.tsv)"
          for attempt in 1 2 3; do
            current="$(gh api "repos/$GITHUB_REPOSITORY/contents/docs/planning/M1_PASSES.tsv?ref=main" --jq .sha)"
            [[ "$current" == "$expected" ]] ||
              { echo 'Concurrent M1 change: rerun live gates on fresh main' >&2; exit 1; }
            parent="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
            base_tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$parent" --jq .tree.sha)"
            new_tree="$(jq -nc --arg base "$base_tree" \
              --arg ledger "$ledger_blob" --arg svg "$plot_blob" \
              '{base_tree:$base,tree:[
                 {path:"docs/planning/M1_PASSES.tsv",mode:"100644",type:"blob",sha:$ledger},
                 {path:"docs/planning/M1_HISTORY.svg",mode:"100644",type:"blob",sha:$svg}
               ]}' | gh api --method POST "repos/$GITHUB_REPOSITORY/git/trees" --input - --jq .sha)"
            new_commit="$(jq -nc --arg tree "$new_tree" --arg parent "$parent" \
              --arg message "M1: record gates and refresh README chart (Actions $GITHUB_RUN_ID)" \
              '{message:$message,tree:$tree,parents:[$parent]}' |
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/commits" --input - --jq .sha)"
            if gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/main" \
              -f sha="$new_commit" -F force=false >/dev/null; then
              echo "M1 ledger + README chart updated in the same commit: $new_commit"
              exit 0
            fi
            echo "main advanced during publication (attempt $attempt); retrying"
          done
          echo 'Failed to publish M1 atomically after 3 attempts' >&2
          exit 1
