name: One-shot no-record M1 P1 P3 candidate probe
on:
  push:
    branches: [work/work2-p6-paid-replay-redgreen-20261102]
    paths: [.github/workflows/work2-p6-paid-replay-probe.yml]
jobs:
  real-gate-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Cheap genuine live P1/P3 gate candidates; NO record
        shell: bash
        run: |
          set +e
          for gate_and_level in P3:20 P3:30 P3:40 P1:30 P1:40 P1:60; do
            gate="${gate_and_level%%:*}"
            level="${gate_and_level#*:}"
            echo "=== CANDIDATE druid:L${level}:unrestricted:${gate} no-record ==="
            timeout 75s python tools/wf_gate.py --class druid --level "$level" --spec unrestricted --gate "$gate"
            echo "=== RC=$? ==="
          done
          exit 0
