name: Work2 one-shot P4 P5 paid receipt contract
on:
  push:
    branches: [work/work2-p6-paid-replay-redgreen-20261102]
    paths: [.github/workflows/work2-p6-paid-replay-probe.yml]
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - run: python -m pytest -q tests/generic/search/test_work2_p4_p5_cli_receipts.py tests/test_work2_p6_replay_receipts.py
      - run: python -m compileall -q tools/wf_gate.py tests/generic/search/test_work2_p4_p5_cli_receipts.py
