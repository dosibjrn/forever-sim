name: Actions artifact disposable deletion smoke

on:
  push:
    paths:
      - .github/workflows/actions-storage-clean-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  disposable-artifact-delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create tiny disposable proof
        shell: bash
        run: printf 'Disposable Actions storage test for run %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/actions-storage-probe.txt"

      - name: Upload one-day disposable proof
        uses: actions/upload-artifact@v4
        with:
          name: actions-storage-disposable-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/actions-storage-probe.txt
          retention-days: 1
          if-no-files-found: error

      - name: List, delete and verify only this run's disposable artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: actions-storage-disposable-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
          artifact_id="$(jq -er --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name) | .id] | if length == 1 then .[0] else error("expected exactly one own artifact") end' <<< "$artifacts")"
          bytes="$(jq -er --argjson id "$artifact_id" '.artifacts[] | select(.id == $id) | .size_in_bytes' <<< "$artifacts")"
          test "$bytes" -gt 0

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/delete.response" --write-out '%{http_code}' --request DELETE --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$api")"
          test "$status" = 204 || { echo "DELETE failed with HTTP $status"; cat "$RUNNER_TEMP/delete.response"; exit 1; }

          # GitHub can return stale GET=200 or a stale artifact listing
          # briefly after DELETE=204 (observed in cleanup run #42574446203).
          # Verify BOTH endpoints converge; never mistake 204 for final absence.
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/get.response" --write-out '%{http_code}' --header "Authorization: Bearer $GH_TOKEN" --header 'Accept: application/vnd.github+json' "$api")"
            if test "$status" != 200 && test "$status" != 404; then
              echo "FAIL: unexpected GET HTTP $status after DELETE" >&2
              exit 1
            fi
            remaining="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100")"
            if test "$status" = 404 && jq -e --argjson id "$artifact_id" '[.artifacts[] | select(.id == $id)] | length == 0' <<< "$remaining" >/dev/null; then
              echo "PASS: created, listed and deleted own disposable artifact id=$artifact_id ($bytes bytes); GET=404 and absent from run artifacts."
              break
            fi
            if test "$attempt" = 12; then
              echo "FAIL: deletion did not converge after 12 checks (last GET HTTP $status)" >&2
              exit 1
            fi
            echo "Deletion visibility pending (attempt $attempt/12, GET HTTP $status)"
            sleep 5
          done

      - name: Inventory repository artifact footprint (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.name,.size_in_bytes,.created_at,.workflow_run.id] | @tsv' > "$RUNNER_TEMP/actions-artifacts.tsv"
          echo "Active artifact count: $(wc -l < "$RUNNER_TEMP/actions-artifacts.tsv")"
          awk -F '\t' '{n++; total += $3} END {printf "Active artifact bytes: %.0f (%.2f MiB) from %d artifacts\\n", total, total/1048576, n}' "$RUNNER_TEMP/actions-artifacts.tsv"
          echo 'Largest currently retained artifacts (id, name, bytes, created_at, run):'
          sort -t "$(printf '\t')" -k3,3nr "$RUNNER_TEMP/actions-artifacts.tsv" | sed -n '1,15p'
          echo 'Largest artifact families (size MiB, count, prefix):'
          awk -F '\t' '{name=$2; sub(/-[0-9a-f]{40}$/, "", name); total[name]+=$3; count[name]++} END {for(name in total) printf "%.2f\t%d\t%s\\n", total[name]/1048576, count[name], name}' "$RUNNER_TEMP/actions-artifacts.tsv" | sort -k1,1nr | sed -n '1,25p'

