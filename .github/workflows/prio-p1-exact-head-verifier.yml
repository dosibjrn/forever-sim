name: One-shot P1 exact-HEAD source gate regression
on:
  push:
    branches:
      - work/prio-p1-exact-head-verifier-20261101
    paths:
      - .github/workflows/prio-p1-exact-head-verifier.yml
permissions:
  contents: read
jobs:
  p1:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout immutable PR84 HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c3d0c14ffbff0350e2cc779b8a902b8899db9e83
          lfs: true
          persist-credentials: false
      - name: Verify exact HEAD and source database hydration
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c3d0c14ffbff0350e2cc779b8a902b8899db9e83"
          git lfs ls-files | head -20 || true
          test -s data/forever/forever_sources.sqlite || true
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run real source-backed P1 regression
        env:
          WOW_FOREVER_BUILD_AS_OF: '2026-10-17'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf470_p1_scope.py
