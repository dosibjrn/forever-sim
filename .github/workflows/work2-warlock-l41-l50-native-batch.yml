name: Work2 Warlock source-native paid range L43-L44 (resumable)

# One actual bounded batch, not a new workflow for each Warlock level.
# Existing L20-L42 paid measurements remain accepted and are NOT repaid.
on:
  push:
    branches:
      - work2/warlock-l42-paid-20261110
    paths:
      - .github/workflows/work2-warlock-l41-l50-native-batch.yml
      - tools/wf_warlock_paid_range.py
      - tests/test_work2_warlock_paid_range.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-native-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact Work2 source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: project
      - name: Checkout selected source-native executor
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: 7b811d37969bd1886cf123835fc87b699d1f5fbd
          path: engine
      - name: Verify exact Rust source
        run: test "$(git -C engine rev-parse HEAD)" = "7b811d37969bd1886cf123835fc87b699d1f5fbd"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever-only regression requirements
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Regression — range cache, refusals, and paid route publication
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_paid_range.py \
            tests/test_work2_warlock_next_level_source.py \
            tests/test_work2_warlock_route_guide.py \
            tests/test_work2_native_paid_banked_path_dp.py \
            tests/test_work2_native_paid_route_publisher.py
      - name: Build exact native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Reuse archived actual L42 100/100 route (do not replay L20-L42)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p predecessor
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13757204616/zip" \
            -o predecessor.zip
          unzip -q predecessor.zip -d predecessor
          test -s predecessor/warlock-l42-source/source_request.json
          test -s predecessor/warlock-l42-native-route/route.json
      - name: Confirm old L42 paid 100/100 and exact submitted source
        working-directory: project
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.wf_warlock_next_level_source import verified_paid_predecessor
          before = verified_paid_predecessor(
              route=Path("../predecessor/warlock-l42-native-route/route.json"),
              source=Path("../predecessor/warlock-l42-source/source_request.json"),
              binary=Path("../engine/target/debug/forever-engine"),
              from_level=42,
              predecessor_binary_sha256="133c96ba50b7589036e062e18a3315e28ac2562064cb99e96d501fc4ee054458")
          print("REUSED_ACTUAL_PAID_L42", before, flush=True)
          PY
      - name: Generate and pay only new L43-L44 100-target levels, resumably
        id: range
        continue-on-error: true
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_paid_range.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../predecessor/warlock-l42-source/source_request.json \
            --predecessor-route ../predecessor/warlock-l42-native-route/route.json \
            --predecessor-binary-sha256 133c96ba50b7589036e062e18a3315e28ac2562064cb99e96d501fc4ee054458 \
            --from-level 42 --end-level 44 --max-new-levels 2 \
            --out ../warlock-paid-range
      - name: Check real paid or refused result, never claim a full route
        if: always() && steps.range.outcome != 'skipped'
        run: |
          test -s warlock-paid-range/range_progress.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("warlock-paid-range/range_progress.json").read_text())
          print(json.dumps(result, indent=2), flush=True)
          assert result["full_10_60_native_replay_executed"] is False
          assert result["elapsed_10_60_seconds"] is None
          assert result["selected_engine_binary_sha256"]
          assert result["completed_new_levels"] == [43, 44], (
              "Native paid L43-L44 not both completed; see exact proposal/refusal receipts")
          assert result["stopped"] is None
          PY
      - name: Preserve selected source, native 100-mob receipts, refusal and route output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-paid-range-${{ github.run_id }}
          path: |
            predecessor/warlock-l42-source/source_request.json
            predecessor/warlock-l42-native-route/route.json
            warlock-paid-range/
          if-no-files-found: warn
          retention-days: 3
