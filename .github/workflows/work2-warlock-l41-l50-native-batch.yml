name: Warlock native-paid adjacent range (parameterized and resumable)

# Explicit dispatch only: do not automatically repay native mob runs on push.
# Exact paid predecessor source/route and native binary remain separately verified.
# Never prefill the already-paid L44→L46 artifact/source parameters: a one-click
# manual dispatch would incur two redundant 100-mob native payments.
# This is a historical baseline continuation, NOT the Decisions-style optimizer.
on:
  workflow_dispatch:
    inputs:
      predecessor_artifact_id:
        description: "Explicit genuine predecessor artifact ID (not needed for new L10 root)"
        required: false
        type: string
      from_level:
        description: "Explicit predecessor level, or 10 for new L10 actor; L20-L60 baselines are already paid"
        required: true
        type: number
      end_level:
        description: "Explicit last genuinely unmeasured level (inclusive, max L60)"
        required: true
        type: number
      max_new_levels:
        description: "Upper bound on newly paid levels (does not repay completed ones)"
        required: true
        type: number
        default: 2
      max_proposals:
        description: "Per-level native candidate proposal budget"
        required: true
        type: number
        default: 30
      selected_rust_sha:
        description: "Explicit exact MythicSim native source commit (never inherit an old baseline pin)"
        required: true
        type: string
      resume_root_artifact_id:
        description: "Prior same-source L10 range artifact ID (optional; prevents repaying L10)"
        required: false
        type: string
        default: ""
      predecessor_binary_sha256:
        description: "Explicit paid predecessor binary SHA256 (not needed for new L10 root)"
        required: false
        type: string

permissions:
  contents: read
  actions: read  # Download the authenticated paid predecessor Actions artifact.

jobs:
  paid-native-range:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout exact Forever source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: project
      - name: Checkout selected source-native executor
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: ${{ inputs.selected_rust_sha }}
          path: engine
      - name: Verify exact Rust source
        env:
          SELECTED_RUST_SHA: ${{ inputs.selected_rust_sha }}
        run: test "$(git -C engine rev-parse HEAD)" = "$SELECTED_RUST_SHA"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever-only regression requirements
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Regression — range cache, refusals, and paid route publication
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_paid_range.py \
            tests/test_work2_warlock_next_level_source.py \
            tests/test_work2_warlock_l10_root.py \
            tests/test_work2_warlock_route_guide.py \
            tests/test_work2_native_paid_banked_path_dp.py \
            tests/test_work2_native_paid_route_publisher.py \
            tests/test_warlock_paid_artifact.py
      - name: Build exact native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Download only selected paid predecessor artifact (no native replay)
        if: ${{ inputs.from_level != 10 }}
        env:
          GH_TOKEN: ${{ github.token }}
          PREDECESSOR_ARTIFACT_ID: ${{ inputs.predecessor_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$PREDECESSOR_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p predecessor-archive
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/$PREDECESSOR_ARTIFACT_ID/zip" \
            -o predecessor.zip
          unzip -q predecessor.zip -d predecessor-archive
      - name: Stage exactly one paid predecessor source/receipt for requested level
        if: ${{ inputs.from_level != 10 }}
        working-directory: project
        env:
          FROM_LEVEL: ${{ inputs.from_level }}
        run: |
          python tools/wf_warlock_paid_artifact.py \
            --archive-dir ../predecessor-archive \
            --from-level "$FROM_LEVEL" --out ../predecessor-staged \
            --resume-cache-out ../warlock-paid-range
      - name: Confirm authentic predecessor 100/100 and source/binary lineage
        if: ${{ inputs.from_level != 10 }}
        working-directory: project
        env:
          FROM_LEVEL: ${{ inputs.from_level }}
          PREDECESSOR_BINARY_SHA256: ${{ inputs.predecessor_binary_sha256 }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from tools.wf_warlock_next_level_source import verified_paid_predecessor
          result = verified_paid_predecessor(
              route=Path("../predecessor-staged/route.json"),
              source=Path("../predecessor-staged/source_request.json"),
              binary=Path("../engine/target/debug/forever-engine"),
              from_level=int(os.environ["FROM_LEVEL"]),
              predecessor_binary_sha256=os.environ["PREDECESSOR_BINARY_SHA256"])
          print("REUSED_AUTHENTIC_PAID_PREDECESSOR", result, flush=True)
          PY
      - name: Download previous L10 root receipt only when explicitly requested
        if: ${{ inputs.from_level == 10 && inputs.resume_root_artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ROOT_ARTIFACT_ID: ${{ inputs.resume_root_artifact_id }}
        run: |
          set -euo pipefail
          [[ "$ROOT_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          mkdir -p root-resume-archive
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/$ROOT_ARTIFACT_ID/zip" \
            -o root-resume.zip
          unzip -q root-resume.zip -d root-resume-archive
      - name: Stage original L10 root cache for authenticated native reuse
        if: ${{ inputs.from_level == 10 && inputs.resume_root_artifact_id != '' }}
        working-directory: project
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.wf_warlock_paid_artifact import restore_l10_root_cache
          restored = restore_l10_root_cache(
              Path("../root-resume-archive"), Path("../warlock-paid-range"))
          print(json.dumps(restored, indent=2), flush=True)
          PY
      - name: Bootstrap a genuine L10 Rust actor and pay only still-unpaid L10–L19
        if: ${{ inputs.from_level == 10 }}
        id: root
        continue-on-error: true
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
          END_LEVEL: ${{ inputs.end_level }}
          MAX_NEW_LEVELS: ${{ inputs.max_new_levels }}
          MAX_PROPOSALS: ${{ inputs.max_proposals }}
        run: |
          python -u tools/wf_warlock_l10_root.py \
            --binary ../engine/target/debug/forever-engine \
            --template ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --end-level "$END_LEVEL" \
            --max-new-levels "$MAX_NEW_LEVELS" --max-proposals "$MAX_PROPOSALS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out ../warlock-paid-range
      - name: Pay only genuinely missing adjacent native levels, resumably
        if: ${{ inputs.from_level != 10 }}
        id: range
        continue-on-error: true
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
          FROM_LEVEL: ${{ inputs.from_level }}
          END_LEVEL: ${{ inputs.end_level }}
          MAX_NEW_LEVELS: ${{ inputs.max_new_levels }}
          MAX_PROPOSALS: ${{ inputs.max_proposals }}
          PREDECESSOR_BINARY_SHA256: ${{ inputs.predecessor_binary_sha256 }}
        run: |
          python -u tools/wf_warlock_paid_range.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../predecessor-staged/source_request.json \
            --predecessor-route ../predecessor-staged/route.json \
            --predecessor-binary-sha256 "$PREDECESSOR_BINARY_SHA256" \
            --from-level "$FROM_LEVEL" --end-level "$END_LEVEL" \
            --max-new-levels "$MAX_NEW_LEVELS" --max-proposals "$MAX_PROPOSALS" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out ../warlock-paid-range
      - name: Check actual newly paid/reused levels or report precise native refusal
        if: always() && steps.range.outcome != 'skipped'
        env:
          FROM_LEVEL: ${{ inputs.from_level }}
          END_LEVEL: ${{ inputs.end_level }}
          MAX_NEW_LEVELS: ${{ inputs.max_new_levels }}
          RANGE_STEP_OUTCOME: ${{ steps.range.outcome }}
        run: |
          # A restored cache may contain a previous run's progress marker.
          # Never publish that marker as proof if this invocation errored before
          # it could verify and republish the actual native-paid frontier.
          if [ "$RANGE_STEP_OUTCOME" != "success" ]; then
            echo "Native-paid range failed; cached progress cannot certify this invocation" >&2
            exit 1
          fi
          test -s warlock-paid-range/range_progress.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("warlock-paid-range/range_progress.json").read_text())
          print(json.dumps(result, indent=2), flush=True)
          start, end = int(os.environ["FROM_LEVEL"]), int(os.environ["END_LEVEL"])
          budget = int(os.environ["MAX_NEW_LEVELS"])
          assert result["from_level"] == start and result["end_level"] == end
          assert result["full_10_60_native_replay_executed"] is False
          assert result["elapsed_10_60_seconds"] is None
          assert result["selected_engine_binary_sha256"]
          assert len(result["completed_new_levels"]) <= budget
          seen = result["completed_new_levels"] + result["reused_levels"]
          assert all(start < level <= end for level in seen)
          assert len(seen) == len(set(seen))
          if result["stopped"] is not None:
              if result["stopped"]["status"] == "BOUNDED_NEW_LEVEL_BUDGET":
                  assert len(result["completed_new_levels"]) == budget
                  assert result["next_level"] == result["stopped"]["level"]
                  print("BOUNDED_RANGE_PAUSE: continue from original paid receipts", flush=True)
              else:
                  raise SystemExit(f"Range stopped with original receipts preserved: {result['stopped']}")
          else:
              assert sorted(seen) == list(range(start + 1, end + 1)), (
                  "not every requested level has a verified paid native receipt")
          PY
      - name: Confirm native-paid L10 root progress or preserve original native refusal
        if: always() && steps.root.outcome != 'skipped'
        env:
          ROOT_STEP_OUTCOME: ${{ steps.root.outcome }}
          END_LEVEL: ${{ inputs.end_level }}
          MAX_NEW_LEVELS: ${{ inputs.max_new_levels }}
        run: |
          test -s warlock-paid-range/range_progress.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path("warlock-paid-range/range_progress.json").read_text())
          print(json.dumps(result, indent=2), flush=True)
          assert result["kind"] == "warlock_native_l10_root_range_v1"
          assert result["from_level"] == 10 and result["end_level"] == int(os.environ["END_LEVEL"])
          assert result["full_10_60_native_replay_executed"] is False
          assert result["elapsed_10_60_seconds"] is None
          assert len(result["completed_new_levels"]) <= int(os.environ["MAX_NEW_LEVELS"])
          seen = result["completed_new_levels"] + result["reused_levels"]
          assert len(seen) == len(set(seen))
          if result["stopped"] is None:
              assert sorted(seen) == list(range(10, int(os.environ["END_LEVEL"]) + 1))
          elif result["stopped"]["status"] == "BOUNDED_NEW_LEVEL_BUDGET":
              assert seen and min(seen) == 10
          else:
              raise SystemExit(f"Original native refusal preserved: {result['stopped']}")
          PY
          if [ "$ROOT_STEP_OUTCOME" != "success" ]; then
            echo "Native L10 producer failed; current native paid 100/100 root is not certified" >&2
            exit 1
          fi
      # These are original paid 100-mob receipts, not disposable PR diagnostics.
      # L10 is resumed by artifact ID across dispatches; 3-day expiry would
      # force an unnecessary repeat or strand the unpaid L11–L19 continuation.
      - name: Preserve selected source, native 100-mob receipts, refusal and route output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-paid-range-${{ github.run_id }}
          path: |
            predecessor-staged/
            warlock-paid-range/
          if-no-files-found: warn
          retention-days: 30
