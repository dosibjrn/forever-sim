name: Work1 P7.4 paid-neighbor focused exact-HEAD regression (one shot)
on:
  push:
    branches:
      - work/work1-p74-paid-single-slot-enchant-neighbors-nov02
    paths:
      - .github/workflows/work1-p74-paid-neighbors-once.yml
permissions:
  contents: read
jobs:
  production-search-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Exact-HEAD actual P7.4 source-legal paid search regression
        run: |
          echo "HEAD $(git rev-parse HEAD)"
          python -m compileall -q tools/wf_gate_p7_4_live.py tests/gates/test_wf_gate_p7_4_live.py
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/test_work1_p7_full_gear_pool.py
