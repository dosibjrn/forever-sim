name: Read-only first-contact gate probe

on:
  workflow_dispatch:
    inputs:
      class_key:
        description: "Class key"
        required: true
        default: druid
        type: string
      level:
        description: "Character level"
        required: true
        default: "40"
        type: string
      spec:
        description: "Spec key"
        required: true
        default: unrestricted
        type: string
      gate_seconds:
        description: "Per-gate timeout in seconds"
        required: true
        default: "30"
        type: string
      total_seconds:
        description: "Total probe budget in seconds"
        required: true
        default: "300"
        type: string
  pull_request:
    paths:
      - ".github/workflows/read-only-gate-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.ref == 'prio/first-contact-nine-gate-20261103')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROBE_CLASS: ${{ inputs.class_key || 'druid' }}
      PROBE_LEVEL: ${{ inputs.level || '40' }}
      PROBE_SPEC: ${{ inputs.spec || 'unrestricted' }}
      PROBE_GATE_SECONDS: ${{ inputs.gate_seconds || '30' }}
      PROBE_TOTAL_SECONDS: ${{ inputs.total_seconds || '300' }}
      FOREVER_P7_LIVE_PROBE_ITERATIONS: "3"
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout exact current-main probe branch read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Hydrate and verify the exact selected Rust fork
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 integrations/mythicsim-rust/engine
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual" >&2
            exit 1
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || {
            echo "WRONG_RUST_FORK_REMOTE" >&2
            exit 1
          }
          ln -s "$engine" upstream
          python integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          if ! git -C "$engine" diff --quiet; then
            echo "M1_PINNED_RUST_NEEDS_UNPUBLISHED_TYPED_RNG_PATCH" >&2
            exit 1
          fi
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          {
            echo "## Probe source"
            echo
            echo "- Main SHA: $(git rev-parse HEAD)"
            echo "- Selected Rust gitlink: $actual"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the exact selected Rust engine
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked

      - name: Install gate runtime dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Run read-only first-contact probe (no M1 writes)
        env:
          GH_TOKEN: ${{ github.token }}
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_LIVE_PROBE_ITERATIONS: "3"
        shell: bash
        run: |
          set -euo pipefail
          python tools/wf_gate_probe.py \
            --class "$PROBE_CLASS" --level "$PROBE_LEVEL" --spec "$PROBE_SPEC" \
            --gate-seconds "$PROBE_GATE_SECONDS" --total-seconds "$PROBE_TOTAL_SECONDS" \
            | tee "$RUNNER_TEMP/wf-gate-probe.txt"
          {
            echo
            echo "## Read-only first-contact result"
            echo
            echo "No M1 ledger write was performed."
            echo
            cat "$RUNNER_TEMP/wf-gate-probe.txt"
          } >> "$GITHUB_STEP_SUMMARY"
