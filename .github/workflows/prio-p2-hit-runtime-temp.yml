name: Prio P2 sourced hit runtime (temporary)
on:
  push:
    branches: [prio/p2-natures-reach-runtime-hit-and-range-guard]
jobs:
  source-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest beautifulsoup4==4.13.4
      - name: Exact-source P2 regression (real CombatRuntime)
        run: python -m pytest -q tests/test_wf_prio_p2_legal_pair.py
      - name: Actual unrecorded Druid L60 Balance P2
        shell: bash
        run: |
          set +e
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P2 > /tmp/prio-p2.json
          rc=$?
          set -e
          cat /tmp/prio-p2.json
          test "$rc" -eq 1
          python - <<'PY'
          import json
          result=json.load(open('/tmp/prio-p2.json'))
          gate=result['results'][0]
          assert result['status']=='FAIL'
          assert gate['reachability_count']==103
          assert gate['pass_count']>=84
          assert all(any('source_offensive_range_world_behavior' in r for r in gate['reasons']
                         if r.startswith(f'natures_reach:{rank}:'))
                     for rank in (1,2)), gate['reasons']
          print('P2 genuine tested ranks:',gate['pass_count'],'/',gate['reachability_count'])
          print('Nature\'s Reach hit probed; range still fails closed')
          PY
