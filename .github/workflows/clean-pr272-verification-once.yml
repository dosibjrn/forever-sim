name: Clean PR 272 one-shot G50 service regression

on:
  push:
    branches:
      - clean/group-g50c-i-service-integration-20261102-1947
    paths:
      - .github/workflows/clean-pr272-verification-once.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Relocated service-queue tests and manual-verifier contract
        run: python -m pytest -q tests/integration/service/test_g50[c-i]_*.py tests/maintenance/test_manual_exact_pr_head_workflow.py -k 'not browser'
