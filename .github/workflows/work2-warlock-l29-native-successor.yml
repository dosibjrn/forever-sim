name: Work2 Warlock L29 native-paid continuation from exact L28 receipt

on:
  push:
    branches:
      - work2/warlock-l29-native-paid-20261110-1046
    paths:
      - .github/workflows/work2-warlock-l29-native-successor.yml

permissions:
  contents: read

jobs:
  paid-native-l29:
    # This pays one new L29 world chain on the source branch, not an L28 rerun.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work2 producer
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.sha }}
      - name: Checkout tested native actor source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify source pin
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
          git -C project rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever world adapter and tests
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify native-boundary producer and guide
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_warlock_route_guide.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py
      - name: Build exact pinned native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve exact L28 executed-world source and route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13744787375/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l28-native-route/native_l28/best_apl/source_request.json
          test -s previous/warlock-l28-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          route=json.loads(Path("previous/warlock-l28-native-route/route.json").read_text())
          source=Path("previous/warlock-l28-native-route/native_l28/best_apl/source_request.json").read_bytes()
          assert route["measured_levels"] == [20,21,22,23,24,25,26,27,28],route["measured_levels"]
          l28=[r for r in route["observations"] if r["level"]==28]
          assert l28 and any(r["source_request_sha256"]==hashlib.sha256(source).hexdigest()
                             for r in l28), "L28 actual paid-world source fingerprint mismatch"
          assert hashlib.sha256(source).hexdigest() == "a95614c6c995686a3ef9091547ffdd6379446ac65d60a878b8cbb3e24fa1cc76", "Unexpected L28 source request"
          assert route["full_10_60_native_replay_executed"] is False
          print("VERIFIED_PAID_L28_BASELINE",hashlib.sha256(source).hexdigest(),flush=True)
          PY
      - name: Propose actual L29 candidate using Rust options and prepare
        id: propose
        continue-on-error: true
        working-directory: project
        run: |
          python -u tools/wf_warlock_next_level_source.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l28-native-route/native_l28/best_apl/source_request.json \
            --predecessor-route ../previous/warlock-l28-native-route/route.json \
            --from-level 28 --to-level 29 \
            --out ../warlock-l29-source
      - name: Publish exact source-native L29 refusal without invented route
        if: steps.propose.outcome == 'failure'
        working-directory: project
        run: |
          test -s ../warlock-l29-source/proposal.json
          # A real, published refusal exits 2; preserve it as an honest
          # unmeasured L29 outcome rather than losing the route artifact.
          set +e
          python -u tools/wf_warlock_route_guide.py \
            --native-proposal ../warlock-l29-source/proposal.json \
            --baseline-observations ../previous/warlock-l28-native-route/route.json \
            --out ../warlock-l29-native-route
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          test -s ../warlock-l29-native-route/route.json
      - name: Execute actual hostile L29 100-target paid native Decisions chain
        if: steps.propose.outcome == 'success'
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 29 \
            --binary ../engine/target/debug/forever-engine \
            --source ../warlock-l29-source/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --baseline-observations ../previous/warlock-l28-native-route/route.json \
            --trial paid-source-native-l29 \
            --out ../warlock-l29-native-route
      - name: Preserve full actual L28 source, L29 requests, refusals and measured guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l29-paid-${{ github.run_id }}
          path: |
            previous/warlock-l28-native-route/native_l28/best_apl/source_request.json
            previous/warlock-l28-native-route/route.json
            warlock-l29-source/
            warlock-l29-native-route/
          if-no-files-found: warn
          retention-days: 3
