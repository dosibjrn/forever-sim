name: PR280 focused P7 and M1 regressions (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-focused-p7-m1.yml'
      - 'tools/wf_gate_coverage.py'
      - 'tools/wf_gate_p7_5_live.py'
      - 'src/game/p7_reference_floors.py'
      - 'tests/gates/test_p7_reference_floors.py'
      - 'tests/maintenance/test_m1_progress.py'
      - 'tests/test_wf_gate_p7_5_live.py'
permissions:
  contents: read
jobs:
  p7-m1-regressions:
    if: ${{ github.event.pull_request.number == 280 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR HEAD with source LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
      - name: Confirm exact changed source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "PR #280 exact HEAD $(git rev-parse HEAD)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Compile affected source and focused tests
        run: |
          python -m compileall -q src/game/p7_reference_floors.py tools/wf_gate_coverage.py tools/wf_gate_p7_5_live.py tests/gates/test_p7_reference_floors.py tests/maintenance/test_m1_progress.py tests/test_wf_gate_p7_5_live.py
      - name: Run six focused regressions (not a P7 production acceptance)
        run: |
          python -m pytest -q tests/gates/test_p7_reference_floors.py tests/maintenance/test_m1_progress.py tests/test_wf_gate_p7_5_live.py tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py
