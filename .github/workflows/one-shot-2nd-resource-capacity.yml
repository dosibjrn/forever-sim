name: One-shot 2nd source resource capacity RED GREEN
on:
  push:
    branches:
      - work/2nd-source-resource-capacity-wait-20261101
    paths:
      - .github/workflows/one-shot-2nd-resource-capacity.yml
permissions:
  contents: read
jobs:
  sourced-cost:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: RED source-backed impossible-cost repro on unmodified main
        shell: bash
        run: |
          set -euo pipefail
          echo "EXACT_HEAD=$(git rev-parse HEAD)"
          cp src/game/runtime/simulator.py /tmp/patched-simulator.py
          git show 5144bd2310ae13ad99a6b704fffa340883afe01e:src/game/runtime/simulator.py > src/game/runtime/simulator.py
          set +e
          python -m pytest -q tests/test_source_policy_resource_guard_regen.py -k cost_above_capacity > /tmp/source-red.txt 2>&1
          code=$?
          set -e
          cat /tmp/source-red.txt
          test "$code" -ne 0
          grep -q 'AssertionError' /tmp/source-red.txt
          cp /tmp/patched-simulator.py src/game/runtime/simulator.py
      - name: GREEN source Rogue runtime and negative controls
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pytest -q tests/test_source_policy_resource_guard_regen.py tests/test_wf373_pack_policy.py -k 'sourced_rogue or apl_finishes_entire_three_target_pack'
