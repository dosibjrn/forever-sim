name: Repository maintenance regressions
on:
  pull_request:
    paths:
      - 'tests/maintenance/**'
      - 'tests/integration/source/**'
      - 'tests/mechanics/**'
      - 'tools/audit_feral_p7_holdout.py'
      - 'tools/import_feral_p7_archives.py'
      - 'docs/evidence/druid-p7/recovered/raw/**'
      - '.github/workflows/maintenance-evidence-tests.yml'

permissions:
  contents: read

jobs:
  source-layout-and-evidence-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and retained evidence
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify grouped mechanics layout and preserved evidence assertions
        run: >-
          python -m pytest -q
          tests/maintenance
          tests/test_prio_discrete_stat_sensitivity.py
          tests/test_wf380_legacy_bonus_talent_budget.py
          tests/mechanics/druid/test_druid_mechanics_layout.py
          tests/mechanics/hunter/test_hunter_mechanics_layout.py
          tests/mechanics/mage/test_mage_extended_layout.py
          tests/mechanics/paladin/test_paladin_mechanics_layout.py
