permissions:
  contents: read

jobs:
  source-layout-and-evidence-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and retained evidence
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify retained WF243 policy decoder fail-closed regression
        run: >-
          python -m pytest -q
          tests/test_wf243_source_joint_repeated_pulls.py::test_heldout_illegal_action_and_talent_fail_closed
      - name: Compile retained repeated-pull policy consumers
        run: >-
          python -m py_compile
          src/v2/source_multi_pull_joint.py
          tools/wf282_source_role_heldout_benchmark.py
          tools/wf298_druid_l20_verified_delta.py
      - name: Compile live P7 gate providers
        run: >-
          python -m py_compile
          tools/wf_gate_coverage.py
          tools/wf_gate_p7_2_live.py
          tools/wf_gate_p7_3_live.py
          src/engine_client/native_talent_proposals.py
          tools/wf_gate.py
          tools/wf_gate_p7_4_live.py
          tools/wf_gate_p7_5_live.py
          tools/wf_gate_p7_5_receipts.py
          src/v2/source_budgeted_gear.py
          tools/wf_gate_p3_live.py
          src/game/native_p3_player_context.py
          tests/test_p7_search_deadline_contract.py
      - name: Verify retained bounded-joint source helpers and caller import
        run: |
          python -m py_compile src/game/checkpoint_pipeline.py src/v2/source_bounded_joint_frontier.py
          python -m pytest -q tests/gates/test_wf384_generic_checkpoint_pipeline.py tests/test_wf390_generic_talent_execution_pipeline.py
      - name: Verify grouped mechanics layout and preserved evidence assertions
        run: >-
          python -m pytest -q
          tests/maintenance
          tests/generic/search/test_v2_path_dp_tiebreak.py
          tests/test_wf305_source_action_scope.py
          tests/gates/test_wf_gate_class_cli.py
          tests/gates/test_wf_gate_runtime_authority.py
          tests/test_wf270_index_to_ir_action_frontier.py
          tests/test_wf272_source_ranked_periodic_finisher.py
          tests/test_wf328_mode_joint_prefix_admission.py
          tests/test_wf330_queued_swing_source_runtime.py
          tests/test_wf331_druid20_source_web_l0.py
          tests/test_wf332_runes_default_off.py
          tests/test_wf319_druid_l20_canonical_numeric_authority.py::test_real_l20_druid_core_spell_amounts_match_canonical_sqlite
          tests/test_wf322_druid_l20_web_observed_build_parity.py::test_historical_build_uses_canonical_index_not_future_external_stage
          tests/test_wf322_druid_l20_web_observed_build_parity.py::test_newer_web_text_stage_changes_actual_core_runtime_but_not_canonical
          tests/test_wf_feral01c2c_heart_runtime.py
          tests/test_wf_feral01c2d1_strength_gear.py
          tests/test_p7_search_deadline_contract.py
          tests/gates/test_wf_gate_p7_5_prior.py
          tests/gates/test_wf_gate_p7_5_receipts.py
          tests/test_wf246_primary_stat_combat.py
          tests/test_wf309_source_stat_aura_pipeline.py
          tests/test_prio_discrete_stat_sensitivity.py
          tests/test_prio_p3_source_policy_sp.py
          tests/test_work2_paladin_p3_source_naked.py
          tests/test_work2_paladin_native_context.py
          tests/test_native_p3_item_options.py
          integrations/mythicsim-rust/tests/test_port_native_typed_rng.py
          tests/test_wf410_process_v2_equipped_weapon_dependency_tdd.py
          tests/test_selected_source_plumbing.py
          tests/test_wf311_verified_detail_effect_pipeline.py
          tests/test_wf313_source_batch_quarantine.py
          tests/test_prio_p3_live_sourced_chance_gear.py
          tests/test_wf380_legacy_bonus_talent_budget.py
          tests/test_wf241_mixed_hot_recovery.py
          tests/test_actor_recovery_channel.py
          tests/test_wf61_companion_persistence.py
          tests/test_work2_persistent_pack_budget.py
          tests/test_wf252_companion_joint.py
          tests/mechanics/druid/test_druid_mechanics_layout.py
          tests/mechanics/druid/test_druid_cat_closure_v0114896.py
          tests/mechanics/druid/test_druid_balance_mana_weights_v0114854.py
          tests/mechanics/druid/test_druid_shared_form_recovery_cycle_v0114898.py
          tests/mechanics/hunter/test_hunter_mechanics_layout.py
          tests/mechanics/mage/test_mage_extended_layout.py
          tests/mechanics/paladin/test_paladin_mechanics_layout.py

      - name: Verify Paladin L20 P3 refuses an absent selected native engine
        shell: bash
        run: |
          set -euo pipefail
          unset FOREVER_P3_NATIVE_ITEM_OPTIONS_BIN FOREVER_P3_NATIVE_PLAYER_CONTEXT_BIN
          report="$RUNNER_TEMP/paladin-l20-p3-native-refusal.json"
          rc=0
          python tools/wf_gate.py --class paladin --level 20 --spec unrestricted \
            --gate P3 --out "$report" || rc=$?
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          assert int(sys.argv[2]) == 1, report
          assert report["class"] == "paladin" and report["level"] == 20, report
          assert report["gate"] == "P3" and report["status"] == "BLOCKED", report
          assert report["results"][0]["reasons"] == [
              "P3_NATIVE_ITEM_OPTIONS_BINARY_REQUIRED"], report
          assert "real_source_search_evaluated" not in report["results"][0], report
          print("PALADIN_L20_P3_NATIVE_BINARY_REQUIRED", flush=True)
          PY
