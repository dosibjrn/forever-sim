name: Repository maintenance regressions
on:
  pull_request:
    paths:
      - 'tests/maintenance/**'
      - 'tests/integration/source/**'
      - 'tests/mechanics/**'
      - 'src/rulesets/forever/classes/druid/mechanics.py'
      - 'src/optimization/leveling_score.py'
      - 'src/scenarios/leveling_targets.py'
      - 'tools/audit_feral_p7_holdout.py'
      - 'tools/import_feral_p7_archives.py'
      - 'tools/wf_gate_coverage.py'
      - 'tools/p1_native_source_inventory.py'
      - 'tools/p1_native_progress.py'
      - 'tools/wf_p1_native_scope_matrix.py'
      - 'tools/wf_p1_native_effects.py'
      - 'tests/gates/test_p1_native_progress.py'
      - 'tests/gates/test_wf_p1_native_blackbox.py'
      - 'tools/wf_gate_p1_live.py'
      - 'tests/test_wf469_p1_alignment.py'
      - 'tests/test_wf470_p1_scope.py'
      - 'tests/gates/test_wf34_*acquisition*.py'
      - 'tools/wf_gate_p7_2_live.py'
      - 'tools/wf_gate_p7_3_live.py'
      - 'tools/wf_gate_p7_4_live.py'
      - 'tools/wf_gate_p7_5_live.py'
      - 'tests/test_p7_search_deadline_contract.py'
      - 'docs/evidence/druid-p7/recovered/raw/**'
      - 'src/game/evaluation.py'
      - 'src/optimization/evaluation.py'
      - 'src/v2/class_model.py'
      - 'src/v2/generic_frontier.py'
      - 'src/v2/generic_melee_routes.py'
      - 'src/v2/generic_backend.py'
      - '.github/workflows/maintenance-evidence-tests.yml'

permissions:
  contents: read

jobs:
  source-layout-and-evidence-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source and retained evidence
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Compile live P7 gate providers
        run: >-
          python -m py_compile
          tools/wf_gate_coverage.py
          tools/wf_gate_p7_2_live.py
          tools/wf_gate_p7_3_live.py
          tools/wf_gate_p7_4_live.py
          tools/wf_gate_p7_5_live.py
          tests/test_p7_search_deadline_contract.py
      - name: Verify grouped mechanics layout and preserved evidence assertions
        run: >-
          python -m pytest -q
          tests/maintenance
          tests/gates/test_p1_native_progress.py
          tests/gates/test_wf_p1_native_blackbox.py
          tests/test_wf469_p1_alignment.py
          tests/test_wf470_p1_scope.py
          tests/test_p7_search_deadline_contract.py
          tests/gates/test_wf_gate_p7_5_prior.py
          tests/test_wf246_primary_stat_combat.py
          tests/test_wf309_source_stat_aura_pipeline.py
          tests/test_prio_discrete_stat_sensitivity.py
          tests/test_wf380_legacy_bonus_talent_budget.py
          tests/mechanics/druid/test_druid_mechanics_layout.py
          tests/mechanics/druid/test_druid_cat_closure_v0114896.py
          tests/mechanics/druid/test_druid_balance_mana_weights_v0114854.py
          tests/mechanics/druid/test_druid_shared_form_recovery_cycle_v0114898.py
          tests/mechanics/hunter/test_hunter_mechanics_layout.py
          tests/mechanics/mage/test_mage_extended_layout.py
          tests/mechanics/paladin/test_paladin_mechanics_layout.py
