name: Merge once — exact PR158 launcher regression
on:
  push:
    branches: [merge/verify-clean158-20261102]
    paths: [.github/workflows/merge-clean158-one-shot.yml]
permissions:
  contents: read
jobs:
  verify-clean158:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 4
          persist-credentials: false
      - name: Require exact PR head and only verification workflow delta
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "bcc2fab1ef071a1508573224932f65adb2c360b6"
          test "$(git diff --name-only HEAD~3 HEAD)" = ".github/workflows/merge-clean158-one-shot.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install bounded test prerequisites
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5 playwright==1.56.0 beautifulsoup4==4.13.4
          command -v chromium || command -v google-chrome || command -v chromium-browser || true
      - name: Confirm V1 pre-existing publicationList failure on untouched main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin b56315b8a9a8d7a5278e1327b81ee8e97fe3eafb
          git worktree add --detach "$RUNNER_TEMP/baseline" b56315b8a9a8d7a5278e1327b81ee8e97fe3eafb
          cd "$RUNNER_TEMP/baseline"
          export REQUIRE_CHROMIUM=1 PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          set +e
          python -m pytest -q --tb=short tests/test_v1_browser_workflow_v0114819.py > "$RUNNER_TEMP/baseline-v1.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/baseline-v1.log"
          if [ "$code" -eq 0 ]; then echo "V1 passes on main but fails on candidate: regression" >&2; exit 1; fi
          grep -q "test_v1_browser_workflow_v0114819.py:180" "$RUNNER_TEMP/baseline-v1.log"
          grep -q "1 failed" "$RUNNER_TEMP/baseline-v1.log"
          echo "BASELINE_HAS_SAME_V1_FAILURE_AT_PUBLICATION_LIST"
      - name: Actual PR V2 V3 and launcher maintenance regressions
        shell: bash
        run: |
          set -euo pipefail
          export REQUIRE_CHROMIUM=1 PYTHONUTF8=1 PYTHONIOENCODING=utf-8
          python -m pytest -q -r s tests/test_v2_restart_persistence_v0114820.py tests/test_v3_checkpoint_failure_semantics_v0114821.py
          python -m pytest -q tests/maintenance/test_root_launcher_relocation.py
          for n in 1 2 3; do bash -n "scripts/commands/run-validation-v${n}.sh"; done
          if command -v pwsh >/dev/null; then
            pwsh -NoProfile -Command '$errors = @(); 1..3 | ForEach-Object { $p = "scripts/commands/run-validation-v$_.ps1"; $tokens = [System.Management.Automation.PSParser]::Tokenize((Get-Content -Raw $p), [ref]$errors); if ($errors.Count -gt 0) { throw "PowerShell parse error in $p" } }'
          fi
