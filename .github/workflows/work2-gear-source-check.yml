name: Work2 one-shot source gear legality check

on:
  push:
    branches:
      - work/2nd-verify-paid-winner-gear-legality-20261102
    paths:
      - src/v2/source_paid_cold_comparison.py
      - tests/test_wf_p6_gear_source_snapshot.py
      - .github/workflows/work2-gear-source-check.yml

permissions:
  contents: read

jobs:
  focused-source-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run actual pinned source and paid-winner legality regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf_p6_gear_source_snapshot.py
