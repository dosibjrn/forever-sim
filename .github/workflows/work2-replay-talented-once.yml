name: Work2 one-shot real source replay talent budget RED GREEN
on:
  push:
    branches:
      - work/work2-pin-independent-replay-talented-20261102
permissions:
  contents: read
jobs:
  real-source-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Focused source dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Genuine source RED on main production replay
        shell: bash
        run: |
          set -euo pipefail
          cp src/v2/source_bounded_joint_frontier.py /tmp/work2_green.py
          git fetch --depth=1 origin main
          git show FETCH_HEAD:src/v2/source_bounded_joint_frontier.py > src/v2/source_bounded_joint_frontier.py
          set +e
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py -k test_independent_100mob_replay_pins_talented_budget_from_real_source_search > /tmp/work2_red.log 2>&1
          status=$?
          set -e
          cat /tmp/work2_red.log
          if [[ "$status" -eq 0 ]]; then
            echo 'RED control unexpectedly passed' >&2
            exit 1
          fi
          grep -Eq 'INDEPENDENT_100MOB_TALENT_BUDGET_MISMATCH|Regex pattern did not match' /tmp/work2_red.log || {
            echo 'RED control failed for unrelated reason' >&2
            exit 1
          }
          cp /tmp/work2_green.py src/v2/source_bounded_joint_frontier.py
      - name: GREEN current source replay budget and real paid gear regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py -k 'independent_100mob_replay_pins_talented_budget_from_real_source_search or source_legal_atomic_weapon_package_is_paid_before_second_slot_item or source_legal_slots_get_early_paid_witnesses'
