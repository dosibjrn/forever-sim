name: Work2 Warlock L40 paid native talent challenger

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - .github/workflows/work2-warlock-l40-paid-alternative.yml
      - tools/wf_warlock_l40_alternative.py
      - tests/test_work2_warlock_l40_alternative.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l40-native-alternative:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact Work2 challenger
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout source-matched Rust engine
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify immutable engine identity
        run: |
          set -euo pipefail
          git -C project rev-parse HEAD
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native world adapter and focused tests
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Validate exact-source challenger, refusals and comparison
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_l40_alternative.py \
            tests/test_work2_warlock_next_level_source.py \
            tests/test_work2_warlock_route_guide.py
      - name: Build selected native Rust executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve original hostile paid L40 baseline and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13753162293/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l40-native-route/native_l40/best_apl/source_request.json
          test -s previous/warlock-l40-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("previous/warlock-l40-native-route")
          source = root / "native_l40/best_apl/source_request.json"
          route = json.loads((root / "route.json").read_text())
          sha = hashlib.sha256(source.read_bytes()).hexdigest()
          assert sha == "b07611f4c2928d464567eef87d87b6f2029414c3e3f843f01ca143a5bcf261c8"
          assert route["measured_levels"] == list(range(20, 41))
          rows = [o for o in route["observations"]
                  if o.get("level") == 40 and o.get("source_request_sha256") == sha
                  and o.get("status") == "measured_native_chain"]
          assert len(rows) == 1
          o = rows[0]
          assert o["targets_requested"] == o["targets_killed"] == 100
          assert o["native_world_ack"] is True and o["paid_native_recovery"] is True
          assert o["engine_binary_sha256"] == hashlib.sha256(
              Path("engine/target/debug/forever-engine").read_bytes()).hexdigest()
          print("ORIGINAL_PAID_L40", sha, o["elapsed_seconds_for_observed_chain"], flush=True)
          PY
      - name: Prepare one distinct L40 source-native talent contender
        working-directory: project
        run: |
          python -u -m tools.wf_warlock_l40_alternative propose \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l40-native-route/native_l40/best_apl/source_request.json \
            --baseline-route ../previous/warlock-l40-native-route/route.json \
            --out ../l40-challenger
      - name: Pay one genuine hostile retained-actor 100/100 Decisions trial
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 40 \
            --binary ../engine/target/debug/forever-engine \
            --source ../l40-challenger/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --trial paid-l40-talent-challenger \
            --out ../l40-challenger-paid
      - name: Compare paid L40 against original unrestricted baseline
        working-directory: project
        run: |
          python -u -m tools.wf_warlock_l40_alternative compare \
            --baseline-route ../previous/warlock-l40-native-route/route.json \
            --baseline-source ../previous/warlock-l40-native-route/native_l40/best_apl/source_request.json \
            --challenger-route ../l40-challenger-paid/route.json \
            --challenger-source ../l40-challenger-paid/native_l40/best_apl/source_request.json \
            --proposal ../l40-challenger/proposal.json \
            --out ../l40-paid-comparison.json
          python -m json.tool ../l40-paid-comparison.json > /dev/null
      - name: Retain original source, alternate proposals, native receipts and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l40-paid-alternative-${{ github.run_id }}
          path: |
            previous/warlock-l40-native-route/native_l40/best_apl/source_request.json
            previous/warlock-l40-native-route/route.json
            l40-challenger/
            l40-challenger-paid/
            l40-paid-comparison.json
          if-no-files-found: warn
          retention-days: 7
