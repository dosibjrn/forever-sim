name: Work2 P6 macro-target diversity 30s paid probe (one shot)
on:
  push:
    branches: [work/work2-p6-diverse-macro-targets-20261102]
    paths: [.github/workflows/work2-p6-diverse-targets-once.yml]
permissions:
  contents: read
jobs:
  real-paid-talent-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source-legal regressions and real 30s + 100-mob replay
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
          git rev-parse HEAD
          python -m pytest -q tests/test_work2_macro_target_diversity.py tests/test_work2_p6_full_source_checkpoint.py tests/test_work2_p6_replay_receipts.py
          mkdir -p work2-real
          python -m tools.wf437_direct_budgeted_run --budget 30 --checkpoint-class druid --checkpoint-level 60 --checkpoint-spec balance --output work2-real/t30.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('work2-real/t30.json').read_text())
          v=x.get('validation') or {}
          rows=[r for r in v.get('rows') or [] if r.get('status')=='COMPLETE' and r.get('count')==100]
          winner=min(rows,key=lambda r:r['full_s_per_mob']) if rows else None
          assert x.get('source_db_sha256')=='047204bab4b477420437c2680480312fbe2a1cd9f48085ef3ce70d00c955f2f9', 'SOURCE_CHANGED'
          assert v.get('complete_100mob_replays')==len(x.get('validation_shortlist') or []) and winner,'NOT_ALL_100MOB_COMPLETE'
          build=x['validation_shortlist'][int(winner['id'])]
          print('WORK2_P6_DIVERSE_TARGET_REAL='+json.dumps({
              'T30':winner['full_s_per_mob'],'baseline_T30':14.39155408333533,
              'T300_previous_paired':14.160863017969865,
              'ratio_vs_previous_T300':winner['full_s_per_mob']/14.160863017969865,
              'unique_paid':x.get('unique_full_builds'),
              'talent_probes':x.get('refinement',{}).get('talent_probes'),
              'full_replays':v.get('complete_100mob_replays'),
              'allocation':build.get('allocation'),
              'policy_signature':build.get('policy_signature'),
          },sort_keys=True),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: work2-p6-diverse-targets-30s
          path: work2-real/
          retention-days: 3
