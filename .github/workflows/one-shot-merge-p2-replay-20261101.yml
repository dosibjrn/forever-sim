name: One-shot P2 and replay integration verification
on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-merge-p2-replay-20261101.yml
permissions:
  contents: read
concurrency:
  group: one-shot-merge-p2-replay-20261101
  cancel-in-progress: true
jobs:
  source-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Real source P2 and policy replay regressions
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf_p2_cross_tree_source_witness.py tests/test_wf35_source_spec_p2_adapter.py tests/test_wf35_product_spec_profile_contract.py tests/test_wf391_generic_joint_frontier.py -k 'not mage_real_gear_talents_apl_recovery_100mob_no_acceptance'
          python -m pytest -q tests/test_wf437_fast_search_validation_tdd.py -k shortlist_serializes_source_gear_policy_and_independent_real_replay
