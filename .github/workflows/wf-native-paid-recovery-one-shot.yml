name: One-shot native paid recovery source witness (NOT P7)
on:
  push:
    branches: [work/first-native-paid-recovery-snapshot-20261101]
    paths: [.github/workflows/wf-native-paid-recovery-one-shot.yml]
permissions:
  contents: read
jobs:
  real-native-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          lfs: true
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - name: Source-backed gsim ACK regressions
        working-directory: project
        run: |
          python -m pip install --disable-pip-version-check pytest beautifulsoup4
          python -m pytest -q tests/test_wf_go_native_world_damage_ack.py tests/test_wf_native_health_feedback_perturbation.py
      - name: Build exact pinned Go native and source hooks
        run: |
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
          cd ..
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
          cd upstream
          go test -count=1 ./sim/core -run 'Test(WorldHealthACK|WorldBoundary|WorldSession)'
          go test -count=1 ./cmd/wf_gsim_go_world_ingress -run 'Test(WorldTargetTransition|WorldRangeFeed|RealWorldEffectACK)'
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Real paid recovery and native actor continuity for two source classes
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path('../gsim-go-world-ingress')
          cases=[
            ('Paladin',Path('../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json')),
            ('Druid L60 Balance',Path('docs/evidence/druid-l60-balance/p7.3/saved_728_request.json')),
          ]
          for label,source in cases:
              result=run(binary,source,ticks=100,target_spawn_yards=3.,
                         enemy_move_speed_yards_s=.1,target_health=100.,
                         pulls=2,recovery_s=2.)
              obs=result['observations']
              assert result['killed_target_ids']==['m1','m0'],(label,result['killed_target_ids'])
              split=next(i for i,o in enumerate(obs) if o['world_tick']['selected_target_id']=='m0')
              assert split>0,(label,split)
              before,after=obs[split-1],obs[split]
              delta=after['native_actor_state']['native_clock_ns']-before['native_actor_state']['native_clock_ns']
              assert delta>=2_000_000_000,(label,delta)
              assert after['native_actor_state']['native_clock_ns']==after['world_tick']['native_clock_ns']
              assert before['native_actor_state']['native_clock_ns']==before['world_tick']['native_clock_ns']
              assert len(before['native_actor_state']['cooldown_ready_at_ns'])==len(after['native_actor_state']['cooldown_ready_at_ns'])
              assert before['native_actor_state']['current_health']>0
              assert after['native_actor_state']['current_health']>0
              assert all(o['native_world_ack_confirmation']['native_process_id']==result['native_process_id'] for o in obs)
              events=[(o['world_tick']['selected_target_id'],e['event_id'])
                      for o in obs for e in o['native_damage_events']]
              assert any(t=='m1' for t,_ in events) and any(t=='m0' for t,_ in events),events
              assert len(set(e for _,e in events))==len(events),events
              print('REAL_PAID_RECOVERY',label,'ticks',len(obs),'gap_ns',delta,
                    'mana_before_after',before['native_actor_state']['current_mana'],
                    after['native_actor_state']['current_mana'],
                    'auras_before_after',before['native_actor_state']['active_auras'],
                    after['native_actor_state']['active_auras'],
                    'cooldown_timers',len(after['native_actor_state']['cooldown_ready_at_ns']))
          try:
              run(binary,cases[0][1],ticks=10,target_spawn_yards=3.,
                  target_health=100.,corrupt_ack=True)
          except RuntimeError as exc:
              assert 'WORLD_EFFECT_ACK_ID_OR_HASH_MISMATCH' in str(exc),str(exc)
              print('REAL_NEGATIVE_FORGED_ACK_REJECTED')
          else:
              raise AssertionError('FORGED_ACK_ACCEPTED')
          print('REAL_NATIVE_RECOVERY_NOT_P7')
          PY
