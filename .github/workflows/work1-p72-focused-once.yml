name: One-shot Work1 P7.2 scoped focused regression
on:
  push:
    branches:
      - work/work1-p72-300s-stochastic-final-20261102-c
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - run: python -m pytest -q tests/test_wf_gate_p7_2_live.py
