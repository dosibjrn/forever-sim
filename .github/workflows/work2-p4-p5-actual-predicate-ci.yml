name: Work2 P4/P5 normative predicate regression (temporary)
on:
  push:
    branches:
      - work/work2-p4-p5-actual-predicate-no-hidden-veto-20261102
jobs:
  predicate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Validate actual P4/P5 source-paid adapter
        run: python -m pytest -q tests/test_work2_full_source_p4_p5_gate_entry.py
      - name: Real sourced Druid L60 Balance P4 30s cold search no record
        shell: bash
        run: |
          set +e
          FOREVER_P4_P5_FULL_SOURCE=1 python tools/wf_gate.py --class druid --level 60 --spec balance --gate P4 --out /tmp/work2-p4-no-record.json
          result=$?
          set -e
          echo "P4 no-record return code: $result"
          python - <<'PY'
          import json
          x=json.load(open('/tmp/work2-p4-no-record.json'))
          for row in x.get('results', []):
              print(json.dumps(row, sort_keys=True))
          PY
