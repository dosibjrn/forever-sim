name: Work2 P4/P5 normative predicate regression (temporary)
on:
  push:
    branches:
      - work/work2-p4-p5-actual-predicate-no-hidden-veto-20261102
jobs:
  predicate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Validate actual P4/P5 source-paid adapter
        run: python -m pytest -q tests/test_work2_full_source_p4_p5_gate_entry.py
