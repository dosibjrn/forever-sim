name: Work2 30s two-round focused refinement diagnostic (one shot)
on:
  push:
    branches: [work/work2-p6-30s-validated-shortlist-20261102]
    paths: [.github/workflows/work2-p6-30s-shortlist-one-shot.yml]
permissions:
  contents: read
jobs:
  source-paid-shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source 2D paid frontier and shortlist regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          # The existing 8-second paid-runtime integration fixture for independent
          # full-horizon serialization is timing-sensitive on hosted runners;
          # it is not exercised by the CLI-only refinement parameter experiment.
          python -m pytest -q tests/generic/search/test_wf437_fast_search_validation_tdd.py -k 'not shortlist_serializes_source_gear_policy_and_independent_real_replay'
      - name: 30s two-round source-paid search and independent 100-mob finalists
        run: |
          set -euo pipefail
          python -m tools.wf437_direct_budgeted_run --budget 30 --checkpoint-class druid --checkpoint-level 60 --checkpoint-spec balance --output /tmp/work2-focused2.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/work2-focused2.json').read_text())
          v=r.get('validation') or {}
          rows=v.get('rows') or []
          winner=next((x for x in rows if str(x.get('id')) == str(v.get('validated_winner_id'))),None)
          receipt={'checkpoint':'druid:60:balance','status':v.get('status'),
                   'budget_s':r.get('requested_wall_budget_s'),'search_wall_s':r.get('wall_s'),
                   'source_db_sha256':r.get('source_db_sha256'),
                   'source_gear_catalogue_snapshot':r.get('source_gear_catalogue_snapshot'),
                   'source_slot_proposal_coverage':r.get('source_slot_proposal_coverage'),
                   'unique_paid':r.get('unique_full_builds'),
                   'refinement':r.get('refinement'),
                   'first_pass_screen_candidates':r.get('first_pass_screen_candidates'),
                   'backfill_screen_candidates':r.get('backfill_screen_candidates'),
                   'shortlist_size':len(r.get('validation_shortlist') or []),
                   '100mob_replays':v.get('100mob_replays'),
                   'complete_100mob_replays':v.get('complete_100mob_replays'),
                   'validated_winner_id':v.get('validated_winner_id'),
                   'validated_winner_full_s_per_mob':winner.get('full_s_per_mob') if winner else None,
                   'replayed_rows':[{'id':x.get('id'),'status':x.get('status'),'full_s_per_mob':x.get('full_s_per_mob')} for x in rows]}
          print('WORK2_30S_FOCUSED2_REAL_RECEIPT='+json.dumps(receipt,sort_keys=True,default=str),flush=True)
          assert receipt['budget_s']==30 and receipt['search_wall_s']<=30
          assert receipt['100mob_replays'] == receipt['shortlist_size']
          PY
