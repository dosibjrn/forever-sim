name: Merge one-shot CLEAN 170 relocated tests
on:
  push:
    branches: [work/merge-verify-clean170-20261102]
    paths: [.github/workflows/merge-clean170-once.yml]
permissions:
  contents: read
jobs:
  test-relocated-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Collect relocated tests
        run: python -m pytest --collect-only -q tests/gates
      - name: Execute relocated tests (no acceptance PASS recording)
        run: python -m pytest -q tests/gates
