name: Work1 P7.5 trusted prior evidence URL regression (not M1)
on:
  push:
    branches: [work/work1-p75-evidence-url-ci-20261103]
    paths:
      - '.github/workflows/work1-p75-evidence-url-ci.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact PR production and test blobs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:tools/wf_gate_p7_5_prior.py)" = ddd236525e747ca23cf851aa4ac351d5e6ec3178
          test "$(git rev-parse HEAD:tools/wf_gate_p7_5_receipts.py)" = 3faec3656bf2e4f36494558f08ce1ca53808d3bc
          test "$(git rev-parse HEAD:tests/gates/test_wf_gate_p7_5_receipts.py)" = 65e4ee1872b85c4f0f1f185eb0b96b5e9260c12e
          echo "Matching Work1 PR exact production and test blobs"
      - name: Run bounded P7.5 accepted-prior regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q tests/gates/test_wf_gate_p7_5_receipts.py tests/gates/test_wf_gate_p7_5_prior.py
          python -m compileall -q tools/wf_gate_p7_5_receipts.py tools/wf_gate_p7_5_prior.py
