name: P7 approved RNG final validation contract one-shot
on:
  pull_request:
    branches: [main]
jobs:
  actual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_gate_live_success_percent.py tests/test_work1_p7_1_live_entry.py tests/test_wf_gate_probe.py
      - run: python tools/m1_progress.py
      - name: Real P7.1 production preflight must fail closed without native Rust binary
        run: |
          python - <<'PY'
          from tools.wf_gate import ROOT, _run_live_gate
          r = _run_live_gate(ROOT, "druid", 60, "balance", "P7.1", "")
          print("REAL_P7_1_PREFLIGHT", r['status'], r.get('reasons'), flush=True)
          assert r['status'] != 'PASS'
          PY
