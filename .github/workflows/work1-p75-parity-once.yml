name: Work1 P7.5 parity negative-control one-shot
on:
  push:
    branches: [work/work1-p75-native-world-parity-guard-20261102]
    paths: [.github/workflows/work1-p75-parity-once.yml]
permissions:
  contents: read
jobs:
  focused-p75:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q tests/test_wf_gate_p7_5_live.py tests/test_wf_gate_p7_2_live.py tests/test_wf_gate_p7_3_live.py tests/test_wf_gate_p7_4_live.py
