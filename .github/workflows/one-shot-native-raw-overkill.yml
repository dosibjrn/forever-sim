name: One-shot native raw overkill ACK
on:
  push:
    branches: [work/first-native-raw-overkill-ack-20261102]
    paths: [.github/workflows/one-shot-native-raw-overkill.yml]
permissions:
  contents: read
jobs:
  real-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine-go
          ref: a667dce8492bd9fb94269a9f864289cb74006775
          path: upstream
      - uses: actions/setup-go@v5
        with:
          go-version-file: upstream/go.mod
          cache-dependency-path: upstream/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify pinned upstream and generate real native proto
        run: |
          set -euo pipefail
          test "$(git -C upstream rev-parse HEAD)" = "a667dce8492bd9fb94269a9f864289cb74006775"
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          export PATH="$(go env GOPATH)/bin:$PATH"
          cd upstream
          make sim/core/proto/api.pb.go
          cd ..
          python3 project/integrations/mythicsim-go/world_boundary/patch_native_spell_result.py upstream/sim/core/spell_result.go
          cp project/integrations/mythicsim-go/world_boundary/core/*.go upstream/sim/core/
          mkdir -p upstream/cmd/wf_gsim_go_world_ingress
          cp project/integrations/mythicsim-go/world_boundary/ingress/*.go upstream/cmd/wf_gsim_go_world_ingress/
      - name: Real native health ACK overkill and negative controls
        working-directory: upstream
        run: |
          go test -tags=with_db -count=1 ./sim/core -run 'TestWorldHealthACK' -v
          GO111MODULE=off go test -count=1 -v ./cmd/wf_gsim_go_world_ingress/feed.go ./cmd/wf_gsim_go_world_ingress/feed_test.go ./cmd/wf_gsim_go_world_ingress/world_damage_ack.go ./cmd/wf_gsim_go_world_ingress/world_damage_ack_test.go
          go build -tags=with_db -trimpath -o ../gsim-go-world-ingress ./cmd/wf_gsim_go_world_ingress
      - name: Real gsim/native two-target lethal overkill and retained actor
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from tools.wf_gsim_go_live_range_probe import run
          binary=Path('../gsim-go-world-ingress')
          request=Path('../upstream/sim/paladin/retribution/testdata/lights_vigil_request.json')
          result=run(binary,request,ticks=40,target_spawn_yards=3.,
                     target_health=10.,pulls=2,recovery_s=0.5)
          assert result['killed_target_ids']==['m1','m0'],result['killed_target_ids']
          assert result['native_process_reused']
          assert any(sum(e['damage'] for e in row['native_damage_events'])>
                     row['gsim_applied_world_ack']['world_target_health_before']
                     for row in result['observations'] if row['native_damage_events'])
          assert all(row['native_world_ack_confirmation']['native_world_health_applied']
                     for row in result['observations'])
          print('REAL_NATIVE_TWO_TARGET_OVERKILL_ACK_PASS')
          PY
