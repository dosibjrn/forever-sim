name: Native route candidate scorer (selected Rust + 2D, diagnostic only)

on:
  pull_request:
    paths:
      - '.github/workflows/native-route-candidate.yml'
      - '.gitmodules'
      - 'integrations/mythicsim-rust/engine'
      - 'integrations/mythicsim-rust/live_two_world_pulls.py'
      - 'integrations/mythicsim-rust/tests/test_native_route_candidate.py'
      - 'src/engine_client/native_candidate_client.py'
      - 'src/engine_client/native_route_candidate.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-route-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-rust-native-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Verify exact selected public Rust fork gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual"
            exit 1
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || {
            echo "WRONG_RUST_FORK_REMOTE"
            exit 1
          }
          echo "Selected MythicSim Rust SHA: $actual" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the existing 2D world bridge dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Build the exact selected Rust engine
        working-directory: integrations/mythicsim-rust/engine
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked --bin forever-engine

      - name: Run native candidate adapter and 100-target 2D world regression
        env:
          FOREVER_ENGINE_BINARY: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/release/forever-engine
        run: |
          python -m compileall -q \
            src/engine_client/native_candidate_client.py \
            src/engine_client/native_route_candidate.py
          python3 integrations/mythicsim-rust/tests/test_native_route_candidate.py
