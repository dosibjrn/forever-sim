name: Work2 Warlock L30 native-paid continuation from exact L29 receipt

on:
  push:
    branches:
      - work2/warlock-l30-native-paid-20261110-1101
    paths:
      - .github/workflows/work2-warlock-l30-native-successor.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paid-native-l30:
    # This pays one new L30 world chain on the source branch, not an L29 rerun.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work2 producer
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.sha }}
      - name: Checkout tested native actor source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify source pin
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
          git -C project rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever world adapter and tests
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify native-boundary producer and guide
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_warlock_route_guide.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py
      - name: Build exact pinned native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve exact L29 executed-world source and route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13748203142/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l29-native-route/native_l29/best_apl/source_request.json
          test -s previous/warlock-l29-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          route=json.loads(Path("previous/warlock-l29-native-route/route.json").read_text())
          source=Path("previous/warlock-l29-native-route/native_l29/best_apl/source_request.json").read_bytes()
          assert 29 in route["measured_levels"], "Paid L29 predecessor absent"
          l29=[r for r in route["observations"] if r["level"]==28]
          assert l29 and any(r["source_request_sha256"]==hashlib.sha256(source).hexdigest()
                             for r in l29), "L29 actual paid-world source fingerprint mismatch"
          assert hashlib.sha256(source).hexdigest() == "f96c1741445387567b431694349c7be33ec1ca9cc09f167b74c3060d735896b4", "Unexpected L29 source request"
          assert route["full_10_60_native_replay_executed"] is False
          print("VERIFIED_PAID_L29_BASELINE",hashlib.sha256(source).hexdigest(),flush=True)
          PY
      - name: Retrieve independent connected L20-L28 paid native route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13747302401/zip" \
            -o baseline.zip
          unzip -q baseline.zip -d baseline
          test -s baseline/warlock-l22-native-route/route.json
      - name: Reconcile actual L20-L29 paid observations and publish guide
        working-directory: project
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --native-summary ../previous/warlock-l29-native-route/native_l29/summary.json \
            --baseline-observations ../baseline/warlock-l22-native-route/route.json \
            --trial paid-source-native-l29-existing \
            --out ../combined
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("../combined/route.json").read_text())
          assert report["measured_levels"] == list(range(20,30)), report["measured_levels"]
          native=report["native_paid_talent_continuity"]
          assert native["levels"] == list(range(20,30)), native
          assert native["observed_100_mob_total_seconds"] > 0, native
          assert report["full_10_60_native_replay_executed"] is False
          assert report["elapsed_10_60_seconds"] is None
          assert len(report["unmeasured_levels"]) == 41
          print("VERIFIED_CONNECTED_NATIVE_PAID_L20_L29",native["observed_100_mob_total_seconds"],flush=True)
          PY
      - name: Propose actual L30 candidate using Rust options and prepare
        id: propose
        continue-on-error: true
        working-directory: project
        run: |
          python -u tools/wf_warlock_next_level_source.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l29-native-route/native_l29/best_apl/source_request.json \
            --predecessor-route ../combined/route.json \
            --from-level 29 --to-level 30 \
            --out ../warlock-l30-source
      - name: Publish exact source-native L30 refusal without invented route
        if: steps.propose.outcome == 'failure'
        working-directory: project
        run: |
          test -s ../warlock-l30-source/proposal.json
          # A real, published refusal exits 2; preserve it as an honest
          # unmeasured L30 outcome rather than losing the route artifact.
          set +e
          python -u tools/wf_warlock_route_guide.py \
            --native-proposal ../warlock-l30-source/proposal.json \
            --baseline-observations ../combined/route.json \
            --out ../warlock-l30-native-route
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          test -s ../warlock-l30-native-route/route.json
      - name: Execute actual hostile L30 100-target paid native Decisions chain
        if: steps.propose.outcome == 'success'
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 29 \
            --binary ../engine/target/debug/forever-engine \
            --source ../warlock-l30-source/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --baseline-observations ../combined/route.json \
            --trial paid-source-native-l30 \
            --out ../warlock-l30-native-route
      - name: Preserve full actual L29 source, L30 requests, refusals and measured guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l30-paid-${{ github.run_id }}
          path: |
            previous/warlock-l29-native-route/native_l29/best_apl/source_request.json
            previous/warlock-l29-native-route/route.json
            baseline/warlock-l22-native-route/route.json
            combined/
            warlock-l30-source/
            warlock-l30-native-route/
          if-no-files-found: warn
          retention-days: 3
