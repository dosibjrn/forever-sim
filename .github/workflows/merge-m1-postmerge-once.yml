name: Merge post-merge read-only M1 and source regression
on:
  push:
    branches: [merge/verify-postmerge-m1-and-paid-20261102-5]
    paths: [.github/workflows/merge-m1-postmerge-once.yml]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          fetch-depth: 2
          persist-credentials: false
      - name: Check only verifier added to merged main
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "b56315b8a9a8d7a5278e1327b81ee8e97fe3eafb"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-m1-postmerge-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: M1 official read-only scoreboard
        run: |
          set -euo pipefail
          python tools/m1_progress.py
      - name: Merged real source paid search and gear regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf409_talent_unlock_paid_witness_tdd.py tests/test_source_paid_gear_witness_priority.py tests/test_wf_prio_p3_spec_build.py tests/test_wf408_unified_production_item_score_p3_tdd.py tests/test_wf_gate_p3_approved.py -k 'not expensive'
