name: Work2 one-shot independent source-paid P6 replay
on:
  push:
    branches:
      - work/2nd-independent-p6-source-replay-20261102
    paths:
      - .github/workflows/work2-one-shot-p6-source-compare.yml
permissions:
  contents: read
  actions: read
jobs:
  real-source-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Independent 100-mob paid replays from pinned real cold searches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
          mkdir -p /tmp/p6-old
          gh run download 41361552002 --repo dosibjrn/forever-sim --name second-cold-same-space-evidence --dir /tmp/p6-old
          python -m tools.wf437_direct_budgeted_run --compare-30 /tmp/p6-old/cold30.json --compare-300 /tmp/p6-old/cold300.json --output /tmp/p6-new.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p6-new.json'))
          print('REAL_SOURCE_REPLAY',p,flush=True)
          assert p['status']=='PAID_COMPARISON_COMPLETE_DIAGNOSTIC_NOT_GATE_ACCEPTED'
          assert p['numeric_p6_within_1pct'] is True
          assert p['p5_10x_breadth'] is True
          assert p['same_source_legal_candidate_space_proven'] is False  # older reports
          assert p['eligible_for_checkpoint_acceptance'] is False
          assert len(p['replays'])==2
          assert all(r['status']=='COMPLETE' and r['count']==100 and r['events']>0 for r in p['replays'])
          PY
          python - <<'PY'
          import json
          p=json.load(open('/tmp/p6-old/cold300.json'))
          p['source_db_sha256']='0'*64
          json.dump(p,open('/tmp/p6-bad.json','w'))
          PY
          if python -m tools.wf437_direct_budgeted_run --compare-30 /tmp/p6-old/cold30.json --compare-300 /tmp/p6-bad.json --output /tmp/p6-bad-result.json; then
            echo 'ERROR: source hash mismatch was accepted' >&2
            exit 1
          fi
          echo 'NEGATIVE_SOURCE_HASH_REJECTED'
