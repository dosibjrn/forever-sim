name: Warlock L30 real Rust gear talent APL 100-mob optimization

on:
  push:
    branches: [work/warlock-l30-real-build-100mob-20261106]
    paths:
      - tools/wf_warlock_l30_talent_apl_optimizer.py
      - .github/workflows/warlock-l30-gear-talent-apl-100mob.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-l30-full-optimization:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout native world and optimizer
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout exact L30-capable Rust engine
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: 86c4329ddb25c7c21a9f49a72bd2721c490aedb7
          path: engine
      - name: Verify pinned engine and Python syntax
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "86c4329ddb25c7c21a9f49a72bd2721c490aedb7"
          python3 -m py_compile project/tools/wf_warlock_l30_talent_apl_optimizer.py
          echo "Selected Rust $(git -C engine rev-parse HEAD)"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing 2D gsim dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Build exact Rust implementation
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Actual L30 gear source paid scoring and 21 talent x APL x 100 mob
        working-directory: project
        run: |
          set -euo pipefail
          python3 -u tools/wf_warlock_l30_talent_apl_optimizer.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --engine-tools ../engine/tools \
            --out ../warlock-l30-optimizer-results \
            --max-finalists 6 --seed 10916
      - name: Save real native requests and paid 100-mob outcomes even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l30-real-gear-talents-apl-100mob
          path: warlock-l30-optimizer-results/
          if-no-files-found: warn
          retention-days: 14
