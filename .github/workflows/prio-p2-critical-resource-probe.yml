name: Prio P2 critical-resource live probe (temporary)
on:
  push:
    branches:
      - prio/p2-critical-resource-live-witness-20261102
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Source-ranked real runtime regression
        run: python -m pytest -q tests/test_prio_p2_live_critical_resource_gain.py
      - name: Druid L30 P2 live no-record
        run: python tools/wf_gate.py --class druid --level 30 --spec unrestricted --gate P2 --out /tmp/prio-p2-no-record.json
