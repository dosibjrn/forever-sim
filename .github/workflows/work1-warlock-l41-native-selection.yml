name: Work1 real paid L40 to L41 Troll Warlock native source check
on:
  push:
    branches:
      - work/work1-warlock-l41-native-selection-20261110
    paths:
      - .github/workflows/work1-warlock-l41-native-selection.yml
      - integrations/mythicsim-rust/engine
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-l41:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: forever
          submodules: false
      - uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: 7b811d37969bd1886cf123835fc87b699d1f5fbd
          path: engine
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Enforce production submodule pin equals executed Rust source
        run: |
          set -euo pipefail
          selected="$(git -C forever rev-parse HEAD:integrations/mythicsim-rust/engine)"
          executed="$(git -C engine rev-parse HEAD)"
          test "$selected" = "$executed"
          echo "PRODUCTION_SELECTED_RUST=$executed"
      - name: Fetch exact paid L40 source (not an invented level-41 actor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir paid-l40
          gh run download 42793230731 -R dosibjrn/forever-sim -n work2-warlock-l33-l40-paid-42793230731 -D paid-l40
          python3 - <<'PY'
          import hashlib, json, pathlib
          root = pathlib.Path("paid-l40")
          source = root / "warlock-l40-source/source_request.json"
          raw = source.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          expected = "b07611f4c2928d464567eef87d87b6f2029414c3e3f843f01ca143a5bcf261c8"
          assert sha == expected, (sha, expected)
          player = json.loads(raw)["raid"]["parties"][0]["players"][0]
          assert (player["class"],player["race"],player["level"]) == ("ClassWarlock","RaceTroll",40)
          assert len(player["equipment"]["items"]) == 17
          route = json.loads((root / "warlock-l40-native-route/route.json").read_text())
          rows = [row for row in route["observations"] if row["level"] == 40
                  and row.get("source_request_sha256") == expected
                  and row.get("status") == "measured_native_chain"
                  and row.get("targets_killed") == row.get("targets_requested") == 100
                  and row.get("paid_native_recovery") is True]
          assert len(rows) == 1, "L40 source must be the truly paid 100/100 predecessor"
          print("L40_EXACT_NATIVE_PAID_SOURCE", sha, flush=True)
          PY
      - name: Compile exact existing L41-L59 Rust actor implementation
        working-directory: engine
        run: |
          set -euo pipefail
          git rev-parse HEAD
          python3 tools/rust_data.py check
          cargo test --locked --lib troll_warlock_l41_to_l59_uses_exact_source_rows
          cargo build --locked --bin forever-engine
          target/debug/forever-engine options --class warlock --level 41 > ../native-l41-options.json
      - name: Submit authentic L40-to-L41 talent and gear proposals to native prepare
        run: |
          set -euo pipefail
          python3 -u forever/tools/wf_warlock_next_level_source.py \
            --binary engine/target/debug/forever-engine \
            --source paid-l40/warlock-l40-source/source_request.json \
            --from-level 40 --to-level 41 --max-proposals 30 \
            --out warlock-l41-native
          python3 - <<'PY'
          import json, pathlib
          r=pathlib.Path("warlock-l41-native")
          proposal=json.loads((r/"proposal.json").read_text())
          assert proposal["status"] == "NATIVE_PREPARED_NOT_YET_PAID", proposal
          source=json.loads((r/"source_request.json").read_text())
          actor=source["raid"]["parties"][0]["players"][0]
          assert (actor["class"],actor["race"],actor["level"]) == ("ClassWarlock","RaceTroll",41)
          assert proposal["original_source_sha256"] == "b07611f4c2928d464567eef87d87b6f2029414c3e3f843f01ca143a5bcf261c8"
          print("L41_REAL_NATIVE_PREPARE",json.dumps({
              "status":proposal["status"],"talents":actor["talentsString"],
              "equipped_slots":len(actor["equipment"]["items"]),
              "source_sha":proposal["selected_source_sha256"],
              "refusals":proposal.get("native_refusals_before_selection",[])
          }),flush=True)
          PY
      - name: Pay two hostile native gsim kills at new L41 actor (not 100-mob claim)
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
          python3 -u forever/tools/wf_warlock_l20_100mob.py \
            --binary engine/target/debug/forever-engine \
            --source warlock-l41-native/source_request.json \
            --out warlock-l41-native/paid-two-target \
            --targets 2 --actor-level 41 --variant best_apl \
            --hostile-player-tank --recovery-policy decisions \
            --health-threshold 0.7 --mana-threshold 0.25
          python3 - <<'PY'
          import json, pathlib
          r=json.loads(pathlib.Path("warlock-l41-native/paid-two-target/summary.json").read_text())
          assert r["target_count_requested"] == 2 and r["actor_level"] == 41, r
          run=r["results"][0]
          assert run["status"] == "COMPLETED_2_REAL_NATIVE_GSIM_KILLS",run
          assert run["killed"] == 2 and run["native_actor"]["level"] == 41
          assert run["native_actor_continuity_receipt_complete"] is True
          print("L41_2_HOSTILE_NATIVE_PAID",json.dumps({
              "status":run["status"],"kills":run["killed"],
              "elapsed_s":run["elapsed_s"],"recovery_s":run.get("native_recovery_seconds")
          }),flush=True)
          PY
      - name: Preserve real L41 prepare, refusal and combat receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-native-l41-source-selection-${{ github.run_id }}
          path: |
            native-l41-options.json
            warlock-l41-native/
          if-no-files-found: warn
          retention-days: 7
