name: Merge one-shot combined M1 read-only and source regressions
on:
  push:
    branches: [merge/verify-combined-m1-20261102]
    paths: [.github/workflows/merge-combined-m1-once.yml]
permissions:
  contents: read
jobs:
  combined:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          lfs: true
          persist-credentials: false
      - name: Require exactly combined main and only workflow-only delta
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6e334c17b3d77fef8d65a9e4f20eafc790e78b9a"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-combined-m1-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run official read-only M1 scoreboard
        run: |
          python tools/m1_progress.py
          git diff --exit-code -- docs/planning/M1_PASSES.tsv
      - name: Combined production-source P3/P4 and launcher regressions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_wf_prio_p3_spec_build.py tests/test_wf409_talent_unlock_paid_witness_tdd.py tests/test_source_paid_gear_witness_priority.py tests/maintenance/test_root_launcher_relocation.py
