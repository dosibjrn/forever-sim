name: Work2 one-shot source-paid saved replay check

on:
  pull_request:
    paths:
      - 'tools/wf437_direct_budgeted_run.py'
      - 'src/v2/source_paid_cold_comparison.py'
      - 'tests/test_work2_source_replay_snapshot_binding.py'
      - '.github/workflows/work2-source-replay-one-shot.yml'

permissions:
  contents: read

jobs:
  saved-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Source-hydrated focused production regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_work2_source_replay_snapshot_binding.py tests/test_work2_p6_full_source_checkpoint.py tests/test_wf_p6_gear_source_snapshot.py
