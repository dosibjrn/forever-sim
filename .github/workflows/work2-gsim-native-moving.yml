name: Work2 selected Rust native cast legality during real gsim movement
on:
  push:
    branches:
      - work/work2-native-gsim-movement-20261103-0625

permissions:
  contents: read

jobs:
  native-gsim-movement:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Port and compile exact selected Rust source
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          echo "branch=$(git rev-parse HEAD) selected_engine=$(git -C "$engine" rev-parse HEAD)"
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py "$engine"
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py "$engine"
          python3 integrations/mythicsim-rust/port_native_gsim_moving.py "$engine"
          python3 integrations/mythicsim-rust/port_native_gsim_moving.py "$engine"
          git -C "$engine" diff --check
          cargo check --locked --manifest-path "$engine/Cargo.toml"
          cargo build --locked --manifest-path "$engine/Cargo.toml" --bin forever-engine
      - name: Gsim true walk, Rust ingress and idempotence regressions
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python3 -m pytest -q tests/test_work2_gsim_world_walk.py tests/test_work2_rust_gsim_moving_port.py
      - name: Real source-native Rust ↔ gsim casts on 2D moving targets
        shell: bash
        run: |
          set -euo pipefail
          for targets in 2 3 16 100; do
            echo "::group::Real native cast legality over $targets world targets"
            python3 integrations/mythicsim-rust/live_two_world_pulls.py \
              --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
              --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
              --mob-health 1200 --targets "$targets"
            echo "::endgroup::"
          done
