name: Work1 selected-fork gitlink preflight regression (one-shot)
on:
  push:
    branches:
      - work/work1-p7-selected-fork-gitlink-20261103
    paths:
      - .github/workflows/work1-selected-fork-gitlink-one-shot.yml
      - tests/test_work1_p7_1_live_entry.py
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused regression dependency
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Validate genuine current gitlink (no Rust build or gate PASS claim)
        run: |
          python - <<'PY'
          from pathlib import Path
          from tools.wf_gate_p7_1_live import _selected_rust_submodule, PINNED_RUST
          root=Path.cwd()
          engine=root/'integrations/mythicsim-rust/engine'
          selected=_selected_rust_submodule(root, engine)
          assert selected is not None, 'P7_RUNNING_RUST_CHECKOUT_NOT_EXACT_PARENT_GITLINK'
          assert selected != PINNED_RUST, 'FORK_PROMOTION_NOT_EXERCISED'
          print('EXACT_FORK_GITLINK_PREFLIGHT_PASS', selected, 'saved_reference_engine', PINNED_RUST)
          PY
      - name: Focused P7.1 and P7.4 selected-source RED to GREEN
        run: |
          python -m pytest -q tests/test_work1_p7_1_live_entry.py tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_1_live.py tools/wf_gate_p7_2_live.py tools/wf_gate_p7_3_live.py tools/wf_gate_p7_4_live.py tools/wf_gate_p7_5_live.py
