name: Work2 one-shot real source paid gear depth

on:
  push:
    branches:
      - work/work2-paid-gear-depth-balanced-screens-20261102
    paths:
      - .github/workflows/work2-paid-gear-depth-once.yml

permissions:
  contents: read

jobs:
  work2-source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Exact source checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real source item depth and CombatRuntime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
          python -m pytest -q tests/test_source_paid_gear_witness_priority.py tests/test_source_wand_paid_slot_proposals.py
