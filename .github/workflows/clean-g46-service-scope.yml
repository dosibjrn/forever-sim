name: Clean G46 service relocation scoped check (temporary)
on:
  push:
    branches:
      - work/clean-g46-service-integration-tests-20261102

permissions:
  contents: read

jobs:
  service-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Run G46g and G46h service/listener integration regressions
        run: python -m pytest -q tests/integration/service/test_generic_g46g_authority.py tests/integration/service/test_generic_g46h_success_e2e.py
