name: Work1 P7.5 no-record current-pin diagnostic

on:
  pull_request:
    types: [opened]
    paths:
      - ".github/workflows/work1-p75-no-record.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: work1-p75-no-record-\${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  p75:
    if: >-
      github.event.pull_request.head.ref == 'work/work1-p75-no-record-20261103' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      FOREVER_P7_FULL_SOURCE_SEARCH: "1"
      FOREVER_MYTHICSIM_RUST_BIN: \${{ github.workspace }}/upstream/target/release/forever-engine
    steps:
      - name: Checkout exact PR HEAD without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Hydrate and verify exact selected Rust pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]]
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]]
          ln -s "$engine" upstream
          python integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          git -C "$engine" diff --quiet
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          {
            echo "PR HEAD: $(git rev-parse HEAD)"
            echo "Selected Rust pin: $actual"
            echo "No M1 recorder or ledger write is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build exact selected Rust engine
        working-directory: upstream
        run: cargo build --release --locked

      - name: Install production gate dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Collect accepted compatible P7.1-P7.4 M1 receipts (read-only)
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          accepted_receipts="$RUNNER_TEMP/p75-accepted-priors.json"
          python tools/wf_gate_p7_5_receipts.py \
            --repository "$GITHUB_REPOSITORY" --class druid \
            --level 60 --spec balance --out "$accepted_receipts"
          python - "$accepted_receipts" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          receipts = json.loads(path.read_text())["receipts"]
          engine = subprocess.check_output(
              ["git", "-C", "integrations/mythicsim-rust/engine",
               "rev-parse", "HEAD"], text=True).strip()
          compatible = [
              r for r in receipts
              if r.get("report", {}).get("status") == "PASS"
              and r.get("report", {}).get("native_source_revision") == engine
          ]
          if not compatible:
              raise SystemExit("No accepted P7.1-P7.4 prior revalidated on the selected Rust pin; do not spend the P7.5 holdout.")
          print("Selected Rust pin:", engine)
          print("Accepted compatible prior gates:",
                " ".join(sorted(r["gate"] for r in compatible)))
          for row in compatible:
              print(row["gate"], row["run_url"])
          PY
          cp "$accepted_receipts" "$RUNNER_TEMP/p75-accepted-priors.json"

      - name: Run full P7.5 production gate without M1 recording
        shell: bash
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          export FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS="$RUNNER_TEMP/p75-accepted-priors.json"
          report="$RUNNER_TEMP/p75.json"
          log="$RUNNER_TEMP/p75.log"
          set +e
          timeout 1500s python tools/wf_gate.py \
            --class druid --level 60 --spec balance --gate P7.5 \
            --out "$report" 2>&1 | tee "$log"
          rc=\${PIPESTATUS[0]}
          set -e
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["status"] in ("PASS", "FAIL", "BLOCKED"), report
          assert rc in (0, 1) and ((rc == 0) == (report["status"] == "PASS")), (rc, report)
          print(json.dumps(report, ensure_ascii=False))
          PY
          {
            echo
            echo "## No-record P7.5 production result"
            echo
            echo "Command: FOREVER_P7_FULL_SOURCE_SEARCH=1 python tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.5 --out <report>"
            echo
            echo "Selected Rust pin: $(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
            echo "No --record-progress flag; M1_PASSES.tsv was not written."
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/p75-artifact"
          cp "$report" "$log" "$RUNNER_TEMP/p75-artifact/"
          cp "$RUNNER_TEMP/p75-accepted-priors.json" "$RUNNER_TEMP/p75-artifact/"

      - name: Upload no-record P7.5 report, log and prior receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-p75-no-record-\${{ github.event.pull_request.head.sha }}
          path: \${{ runner.temp }}/p75-artifact/
          if-no-files-found: warn
