name: Live exact-submodule MythicSim Rust fight to real gsim world (NOT P7)
# Historical 10,000-fight stochastic and 1,000-fight balanced source probes
# are explicit diagnostics, not automatic CI or the current three-mob
# multi-level optimizer. Preserve manual execution and native assertions.
on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  pinned-rust-live-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
          submodules: true
      - name: Verify exact public Rust fork gitlink (never floating upstream)
        run: |
          set -euo pipefail
          engine=project/integrations/mythicsim-rust/engine
          recorded="$(git -C project ls-tree HEAD -- integrations/mythicsim-rust/engine | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] || {
            echo "RUST_FORK_SUBMODULE_PIN_MISMATCH recorded=$recorded actual=$actual"; exit 1;
          }
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]] || {
            echo 'WRONG_RUST_FORK_REMOTE'; exit 1;
          }
          ln -s project/integrations/mythicsim-rust/engine upstream
          echo "Trusted exact fork Rust source $actual"
      - name: Hydrate only the P7 source item catalogue from Git LFS
        working-directory: project
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing gsim source dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Exact-HEAD P7.3 source-gate regressions (not P7 acceptance)
        working-directory: project
        run: |
          echo "Focused production gate HEAD: $(git rev-parse HEAD)"
          python -m pytest -q \
            tests/test_wf_gate_p7_3_live.py \
            tests/test_wf_gate_p7_2_live.py \
            tests/test_work1_p7_balanced_native_world_rng.py \
            integrations/mythicsim-rust/tests/test_rng_extreme_probability_fix.py
      - name: Apply typed RNG port to exact pinned fork revision and verify the 2D world seam
        run: |
          python -m compileall -q project/integrations/mythicsim-rust/live_world_probe.py
          python project/integrations/mythicsim-rust/port_native_typed_rng.py upstream
          python project/integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          grep -Fq 'pub enum RngMode' upstream/src/core/rng.rs
          if grep -Fq 'WOWSIM_RNG_MODE' upstream/src/core/rng.rs; then
            echo 'ENVIRONMENT_SELECTED_RNG_REMAINS_IN_SELECTED_RUST' >&2; exit 1
          fi
      - name: Verify actual Rust typed RNG, balanced quota and historical high-crit edge tests
        working-directory: upstream
        run: |
          cargo test --locked --lib typed_rng_api_tests
          cargo test --locked --lib wf652_balanced_tests
          cargo test --locked --lib wf_l60_rng_extreme_tests
      - name: Build exact pinned fork Rust fight engine with synchronous world seam
        working-directory: upstream
        env:
          # Native Rust mechanics are unchanged; avoid single-CGU ThinLTO build
          # latency for the short exact-HEAD integration iteration.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Verify pinned Rust RNG mode changes real native and 2D world combat
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("work1_rng_world",path)
          mod=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("docs/evidence/druid-l60-balance/p7.3/saved_728_request.json")
          outputs={}
          for mode in ("stochastic","balanced"):
              native=mod.native_source_control(binary,request,5,rng_mode=mode)
              live=mod.run(binary,request,distance=15.,iterations=5,rng_mode=mode)
              assert live["iterations_done"]==5
              assert live["native_damage_events"]>0
              assert live["native_world_ticks"]>0
              assert abs(native["native_dps"]-live["world_mean_dps"])<1e-5,(mode,native,live)
              outputs[mode]=native["native_dps"]
              print("REAL_PINNED_RUST_RNG_MODE",mode,"native",native["native_dps"],
                    "live",live["world_mean_dps"],"events",live["native_damage_events"],flush=True)
          assert abs(outputs["balanced"]-outputs["stochastic"])>0.01,(
              "BALANCED_TYPED_RNG_MODE_IGNORED_BY_SELECTED_RUST",outputs)
          print("REAL_SELECTED_RUST_NATIVE_2D_RNG_MODE_DIVERGENCE_GREEN",flush=True)
          PY
      - name: Long frozen-source balanced RNG accuracy and determinism (NOT P7)
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util, json, math, tempfile
          from pathlib import Path
          path=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("selected_rng_probe",path)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          reference=Path("docs/evidence/druid-l60-balance/p7.3/saved_728_request.json")
          saved=json.loads(reference.read_text())
          assert saved["simOptions"]["iterations"] >= 10000
          # Original frozen source, production Rust, same configuration.
          # Do not treat a noisy 5-fight difference as an accuracy test.
          stochastic=probe.native_source_control(binary,reference,10000,rng_mode="stochastic")["native_dps"]
          balanced=probe.native_source_control(binary,reference,1000,rng_mode="balanced")["native_dps"]
          with tempfile.TemporaryDirectory() as temp:
              different_seed=Path(temp)/"same_source_new_seed.json"
              varied=json.loads(reference.read_text())
              varied["simOptions"]["randomSeed"]="1300647011"
              different_seed.write_text(json.dumps(varied))
              balanced_other=probe.native_source_control(
                  binary,different_seed,1000,rng_mode="balanced")["native_dps"]
          deviation=abs(balanced/stochastic-1)
          print(json.dumps({"source":"saved_728_request.json",
              "native_fights_stochastic":10000, "native_fights_balanced":1000,
              "stochastic_mean_dps":stochastic,
              "balanced_mean_dps":balanced,
              "balanced_other_seed_dps":balanced_other,
              "relative_deviation":deviation, "max_deviation":0.05},indent=2),flush=True)
          assert all(map(math.isfinite,(stochastic,balanced,balanced_other))) and stochastic>0
          assert balanced == balanced_other, "BALANCED_SEED_INDEPENDENCE_REGRESSION"
          assert deviation <= 0.05, "BALANCED_LONG_MEAN_OUTSIDE_HISTORICAL_5PCT_BAND"
          print("HISTORICAL_BALANCED_LONG_RUN_AND_SEED_INDEPENDENCE_PASS",flush=True)
          PY
      - name: Source Feral 2D facing flip changes real native Rust positional attacks
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          module=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("rust_live_world",module)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          request=Path("docs/evidence/druid-l60-feral/p7.1/saved_811_request.json")
          binary=Path("../upstream/target/release/forever-engine")
          result=probe.run(binary,request,distance=3.,facing_switch_at_s=10.,rng_mode="stochastic")
          before=result["source_action_events_before"]
          after=result["source_action_events_after"]
          print("SOURCE_FERAL_NATIVE_ACTIONS_BACK",before,flush=True)
          print("SOURCE_FERAL_NATIVE_ACTIONS_FRONT",after,flush=True)
          assert result["facing_switch_clock_ns"] is not None
          assert result["native_damage_events"]>0 and result["native_world_ticks"]>2
          assert result["checkpoint_certified"] is False
          # Source Shred 9830 is behind-only and Claw 9850 works in front.
          def count(actions,needle):
              return sum(c for a,c in actions.items() if needle in str(a))
          assert count(before,"9830")>0,(before,after)
          assert count(after,"9850")>0,(before,after)
          print("REAL_RUST_FERAL_WORLD_FACING_CAUSAL_ACTION_CHANGE_NOT_P7",flush=True)
          PY
      - name: Real source Mage L60 fire combat through the same Rust and gsim 2D bridge
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("rust_live_world",Path("integrations/mythicsim-rust/live_world_probe.py"))
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("../upstream/fixtures/mage/prepared-v2/fire-reference.request.json")
          result=probe.run(binary,request,distance=20.,rng_mode="stochastic")
          print("REAL_RUST_MAGE_L60_SOURCE_WORLD",result,flush=True)
          assert result["iterations_done"]==1
          assert result["native_damage_events"]>0
          assert abs(result["native_dps"]-result["world_mean_dps"])<1e-5
          assert result["checkpoint_certified"] is False
          PY
      - name: Hunter source pet damage must retain true native caster identity in gsim
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("rust_live_world",path)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("../upstream/fixtures/mage/prepared-v2/all-values-beast-mastery-hunter-labeled.request.json")
          result=probe.run(binary,request,distance=12.,rng_mode="stochastic")
          print("REAL_RUST_HUNTER_PET_SOURCE_WORLD",result,flush=True)
          assert result["native_damage_events"]>0
          assert result["native_pet_damage_events"]>0, "SOURCE_PET_EVENTS_MISATTRIBUTED_AS_PLAYER"
          assert result["native_precombat_damage_events"]>0, "SOURCE_PRECOMBAT_DAMAGE_UNACCOUNTED"
          assert abs(result["native_dps"]-result["world_mean_dps"])<1e-5
          assert result["checkpoint_certified"] is False
          PY
      - name: Paired real gsim 2D near/far Rust damage ACK and forged ACK rejection
        working-directory: project
        run: |
          python integrations/mythicsim-rust/live_world_probe.py \
            --binary ../upstream/target/release/forever-engine \
            --request docs/evidence/druid-l60-balance/p7.3/saved_728_request.json
