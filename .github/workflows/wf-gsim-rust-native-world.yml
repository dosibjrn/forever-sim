name: Live pinned MythicSim Rust fight to real gsim world (NOT P7)
on:
  workflow_dispatch:
  push:
    branches: [work/first-rust-native-world-damage-20261102, work/first-rust-multifight-world-20261102, work/first-rust-event-driven-world-boundaries-20261102, work/work1-p71-live-partial-probe-20261102]
    paths:
      - .github/workflows/wf-gsim-rust-native-world.yml
      - integrations/mythicsim-rust/patch_world_ingress.py
      - integrations/mythicsim-rust/world_bridge.rs
      - integrations/mythicsim-rust/live_world_probe.py
      - tools/wf_gate_p7_1_live.py
      - tools/wf_gate.py
      - tests/test_work1_p7_1_live_entry.py
permissions:
  contents: read
jobs:
  pinned-rust-live-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: project
      - uses: actions/checkout@v4
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing gsim source dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4
      - name: Verify patch anchors and Python source
        run: |
          python -m compileall -q project/integrations/mythicsim-rust/patch_world_ingress.py project/integrations/mythicsim-rust/live_world_probe.py
          python project/integrations/mythicsim-rust/patch_world_ingress.py upstream
      - name: Build actual pinned source Rust fight engine with synchronous world seam
        working-directory: upstream
        env:
          # Native Rust mechanics are unchanged; avoid single-CGU ThinLTO build
          # latency for the short exact-HEAD integration iteration.
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Prove the patched engine still exactly reproduces 10k saved Rust reference
        if: github.ref != 'refs/heads/work/work1-p71-live-partial-probe-20261102'
        working-directory: project
        run: python integrations/mythicsim-rust/verify_reference.py --engine ../upstream/target/release/forever-engine
      - name: Work1 P7.1 real 3-fight provider + canonical no-sample-percent gate CLI
        working-directory: project
        run: |
          python -m pip install --disable-pip-version-check pytest==8.3.5
          python -m pytest -q tests/test_work1_p7_1_live_entry.py tests/test_wf_gate_live_success_percent.py -k 'not test_real_druid_p2_live_fail_shows_success_and_8020'
          python - <<'PY'
          import json, os, subprocess, sys
          env=dict(os.environ, FOREVER_P7_LIVE_PROBE_ITERATIONS="3")
          cmd=[sys.executable, "tools/wf_gate.py", "--class", "druid",
               "--level", "60", "--spec", "balance", "--gate", "P7.1"]
          p=subprocess.run(cmd, env=env, capture_output=True, text=True)
          print("EXACT_HEAD_REAL_P7_1_NATIVE_GSIM_STDOUT",p.stdout,flush=True)
          print("EXACT_HEAD_REAL_P7_1_NATIVE_GSIM_STDERR",p.stderr[-1500:],flush=True)
          assert p.returncode==1 and p.stdout,p.stderr
          x=json.loads(p.stdout)
          r=x["results"][0]
          assert x["status"]==r["status"]=="FAIL",x
          assert r["reasons"]==["P7_1_BOUNDED_DIAGNOSTIC_NOT_FULL_SAVED_REFERENCE"],x
          assert r["production_engine"]=="pinned_mythicsim_rust_gsim_2d"
          assert r["source_request_raw_sha256"]=="e99b06e5aa891a941ac077643a4209ab8582c810b678df4ec2d47ac48c6c646a"
          assert r["native_source_revision"]=="666fe17a42682068a3c8497d88d5fa3732cbdfb9"
          assert r["sampled_source_fights"]==r["behavior_probes_executed"]==3
          assert r["saved_source_iterations"]==10000
          assert 0<r["dps_objective_proximity_percent"]<=100,r
          assert not any(k in r for k in ("verified","applicable","partial_coverage_percent","pareto_effort_estimate_percent")),r
          assert r["dps_objective_gate_pass"] is False
          print("REAL_SOURCE_RUST_GSIM_P7_1_PROXIMITY_ONLY_NO_M1",flush=True)
          PY
      - name: Source Feral 2D facing flip changes real native Rust positional attacks
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          module=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("rust_live_world",module)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          request=Path("docs/evidence/druid-l60-feral/p7.1/saved_811_request.json")
          binary=Path("../upstream/target/release/forever-engine")
          result=probe.run(binary,request,distance=3.,facing_switch_at_s=10.)
          before=result["source_action_events_before"]
          after=result["source_action_events_after"]
          print("SOURCE_FERAL_NATIVE_ACTIONS_BACK",before,flush=True)
          print("SOURCE_FERAL_NATIVE_ACTIONS_FRONT",after,flush=True)
          assert result["facing_switch_clock_ns"] is not None
          assert result["native_damage_events"]>0 and result["native_world_ticks"]>2
          assert result["checkpoint_certified"] is False
          # Source Shred 9830 is behind-only and Claw 9850 works in front.
          def count(actions,needle):
              return sum(c for a,c in actions.items() if needle in str(a))
          assert count(before,"9830")>0,(before,after)
          assert count(after,"9850")>0,(before,after)
          print("REAL_RUST_FERAL_WORLD_FACING_CAUSAL_ACTION_CHANGE_NOT_P7",flush=True)
          PY
      - name: Real source Mage L60 fire combat through the same Rust and gsim 2D bridge
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          spec=importlib.util.spec_from_file_location("rust_live_world",Path("integrations/mythicsim-rust/live_world_probe.py"))
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("../upstream/fixtures/mage/prepared-v2/fire-reference.request.json")
          result=probe.run(binary,request,distance=20.)
          print("REAL_RUST_MAGE_L60_SOURCE_WORLD",result,flush=True)
          assert result["iterations_done"]==1
          assert result["native_damage_events"]>0
          assert abs(result["native_dps"]-result["world_mean_dps"])<1e-5
          assert result["checkpoint_certified"] is False
          PY
      - name: Hunter source pet damage must retain true native caster identity in gsim
        working-directory: project
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path("integrations/mythicsim-rust/live_world_probe.py")
          spec=importlib.util.spec_from_file_location("rust_live_world",path)
          probe=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary=Path("../upstream/target/release/forever-engine")
          request=Path("../upstream/fixtures/mage/prepared-v2/all-values-beast-mastery-hunter-labeled.request.json")
          result=probe.run(binary,request,distance=12.)
          print("REAL_RUST_HUNTER_PET_SOURCE_WORLD",result,flush=True)
          assert result["native_damage_events"]>0
          assert result["native_pet_damage_events"]>0, "SOURCE_PET_EVENTS_MISATTRIBUTED_AS_PLAYER"
          assert result["native_precombat_damage_events"]>0, "SOURCE_PRECOMBAT_DAMAGE_UNACCOUNTED"
          assert abs(result["native_dps"]-result["world_mean_dps"])<1e-5
          assert result["checkpoint_certified"] is False
          PY
      - name: Paired real gsim 2D near/far Rust damage ACK and forged ACK rejection
        working-directory: project
        run: |
          python integrations/mythicsim-rust/live_world_probe.py \
            --binary ../upstream/target/release/forever-engine \
            --request docs/evidence/druid-l60-balance/p7.3/saved_728_request.json
