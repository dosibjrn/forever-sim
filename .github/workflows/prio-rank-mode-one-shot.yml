name: One-shot source rank mode runtime verification
on:
  push:
    branches:
      - work/prio-rank-mode-permissions-20261101
    paths:
      - .github/workflows/prio-rank-mode-one-shot.yml
permissions:
  contents: read
jobs:
  source-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Execute actual source GameIR and CombatRuntime
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_wf250_source_rank_talent_e2e.py -k sourced_rank_upgrade_remains_castable_in_explicit_combat_mode
