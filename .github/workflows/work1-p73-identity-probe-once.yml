name: Work1 P7.3 selected talent identity and native-world paired probe (one-shot)
on:
  push:
    branches: [work/work1-p73-talent-identity-probe-20261102]
    paths: [.github/workflows/work1-p73-identity-probe-once.yml]
permissions:
  contents: read
jobs:
  p73-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact Work1 code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Checkout original selected MythicSim Rust
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
          persist-credentials: false
      - name: Hydrate exact source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Focused selected-winner receipt regression
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p7_3_live.py tools/wf_gate.py
          python -m pytest -q tests/gates/test_wf_gate_p7_3_live.py
      - name: Install real world ingress into selected engine
        run: python integrations/mythicsim-rust/patch_world_ingress.py upstream
      - name: Build selected Rust production binary
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Execute bounded different-legal-talents real Rust and gsim 2D pair, not acceptance
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
        run: |
          mkdir -p run-output
          python -u - <<'PY' | tee run-output/talent-pair.txt
          import copy,hashlib,json,random,sys,tempfile
          from pathlib import Path
          from tools.wf_gate_p7_2_live import _source_module,_pinned_source_runtime
          from tools.wf_gate_p7_3_live import _cold_talents
          from tools.wf_gate_p7_1_live import _source_native_world_parity
          ROOT=Path.cwd()
          result=_pinned_source_runtime(ROOT,"druid",60,"balance","P7.3")
          if isinstance(result,dict):
              raise RuntimeError("SOURCE_PREFLIGHT:"+json.dumps(result))
          base,meta,binary=result
          source_dir=ROOT/"integrations/mythicsim-rust"
          sys.path.insert(0,str(source_dir))
          try:
              source=_source_module(source_dir/"p73_talent_search_v2.py","work1_p73_pair_source")
          finally:
              sys.path.remove(str(source_dir))
          production=_source_module(source_dir/"live_world_probe.py","work1_p73_pair_runtime")
          player=lambda req:req["raid"]["parties"][0]["players"][0]
          reference=player(base)["talentsString"]
          ref_ranks=source.parse(reference)
          variants=[("saved_reference",base)]
          for seed in (9,719):
              generated=_cold_talents(base,random.Random(seed),source)
              talents=player(generated)["talentsString"]
              assert talents!=reference and source.validate(source.parse(talents))
              variants.append(("cold_source_"+str(seed),generated))
          results=[]
          for name,req in variants:
              with tempfile.TemporaryDirectory(prefix="work1_p73_pair_") as t:
                  path=Path(t)/"legal-source-request.json"
                  path.write_text(json.dumps(req))
                  n=24
                  native=production.native_source_control(binary,path,n,rng_mode="stochastic")
                  live=production.run(binary,path,distance=player(req)["distanceFromTarget"],iterations=n,rng_mode="stochastic")
                  parity=_source_native_world_parity(native,live,n)
                  assert parity is None, (name,parity)
                  ranks=source.parse(player(req)["talentsString"])
                  delta=sum(abs(a-b) for ra,rb in zip(ref_ranks,ranks) for a,b in zip(ra,rb))
                  results.append({"name":name,"talents":player(req)["talentsString"],
                                  "rank_l1_delta_from_saved":delta,
                                  "native_stochastic_24_dps":native["native_dps"],
                                  "live_stochastic_24_dps":live["world_mean_dps"],
                                  "world_damage_events":live["native_damage_events"],
                                  "world_boundaries":live["native_world_ticks"],
                                  "request_raw_sha256":hashlib.sha256(path.read_bytes()).hexdigest()})
          print("WORK1_P73_REAL_TALENT_PAIR:"+json.dumps(results,sort_keys=True),flush=True)
          Path("run-output/talent-pair.json").write_text(json.dumps(results,indent=2))
          print("NOTE: 24 stochastic fights each is an exploratory native+2D causal pair, NOT P7.3 acceptance")
          PY
      - name: Upload bounded causal probe receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: work1-p73-talents-${{ github.sha }}
          path: run-output/
          if-no-files-found: warn
          retention-days: 14
