name: Work1 P7.5 WF613 current-pin no-record diagnostic

on:
  push:
    branches:
      - work/work1-p75-wf613-no-record-20261103
    paths:
      - ".github/workflows/work1-p75-wf613-no-record.yml"

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: work1-p75-wf613-current-pin-${{ github.sha }}
  cancel-in-progress: false

jobs:
  p75:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      FOREVER_P7_FULL_SOURCE_SEARCH: "1"
      FOREVER_P7_SEARCH_STRATEGY: "wf613"
    steps:
      - name: Checkout exact diagnostic HEAD without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Hydrate and verify exact selected Rust pin and typed RNG
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]]
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]]
          ln -s "$engine" upstream
          python integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          git -C "$engine" diff --quiet
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          {
            echo "Diagnostic HEAD: $(git rev-parse HEAD)"
            echo "Selected Rust pin: $actual"
            echo "Search strategy: wf613"
            echo "No M1 recorder or ledger write is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build exact selected Rust engine
        working-directory: upstream
        run: cargo build --release --locked

      - name: Install production gate dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Collect registered accepted compatible P7.1-P7.4 receipts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/wf_gate_p7_5_receipts.py \
            --repository "$GITHUB_REPOSITORY" \
            --class druid --level 60 --spec balance \
            --out "$RUNNER_TEMP/p75-priors.json"
          python - "$RUNNER_TEMP/p75-priors.json" <<'PY'
          import json, sys
          from pathlib import Path
          data = json.loads(Path(sys.argv[1]).read_text())
          receipts = data.get("receipts", [])
          assert len(receipts) == 4, (len(receipts), receipts)
          assert {r["gate"] for r in receipts} == {"P7.1", "P7.2", "P7.3", "P7.4"}
          assert all(r["report"].get("native_source_revision") ==
                     "deb366e986dbc156e2242ddac3ac8c4ac854c107"
                     for r in receipts), receipts
          print("CURRENT_PIN_ACCEPTED_PRIORS", json.dumps([
              {"gate": r["gate"], "run_url": r["run_url"],
               "dps": r["report"].get("dps_objective_actual")}
              for r in receipts
          ], sort_keys=True))
          PY

      - name: Run full P7.5 WF613 production search and stochastic holdout without M1 recording
        shell: bash
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/p75-wf613.json"
          log="$RUNNER_TEMP/p75-wf613.log"
          priors="$RUNNER_TEMP/p75-priors.json"
          export FOREVER_P7_ACCEPTED_PRIOR_RECEIPTS="$priors"
          set +e
          timeout 1500s python tools/wf_gate.py \
            --class druid --level 60 --spec balance --gate P7.5 --out "$report" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["status"] in ("PASS", "FAIL", "BLOCKED"), report
          assert rc in (0, 1) and ((rc == 0) == (report["status"] == "PASS")), (rc, report)
          assert report.get("search_strategy") == "wf613", report
          assert report.get("search_rng_mode") == "balanced", report
          print("P75_WF613_NO_RECORD_RESULT", json.dumps(report, ensure_ascii=False))
          PY
          git diff --exit-code -- docs/planning/M1_PASSES.tsv
          {
            echo
            echo "## P7.5 WF613 current-pin no-record diagnostic"
            echo
            echo "- Diagnostic HEAD: $(git rev-parse HEAD)"
            echo "- Selected Rust pin: $(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
            echo "- Search policy: WF613 adaptive paid archive; deterministic Balanced search; independent frozen 1,000-fight Stochastic holdout"
            echo "- Exact command: FOREVER_P7_FULL_SOURCE_SEARCH=1 FOREVER_P7_SEARCH_STRATEGY=wf613 python tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.5 --out <report>"
            echo "- No --record-progress; M1_PASSES.tsv remained unchanged."
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/p75-artifact"
          cp "$report" "$log" "$priors" "$RUNNER_TEMP/p75-artifact/"

      - name: Upload no-record P7.5 report, log and accepted-prior receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-p75-wf613-current-pin-${{ github.sha }}
          path: ${{ runner.temp }}/p75-artifact/
          if-no-files-found: warn
