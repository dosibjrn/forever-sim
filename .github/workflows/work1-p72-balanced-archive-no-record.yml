name: Work1 P7.2 balanced archive no-record diagnostic

on:
  pull_request:
    paths:
      - "tools/wf_gate_p7_2_live.py"
      - "tests/gates/test_wf_gate_p7_2_live.py"
      - ".github/workflows/work1-p72-balanced-archive-no-record.yml"

permissions:
  contents: read

concurrency:
  group: work1-p72-archive-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  p72:
    if: >-
      github.event.pull_request.head.ref == 'work/work1-p72-balanced-elite-archive-20261103' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      FOREVER_P7_FULL_SOURCE_SEARCH: "1"
    steps:
      - name: Checkout exact PR HEAD without write credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Hydrate and verify exact selected Rust pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          git submodule update --init --depth 1 "$engine"
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$actual" == "$recorded" ]]
          [[ "$(git -C "$engine" remote get-url origin)" == *"dosibjrn/mythicsim-forever-engine"* ]]
          ln -s "$engine" upstream
          python integrations/mythicsim-rust/wf659_rng_boolean_audit.py upstream/src
          test -f upstream/src/core/fight/world_bridge.rs
          grep -Fq 'pub enum RngMode' "$engine/src/core/rng.rs"
          ! grep -Fq 'WOWSIM_RNG_MODE' "$engine/src/core/rng.rs"
          grep -Fq 'pub(crate) fn new(mode: RngMode,' "$engine/src/core/rng.rs"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          git -C "$engine" diff --quiet
          grep -Fq 'SimRng::new(rng_mode,' "$engine/src/core/fight.rs"
          {
            echo "PR HEAD: $(git rev-parse HEAD)"
            echo "Selected Rust pin: $actual"
            echo "No M1 recorder or ledger write is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build exact selected Rust engine
        working-directory: upstream
        run: cargo build --release --locked

      - name: Install production gate dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'

      - name: Run full P7.2 production gate without M1 recording
        shell: bash
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/p72.json"
          log="$RUNNER_TEMP/p72.log"
          set +e
          timeout 1500s python tools/wf_gate.py \
            --class druid --level 60 --spec balance --gate P7.2 --out "$report" \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          python - "$report" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          report = json.loads(Path(sys.argv[1]).read_text())
          rc = int(sys.argv[2])
          assert report["status"] in ("PASS", "FAIL", "BLOCKED"), report
          assert rc in (0, 1) and ((rc == 0) == (report["status"] == "PASS")), (rc, report)
          print(json.dumps(report, ensure_ascii=False))
          PY
          {
            echo
            echo "## No-record P7.2 production result"
            echo
            echo "Command: FOREVER_P7_FULL_SOURCE_SEARCH=1 python tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.2 --out <report>"
            echo
            echo "No --record-progress flag; M1_PASSES.tsv was not written."
            echo
            cat "$report"
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p "$RUNNER_TEMP/p72-artifact"
          cp "$report" "$log" "$RUNNER_TEMP/p72-artifact/"

      - name: Upload no-record P7.2 report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-p72-balanced-archive-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/p72-artifact/
          if-no-files-found: warn
