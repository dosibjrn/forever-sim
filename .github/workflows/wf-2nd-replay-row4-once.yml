name: One-shot exact failed source finalist replay
on:
  pull_request:
    branches: [main]
    paths: [tools/wf437_direct_budgeted_run.py]
permissions:
  contents: read
  actions: read
concurrency:
  group: one-shot-2nd-saved-row4-20261101
  cancel-in-progress: false
jobs:
  real-failed-row:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Replay the exact failed 300s source-paid finalist with corrected exit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object tools/wf437_direct_budgeted_run.py)" = b8275d74a4f70a4699caed6c9408a61986a17991
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          mkdir -p /tmp/sourced
          gh run download 41346629728 --repo "${GITHUB_REPOSITORY}" --name source-cold-30-300-20261101 --dir /tmp/sourced
          python - <<'PY'
          import json,subprocess,sys
          saved=json.load(open('/tmp/sourced/cold300.json'))
          assert saved['validation']['rows'][4]['status']=='BLOCKED_ACTOR_DIED'
          assert saved['validation']['rows'][4]['full_s_per_mob'] is None
          def replay(idx):
              p=subprocess.run([sys.executable,'-m','tools.wf437_direct_budgeted_run',
                  '--replay-from','/tmp/sourced/cold300.json','--replay-row',str(idx),
                  '--output',f'/tmp/row{idx}.json'],capture_output=True,text=True)
              print('EXACT_SOURCE_REPLAY',idx,'EXIT',p.returncode,'STDOUT',p.stdout[-1000:],
                    'STDERR',p.stderr[-1000:],flush=True)
              report=json.load(open(f'/tmp/row{idx}.json'))
              return p,report['validation']
          bad,bad_result=replay(4)
          assert bad.returncode==1 and bad_result['complete_100mob_replays']==0
          assert bad_result['rows'][0]['status']=='BLOCKED_ACTOR_DIED'
          good,good_result=replay(0)
          assert good.returncode==0 and good_result['complete_100mob_replays']==1
          assert good_result['rows'][0]['status']=='COMPLETE'
          assert good_result['rows'][0]['count']==100
          print('EXACT_SAVED_FAILED_FINALIST_RED_TO_GREEN_PASS',flush=True)
          PY
