name: Work1 P7.5 paid stochastic finalist focused regression (temporary)
on:
  push:
    branches: [work/work1-p75-paid-stochastic-finalists-20261103-0423]
    paths:
      - tools/wf_gate_p7_5_live.py
      - tests/gates/test_wf_gate_p7_5_live.py
      - tests/gates/test_wf_gate_p7_5_stochastic_finalists.py
      - .github/workflows/work1-p75-finalist-smoke.yml
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test runner
        run: python -m pip install 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Exact HEAD P7.5 production routing and finalist regressions
        run: |
          echo "PRODUCER_HEAD=$(git rev-parse HEAD)"
          python -m compileall -q tools/wf_gate_p7_5_live.py tests/gates/test_wf_gate_p7_5_stochastic_finalists.py
          python -m pytest -q tests/gates/test_wf_gate_p7_5_live.py tests/gates/test_wf_gate_p7_5_stochastic_finalists.py
