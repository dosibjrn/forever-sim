name: Work2 one-shot request for existing native-paid L47-L60 range
# Branch-local invocation bridge only; NEVER merge this temporary workflow.
on:
  push:
    branches:
      - work2/one-shot-paid-l45-l46-20261110-1505
    paths:
      - .github/workflows/work2-paid-range-one-shot.yml
permissions:
  contents: read
  actions: write
jobs:
  dispatch-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check for an already launched native range and dispatch existing main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import urllib.error
          import urllib.request

          repo = "dosibjrn/forever-sim"
          workflow = "work2-warlock-l41-l50-native-batch.yml"
          base = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          with urllib.request.urlopen(urllib.request.Request(
                  base + "/runs?event=workflow_dispatch&per_page=100",
                  headers=headers), timeout=20) as response:
              runs = json.load(response)["workflow_runs"]
          now = dt.datetime.now(dt.timezone.utc)
          recent = [run for run in runs if
                    run.get("head_branch") == "main" and
                    run.get("status") in ("queued","in_progress","requested","waiting","pending") and
                    now - dt.datetime.fromisoformat(run["created_at"].replace("Z","+00:00"))
                    < dt.timedelta(hours=4)]
          if recent:
              print("EQUIVALENT_DISPATCH_MAY_ALREADY_EXIST; no duplicate paid run:",
                    [(x["id"], x["status"]) for x in recent], flush=True)
              raise SystemExit(0)

          inputs = {
              "predecessor_artifact_id": "13767012142",
              "from_level": "46",
              "end_level": "60",
              "max_new_levels": "14",
              "max_proposals": "30",
              "selected_rust_sha": "7b811d37969bd1886cf123835fc87b699d1f5fbd",
              "predecessor_binary_sha256": "133c96ba50b7589036e062e18a3315e28ac2562064cb99e96d501fc4ee054458",
          }
          payload = json.dumps({"ref": "main", "inputs": inputs}).encode()
          request = urllib.request.Request(base + "/dispatches", data=payload,
                                           headers=headers, method="POST")
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 204:
                  raise RuntimeError(f"Unexpected dispatch HTTP {response.status}")
          print("DISPATCHED_EXISTING_MAIN_NATIVE_PAID_RANGE_L47_L60", flush=True)
          print("Dispatch identity:", json.dumps(inputs, sort_keys=True), flush=True)
          PY
