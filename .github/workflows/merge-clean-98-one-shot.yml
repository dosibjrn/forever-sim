name: Merge one-shot Clean98 current-HEAD targeted regression
on:
  push:
    branches: [merge/verify-clean-98-20261102]
    paths: [.github/workflows/merge-clean-98-one-shot.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify production tree equals exact current Clean PR
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aaac32e02a622930026e14c5c3109e18a549e5c7"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/merge-clean-98-one-shot.yml"
      - name: Install source test prerequisites
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4' 'PyYAML==6.0.2'
      - name: Real Clean maintenance, samplers, new coverage writer and CLI tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/maintenance/test_root_launcher_relocation.py tests/maintenance/test_maintenance_layout.py
          python -m pytest -q tests/test_wf_coverage_sample_wrappers.py
          python -m pytest -q tests/test_wf_coverage235_secondary_rank_batch.py tests/test_wf_coverage238_form_crit_dodge.py
          python -m pytest -q tests/test_product_coverage_v2.py -k coverage_cli_writes_generated_reports_to_ignored_runtime
          python scripts/run_wf_coverage238_sample.py --help
          python scripts/run_wf_coverage239_sample.py --help
