name: Prio P3 source-profile smoke (temporary)
on:
  push:
    branches: [work/prio-p3-source-profile-paid-gear-20261102]
jobs:
  p3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_prio_p3_spec_build.py
      - run: python -m pytest -q tests/test_wf408_unified_production_item_score_p3_tdd.py tests/test_wf_gate_p3_approved.py -k 'not expensive'
