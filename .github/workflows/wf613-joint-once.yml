name: WF613 optional joint search native-2D exact-HEAD test (one-shot)
on:
  push:
    branches: [work/wf613-optional-p75-20261102]
    paths: [.github/workflows/wf613-joint-once.yml]
permissions:
  contents: read
jobs:
  wf613:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact candidate branch with source data
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          lfs: true
      - name: Checkout genuinely pinned MythicSim Rust engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sage3648/mythicsim-forever-engine
          ref: 666fe17a42682068a3c8497d88d5fa3732cbdfb9
          path: upstream
          persist-credentials: false
      - name: Hydrate immutable source catalogue
        run: git lfs pull --include="data/forever/catalogue/items_2026-09-29.sqlite" --exclude=""
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Focused production source and WF613 regression tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          echo "WF613_TESTED_HEAD=$(git rev-parse HEAD)"
          # Two legacy CI tests in the historical suite refer to deleted
          # .github/workflows/wf678-p75-pr.yml. Exclude ONLY those obsolete
          # workflow-presence assertions; keep all native-source/gear/APL tests.
          python -m pytest -q tests/gates/test_wf613_strategy.py tests/gates/test_wf_gate_p7_5_live.py integrations/mythicsim-rust/tests/test_p75_joint_contract.py -k 'not test_ci_runs_exact_pr_head_not_synthetic_merge_ref and not test_ci_watches_all_native_search_dependencies'
          python -m compileall -q integrations/mythicsim-rust/wf613_strategy.py integrations/mythicsim-rust/p75_joint_search.py tools/wf_gate_p7_5_live.py
      - name: Patch world ingress into original Rust combat engine
        run: python integrations/mythicsim-rust/patch_world_ingress.py upstream
      - name: Compile real Rust production combat
        working-directory: upstream
        env:
          CARGO_PROFILE_RELEASE_LTO: "off"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked
      - name: Execute WF613 adaptive 300s cold + frozen 1000 stochastic through real Rust/2D
        shell: bash
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/upstream/target/release/forever-engine
          FOREVER_P7_FULL_SOURCE_SEARCH: "1"
          FOREVER_P7_SEARCH_STRATEGY: "wf613"
        run: |
          set -euo pipefail
          mkdir -p wf613-output
          printf 'head=%s\nengine=%s\nstrategy=wf613\nsource=docs/evidence/druid-l60-balance/p7.3/saved_728_request.json\n' "$(git rev-parse HEAD)" "$(git -C upstream rev-parse HEAD)" > wf613-output/provenance.txt
          set +e
          timeout 1500s python -u tools/wf_gate.py --class druid --level 60 --spec balance --gate P7.5 --out wf613-output/p75.json > wf613-output/p75.log 2>&1
          rc=$?
          set -e
          echo "exit_code=$rc" >> wf613-output/provenance.txt
          tail -n 6 wf613-output/p75.log
          if [[ $rc -ne 0 && $rc -ne 1 ]]; then exit "$rc"; fi
          test -s wf613-output/p75.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          doc=json.loads(Path("wf613-output/p75.json").read_text())
          row=doc["results"][0]
          keys=("status","reasons","joint_cold_world_dps","frozen_stochastic_world_dps","frozen_stochastic_native_dps","source_legal_joint_candidates_paid","search_wall_s","search_strategy","operator_attempts","operator_best_improvements","paid_archive_size","cold_candidate_failures")
          details={k:row.get(k) for k in keys}
          print("WF613_PRODUCTION_RESULT",json.dumps(details))
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("### WF613 P7.5 — "+doc["status"]+" (unrecorded)\n\n~~~json\n"+json.dumps(details,indent=2)+"\n~~~\n")
          PY
      - name: Preserve actual diagnostic and provenance for next cycle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wf613-selected-rust-gsim2d-${{ github.sha }}
          path: wf613-output/
          if-no-files-found: warn
          retention-days: 14
