name: Native session clock and world-ACK contract
on:
  pull_request:
    paths:
      - 'src/game/runtime/native_step_protocol.py'
      - 'src/game/runtime/go_native_world_damage_ack.py'
      - 'integrations/mythicsim-rust/live_two_world_pulls.py'
      - 'integrations/mythicsim-rust/apl_mutation.py'
      - 'integrations/mythicsim-rust/tests/test_apl_mutation_fallback_order.py'
      - 'integrations/mythicsim-rust/port_native_typed_rng.py'
      - 'integrations/mythicsim-rust/engine'
      - 'integrations/mythicsim-rust/live_world_probe.py'
      - 'tools/wf_native_priest_l20_paid.py'
      - 'tools/wf_native_feral_l60_world.py'
      - 'tests/test_work2_feral_l60_native_world.py'
      - 'tools/wf_gsim_go_live_range_probe.py'
      - 'docs/evidence/druid-l60-balance/p7.5/historical_wf678_winner_axes.json'
      - 'tests/test_p75_axis_ablation.py'
      - 'tests/test_work2_native_health_damage_controls.py'
      - 'tests/test_work2_native_world_elapsed.py'
      - 'tests/test_work2_warlock_native_paid_chain.py'
      - 'tests/test_work1_native_decisions_vendor_recovery.py'
      - 'tools/wf_warlock_l20_100mob.py'
      - 'tests/test_work2_gsim_world_walk.py'
      - 'tests/test_work2_native_world_clock_ack.py'
      - 'tests/integration/backend/test_wf_go_native_world_damage_ack.py'
      - '.github/workflows/native-session-ack-regressions.yml'

permissions:
  contents: read
  actions: read

jobs:
  clock-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify native clock and real gsim world lethal ACK (not gate)
        run: python -m pytest -q tests/test_work2_feral_l60_native_world.py tests/test_work2_gsim_world_walk.py tests/test_work2_native_world_clock_ack.py tests/test_work2_native_health_damage_controls.py tests/test_work2_native_world_elapsed.py tests/test_work2_warlock_native_paid_chain.py tests/test_work1_native_decisions_vendor_recovery.py tests/integration/backend/test_wf_go_native_world_damage_ack.py tests/test_p75_axis_ablation.py tests/maintenance/test_native_session_ack_execution_boundary.py
