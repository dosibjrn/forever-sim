name: Native session clock and world-ACK contract
on:
  pull_request:
    paths:
      - 'src/game/runtime/native_step_protocol.py'
      - 'src/game/runtime/go_native_world_damage_ack.py'
      - 'integrations/mythicsim-rust/live_two_world_pulls.py'
      - 'tests/test_work2_gsim_world_walk.py'
      - 'tests/test_work2_native_world_clock_ack.py'
      - 'tests/integration/backend/test_wf_go_native_world_damage_ack.py'
      - '.github/workflows/native-session-ack-regressions.yml'

permissions:
  contents: read

jobs:
  clock-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify native clock and real gsim world lethal ACK (not gate)
        run: python -m pytest -q tests/test_work2_gsim_world_walk.py tests/test_work2_native_world_clock_ack.py tests/integration/backend/test_wf_go_native_world_damage_ack.py

  source-health-world:
    # One bounded real selected-Rust ↔ gsim 2D source-HP smoke; not P4–P6.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing world runtime dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Compile exact selected public Rust fork plus reviewed native health receipt source port
        run: |
          set -euo pipefail
          selected="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          actual="$(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
          test "$selected" = "$actual"
          echo "SELECTED_RUST_SHA=$actual"
          python integrations/mythicsim-rust/port_native_health_damage_receipts.py integrations/mythicsim-rust/engine
          cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml --bin forever-engine
      - name: Two distinct sourced-HP native↔2D world kills and forged-ACK rejection
        run: |
          python integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
            --classic-mob-level 60 --targets 2 --require-native-moving
      - name: Real source-native incoming health damage on retained gsim 2D actor (not gate)
        run: |
          python integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/feral-bear-druid-defensives.prepared.json \
            --mob-health 1200 --targets 2 --require-native-health-damage
