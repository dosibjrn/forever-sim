name: Native session clock and world-ACK contract
on:
  pull_request:
    paths:
      - 'src/game/runtime/native_step_protocol.py'
      - 'src/game/runtime/go_native_world_damage_ack.py'
      - 'integrations/mythicsim-rust/live_two_world_pulls.py'
      - 'integrations/mythicsim-rust/apl_mutation.py'
      - 'integrations/mythicsim-rust/tests/test_apl_mutation_fallback_order.py'
      - 'integrations/mythicsim-rust/port_native_typed_rng.py'
      - 'integrations/mythicsim-rust/engine'
      - 'integrations/mythicsim-rust/live_world_probe.py'
      - 'tools/wf_native_priest_l20_paid.py'
      - 'tools/wf_native_feral_l60_world.py'
      - 'tests/test_work2_feral_l60_native_world.py'
      - 'tools/wf_gate_p4_p5_partial.py'
      - 'tools/wf_gsim_go_live_range_probe.py'
      - 'tests/test_wf_native_priest_l20_paid.py'
      - 'docs/evidence/druid-l60-balance/p7.5/historical_wf678_winner_axes.json'
      - 'tests/test_p75_axis_ablation.py'
      - 'tests/test_work2_native_health_damage_controls.py'
      - 'tests/test_work2_native_world_elapsed.py'
      - 'tests/test_work2_warlock_native_paid_chain.py'
      - 'tools/wf_warlock_l20_100mob.py'
      - 'tests/test_work2_gsim_world_walk.py'
      - 'tests/test_work2_native_world_clock_ack.py'
      - 'tests/integration/backend/test_wf_go_native_world_damage_ack.py'
      - '.github/workflows/native-session-ack-regressions.yml'

permissions:
  contents: read
  actions: read

jobs:
  clock-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify native clock and real gsim world lethal ACK (not gate)
        run: python -m pytest -q tests/test_work2_feral_l60_native_world.py tests/test_work2_gsim_world_walk.py tests/test_work2_native_world_clock_ack.py tests/test_work2_native_health_damage_controls.py tests/test_work2_native_world_elapsed.py tests/test_work2_warlock_native_paid_chain.py tests/integration/backend/test_wf_go_native_world_damage_ack.py tests/test_p75_axis_ablation.py

  source-health-world:
    # One bounded real selected-Rust ↔ gsim 2D source-HP smoke; not P4–P6.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing world runtime dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Verify published typed RNG and compile the exact selected Rust fork
        run: |
          set -euo pipefail
          selected="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          actual="$(git -C integrations/mythicsim-rust/engine rev-parse HEAD)"
          test "$selected" = "$actual"
          echo "SELECTED_RUST_SHA=$actual"
          # Typed RNG is already published in the pinned fork. Do not reapply
          # the historical source-rewrite port to its changed Rust CLI imports:
          # the port's text anchors are not a runtime contract.
          grep -Fq 'pub enum RngMode' integrations/mythicsim-rust/engine/src/core/rng.rs
          grep -Fq '"--rng-mode"' integrations/mythicsim-rust/engine/src/main.rs
          grep -Fq '"native_health_damage_taken"' integrations/mythicsim-rust/engine/src/core/fight.rs
          grep -Fq '"native_health_damage_events"' integrations/mythicsim-rust/engine/src/core/fight.rs
          grep -Fq 'pub enum RngMode' integrations/mythicsim-rust/engine/src/core/rng.rs
          ! grep -Fq 'WOWSIM_RNG_MODE' integrations/mythicsim-rust/engine/src/core/rng.rs
          grep -Fq 'SimRng::new(rng_mode,' integrations/mythicsim-rust/engine/src/core/fight.rs
          cargo build --locked --manifest-path integrations/mythicsim-rust/engine/Cargo.toml --bin forever-engine
          binary=integrations/mythicsim-rust/engine/target/debug/forever-engine
          fixture=integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json
          if "$binary" sim --infile "$fixture" >/tmp/rng-mode-missing.log 2>&1; then
            echo "Native CLI accepted missing --rng-mode" >&2; exit 1
          fi
          if "$binary" sim --rng-mode bogus --infile "$fixture" >/tmp/rng-mode-invalid.log 2>&1; then
            echo "Native CLI accepted invalid --rng-mode" >&2; exit 1
          fi
          echo "RUST_NATIVE_CLI_REJECTS_MISSING_AND_INVALID_RNG_MODE"
      - name: Verify explicit Balanced and Stochastic modes in real native and gsim 2D combat (not gate)
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path("integrations/mythicsim-rust/live_world_probe.py")
          spec = importlib.util.spec_from_file_location("typed_rng_world_smoke", path)
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)
          binary = Path("integrations/mythicsim-rust/engine/target/debug/forever-engine")
          request = Path("docs/evidence/druid-l60-balance/p7.3/saved_728_request.json")
          outputs = {}
          for mode in ("balanced", "stochastic"):
              native = probe.native_source_control(binary, request, 5, rng_mode=mode)
              live = probe.run(binary, request, distance=15.0, iterations=5, rng_mode=mode)
              assert live["iterations_done"] == 5, (mode, live)
              assert live["native_damage_events"] > 0, (mode, live)
              assert live["native_world_ticks"] > 0, (mode, live)
              assert abs(native["native_dps"] - live["world_mean_dps"]) < 1e-5, (mode, native, live)
              outputs[mode] = native["native_dps"]
              print("TYPED_RNG_REAL_NATIVE_2D", mode, "native", native["native_dps"],
                    "live", live["world_mean_dps"], flush=True)
          assert abs(outputs["balanced"] - outputs["stochastic"]) > 0.01, (
              "BALANCED_TYPED_RNG_MODE_IGNORED_BY_SELECTED_RUST", outputs)
          print("REAL_SELECTED_RUST_BALANCED_STOCHASTIC_NATIVE_2D_SMOKE_GREEN_NOT_GATE", flush=True)
          PY
      - name: Two distinct sourced-HP native↔2D world kills and forged-ACK rejection
        run: |
          python integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
            --classic-mob-level 60 --targets 2 --require-native-moving --require-native-zero-health-damage
      - name: Real source-native incoming health damage on retained gsim 2D actor (not gate)
        run: |
          python integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --prepared integrations/mythicsim-rust/engine/fixtures/mage/prepared-v2/feral-bear-druid-defensives.prepared.json \
            --mob-health 1200 --targets 2 --require-native-health-damage
      - name: Paid Priest L20 candidate through exact native Rust and gsim 2D ACK (not P4/P5 acceptance)
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from src.game.native_p3_item_options import query_native_p3_item_options
          from tools.wf_native_priest_l20_paid import (
              couple_source_priest_l20_world,
              couple_source_priest_l20_persistent_world,
              score_native_priest_l20_item_candidates,
          )
          binary = Path("integrations/mythicsim-rust/engine/target/debug/forever-engine").resolve()
          fixture = Path("integrations/mythicsim-rust/fixtures/priest-l20-native-smite.request.json")
          native_options = query_native_p3_item_options(
              str(binary), "priest", 20, spec="unrestricted")
          assert native_options["items"], native_options
          paid = score_native_priest_l20_item_candidates(
              binary, fixture, native_options["items"],
              world_screen=couple_source_priest_l20_world,
              persistent_world=couple_source_priest_l20_persistent_world,
              budget_s=25., max_paid_builds=4)
          print("PRIEST_L20_SELECTED_NATIVE_PAID_TO_REAL_2D",
                json.dumps(paid, sort_keys=True), flush=True)
          assert paid["native_paid_whole_builds"] > 0, paid
          assert paid["native_source_action_casts"] > 0, paid
          assert paid["native_2d_live_ack_attempted"] >= 1, paid
          assert paid["native_2d_live_ack_verified"] >= 1, paid
          # The independent one-fight ACK can be nonlethal. Require the
          # *stronger* proof instead: real native↔2D lethal ACKs on two
          # distinct ordinary L20 source-proxy mobs with one retained actor.
          # This is not paid recovery or 100-mob gate acceptance.
          assert paid["native_2d_persistent_verified"] == 1, paid
          assert paid["native_2d_persistent_targets_killed"] == 2, paid
          assert paid["native_2d_screen_complete"] is False, paid
          assert any(
              receipt.get("native_2d_fight", {}).get("native_2d_world_ticks", 0) > 0
              for receipt in paid["native_candidate_receipts"]
          ), paid
          print("PRIEST_L20_REAL_PAID_RUST_GSIM2D_ACK_PASS_NOT_100MOB_NOT_GATE",
                flush=True)
          PY
      - name: Feral L60 source build through two consecutive native/world targets (not P4-P6)
        run: |
          python tools/wf_native_feral_l60_world.py \
            --binary integrations/mythicsim-rust/engine/target/debug/forever-engine \
            --source-request docs/evidence/druid-l60-feral/p7.1/saved_811_request.json \
            --targets 2

  warlock-l20-paid-hundred:
    # Run the first real 100-target Decisions/world attempt on an exact
    # previously tested native source. The strict eight-target preflight is
    # NOT an approved prerequisite. Restrict this paid diagnostic to Work2's
    # Warlock implementation branches, not every unrelated native PR.
    if: startsWith(github.head_ref, 'work2/warlock-l20-')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Work2 PR client
        uses: actions/checkout@v4
        with:
          path: project
      - name: Checkout tested Warlock Decisions and world ACK Rust
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          ref: febc1d703e022265ed61ede3fec9b05416282536
          path: engine
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install 2D world Python dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Build and fingerprint exact native source
        working-directory: engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "febc1d703e022265ed61ede3fec9b05416282536"
          cargo build --locked --bin forever-engine
          sha256sum target/debug/forever-engine fixtures/warlock-l20-troll-best-paid.request.json
      - name: Execute 100 distinct-target Warlock Decisions/native-world paid objective
        working-directory: project
        run: |
          set -euo pipefail
          python -u tools/wf_warlock_l20_100mob.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../engine/fixtures/warlock-l20-troll-best-paid.request.json \
            --out ../warlock-l20-decisions-hundred \
            --variant best_apl --targets 100 --recovery-policy decisions \
            --health-threshold 1.0 --mana-threshold 1.0
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("../warlock-l20-decisions-hundred/summary.json").read_text())
          row, = receipt["results"]
          assert row["status"] == "COMPLETED_100_REAL_NATIVE_GSIM_KILLS", row
          assert row["killed"] == 100, row
          assert row["native_recovery_clock_accounted"] is True, row
          assert row["native_actor_continuity_receipt_complete"] is True, row
          assert row["native_2d_paid_objective_eligible"] is True, row
          assert receipt["p4_p5_p6_pass"] is False, receipt
          print("WARLOCK_L20_100_NATIVE_DECISIONS_ELAPSED_NOT_COLD_SEARCH",
                json.dumps(row, sort_keys=True), flush=True)
          PY
      - name: Show complete native refusal or real paid result
        if: always()
        run: |
          test ! -f warlock-l20-decisions-hundred/summary.json || cat warlock-l20-decisions-hundred/summary.json
      - name: Preserve 100-target paid Decisions native refusal and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warlock-l20-decisions-hundred
          path: warlock-l20-decisions-hundred/
          if-no-files-found: warn
          retention-days: 3
