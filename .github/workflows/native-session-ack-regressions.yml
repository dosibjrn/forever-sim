name: Native session clock and world-ACK contract
on:
  pull_request:
    paths:
      - 'src/game/runtime/native_step_protocol.py'
      - 'tests/test_work2_native_world_clock_ack.py'
      - '.github/workflows/native-session-ack-regressions.yml'

permissions:
  contents: read

jobs:
  clock-ack:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependency
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Verify world clock and ACK sequencing (transport only, not gate)
        run: python -m pytest -q tests/test_work2_native_world_clock_ack.py
