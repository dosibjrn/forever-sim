name: Clean temporary scoped layout regression
on:
  push:
    branches: [work/clean-retired-layout-workflow-refs-20261102]
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Verify three public layout contracts
        run: |
          python -m pytest -q tests/generic/runtime/test_generic_runtime_layout.py tests/generic/classes/test_generic_class_layout.py tests/generic/search/test_generic_search_layout.py
