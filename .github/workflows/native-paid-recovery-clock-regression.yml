name: Native between-pull clock-paid recovery regression

on:
  push:
    branches: [work/warlock-paid-recovery-clock-semantics-20261109]
    paths:
      - integrations/mythicsim-rust/live_two_world_pulls.py
      - tools/test_native_paid_recovery_clock.py
      - .github/workflows/native-paid-recovery-clock-regression.yml
  pull_request:
    paths:
      - integrations/mythicsim-rust/live_two_world_pulls.py
      - tools/test_native_paid_recovery_clock.py
      - .github/workflows/native-paid-recovery-clock-regression.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clock-paid:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native 2D world bridge dependencies
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Check recovered native 2D clock contract
        run: |
          python3 -m py_compile integrations/mythicsim-rust/live_two_world_pulls.py
          python3 -m unittest discover -s tools -p 'test_native_paid_recovery_clock.py' -v
