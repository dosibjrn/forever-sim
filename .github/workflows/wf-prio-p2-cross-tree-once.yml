name: One-shot source P2 cross-tree witness (remove after verification)
on:
  push:
    branches:
      - work/prio-p2-cross-tree-source-witness-20261101
    paths:
      - .github/workflows/wf-prio-p2-cross-tree-once.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wf-prio-p2-cross-tree-once
  cancel-in-progress: false
jobs:
  source-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded source-test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Source-legal exact-rank regression and existing P2 controls
        run: |
          git rev-parse HEAD
          python -m pytest -q tests/test_wf_p2_cross_tree_source_witness.py tests/test_wf35_source_spec_p2_adapter.py tests/test_wf35_product_spec_profile_contract.py tests/test_wf391_generic_joint_frontier.py -k 'not mage_real_gear_talents_apl_recovery_100mob_no_acceptance'
