name: Work1 Druid L30 P7.2 native changed APL (no M1)

on:
  push:
    branches:
      - work/work1-druid-l30-p72-native-axis-20261105
    paths:
      - .github/workflows/work1-druid-l30-p72-native.yml
      - tools/wf_gate_p7_2_live.py
      - tests/test_work1_druid_l30_p72.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: work1-druid-l30-p72-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selected-native-p72:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: "0"
      FOREVER_MYTHICSIM_RUST_BIN: integrations/mythicsim-rust/engine/target/release/forever-engine
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - name: Checkout exact Work1 commit and selected Rust source
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: true
          fetch-depth: 1

      - name: Verify unchanged frozen L30 reference and selected gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          [[ -n "$recorded" && "$recorded" == "$actual" ]] || {
            echo "SELECTED_NATIVE_GITLINK_DIVERGED" >&2
            exit 1
          }
          test -s docs/evidence/native-references/druid-l30-unrestricted/request.json
          test -s docs/evidence/native-references/druid-l30-unrestricted/reference.json
          echo "Forever HEAD: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Selected Rust SHA: $actual" >> "$GITHUB_STEP_SUMMARY"
          echo "P7.1 native receipt is frozen; no stochastic resampling in this workflow" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install focused Forever dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'

      - name: Validate changed L30 native request and refusal transport
        run: >-
          python -m pytest -q
          tests/test_work1_druid_l30_p72.py
          tests/test_work2_p72_native_axis.py
          tests/gates/test_wf_gate_p7_2_live.py

      - name: Build exact pinned Rust executable
        working-directory: integrations/mythicsim-rust/engine
        run: cargo build --locked --release --bin forever-engine

      - name: Pay real Druid L30 P7.2 changed APL on selected native scorer
        shell: bash
        run: |
          set -euo pipefail
          python tools/wf_gate.py \
            --class druid --level 30 --spec unrestricted --gate P7.2 \
            --out druid-l30-p72-gate.json \
            | tee druid-l30-p72-gate-stdout.json
          cat druid-l30-p72-gate.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain genuine paid axis candidate and native refusal diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work1-druid-l30-p72-no-record
          path: |
            druid-l30-p72-gate.json
            druid-l30-p72-gate-stdout.json
          if-no-files-found: warn
          retention-days: 30
