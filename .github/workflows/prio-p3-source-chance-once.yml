name: Prio P3 sourced chance exact-source one-shot
on:
  push:
    branches: [prio/p3-source-chance-gear-20261102]
permissions:
  contents: read
jobs:
  source-chance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize pinned source
        run: git lfs pull
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 beautifulsoup4==4.13.4
      - name: Focused actual source and CombatRuntime regression
        run: python -m pytest -q tests/test_prio_source_chance_gear.py
      - name: Live P3 selected paid backend, no M1 recording
        run: |
          set +e
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P3 --out /tmp/prio-p3-chance.json
          rc=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/prio-p3-chance.json').read_text())
          print('LIVE_GATE_JSON:',json.dumps(d,ensure_ascii=False))
          assert d['gate']=='P3' and d['status'] in ('PASS','FAIL')
          assert d['results'][0]['behavior_probes_executed']>0
          PY
          test "$rc" -eq 0 -o "$rc" -eq 1
