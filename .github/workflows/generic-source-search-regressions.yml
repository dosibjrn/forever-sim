name: Generic source-paid search regressions
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'tests/generic/search/**'
      - 'tests/generic/publication/**'
      - 'tests/gates/test_wf_gate_p7_5_stochastic_finalists.py'
      - 'tests/gates/test_wf_gate_p7_5_live.py'
      - 'tests/gates/test_wf_gate_p7_5_native_unrestricted.py'
      - 'tests/gates/test_wf_gate_p7_5_prior.py'
      - 'tools/wf_gate_p7_5_prior.py'
      - 'tools/wf_gate_p7_5_live.py'
      - 'tests/gates/test_wf_gate_p7_2_live.py'
