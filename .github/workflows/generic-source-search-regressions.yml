permissions:
  contents: read

concurrency:
  group: generic-source-paid-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-search:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned source data
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused regression dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Verify source-backed talent and paid equipment search
        run: >-
          python -m pytest -vv
          tests/generic/publication/test_generic_registry_g47b.py
          tests/generic/search/test_work2_refinement_mode_slot.py
          tests/generic/search/test_wf437_direct_budgeted_run_source.py
          tests/generic/search/test_source_wand_paid_slot_proposals.py
          tests/generic/search/test_source_paid_gear_witness_priority.py
          tests/test_work2_818_mage_paid_policy_breadth.py
          tests/test_work2_rogue_native_item_stat_probe.py
          tests/gates/test_wf35_product_spec_profile_contract.py
          tests/test_source_spec_profile.py
          tests/test_source_rank_fullpoint_frontier.py
          tests/test_wf_prio_p4_p5_paid_partials.py
          tests/generic/search/test_per_level_fixed_point_v0114846.py
          tests/generic/search/test_stat_weight_model.py
          tests/generic/search/test_v2_analytic_scorer.py
          tests/generic/search/test_v2_analytic_scorer_edges.py
          tests/generic/search/test_v2_analytic_frontier_extra.py
          tests/generic/search/test_generic_search_layout.py
          tests/generic/search/test_leveling_score.py
          tests/generic/search/test_bounded_policy_search_g16.py
          tests/generic/search/test_policy_search_efficiency_g18.py::test_g18_cache_normalizes_action_cost_and_numeric_equivalent_policy
          tests/generic/runtime/test_source_maintenance_rank_reader.py
          tests/generic/runtime/test_source_stage_isolation.py
          tests/generic/runtime/test_source_ir_assembly_order.py
          tests/test_wf332_runes_default_off.py
          tests/test_wf_feral01_sqlite_talent_execution.py::test_unknown_talent_effect_is_not_a_zero_cost_noop
          tests/gates/test_wf_gate_p7_5_stochastic_finalists.py
          tests/gates/test_wf_gate_p7_5_live.py
          tests/gates/test_wf_gate_p7_2_live.py
          tests/test_work2_p72_native_axis.py
          tests/gates/test_wf_gate_p7_3_live.py
          tests/gates/test_p7_independent_cold_rediscovery.py
          tests/gates/test_wf_gate_p7_4_live.py
          tests/gates/test_wf_gate_probe.py
          tests/gates/test_wf_gate_live_success_percent.py
          tests/test_wf_prio_p1_p3_partials.py
          tests/test_work1_p7_native_item_authority.py
          tests/test_work1_p7_full_gear_pool.py
          tests/test_p7_search_deadline_contract.py
          integrations/mythicsim-rust/tests/test_p73_native_search_ci.py
          integrations/mythicsim-rust/tests/test_apl_mutation_length_reachability.py
          integrations/mythicsim-rust/tests/test_apl_mutation_fallback_order.py
          integrations/mythicsim-rust/tests/test_native_gear_adapter.py
          integrations/mythicsim-rust/tests/test_native_p3_equipped.py
          integrations/mythicsim-rust/tests/test_rng_probability_diagnostic.py
          tests/test_work1_p7_balanced_native_world_rng.py
          tests/test_work1_p7_1_live_entry.py
          integrations/mythicsim-rust/tests/test_p75_unrestricted_99pct.py::UnrestrictedNinetyNinePercentTests::test_paid_native_ledger_retains_replayable_request_and_rng_provenance
          integrations/mythicsim-rust/tests/test_p75_unrestricted_99pct.py::UnrestrictedNinetyNinePercentTests::test_paid_screen_survives_failed_balanced_probe
          integrations/mythicsim-rust/tests/test_p75_unrestricted_99pct.py::UnrestrictedNinetyNinePercentTests::test_paid_rerank_ledger_replays_all_finalist_evaluations
          integrations/mythicsim-rust/tests/test_p75_unrestricted_99pct.py::UnrestrictedNinetyNinePercentTests::test_cold_apl_can_generate_19_actions_from_10_action_source_grammar

  selected-native-p72:
    # One selected-engine read-only acceptance probe on Work2's P7.2 lane.
    # This is NOT the Merge-owned M1 recorder or a new acceptance predicate.
    if: startsWith(github.head_ref, 'work/work2-p72-native-axis-')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact P7.2 PR HEAD with selected Rust fork
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          lfs: true
          fetch-depth: 0
      - name: Verify native engine SHA matches selected gitlink
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          recorded="$(git ls-tree HEAD -- "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$recorded" && test "$recorded" = "$actual"
          echo "HEAD=$(git rev-parse HEAD) RUST_GITLINK=$actual"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source runtime dependency
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Build selected native scorer
        working-directory: integrations/mythicsim-rust/engine
        env:
          CARGO_PROFILE_RELEASE_LTO: 'off'
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        run: cargo build --release --locked --bin forever-engine
      - name: Pay real P7.2 changed-APL candidate without recording M1
        env:
          FOREVER_MYTHICSIM_RUST_BIN: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/release/forever-engine
        run: |
          python tools/wf_gate.py --class druid --level 60 --spec unrestricted --gate P7.2
