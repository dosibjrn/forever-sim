name: Work1 P7.4 enchant-neighbor exact-source focused check (temporary)
on:
  push:
    branches:
      - work/work1-p74-enchant-alternative-neighbor-20261102
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Prove P7.4 actual production neighbor regressions
        run: |
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py tests/test_work1_p7_full_gear_pool.py
          python -m compileall -q tools/wf_gate_p7_4_live.py
