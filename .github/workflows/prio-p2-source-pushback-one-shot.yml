name: Prio one-shot Nature's Focus P2 production regressions

on:
  push:
    branches:
      - prio/p2-source-pushback-runtime-20261102

permissions:
  contents: read

concurrency:
  group: prio-p2-source-pushback-once
  cancel-in-progress: false

jobs:
  focused-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch commit with source LFS
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Run changed P2 behavioral tests on pinned sources
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git lfs ls-files | head -20 || true
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m compileall -q tools/wf_gate_p2_live.py src/game/data/forever/sqlite_talents.py
          python -m pytest -q tests/test_prio_source_cast_pushback_l60.py tests/test_wf429_source_cast_pushback_p2_tdd.py tests/test_wf35_source_spec_p2_adapter.py
      - name: Unrecorded current-source Druid L60 Balance P2 production gate
        shell: bash
        run: |
          set -uo pipefail
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P2 --out /tmp/prio-p2-live.json > /tmp/prio-p2-cli.log 2>&1
          cli_exit=$?
          if [ ! -s /tmp/prio-p2-live.json ]; then
            cat /tmp/prio-p2-cli.log
            echo 'Gate crashed or emitted no structured execution evidence' >&2
            exit 2
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/prio-p2-live.json').read_text())
          print('UNRECORDED P2 REAL PRODUCTION VERDICT:', d['status'])
          for gate in d['results']:
              print('pass_count:',gate.get('pass_count'),'reachability_count:',gate.get('reachability_count'),
                    'behavior_probes_executed:',gate.get('behavior_probes_executed'))
              print('first_reasons:',gate.get('reasons',[])[:25])
              print('partial_measured:', {k:v for k,v in gate.items() if k.startswith('measured_')})
          PY
          echo "Gate CLI exit=${cli_exit} (non-PASS is a reported diagnostic; never writes M1)"
