name: Merge one-shot Clean139 exact source regression
on:
  push:
    branches: [merge/verify-clean139-20261102]
    paths: [.github/workflows/merge-verify-clean139-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 4
          lfs: true
          persist-credentials: false
      - name: Confirm only temporary workflow differs from PR139 source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~3)" = "f0a69311db0ce4d343acec758523742b935722e1"
          test "$(git diff --name-only HEAD~3 HEAD)" = ".github/workflows/merge-verify-clean139-once.yml"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Real backend tests, maintained import paths, and CLI
        run: |
          set -euo pipefail
          python -m tools.report_backend_comparison --help
          if git grep -n -E '(^|[[:space:]])(from tools\.report_backend_reconciliation|import tools\.report_backend_reconciliation|python(3)?[[:space:]]+(-m[[:space:]]+)?tools[./]report_backend_reconciliation)' -- '*.py' '*.sh' '*.yml' '*.yaml'; then
            echo 'OBSOLETE_BACKEND_SHIM_RUNTIME_REFERENCE_REMAINS'
            exit 1
          fi
