name: P2 exact-rank witness regression (one-shot branch)
on:
  push:
    branches: [work/prio-p2-exact-rank-witness]
    paths:
      - tests/test_wf_prio_p2_exact_rank_fullpoint.py
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Exact-rank full-point and source cross-tree regressions
        run: python -m pytest -q tests/test_wf_prio_p2_exact_rank_fullpoint.py tests/test_wf_p2_cross_tree_source_witness.py tests/test_wf_p2_source_witness_priority.py
