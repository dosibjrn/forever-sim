name: P2 exact-rank witness regression (one-shot branch)
on:
  push:
    branches: [work/prio-p2-exact-rank-witness]
    paths:
      - tests/test_wf_prio_p2_exact_rank_fullpoint.py
jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Exact-rank full-point and source cross-tree regressions
        run: python -m pytest -q tests/test_wf_prio_p2_exact_rank_fullpoint.py tests/test_wf_p2_cross_tree_source_witness.py tests/test_wf_p2_source_witness_priority.py
      - name: Live Druid L60 Balance P2 (diagnostic, FAIL remains FAIL)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.wf_gate_p2_live import run_live
          report = run_live(Path.cwd(), 'druid', 60, spec='balance')
          Path('p2-live-result.json').write_text(json.dumps(report, indent=2, default=str))
          print(json.dumps({key: report.get(key) for key in (
              'status', 'pass_count', 'fail_count', 'unresolved_count',
              'unreachable_count', 'source_rank_total', 'source_spec_candidate_count'
          )}, indent=2))
          print('First 12 unresolved:', report.get('unresolved', [])[:12])
          print('First 12 failed:', [x.get('rank_key') for x in report.get('ranks', [])
                if x.get('status') != 'PASS'][:12])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p2-live-diagnostic
          path: p2-live-result.json
