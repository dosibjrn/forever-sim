name: Work1 P7.4 paid parent focus one-shot
on:
  push:
    branches: [work/work1-p74-paid-stochastic-parent-focus-20261103]
permissions:
  contents: read
jobs:
  focused-p74:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Selected production P7.4 search routing regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python -m pytest -q tests/gates/test_wf_gate_p7_4_live.py
          python -m compileall -q tools/wf_gate_p7_4_live.py
