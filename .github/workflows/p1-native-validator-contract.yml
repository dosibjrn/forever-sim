name: P1 Forever native boundary contract (not effect certification)
on:
  pull_request:
    paths:
      - .github/workflows/p1-native-validator-contract.yml
      - config/gates/p1_scenario_applicability_v1.json
      - src/engine_client/native_p1_effect_probe.py
      - src/engine_client/native_p2_rank_probe.py
      - tools/wf_p1_native_effects.py
      - tests/gates/test_wf_p1_native_blackbox.py
      - config/gates/p1_scenario_applicability_v1.json

permissions:
  contents: read

jobs:
  forever-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Test Forever-owned P1 request and response behavior (no game-rule validator)
        run: python -m pytest -q tests/gates/test_wf_p1_native_blackbox.py
