name: P1 Forever native boundary contract (not effect certification)
on:
  pull_request:
    paths:
      - .github/workflows/p1-native-validator-contract.yml
      - .gitmodules
      - config/gates/p1_scenario_applicability_v1.json
      - integrations/mythicsim-rust/engine
      - integrations/mythicsim-rust/live_two_world_pulls.py
      - integrations/mythicsim-rust/port_native_typed_rng.py
      - integrations/mythicsim-rust/tests/test_native_p1_effect_probe.py
      - src/engine_client/native_p1_effect_probe.py
      - src/engine_client/native_p2_rank_probe.py
      - tools/wf_p1_native_effects.py
      - tests/gates/test_wf_p1_native_blackbox.py

permissions:
  contents: read

jobs:
  forever-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5'
      - name: Test Forever-owned P1 request and response behavior (no game-rule validator)
        run: python -m pytest -q tests/gates/test_wf_p1_native_blackbox.py
      - name: Verify and build the exact selected Rust fork pin
        shell: bash
        run: |
          set -euo pipefail
          engine=integrations/mythicsim-rust/engine
          expected="$(git ls-tree HEAD "$engine" | awk '$1=="160000" && $2=="commit" {print $3}')"
          actual="$(git -C "$engine" rev-parse HEAD)"
          test -n "$expected" && test "$expected" = "$actual"
          grep -Fq "https://github.com/dosibjrn/mythicsim-forever-engine.git" .gitmodules
          echo "PINNED_RUST_SOURCE_SHA=$actual"
          python integrations/mythicsim-rust/port_native_typed_rng.py "$engine"
          cargo build --locked --manifest-path "$engine/Cargo.toml" --bin forever-engine
      - name: Run real selected-Rust P1 direct-effect diagnostics
        env:
          FOREVER_ENGINE_BINARY: ${{ github.workspace }}/integrations/mythicsim-rust/engine/target/debug/forever-engine
        run: python3 integrations/mythicsim-rust/tests/test_native_p1_effect_probe.py
