name: Clean G46h original-main baseline comparison (temporary)
on:
  push:
    branches:
      - work/clean-generic-route-publication-tests-20261102

permissions:
  contents: read

jobs:
  original-test:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout original main exact SHA
        uses: actions/checkout@v4
        with:
          ref: dd190659f3d042541b4452541058ddbae67ebb81
          lfs: true
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scoped dependencies
        run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Run unchanged original G46h test at original location
        run: |
          test "$(git rev-parse HEAD)" = dd190659f3d042541b4452541058ddbae67ebb81
          python -m pytest -q tests/test_generic_g46h_success_e2e.py
