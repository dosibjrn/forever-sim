name: One-shot P3 measured policy witness verification
on:
  push:
    branches:
      - fix/p3-source-policy-real-stat-witness
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run actual source-backed P3 regression without M1 recording
        run: |
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.4.1'
          python -m pytest -q tests/test_prio_p3_source_policy_sp.py tests/test_wf_prio_p3_spec_build.py tests/test_prio_discrete_stat_sensitivity.py
          python tools/wf_gate.py --class druid --level 60 --spec balance --gate P3 --out /tmp/prio-p3-source-policy-witness.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/prio-p3-source-policy-witness.json'))
          print('REAL_P3_LIVE',json.dumps(d,sort_keys=True,default=str))
          assert d['status']=='PASS',d
          PY
