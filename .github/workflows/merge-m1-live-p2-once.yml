name: Merge M1 source production P2 one-shot
on:
  push:
    branches: [merge/m1-first-live-gates-20261102]
    paths: [.github/workflows/merge-m1-live-p2-once.yml]
permissions:
  contents: read
jobs:
  live-p2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run real source-backed production P2 and record only eligible results
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          for identity in "druid 60 balance" "druid 20 unrestricted" "mage 20 unrestricted"; do
            read -r class level spec <<< "$identity"
            echo "=== LIVE_P2_START $class $level $spec ==="
            set +e
            python tools/wf_gate.py --class "$class" --level "$level" --spec "$spec" --gate P2 --record-progress > /tmp/m1_gate_result.json
            rc=$?
            set -e
            cat /tmp/m1_gate_result.json
            python - <<'PY'
          import json
          r=json.load(open('/tmp/m1_gate_result.json'))
          assert r['status'] in ('PASS','FAIL'),r
          print('LIVE_GATE_STATUS',r['class'],r['level'],r['spec'],r['status'])
          PY
            if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          done
          echo "=== OFFICIAL_RECORD_FROM_ACTUAL_LIVE_GATES ==="
          cat docs/planning/M1_PASSES.tsv
          echo "=== M1_PROGRESS ==="
          python tools/m1_progress.py
