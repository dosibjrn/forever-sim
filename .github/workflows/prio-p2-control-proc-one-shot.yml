name: Prio P2 sourced control proc one-shot
on:
  push:
    branches:
      - work/prio-p2-control-proc-runtime-witness-20261101
    paths:
      - .github/workflows/prio-p2-control-proc-one-shot.yml
permissions:
  contents: read
jobs:
  source-proc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install minimal source test dependencies
        run: python -m pip install pytest beautifulsoup4
      - name: Verify real source proc and negative control
        run: python -m pytest -q tests/test_p2_source_control_proc_runtime.py
