name: Prio P2 sourced control proc one-shot
on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - .github/workflows/prio-p2-control-proc-one-shot.yml
permissions:
  contents: read
jobs:
  source-proc:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
      - name: Confirm exact source HEAD
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Install minimal source test dependencies
        run: python -m pip install pytest beautifulsoup4
      - name: Verify real source proc and negative control
        run: python -m pytest -q tests/test_p2_source_control_proc_runtime.py
