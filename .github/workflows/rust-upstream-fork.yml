name: Bootstrap and sync MythicSim Rust public fork

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/rust-upstream-fork.yml
      - scripts/bootstrap_mythicsim_rust_fork.sh
      - docs/RUST_UPSTREAM_FORK.md

permissions:
  contents: read

jobs:
  check-script:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and verify fail-closed bootstrap guards
        run: |
          bash -n scripts/bootstrap_mythicsim_rust_fork.sh
          python3 -m py_compile integrations/mythicsim-rust/port_upstream_paladin_typed_rng.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_pull_queue.py
          python3 integrations/mythicsim-rust/test_port_native_pull_queue.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/bootstrap_mythicsim_rust_fork.sh").read_text()
          for required in (
              "FOREVER_RUST_FORK_TOKEN", "who", "actual_parent",
              "git push fork refs/remotes/origin/main:refs/heads/main",
              "check_engine_source", "cargo check --locked",
              "port_upstream_paladin_typed_rng.py", "git merge --no-ff",
              "FORK_ENGINE_SHA",
          ):
              assert required in s, required
          print("SOURCE_PACKAGING_AND_GIT_SAFETY_GUARDS_PRESENT")
          PY

  check-selected-rust-source:
    # The PR may not access fork-write secrets. Compile the ACTUAL selected
    # public engine with this patch, without mutating or repinning either repo.
    if: github.event_name == 'pull_request'
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply port to selected production Rust source and compile
        run: |
          git clone --quiet --filter=blob:none https://github.com/dosibjrn/mythicsim-forever-engine.git /tmp/forever-selected-rust
          git -C /tmp/forever-selected-rust checkout --quiet 1f170913f0af47f0de455c2b91581d777e713d3a
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          git -C /tmp/forever-selected-rust diff --check
          test "$(git -C /tmp/forever-selected-rust diff --name-only)" = "src/core/fight.rs"
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          test "$(git -C /tmp/forever-selected-rust diff --name-only)" = "src/core/fight.rs"
          cargo check --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml

  sync-fork:
    if: github.event_name == 'workflow_dispatch'
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fork upstream and carry Rust integrations across all upstream commits
        id: sync
        env:
          FOREVER_RUST_FORK_TOKEN: ${{ secrets.FOREVER_RUST_FORK_TOKEN }}
        run: bash scripts/bootstrap_mythicsim_rust_fork.sh
      - name: Report packaged source result
        env:
          FORK_SHA: ${{ steps.sync.outputs.FORK_ENGINE_SHA }}
          MAIN_SHA: ${{ steps.sync.outputs.FORK_UPSTREAM_MAIN }}
        run: |
          echo "Upstream main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Packaged integration SHA (not a gate acceptance): $FORK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "forever-sim's existing pinned production engine and P1–P7.5 gates were not changed." >> "$GITHUB_STEP_SUMMARY"
