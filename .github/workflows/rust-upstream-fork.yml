name: Bootstrap and sync MythicSim Rust public fork

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - .github/workflows/rust-upstream-fork.yml
      - scripts/bootstrap_mythicsim_rust_fork.sh
      - docs/RUST_UPSTREAM_FORK.md
      - integrations/mythicsim-rust/port_native_two_pull_cli.py
      - integrations/mythicsim-rust/port_native_target_ramp_clock.py
      - integrations/mythicsim-rust/port_native_world_lethal_ack.py
      - integrations/mythicsim-rust/port_native_early_retarget.py
      - integrations/mythicsim-rust/port_native_world_lethal_terminal.py
      - integrations/mythicsim-rust/test_port_native_world_lethal_terminal.py
      - integrations/mythicsim-rust/port_native_improved_roots_rank.py
      - integrations/mythicsim-rust/test_port_native_improved_roots_rank.py
      - integrations/mythicsim-rust/port_native_persistent_target.py
      - integrations/mythicsim-rust/test_port_native_early_retarget.py

permissions:
  contents: read

jobs:
  check-script:
    # A comment is allowed to run the fork writer ONLY when the repository
    # owner posts the exact command on a closed PR. On issue_comment GitHub
    # checks out the default branch (main), never the PR's untrusted branch.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.body == '/rust-fork-sync' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'closed')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and verify fail-closed bootstrap guards
        run: |
          bash -n scripts/bootstrap_mythicsim_rust_fork.sh
          python3 -m py_compile integrations/mythicsim-rust/port_upstream_paladin_typed_rng.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_improved_roots_rank.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_pull_queue.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_persistent_target.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_two_pull_cli.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_target_ramp_clock.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_world_lethal_ack.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_early_retarget.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_world_lethal_terminal.py
          python3 integrations/mythicsim-rust/test_port_native_improved_roots_rank.py
          python3 integrations/mythicsim-rust/test_port_native_pull_queue.py
          python3 integrations/mythicsim-rust/test_port_native_world_lethal_ack.py
          python3 integrations/mythicsim-rust/test_port_native_early_retarget.py
          python3 integrations/mythicsim-rust/test_port_native_world_lethal_terminal.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/bootstrap_mythicsim_rust_fork.sh").read_text()
          for required in (
              "FOREVER_RUST_FORK_TOKEN", "who", "actual_parent",
              "git push fork refs/remotes/origin/main:refs/heads/main",
              "check_engine_source", "cargo check --locked",
              "port_upstream_paladin_typed_rng.py", "git merge --no-ff",
              "FORK_ENGINE_SHA",
          ):
              assert required in s, required
          print("SOURCE_PACKAGING_AND_GIT_SAFETY_GUARDS_PRESENT")
          PY

  check-selected-rust-source:
    # The PR may not access fork-write secrets. Compile the ACTUAL selected
    # public engine with this patch, without mutating or repinning either repo.
    if: github.event_name == 'pull_request'
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply port to selected production Rust source and compile
        run: |
          git clone --quiet --filter=blob:none https://github.com/dosibjrn/mythicsim-forever-engine.git /tmp/forever-selected-rust
          # Check the actual gitlink selected by this PR, not a stale hardcoded SHA.
          selected_sha="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          test -n "$selected_sha"
          git -C /tmp/forever-selected-rust checkout --quiet "$selected_sha"
          test "$(git -C /tmp/forever-selected-rust rev-parse HEAD)" = "$selected_sha"

          # The source port must work both before and after the fork is pinned.
          python3 integrations/mythicsim-rust/port_native_improved_roots_rank.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_persistent_target.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_pull_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_target_ramp_clock.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_ack.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_early_retarget.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py /tmp/forever-selected-rust
          git -C /tmp/forever-selected-rust diff --check
          first_hash="$(git -C /tmp/forever-selected-rust hash-object src/core/fight.rs src/core/fight/world_bridge.rs src/classes.rs src/engine/prepared.rs src/lib.rs src/main.rs src/classes/druid/prepare/talents.rs | sha256sum)"
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_persistent_target.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_pull_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_target_ramp_clock.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_ack.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_early_retarget.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py /tmp/forever-selected-rust
          second_hash="$(git -C /tmp/forever-selected-rust hash-object src/core/fight.rs src/core/fight/world_bridge.rs src/classes.rs src/engine/prepared.rs src/lib.rs src/main.rs src/classes/druid/prepare/talents.rs | sha256sum)"
          test "$first_hash" = "$second_hash"
          cargo check --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib persistent_next_target
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib world_lethal_terminal
          cargo run --quiet --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml -- native-pulls --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json --targets 2 > /tmp/forever-native-two-window.json
          python3 - <<'PY'
          import json, math
          with open("/tmp/forever-native-two-window.json") as f:
              actual = json.load(f)
          result = actual["result"]
          assert result["scope"] == "NATIVE_TWO_DURATION_WINDOWS_DIAGNOSTIC_NOT_GATE"
          assert result["continuous_actor"] and result["selected_native_combat"]
          assert not result["actual_2d_ack"] and not result["paid_recovery"]
          assert actual["checkpoint_certified"] is False
          first, second = result["windows"]
          assert first["index"] == 0 and second["index"] == 1
          assert 0 < first["end_ns"] < second["end_ns"]
          assert all(math.isfinite(x["actor_mana"]) and math.isfinite(x["actor_health"])
                     for x in (first, second))
          print("NATIVE_TWO_WINDOW_REAL_SELECTED_RUST_ACTOR_SMOKE_PASS")
          PY
          if cargo run --quiet --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml -- native-pulls --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json --targets 3 >/tmp/forever-native-invalid.json 2>&1; then
            echo "Unsupported 3-target CLI returned false success" >&2
            exit 1
          fi

  sync-fork:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.body == '/rust-fork-sync' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'closed')
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fork upstream and carry Rust integrations across all upstream commits
        id: sync
        env:
          FOREVER_RUST_FORK_TOKEN: ${{ secrets.FOREVER_RUST_FORK_TOKEN }}
        run: bash scripts/bootstrap_mythicsim_rust_fork.sh
      - name: Report packaged source result
        env:
          FORK_SHA: ${{ steps.sync.outputs.FORK_ENGINE_SHA }}
          MAIN_SHA: ${{ steps.sync.outputs.FORK_UPSTREAM_MAIN }}
        run: |
          echo "Upstream main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Packaged integration SHA (not a gate acceptance): $FORK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "forever-sim's existing pinned production engine and P1–P7.5 gates were not changed." >> "$GITHUB_STEP_SUMMARY"
