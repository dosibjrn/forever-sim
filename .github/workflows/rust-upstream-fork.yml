name: Bootstrap and sync MythicSim Rust public fork

on:
  workflow_dispatch:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - scripts/bootstrap_mythicsim_rust_fork.sh
      - integrations/mythicsim-rust/port_native_two_pull_cli.py
      - integrations/mythicsim-rust/port_native_target_ramp_clock.py
      - integrations/mythicsim-rust/port_native_world_lethal_ack.py
      - integrations/mythicsim-rust/port_native_early_retarget.py
      - integrations/mythicsim-rust/port_native_world_lethal_terminal.py
      - integrations/mythicsim-rust/port_native_two_world_cli.py
      - integrations/mythicsim-rust/test_port_native_two_world_cli.py
      - integrations/mythicsim-rust/port_native_gsim_moving.py
      - integrations/mythicsim-rust/port_native_health_damage_receipts.py
      - integrations/mythicsim-rust/test_port_native_health_damage_receipts.py
      - integrations/mythicsim-rust/port_native_mana_regen_receipts.py
      - integrations/mythicsim-rust/test_port_native_mana_regen_receipts.py
      - integrations/mythicsim-rust/test_port_native_world_lethal_terminal.py
      - tests/test_work2_rust_gsim_moving_port.py
      - integrations/mythicsim-rust/port_native_improved_roots_rank.py
      - integrations/mythicsim-rust/test_port_native_improved_roots_rank.py
      - integrations/mythicsim-rust/port_native_talent_layout_api.py
      - integrations/mythicsim-rust/test_port_native_talent_layout_api.py
      - integrations/mythicsim-rust/port_native_entangling_roots_dot.py
      - integrations/mythicsim-rust/test_port_native_entangling_roots_dot.py
      - integrations/mythicsim-rust/port_native_typed_rng.py
      - integrations/mythicsim-rust/tests/test_port_native_typed_rng.py
      - integrations/mythicsim-rust/port_native_persistent_target.py
      - integrations/mythicsim-rust/test_port_native_early_retarget.py

permissions:
  contents: read

jobs:
  check-script:
    # A comment is allowed to run the fork writer ONLY when the repository
    # owner posts the exact command on a closed PR. On issue_comment GitHub
    # checks out the default branch (main), never the PR's untrusted branch.
    if: >-
      github.event_name != 'issue_comment' ||
      (github.event.comment.body == '/rust-fork-sync' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'closed')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check and verify fail-closed bootstrap guards
        run: |
          bash -n scripts/bootstrap_mythicsim_rust_fork.sh
          python3 -m py_compile integrations/mythicsim-rust/port_upstream_paladin_typed_rng.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_improved_roots_rank.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_talent_layout_api.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_entangling_roots_dot.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_typed_rng.py
          python3 integrations/mythicsim-rust/tests/test_port_native_typed_rng.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_pull_queue.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_persistent_target.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_two_pull_cli.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_target_ramp_clock.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_world_lethal_ack.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_early_retarget.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_world_lethal_terminal.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_two_world_cli.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_gsim_moving.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_health_damage_receipts.py
          python3 -m py_compile integrations/mythicsim-rust/port_native_mana_regen_receipts.py
          python3 integrations/mythicsim-rust/test_port_native_health_damage_receipts.py
          python3 integrations/mythicsim-rust/test_port_native_mana_regen_receipts.py
          python3 integrations/mythicsim-rust/test_port_native_improved_roots_rank.py
          python3 integrations/mythicsim-rust/test_port_native_talent_layout_api.py
          python3 integrations/mythicsim-rust/test_port_native_entangling_roots_dot.py
          python3 integrations/mythicsim-rust/test_port_native_pull_queue.py
          python3 integrations/mythicsim-rust/test_port_native_world_lethal_ack.py
          python3 integrations/mythicsim-rust/test_port_native_early_retarget.py
          python3 integrations/mythicsim-rust/test_port_native_two_world_cli.py
          python3 integrations/mythicsim-rust/test_port_native_world_lethal_terminal.py
          python3 -m pip install --disable-pip-version-check 'pytest==8.3.5'
          python3 -m pytest -q tests/test_work2_rust_gsim_moving_port.py tests/maintenance/test_fork_sync_retired_p2_guard.py
          python3 - <<'PY'
          from pathlib import Path
          s = Path("scripts/bootstrap_mythicsim_rust_fork.sh").read_text()
          for required in (
              "FOREVER_RUST_FORK_TOKEN", "who", "actual_parent",
              "git push fork refs/remotes/origin/main:refs/heads/main",
              "check_engine_source", "cargo check --locked",
              "port_upstream_paladin_typed_rng.py", "port_native_talent_layout_api.py", "git merge --no-ff",
              "FORK_ENGINE_SHA",
          ):
              assert required in s, required
          print("SOURCE_PACKAGING_AND_GIT_SAFETY_GUARDS_PRESENT")
          PY

  check-selected-rust-source:
    # The PR may not access fork-write secrets. Compile the ACTUAL selected
    # public engine with this patch, without mutating or repinning either repo.
    if: github.event_name == 'pull_request'
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install selected-source HTML parser dependency
        run: python3 -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
      - name: Apply port to selected production Rust source and compile
        run: |
          git clone --quiet --filter=blob:none https://github.com/dosibjrn/mythicsim-forever-engine.git /tmp/forever-selected-rust
          # Check the actual gitlink selected by this PR, not a stale hardcoded SHA.
          selected_sha="$(git ls-tree HEAD integrations/mythicsim-rust/engine | awk '{print $3}')"
          test -n "$selected_sha"
          git -C /tmp/forever-selected-rust checkout --quiet "$selected_sha"
          test "$(git -C /tmp/forever-selected-rust rev-parse HEAD)" = "$selected_sha"

          # The source port must work both before and after the fork is pinned.
          python3 integrations/mythicsim-rust/port_native_improved_roots_rank.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_entangling_roots_dot.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_talent_layout_api.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_persistent_target.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_pull_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_target_ramp_clock.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_ack.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_early_retarget.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_gsim_moving.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_health_damage_receipts.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_mana_regen_receipts.py /tmp/forever-selected-rust
          # Re-run the idempotent layout port after every other src/lib.rs edit.
          python3 integrations/mythicsim-rust/port_native_talent_layout_api.py /tmp/forever-selected-rust
          git -C /tmp/forever-selected-rust diff --check
          first_hash="$(git -C /tmp/forever-selected-rust hash-object src/core/fight.rs src/core/fight/world_bridge.rs src/classes.rs src/engine/prepared.rs src/lib.rs src/main.rs src/classes/druid/prepare.rs src/classes/druid/prepare/talents.rs src/classes/druid/prepare/balance.rs src/classes/druid/prepare/export.rs src/contracts/prepared_v2.rs src/classes/druid/agent.rs src/classes/druid/prepared/coverage.rs tests/classes/druid/prepare.rs | sha256sum)"
          python3 integrations/mythicsim-rust/port_native_pull_queue.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_persistent_target.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_pull_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_target_ramp_clock.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_ack.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_early_retarget.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_world_lethal_terminal.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_two_world_cli.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_gsim_moving.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_health_damage_receipts.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_mana_regen_receipts.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_improved_roots_rank.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_entangling_roots_dot.py /tmp/forever-selected-rust
          python3 integrations/mythicsim-rust/port_native_talent_layout_api.py /tmp/forever-selected-rust
          second_hash="$(git -C /tmp/forever-selected-rust hash-object src/core/fight.rs src/core/fight/world_bridge.rs src/classes.rs src/engine/prepared.rs src/lib.rs src/main.rs src/classes/druid/prepare.rs src/classes/druid/prepare/talents.rs src/classes/druid/prepare/balance.rs src/classes/druid/prepare/export.rs src/contracts/prepared_v2.rs src/classes/druid/agent.rs src/classes/druid/prepared/coverage.rs tests/classes/druid/prepare.rs | sha256sum)"
          test "$first_hash" = "$second_hash"
          python3 integrations/mythicsim-rust/port_native_typed_rng.py /tmp/forever-selected-rust
          cargo check --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib typed_rng_api_tests
          cargo build --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --bin forever-engine
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib druid_talent_layout_api_tests
          /tmp/forever-selected-rust/target/debug/forever-engine talent-layout --class druid > /tmp/forever-druid-talent-layout.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("/tmp/forever-druid-talent-layout.json").read_text())
          assert value.get("schema_version") == 1
          assert value.get("class") == "druid"
          assert value.get("ruleset") == "forever"
          trees = value.get("trees")
          assert isinstance(trees, list)
          assert [tree.get("key") for tree in trees] == ["balance", "feral", "restoration"]
          for tree in trees:
              talents = tree.get("talents")
              assert isinstance(talents, list) and talents
              for talent in talents:
                  assert isinstance(talent.get("field"), str) and talent["field"]
                  assert isinstance(talent.get("name"), str) and talent["name"]
                  assert isinstance(talent.get("max_ranks"), int)
                  assert isinstance(talent.get("in_proto"), bool)
          print("NATIVE_DRUID_TALENT_LAYOUT_JSON_API_PASS")
          PY
          if /tmp/forever-selected-rust/target/debug/forever-engine sim --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json >/tmp/forever-rng-missing.log 2>&1; then
            echo "Native CLI accepted missing RNG mode" >&2; exit 1
          fi
          if /tmp/forever-selected-rust/target/debug/forever-engine sim --rng-mode bogus --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json >/tmp/forever-rng-unknown.log 2>&1; then
            echo "Native CLI accepted unknown RNG mode" >&2; exit 1
          fi
          echo "RUST_NATIVE_TYPED_RNG_REQUIRED_AND_INVALID_MODE_REJECTED"
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml forever_roots_preparation_uses_native_spell_data_and_improved_rank
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml forever_roots_native_periodic_ticks_change_with_rank -- --nocapture
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib persistent_next_target
          cargo test --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --lib world_lethal_terminal
          cargo run --quiet --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml -- native-pulls --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json --targets 2 --rng-mode stochastic > /tmp/forever-native-two-window.json
          python3 - <<'PY'
          import json, math
          with open("/tmp/forever-native-two-window.json") as f:
              actual = json.load(f)
          result = actual["result"]
          assert result["scope"] == "NATIVE_TWO_DURATION_WINDOWS_DIAGNOSTIC_NOT_GATE"
          assert result["continuous_actor"] and result["selected_native_combat"]
          assert not result["actual_2d_ack"] and not result["paid_recovery"]
          assert actual["checkpoint_certified"] is False
          first, second = result["windows"]
          assert first["index"] == 0 and second["index"] == 1
          assert 0 < first["end_ns"] < second["end_ns"]
          assert all(math.isfinite(x["actor_mana"]) and math.isfinite(x["actor_health"])
                     for x in (first, second))
          print("NATIVE_TWO_WINDOW_REAL_SELECTED_RUST_ACTOR_SMOKE_PASS")
          PY
          if cargo run --quiet --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml -- native-pulls --infile /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json --targets 3 --rng-mode stochastic >/tmp/forever-native-invalid.json 2>&1; then
            echo "Unsupported 3-target CLI returned false success" >&2
            exit 1
          fi
          # Real selected-Rust / live gsim boundary smoke, not a paid gate.
          # The 3-target walk must be acknowledged by Rust (not only gsim).
          cargo build --locked --manifest-path /tmp/forever-selected-rust/Cargo.toml --bin forever-engine
          python3 integrations/mythicsim-rust/live_two_world_pulls.py \
            --binary /tmp/forever-selected-rust/target/debug/forever-engine \
            --prepared /tmp/forever-selected-rust/fixtures/mage/prepared-v2/balance-druid-revelation.prepared.json \
            --mob-health 1200 --targets 3 --require-native-moving > /tmp/forever-rust-moving-3world.jsonl
          python3 - <<'PY'
          import json
          with open("/tmp/forever-rust-moving-3world.jsonl") as f:
              rows = [json.loads(line.split(" ", 1)[1]) for line in f if line.strip()]
          actual, forged = rows
          assert actual["world_targets_killed"] == 3
          # Actual selected-Rust ResourceMetrics, not Python regen or paid downtime.
          assert all(isinstance(w.get("native_combat_mana_regen_events"), int)
                     and w["native_combat_mana_regen_events"] >= 0
                     and isinstance(w.get("native_combat_mana_regen_actual_gain"), (int, float))
                     and w["native_combat_mana_regen_actual_gain"] >= 0
                     for w in actual["native_windows"])
          assert sum(w["native_combat_mana_regen_events"]
                     for w in actual["native_windows"]) > 0
          assert actual["actual_2d_ack"] and actual["continuous_native_actor"]
          assert actual["native_movement_cast_legal"]
          assert actual["native_gsim_moving_ticks"] > 0
          # The prepared Balance DPS reference has no enemy attacker. Read
          # actual native damage accounting: no synthetic incoming attack.
          assert all(w["native_health_damage_taken"] == 0
                     and w["native_health_damage_events"] == 0
                     for w in actual["native_windows"])
          assert not actual["paid_recovery"] and not actual["checkpoint_certified"]
          assert forged["forged_ack_rejected"]
          print("SELECTED_RUST_THREE_REAL_WORLD_TARGETS_MOVING_ACK_PASS_NOT_GATE")
          PY

  sync-fork:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.comment.body == '/rust-fork-sync' &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.issue.pull_request != null &&
       github.event.issue.state == 'closed')
    needs: check-script
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fork upstream and carry Rust integrations across all upstream commits
        id: sync
        env:
          FOREVER_RUST_FORK_TOKEN: ${{ secrets.FOREVER_RUST_FORK_TOKEN }}
        run: bash scripts/bootstrap_mythicsim_rust_fork.sh
      - name: Report packaged source result
        env:
          FORK_SHA: ${{ steps.sync.outputs.FORK_ENGINE_SHA }}
          MAIN_SHA: ${{ steps.sync.outputs.FORK_UPSTREAM_MAIN }}
        run: |
          echo "Upstream main: $MAIN_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Packaged integration SHA (not a gate acceptance): $FORK_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "forever-sim's existing pinned production engine and P1–P7.5 gates were not changed." >> "$GITHUB_STEP_SUMMARY"
