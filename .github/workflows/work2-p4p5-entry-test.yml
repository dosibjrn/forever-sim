name: Work2 focused full-source gate entry test (temporary)

on:
  pull_request:
    paths:
      - 'tools/wf_gate_p4_p5_partial.py'
      - 'tests/test_work2_full_source_p4_p5_gate_entry.py'
      - '.github/workflows/work2-p4p5-entry-test.yml'

permissions:
  contents: read

jobs:
  work2-focused:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exact-PR-head checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          lfs: true
          persist-credentials: false
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Run new source gate-entry regressions
        run: |
          python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
          python -m pytest -q tests/test_work2_full_source_p4_p5_gate_entry.py
