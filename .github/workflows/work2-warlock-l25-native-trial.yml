name: Work2 Warlock L25 one changed native paid route trial

on:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - tools/wf_warlock_next_level_source.py
      - tests/test_work2_warlock_next_level_source.py
      - .github/workflows/work2-warlock-l25-native-trial.yml
      - src/v2/native_paid_route.py
      - src/v2/path_dp.py
      - tools/wf_warlock_route_guide.py
      - tests/test_work2_native_paid_banked_path_dp.py
      - tests/test_work2_native_paid_route_publisher.py

permissions:
  contents: read

jobs:
  paid-native-l25:
    # This is one independent new L25 chain, not an L24 or cold-search rerun.
    # One new source-paid L25 continuation, not an L24 retry.
    if: github.head_ref == 'work2/warlock-l25-native-route-refusal-20261110-0901'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact Work2 producer
        uses: actions/checkout@v4
        with:
          path: project
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Checkout tested native actor source
        uses: actions/checkout@v4
        with:
          repository: dosibjrn/mythicsim-forever-engine
          path: engine
          ref: 35d2c65c21263fe185facc1b5d2743b450fcad47
      - name: Verify source pin
        run: |
          set -euo pipefail
          test "$(git -C engine rev-parse HEAD)" = "35d2c65c21263fe185facc1b5d2743b450fcad47"
          git -C project rev-parse HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Forever world adapter and tests
        run: python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4' 'pytest==8.3.5'
      - name: Verify native-boundary producer and guide
        working-directory: project
        run: |
          python -m pytest -q tests/test_work2_warlock_next_level_source.py tests/test_work2_warlock_route_guide.py tests/test_work2_native_paid_banked_path_dp.py tests/test_work2_native_paid_route_publisher.py
      - name: Build exact pinned native executor
        working-directory: engine
        run: cargo build --locked --bin forever-engine
      - name: Retrieve exact L24 executed-world source and route evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p previous
          curl -fLsS --retry 2 -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/dosibjrn/forever-sim/actions/artifacts/13742271375/zip" \
            -o previous.zip
          unzip -q previous.zip -d previous
          test -s previous/warlock-l24-native-route/native_l24/best_apl/source_request.json
          test -s previous/warlock-l24-native-route/route.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          route=json.loads(Path("previous/warlock-l24-native-route/route.json").read_text())
          source=Path("previous/warlock-l24-native-route/native_l24/best_apl/source_request.json").read_bytes()
          assert route["measured_levels"] == [20,21,22,23,24],route["measured_levels"]
          l24=[r for r in route["observations"] if r["level"]==23]
          assert l24 and any(r["source_request_sha256"]==hashlib.sha256(source).hexdigest()
                             for r in l24), "L24 actual paid-world source fingerprint mismatch"
          assert route["full_10_60_native_replay_executed"] is False
          print("VERIFIED_PAID_L24_BASELINE",hashlib.sha256(source).hexdigest(),flush=True)
          PY
      - name: Propose actual L25 candidate using Rust options and prepare
        id: propose
        continue-on-error: true
        working-directory: project
        run: |
          python -u tools/wf_warlock_next_level_source.py \
            --binary ../engine/target/debug/forever-engine \
            --source ../previous/warlock-l24-native-route/native_l24/best_apl/source_request.json \
            --predecessor-route ../previous/warlock-l24-native-route/route.json \
            --from-level 24 --to-level 25 \
            --out ../warlock-l25-source
      - name: Publish exact source-native L25 refusal without invented route
        if: steps.propose.outcome == 'failure'
        working-directory: project
        run: |
          test -s ../warlock-l25-source/proposal.json
          # A real, published refusal exits 2; preserve it as an honest
          # unmeasured L25 outcome rather than losing the route artifact.
          set +e
          python -u tools/wf_warlock_route_guide.py \
            --native-proposal ../warlock-l25-source/proposal.json \
            --baseline-observations ../previous/warlock-l24-native-route/route.json \
            --out ../warlock-l25-native-route
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          test -s ../warlock-l25-native-route/route.json
      - name: Execute actual hostile L25 100-target paid native Decisions chain
        if: steps.propose.outcome == 'success'
        working-directory: project
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python -u tools/wf_warlock_route_guide.py \
            --execute-native --actor-level 25 \
            --binary ../engine/target/debug/forever-engine \
            --source ../warlock-l25-source/source_request.json \
            --health-threshold 0.7 --mana-threshold 0.25 \
            --baseline-observations ../previous/warlock-l24-native-route/route.json \
            --trial paid-source-native-l25 \
            --out ../warlock-l25-native-route
      - name: Preserve full actual L24 source, L25 requests, refusals and measured guide
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work2-warlock-l25-paid-${{ github.run_id }}
          path: |
            previous/warlock-l24-native-route/native_l24/best_apl/source_request.json
            previous/warlock-l24-native-route/route.json
            warlock-l25-source/
            warlock-l25-native-route/
          if-no-files-found: warn
          retention-days: 3
