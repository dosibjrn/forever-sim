name: Prio source paid P4 P5 partial proof (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  live-paid:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==8.3.5 beautifulsoup4==4.13.4
      - run: python -m pytest -q tests/test_wf_prio_p4_p5_paid_partials.py
      - name: Real source-paid backend partial counts
        run: |
          python - <<'PY'
          from tools.wf_gate import ROOT,_run_live_gate
          for gate in ('P4','P5'):
              r=_run_live_gate(ROOT,'druid',30,'unrestricted',gate,'')
              print('LIVE',gate,'status',r['status'],'verified',r.get('pass_count'),
                    'applicable',r.get('reachability_count'),
                    'executed',r.get('behavior_probes_executed'),
                    'paid',r.get('real_paid_unique_full_builds'),
                    'reasons',r.get('reasons',[])[:2], flush=True)
          PY
