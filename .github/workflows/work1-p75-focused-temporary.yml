name: Work1 P7.5 exact-branch focused test (temporary)
on:
  push:
    branches:
      - work/work1-p75-native-world-cold-final-20261102-1811
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Check P7.5 provider and focused behavior
        run: |
          python -m compileall -q tools/wf_gate_p7_5_live.py tests/test_wf_gate_p7_5_live.py
          python -m pytest -q tests/test_wf_gate_p7_5_live.py
