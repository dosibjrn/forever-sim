name: P1 native progress 80-20 contract
on:
  push:
    branches: [work/p1-native-progress-pareto-gates-20261102]
    paths:
      - tools/p1_native_progress.py
      - tools/wf_p1_native_effects.py
      - tests/test_p1_native_progress.py
      - tests/test_wf_p1_native_blackbox.py
      - .github/workflows/p1-native-progress.yml
  workflow_dispatch:
jobs:
  native-progress-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pytest==8.3.5' 'beautifulsoup4==4.13.4'
      - name: Synthetic arithmetic/contracts only, no fake native pass
        run: python -m pytest -q tests/test_p1_native_progress.py tests/test_wf_p1_native_blackbox.py
      - name: Verify real source inventory and native P1 milestone remains zero without genuine effects
        run: python -c 'from tools.p1_native_source_inventory import inventory; from tools.p1_native_progress import native_p1_progress; scope=inventory("hunter",20); r=native_p1_progress(scope); print(r); assert r["progress_naksut"] == 0 and r["formal_gate_pass"] is False'
