name: One-shot Clean source acquisition CLI (real staged SQLite)
on:
  push:
    branches: [work/clean-source-ingest-cli-20261101]
    paths:
      - .github/workflows/clean-source-ingest-cli-one-shot.yml
      - tools/ingest_source_acquisition_evidence_sqlite.py
      - tools/ingest_source_acquisition_entities_sqlite.py
permissions:
  contents: read
concurrency:
  group: clean-source-ingest-cli-one-shot
  cancel-in-progress: true
jobs:
  real-source-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Real nine-class source ingest CLI on isolated stage
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'beautifulsoup4==4.13.4'
          stage="$(mktemp -d)/stage.sqlite"
          source="data/forever/catalogue/forever_abilities.sqlite"
          before="$(sha256sum "$source" | cut -d' ' -f1)"
          python - "$source" "$stage" <<'PY'
          import sqlite3,sys
          with sqlite3.connect('file:'+sys.argv[1]+'?mode=ro',uri=True) as src, sqlite3.connect(sys.argv[2]) as dst:
              src.backup(dst)
          PY
          python tools/ingest_source_acquisition_evidence_sqlite.py --db "$stage"
          python tools/ingest_source_acquisition_entities_sqlite.py --db "$stage"
          python - "$stage" <<'PY'
          import sqlite3,sys
          with sqlite3.connect(sys.argv[1]) as db:
              n, classes = db.execute('SELECT COUNT(*),COUNT(DISTINCT class_key) FROM ability_acquisition_evidence').fetchone()
              entities = db.execute('SELECT COUNT(*) FROM ability_acquisition_entities').fetchone()[0]
              assert n > 0 and classes == 9, (n,classes)
              assert db.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
              print(f'SOURCE_INGEST_OK evidence={n} classes={classes} entities={entities}')
          PY
          after="$(sha256sum "$source" | cut -d' ' -f1)"
          [[ "$before" == "$after" ]] || { echo 'CANONICAL_SQLITE_MUTATED'; exit 1; }
